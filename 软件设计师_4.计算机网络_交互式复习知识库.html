/* Networking-specific educational diagrams */
.net-row{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:8px}.net-arrow{font-size:18px;color:var(--accent);font-weight:800}.net-cell{flex:1 1 120px;min-width:100px;max-width:300px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 13px;text-align:center;color:var(--ink)}.net-cell.highlight{background:var(--accent-bg);border-color:#a9c9e5}.net-cell b{display:block;font-size:13px;line-height:1.5}.net-cell small{display:block;font-size:11px;color:var(--muted);line-height:1.6;margin-top:6px}.net-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}.net-grid .net-cell{min-width:0;max-width:none}.net-layerstack{max-width:730px;margin:4px auto;display:grid;gap:6px}.net-layer{display:flex;align-items:center;justify-content:space-between;gap:18px;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:13px 17px;color:var(--ink)}.net-layer strong{font-size:13px;flex:0 0 135px}.net-layer span{font-size:12px;color:var(--muted);line-height:1.65}.net-layer.light{background:var(--accent-bg)}.net-tablewrap{overflow-x:auto}.net-note{text-align:center;font-size:12px;line-height:1.85;color:var(--muted);margin-top:14px}.net-bits{display:flex;align-items:center;gap:6px;max-width:760px;margin:12px auto;min-height:60px}.net-bitgroup{flex:1;background:var(--accent-bg);border:1px solid var(--line);text-align:center;padding:10px 5px;color:var(--ink);font-weight:800;border-radius:6px}.net-bitgroup small{display:block;font-size:10px;color:var(--muted);font-weight:400;margin-top:3px}.net-bithead,.net-bitpayload{background:var(--accent-bg);color:var(--ink);padding:14px 6px;text-align:center;border:1px solid var(--line);font-size:12px;border-radius:7px;font-weight:750}.net-bitpayload{background:#e5f6f1}.net-topologies{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.net-topologies>div{border:1px solid var(--line);border-radius:9px;padding:11px 9px;text-align:center;background:var(--panel)}.net-topology-title{color:var(--ink);font-size:13px;font-weight:800}.net-topologies svg{width:100%;max-width:220px;height:100px}.net-topologies svg path{stroke:var(--accent);stroke-width:3;fill:none}.net-topologies svg circle,.net-topologies svg rect{stroke:var(--accent);stroke-width:2;fill:var(--accent-bg)}.net-calc{display:grid;grid-template-columns:2fr 1fr auto;gap:12px;align-items:end}.net-calcfield{display:flex;flex-direction:column;gap:7px}.net-calcfield label{font-size:12px;color:var(--muted);font-weight:750}.net-calcfield input{width:100%;min-width:0;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:9px;padding:11px 12px;font-size:13px}.net-calcresult{grid-column:1/-1;background:var(--accent-bg);border:1px solid var(--line);border-radius:10px;color:var(--ink);padding:17px;line-height:2;font-size:13px;overflow-wrap:anywhere}.net-calcresult.error{background:#fff2ef;color:#9b413c}.net-url{text-align:center;font:700 16px/1.9 ui-monospace,Consolas,monospace;overflow-wrap:anywhere;background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:16px;margin:7px 0 16px}.net-url span{color:var(--accent)}.net-url i{font-style:normal;color:var(--muted)}.lesson-footer{padding-bottom:30px;margin-bottom:55px}
html[data-theme=dark] .net-cell,html[data-theme=dark] .net-layer,html[data-theme=dark] .net-topologies>div,html[data-theme=dark] .net-bitgroup,html[data-theme=dark] .net-url{background:var(--panel);border-color:var(--line)}html[data-theme=dark] .net-cell.highlight,html[data-theme=dark] .net-layer.light{background:var(--accent-bg);border-color:#496c90}html[data-theme=dark] .net-bithead{background:#254663}html[data-theme=dark] .net-bitpayload{background:#255044}html[data-theme=dark] .net-calcresult{background:#244263}html[data-theme=dark] .net-calcresult.error{background:#593633;color:#f4c7c0}

<script>
const DATA = {"chapters":[{"id":0,"number":"00","name":"本章考试定位","subtitle":"PDF 第2页；转写 5.1","topicIds":["0:0","0:1"]},{"id":1,"number":"01","name":"网络功能与基本模型","subtitle":"PDF 第2–3页；转写 5.1","topicIds":["1:0","1:1","1:2"]},{"id":2,"number":"02","name":"OSI 七层模型与设备","subtitle":"PDF 第3页；转写 5.1","topicIds":["2:0","2:1","2:2","2:3","2:4","2:5","2:6"]},{"id":3,"number":"03","name":"局域网与 TCP/IP 协议","subtitle":"PDF 第4–6页；转写 5.1","topicIds":["3:0","3:1","3:2","3:3","3:4","3:5","3:6","3:7"]},{"id":4,"number":"04","name":"传输介质与通信交换","subtitle":"PDF 第7–10页；转写 5.2","topicIds":["4:0","4:1","4:2","4:3","4:4","4:5"]},{"id":5,"number":"05","name":"IPv4 地址分类与特殊地址","subtitle":"PDF 第11–12页；转写 5.2","topicIds":["5:0","5:1","5:2","5:3"]},{"id":6,"number":"06","name":"子网划分与超网汇聚","subtitle":"PDF 第12–13页；转写 5.2","topicIds":["6:0","6:1","6:2","6:3","6:4"]},{"id":7,"number":"07","name":"IPv6 与网络规划","subtitle":"PDF 第13–15页；转写 5.3","topicIds":["7:0","7:1","7:2","7:3","7:4"]},{"id":8,"number":"08","name":"RAID 与网络存储","subtitle":"PDF 第15–17页；转写 5.3","topicIds":["8:0","8:1","8:2","8:3"]},{"id":9,"number":"09","name":"其他网络考点","subtitle":"PDF 第18–19页；转写 5.3","topicIds":["9:0","9:1","9:2","9:3","9:4","9:5"]}],"lessons":[{"id":"0:0","chapter":0,"index":0,"title":"考试定位：约 5 分的网络知识","fullTitle":"考试定位：约 5 分的网络知识","intro":"老师开篇指出计算机网络在软件设计师基础知识中通常有约 5 分，知识面较散，重点掌握课堂系统总结而不是把网络工程师教材全背下来。","points":[{"text":"老师经验：选择题约 5 分，不是固定配分。","note":"","priority":"frequent"},{"text":"OSI 七层模型顺序、各层功能与代表设备要会对应。","note":"","priority":"must"},{"text":"IP 分类、子网掩码、子网划分与超网汇聚涉及计算和进制转换。","note":"","priority":"must"},{"text":"常见 TCP/IP 协议功能、英文缩写和端口号需要理解记忆。","note":"","priority":"frequent"},{"text":"网络规划（三层模型、综合布线）是老师标注的常考概念。","note":"","priority":"frequent"},{"text":"RAID / DAS / NAS / SAN 及零散补充概念以识别和比较为主。","note":"","priority":"understand"}],"source":"PDF 第2页；转写 5.1","priority":"","visual":"road","memory":"课堂建议：五分左右的散知识，优先层模型、协议、子网和规划。"},{"id":"0:1","chapter":0,"index":1,"title":"本章学习顺序与不同深度","fullTitle":"本章学习顺序与不同深度","intro":"课程分为 5.1 分层协议、5.2 传输介质与 IP 地址、5.3 IPv6/规划/存储，建议顺着层级和计算依赖依次学习。","points":[{"text":"第 1 步：网络功能和拓扑 → OSI/TCP-IP 分层 → 每层典型设备。","note":"","priority":""},{"text":"第 2 步：以协议功能和端口为线索，辨别 IP、ARP、TCP、UDP、HTTP、DHCP、DNS。","note":"","priority":""},{"text":"第 3 步：传输介质、单双工与交换方式，只记考试相关区别。","note":"","priority":""},{"text":"第 4 步：IPv4 分类与二进制 → 掩码 → /n 子网计算 → 超网汇聚。","note":"","priority":""},{"text":"第 5 步：IPv6、网络规划和 RAID/网络存储，最后复习 NAT/VLAN/VPN 等。","note":"","priority":""}],"source":"PDF 第2页；转写 5.1","priority":"","visual":"road","memory":"先分层→协议，再 IPv4→子网计算，最后 IPv6→规划→存储。"},{"id":"1:0","chapter":1,"index":0,"title":"网络功能与分类","fullTitle":"网络功能与分类","intro":"计算机网络将计算机技术与通信技术结合，课程先介绍通信、共享、负载均衡与可靠性及网络覆盖范围。","points":[{"text":"四种常见功能：数据通信、资源共享、负载均衡、高可靠性。","note":"","priority":"understand"},{"text":"按覆盖范围：PAN 个人区域网、LAN 局域网、MAN 城域网、WAN 广域网。","note":"","priority":"understand"},{"text":"按物理组织也可分不同网络类型，网速和覆盖范围只是历史课件示意，不是绝对边界。","note":"","priority":"understand"},{"text":"1 Byte = 8 bit，常见带宽 Mb/s 与下载速率 MB/s 要换算。","note":"","priority":""}],"source":"PDF 第2–3页；转写 5.1","priority":"","visual":"networktypes","memory":"功能：通信、共享、均衡、可靠；范围：PAN/LAN/MAN/WAN。"},{"id":"1:1","chapter":1,"index":1,"title":"网络拓扑：总线、星、环、树、网状","fullTitle":"网络拓扑：总线、星、环、树、网状","intro":"拓扑指节点之间的连接关系；老师要求先认图、识别典型特点，不需要深入每种实现细节。","points":[{"text":"总线型：多个节点共享同一条传输通路；总线故障影响整体。","note":"","priority":"understand"},{"text":"星型：节点连接到中心设备，集中管理方便；中心设备是单点风险。","note":"","priority":"frequent"},{"text":"环型：节点构成环状连接，信号沿环传递。","note":"","priority":"understand"},{"text":"树型：分层连接的拓扑，适合层级组织。","note":"","priority":"understand"},{"text":"网状型：节点间路径较多，冗余高、线路成本也较高。","note":"","priority":"understand"}],"source":"PDF 第2–3页；转写 5.1","priority":"","visual":"topology","memory":"总线共用、星型有中心、环型首尾相连、树型分层、网状多路径。"},{"id":"1:2","chapter":1,"index":2,"title":"协议的三个要素","fullTitle":"协议的三个要素","intro":"课程介绍网络协议由语法、语义、时序三要素组成，理解它们是后续阅读协议格式的基础。","points":[{"text":"语法：数据格式、编码、字段组织等。","note":"","priority":"understand"},{"text":"语义：控制信息含义、动作及响应。","note":"","priority":"understand"},{"text":"时序：事件发生顺序、先后与速率匹配。","note":"","priority":"understand"}],"source":"PDF 第2–3页；转写 5.1","priority":"","memory":"协议三要素：语法定格式，语义定含义，时序定先后。"},{"id":"2:0","chapter":2,"index":0,"title":"OSI 七层模型与顺序","fullTitle":"OSI 七层模型与顺序","intro":"七层模型是老师明确要求记住的考点，特别是从下到上的顺序、数据单位、典型设备和主要功能。","points":[{"text":"从低到高：物理 → 数据链路 → 网络 → 传输 → 会话 → 表示 → 应用。","note":"","priority":"must"},{"text":"物理层传比特；数据链路层传帧；网络层传分组/包；传输层传段或报文。","note":"","priority":"must"},{"text":"代表设备：物理层中继器/集线器，链路层交换机/网桥，网络层路由器。","note":"","priority":"must"},{"text":"传输层 TCP/UDP；应用层 HTTP、FTP、SMTP、DNS 等。","note":"","priority":"frequent"},{"text":"会话层控制会话；表示层处理数据表示与转换；应用层面向应用服务。","note":"","priority":"understand"}],"source":"PDF 第3页；转写 5.1","priority":"must","visual":"osi","memory":"物、链、网、传、会、表、应。设备：集线器1层，交换机2层，路由器3层。"},{"id":"2:1","chapter":2,"index":1,"title":"物理层：比特、介质与中继设备","fullTitle":"物理层：比特、介质与中继设备","intro":"物理层关注信号和接口的物理/电气特征，老师重点让学生记住数据单位与设备归属。","points":[{"text":"传输单位：比特（bit，位）。","note":"","priority":"must"},{"text":"典型设备：中继器 Repeater、集线器 Hub。","note":"","priority":"must"},{"text":"传输介质和接口信号涉及线缆、连接器等。","note":"","priority":"understand"},{"text":"重复器再生与整形信号；不要把 USB 扩展集线器与以太网 Hub 混成同一设备。","note":"","priority":""}],"source":"PDF 第3页；转写 5.1","priority":"","visual":"devices","memory":"第1层传 bit；中继器、Hub。","notice":"转写使用 USB Hub 作比喻，容易误解：OSI 物理层代表的 Hub 是以太网集线器，不等同于 USB 扩展坞。"},{"id":"2:2","chapter":2,"index":2,"title":"数据链路层：帧、MAC 与交换机","fullTitle":"数据链路层：帧、MAC 与交换机","intro":"数据链路层在相邻节点的链路上以帧为单位传输，老师强调其设备和地址类型。","points":[{"text":"传输单位：帧 Frame。","note":"","priority":"must"},{"text":"典型设备：网桥 Bridge、二层交换机 Switch。","note":"","priority":"must"},{"text":"MAC 地址属于链路层标识，用于局域网内帧转发。","note":"","priority":"frequent"},{"text":"帧封装、帧校验与介质接入控制帮助提高链路传输可靠性。","note":"","priority":"understand"}],"source":"PDF 第3页；转写 5.1","priority":"","visual":"devices","memory":"第2层传帧，识别 MAC，设备是网桥/交换机。"},{"id":"2:3","chapter":2,"index":3,"title":"网络层：IP、路由器与主机地址","fullTitle":"网络层：IP、路由器与主机地址","intro":"网络层通过逻辑地址和路由选择完成跨网络的数据包传递；课程把路由器列为关键代表设备。","points":[{"text":"传输单位：IP 数据报/分组。","note":"","priority":"must"},{"text":"IP 地址属于网络层逻辑地址；路由器根据网络层地址转发。","note":"","priority":"must"},{"text":"典型设备：路由器 Router。","note":"","priority":"must"},{"text":"协议举例：IP、ICMP、IGMP；课程也在互联网层附近介绍 ARP/RARP。","note":"","priority":"frequent"}],"source":"PDF 第3页；转写 5.1","priority":"","visual":"devices","memory":"第3层：IP 定位网络，路由器决定下一跳。"},{"id":"2:4","chapter":2,"index":4,"title":"传输层：端到端、TCP 与 UDP","fullTitle":"传输层：端到端、TCP 与 UDP","intro":"传输层在应用进程之间提供端到端的数据传输服务，端口号用于区分同一主机的不同服务。","points":[{"text":"TCP：面向连接，可靠传输，保证有序、差错恢复等。","note":"","priority":"must"},{"text":"UDP：无连接，尽力交付，不保证可靠性与顺序。","note":"","priority":"must"},{"text":"端口号用于区分应用进程/服务，结合 IP 地址定位通信端点。","note":"","priority":"must"},{"text":"TCP 常用于 HTTP/FTP/邮件等传统协议；UDP 常用于 DNS 查询、DHCP、TFTP 等。","note":"","priority":"frequent"},{"text":"不要仅凭“上层协议”推断只能用单一运输方式：实际应用可有不同实现。","note":"","priority":"understand"}],"source":"PDF 第3页；转写 5.1","priority":"must","visual":"tcpudp","memory":"TCP 可靠、有连接；UDP 无连接、尽力而为；端口识别进程。"},{"id":"2:5","chapter":2,"index":5,"title":"会话、表示和应用层","fullTitle":"会话、表示和应用层","intro":"老师表示会话层、表示层只需要理解大意，应用层认识常见协议与功能。","points":[{"text":"会话层：会话建立、管理与结束。","note":"","priority":"understand"},{"text":"表示层：数据表示与格式转换、编码、加密与压缩等。","note":"","priority":"understand"},{"text":"应用层：提供应用进程使用的网络服务，常见 HTTP、FTP、SMTP、DNS 等。","note":"","priority":"frequent"},{"text":"对应实际 TCP/IP 协议栈时，这三层很多功能合并在应用层。","note":"","priority":"understand"}],"source":"PDF 第3页；转写 5.1","priority":"","visual":"osi","memory":"会话管会话；表示管格式；应用管服务。"},{"id":"2:6","chapter":2,"index":6,"title":"OSI 与 TCP/IP 四层对照","fullTitle":"OSI 与 TCP/IP 四层对照","intro":"老师明确要求认识 TCP/IP 四层模型，以及它与 OSI 七层各层大致对应。","points":[{"text":"TCP/IP 网络接口层 ≈ OSI 物理层 + 数据链路层。","note":"","priority":"must"},{"text":"TCP/IP 网际层（互联网层）≈ OSI 网络层。","note":"","priority":"must"},{"text":"TCP/IP 传输层 ≈ OSI 传输层。","note":"","priority":"must"},{"text":"TCP/IP 应用层 ≈ OSI 会话层 + 表示层 + 应用层。","note":"","priority":"must"},{"text":"这是一种教学上的分层对照，不同文献也会使用五层简化模型。","note":"","priority":"understand"}],"source":"PDF 第3页；转写 5.1","priority":"must","visual":"mapping","memory":"TCP/IP 四层：网络接口、网际、传输、应用。"},{"id":"3:0","chapter":3,"index":0,"title":"以太网 IEEE 802.3 家族速率","fullTitle":"以太网 IEEE 802.3 家族速率","intro":"课件列出传统以太网标准与典型速率，老师主要要求识别数字后缀。","points":[{"text":"IEEE 802.3：传统以太网 10 Mb/s。","note":"","priority":"frequent"},{"text":"IEEE 802.3u：快速以太网 100 Mb/s。","note":"","priority":"frequent"},{"text":"IEEE 802.3z：千兆以太网 1000 Mb/s。","note":"","priority":"frequent"},{"text":"IEEE 802.3ae：万兆以太网 10 Gb/s。","note":"","priority":"frequent"},{"text":"无线局域网以 IEEE 802.11 系列为典型标准。","note":"","priority":"understand"}],"source":"PDF 第4–6页；转写 5.1","priority":"","visual":"ieee","memory":"802.3 10M，802.3u 100M，802.3z 1000M，802.3ae 10G。","notice":"课件中的名称与速率是经典考试对照，并非以太网全部标准版本。"},{"id":"3:1","chapter":3,"index":1,"title":"TCP/IP 协议族结构总览","fullTitle":"TCP/IP 协议族结构总览","intro":"老师按照网际层、传输层、应用层介绍协议功能，要求看英文缩写能判断基本用途。","points":[{"text":"网际/网络层：IP 负责无连接的数据报传输与逻辑寻址。","note":"","priority":"frequent"},{"text":"ICMP：网络控制消息、差错报告，例如 ping 使用 ICMP 回显。","note":"","priority":"frequent"},{"text":"ARP：在 IPv4 同一链路上，将目标 IPv4 地址解析为对应 MAC 地址。","note":"","priority":"frequent"},{"text":"RARP：根据物理地址获取 IP 地址，是历史协议。","note":"","priority":"understand"},{"text":"IGMP：IPv4 组播组管理。","note":"","priority":"understand"},{"text":"传输层：TCP 和 UDP；应用层：HTTP、FTP、SMTP、POP3、DNS、DHCP 等。","note":"","priority":"must"}],"source":"PDF 第4–6页；转写 5.1","priority":"","visual":"protocolstack","memory":"IP/ICMP/ARP 看网络；TCP/UDP 看传输；HTTP/FTP/DNS 看应用。"},{"id":"3:2","chapter":3,"index":2,"title":"ARP、ICMP、IGMP 的功能辨析","fullTitle":"ARP、ICMP、IGMP 的功能辨析","intro":"这三个协议与 IP 一起出现时容易混淆，重点区分地址解析、差错控制与组播管理。","points":[{"text":"ARP：已知 IPv4 地址，解析对应链路层 MAC 地址。","note":"","priority":"must"},{"text":"ICMP：报告网络层错误与诊断信息。","note":"","priority":"frequent"},{"text":"IGMP：管理 IPv4 多播成员关系。","note":"","priority":"understand"},{"text":"RARP：已知 MAC 查询 IP，主要作历史概念了解。","note":"","priority":"understand"},{"text":"ARP 的协议栈归属在不同教材中表述略不同，按本课课件归入网际层相关协议识别。","note":"","priority":"understand"}],"source":"PDF 第4–6页；转写 5.1","priority":"","visual":"arp","memory":"ARP 寻 MAC，ICMP 报错与诊断，IGMP 管组播。"},{"id":"3:3","chapter":3,"index":3,"title":"TCP 与 UDP 的可靠性对比","fullTitle":"TCP 与 UDP 的可靠性对比","intro":"这是老师专门反复强调的对比，并联系 FTP/HTTP 与 DNS/DHCP 等上层协议。","points":[{"text":"TCP 先建立连接、提供可靠按序字节流。","note":"","priority":"must"},{"text":"UDP 不保证送达和顺序，开销较小。","note":"","priority":"must"},{"text":"课件常将 FTP、HTTP、SMTP、POP3 归为基于 TCP 的应用协议。","note":"","priority":"frequent"},{"text":"课件常将 DHCP、TFTP、SNMP 与 UDP 联系。","note":"","priority":"frequent"},{"text":"DNS 经典查询多用 UDP，某些场景也用 TCP，不能简单断言 DNS 永远不使用 TCP。","note":"","priority":"frequent"}],"source":"PDF 第4–6页；转写 5.1","priority":"must","visual":"tcpudp","memory":"TCP 可靠；UDP 省开销；记经典上层搭配。"},{"id":"3:4","chapter":3,"index":4,"title":"HTTP、HTTPS、FTP、Telnet 与 TFTP","fullTitle":"HTTP、HTTPS、FTP、Telnet 与 TFTP","intro":"课堂介绍常见应用协议的作用，重点是协议英文缩写、是否加密以及典型端口。","points":[{"text":"HTTP 超文本传输协议，默认端口 80/TCP。","note":"","priority":"frequent"},{"text":"HTTPS 是基于 TLS 的安全 HTTP，默认端口 443/TCP。","note":"","priority":"frequent"},{"text":"FTP 文件传输，常见控制端口 21/TCP；传统 FTP 数据连接与模式相关。","note":"","priority":"frequent"},{"text":"Telnet 远程终端登录 23/TCP，不提供现代安全的加密保障。","note":"","priority":"understand"},{"text":"TFTP 简单文件传输，通常基于 UDP/69。","note":"","priority":"understand"}],"source":"PDF 第4–6页；转写 5.1","priority":"","visual":"ports","memory":"HTTP 80，HTTPS 443，FTP 21，Telnet 23，TFTP 69。"},{"id":"3:5","chapter":3,"index":5,"title":"电子邮件：SMTP、POP3 与接收发送","fullTitle":"电子邮件：SMTP、POP3 与接收发送","intro":"课堂将 SMTP、POP3 列为典型电子邮件协议，对应发送/接收场景。","points":[{"text":"SMTP：邮件传输/提交协议，传统服务器间转发常用 25/TCP。","note":"","priority":"must"},{"text":"POP3：从邮件服务器取回邮件，默认 110/TCP。","note":"","priority":"frequent"},{"text":"IMAP 也常用于邮箱访问，默认 143/TCP（本课课件未重点展开）。","note":"","priority":"understand"},{"text":"邮件应用通常结合不同协议完成发送与收取。","note":"","priority":""}],"source":"PDF 第4–6页；转写 5.1","priority":"","visual":"ports","memory":"SMTP 发/转邮件，POP3 收邮件；常见端口 25、110。"},{"id":"3:6","chapter":3,"index":6,"title":"DNS、DHCP 与 SNMP","fullTitle":"DNS、DHCP 与 SNMP","intro":"老师重点解释域名解析与动态分配 IP 地址，其他管理协议以认识为主。","points":[{"text":"DNS：把域名解析到 IP 地址，传统 DNS 53/UDP 与 53/TCP。","note":"","priority":"must"},{"text":"DHCP：动态配置 IP 地址等网络参数，服务器 67/UDP、客户端 68/UDP。","note":"","priority":"must"},{"text":"SNMP：简单网络管理协议，传统查询端口 161/UDP、Trap 162/UDP。","note":"","priority":"understand"},{"text":"DNS 不是“直接返回网页”，而是解析名称与地址等记录。","note":"","priority":"understand"}],"source":"PDF 第4–6页；转写 5.1","priority":"","visual":"ports","memory":"DNS 查域名 53，DHCP 分地址 67/68，SNMP 管设备 161/162。"},{"id":"3:7","chapter":3,"index":7,"title":"常用端口集中记忆","fullTitle":"常用端口集中记忆","intro":"课件第 6 页专门给出端口表，适合制作成可速查和自测的内容。","points":[{"text":"HTTP：80；FTP 控制：21；Telnet：23。","note":"","priority":"must"},{"text":"SMTP：25；POP3：110；DNS：53。","note":"","priority":"must"},{"text":"DHCP 服务端：67；客户端：68。","note":"","priority":"frequent"},{"text":"TFTP：69；SNMP：161；Trap：162。","note":"","priority":"understand"},{"text":"HTTPS：443 为常见安全 Web 端口，是对 HTTP 的补充。","note":"","priority":"understand"}],"source":"PDF 第4–6页；转写 5.1","priority":"frequent","visual":"ports","memory":"20 FTP 数据（传统主动模式）、21 FTP 控制、23 Telnet、25 SMTP、53 DNS、67/68 DHCP、80 HTTP、110 POP3、161/162 SNMP。"},{"id":"4:0","chapter":4,"index":0,"title":"双绞线、UTP/STP 与网线分类","fullTitle":"双绞线、UTP/STP 与网线分类","intro":"课程重点介绍双绞线和光纤；同轴电缆在该课程里只需了解名称。","points":[{"text":"双绞线由成对绞合的铜导线构成，常见以太网双绞线使用 RJ-45 类接口。","note":"","priority":"must"},{"text":"UTP：非屏蔽双绞线，通常成本较低、安装较便利。","note":"","priority":"frequent"},{"text":"STP：屏蔽双绞线，利用屏蔽层增强抗干扰能力，施工要求也更高。","note":"","priority":"frequent"},{"text":"课件举三类/五类/超五类/六类与 10M/100M/1000M 速率的经典对应。","note":"","priority":"understand"},{"text":"同轴电缆只了解基本类别；实际是否“淘汰”应结合具体技术场景。","note":"","priority":"understand"}],"source":"PDF 第7–10页；转写 5.2","priority":"","visual":"media","memory":"UTP 无屏蔽，STP 有屏蔽；铜缆主要传电信号。"},{"id":"4:1","chapter":4,"index":1,"title":"T568A / T568B 与直通线、交叉线","fullTitle":"T568A / T568B 与直通线、交叉线","intro":"老师讲到 RJ-45 网线八芯线序，表示偶尔会考，重点理解 1、2 与 3、6 线对的交换规律。","points":[{"text":"T568A：白绿、绿、白橙、蓝、白蓝、橙、白棕、棕。","note":"","priority":"understand"},{"text":"T568B：白橙、橙、白绿、蓝、白蓝、绿、白棕、棕。","note":"","priority":"understand"},{"text":"直通线：两端使用相同线序（A-A 或 B-B）。","note":"","priority":"frequent"},{"text":"交叉线：一端 A 一端 B，经典 10/100M 交换 1↔3、2↔6。","note":"","priority":"frequent"},{"text":"现代以太网常支持 Auto MDI-X，未必需要人工区分直通与交叉线。","note":"","priority":"understand"}],"source":"PDF 第7–10页；转写 5.2","priority":"","visual":"wires","memory":"T568A 绿对在前，T568B 橙对在前；差异集中 1、2、3、6。"},{"id":"4:2","chapter":4,"index":2,"title":"单模与多模光纤","fullTitle":"单模与多模光纤","intro":"光纤通过光信号传输，老师要求认识单模、多模光纤的区别，数字规格以课件历史场景为例。","points":[{"text":"MMF 多模光纤：允许多个光传播模式，常用于较短距离，光源可为 LED/VCSEL。","note":"","priority":"must"},{"text":"SMF 单模光纤：传播模式较少（理想单模），适合远距离链路。","note":"","priority":"must"},{"text":"核心差异：传播模式、芯径、设备成本与适用距离不同。","note":"","priority":"frequent"},{"text":"课件中关于 2 km、550 m、5 km 等距离属于特定链路速率/器件组合，不能当作所有光纤的固定上限。","note":"","priority":"understand"}],"source":"PDF 第7–10页；转写 5.2","priority":"","visual":"fiber","memory":"MMF 多模适合较短距离，SMF 单模适合远距离；介质传光信号。"},{"id":"4:3","chapter":4,"index":3,"title":"通信方向：单工、半双工、全双工","fullTitle":"通信方向：单工、半双工、全双工","intro":"分清能否双向通信，以及能否同时双向，是最稳定的概念辨析题。","points":[{"text":"单工：只能 A→B 单向传输。","note":"","priority":"must"},{"text":"半双工：可 A↔B 双向，但同一时刻仅能一个方向发送。","note":"","priority":"must"},{"text":"全双工：A↔B 可同时双向传输。","note":"","priority":"must"},{"text":"课堂比喻：对讲机常为半双工，普通电话可全双工。","note":"","priority":"frequent"}],"source":"PDF 第7–10页；转写 5.2","priority":"","visual":"duplex","memory":"单工一条单向箭头；半双工双向轮流；全双工双向同时。"},{"id":"4:4","chapter":4,"index":4,"title":"电路交换、报文交换、分组交换","fullTitle":"电路交换、报文交换、分组交换","intro":"课程专门比较三种数据交换模式，需要认识建立专线、存储转发和拆分小包三类特点。","points":[{"text":"电路交换：通信前先建立专用通路，建立连接后可连续发送。","note":"","priority":"frequent"},{"text":"报文交换：以完整报文为单位存储转发，中间节点缓存整条报文。","note":"","priority":"frequent"},{"text":"分组交换：把报文拆成较小分组，经网络转发与重组。","note":"","priority":"must"},{"text":"分组交换适合计算机网络，资源按需共享；可结合虚电路/数据报方式。","note":"","priority":"frequent"}],"source":"PDF 第7–10页；转写 5.2","priority":"","visual":"switchmode","memory":"电路先占线；报文整份存转；分组先切包。"},{"id":"4:5","chapter":4,"index":5,"title":"ATM 信元与通信补充考点","fullTitle":"ATM 信元与通信补充考点","intro":"课件补充 ATM 信元结构和一些通信相关术语，老师以认识和题目印象为主。","points":[{"text":"ATM 采用固定长度信元，53 字节。","note":"","priority":"understand"},{"text":"ATM 信元头部 5 字节，净荷 48 字节。","note":"","priority":"frequent"},{"text":"相关广域网术语 PPP、ISDN、xDSL、DDN、X.25、帧中继等，理解名字即可。","note":"","priority":"understand"}],"source":"PDF 第7–10页；转写 5.2","priority":"","visual":"atm","memory":"ATM：53B 信元 = 5B 头 + 48B 有效载荷。"},{"id":"5:0","chapter":5,"index":0,"title":"IPv4 地址格式：32 位与点分十进制","fullTitle":"IPv4 地址格式：32 位与点分十进制","intro":"课堂强调 IP 地址是后续子网计算的基础：4 段、32 位，每段 8 位，能转成二进制才会计算。","points":[{"text":"IPv4 长度 32 bit，4 个 8 bit 字节，以点分十进制表示。","note":"","priority":"must"},{"text":"每段整数范围 0～255；例如 128.11.3.31。","note":"","priority":"must"},{"text":"IPv4 地址由网络前缀与主机部分组成，CIDR 用 /n 表示前缀长度。","note":"","priority":"must"},{"text":"IP 是逻辑地址，MAC 是链路层地址，两者不要混淆。","note":"","priority":"frequent"}],"source":"PDF 第11–12页；转写 5.2","priority":"","visual":"ipv4","memory":"IPv4＝32 位＝4 字节；每段 8 位；一个字节 0～255。"},{"id":"5:1","chapter":5,"index":1,"title":"A/B/C/D/E 类地址识别","fullTitle":"A/B/C/D/E 类地址识别","intro":"课件兼顾传统有类编址与现代无类前缀；老师强调至少要能按首字节判断 A/B/C 类。","points":[{"text":"A 类首字节 1～126，默认 /8；127 段留给环回等用途。","note":"","priority":"must"},{"text":"B 类首字节 128～191，默认 /16。","note":"","priority":"must"},{"text":"C 类首字节 192～223，默认 /24。","note":"","priority":"must"},{"text":"D 类 224～239，组播地址；E 类 240～255，保留/特殊用途。","note":"","priority":"understand"},{"text":"判断题先看首字节范围，不要直接把 /24 误认成所有 C 类地址。","note":"","priority":"frequent"}],"source":"PDF 第11–12页；转写 5.2","priority":"","visual":"ipclasses","memory":"A 1–126；B 128–191；C 192–223；D 224–239；E 240–255。"},{"id":"5:2","chapter":5,"index":2,"title":"公有、私有、环回及其他特殊 IPv4 地址","fullTitle":"公有、私有、环回及其他特殊 IPv4 地址","intro":"老师将公私网地址作为重要记忆点；要能识别局域网中最常见的私有地址和环回地址。","points":[{"text":"私有 A 段：10.0.0.0/8。","note":"","priority":"must"},{"text":"私有 B 段：172.16.0.0/12（172.16～172.31）。","note":"","priority":"must"},{"text":"私有 C 段：192.168.0.0/16。","note":"","priority":"must"},{"text":"127.0.0.0/8 是环回地址空间，127.0.0.1 常用于本机。","note":"","priority":"frequent"},{"text":"169.254.0.0/16 为链路本地地址，主机自动配置时常见。","note":"","priority":"understand"},{"text":"公有地址与私有地址并非单靠 A/B/C 分类判断，私网需要 NAT 等机制访问公网。","note":"","priority":"understand"}],"source":"PDF 第11–12页；转写 5.2","priority":"","visual":"privateip","memory":"私网三段：10/8，172.16/12，192.168/16；127.0.0.1 环回。"},{"id":"5:3","chapter":5,"index":3,"title":"子网掩码与 CIDR 表示","fullTitle":"子网掩码与 CIDR 表示","intro":"掩码的高 n 位为 1、低 32−n 位为 0，结合 IP 的网络部分与主机部分计算。","points":[{"text":"地址 192.168.1.130/26，前缀为 26，主机部分为 6 位。","note":"","priority":"must"},{"text":"掩码：255.255.255.192。","note":"","priority":"must"},{"text":"每个 /26 网段共有 2⁶＝64 个地址，传统可用主机数为 62。","note":"","priority":"must"},{"text":"网络地址用 IP 按位与掩码得到，广播地址将主机位全置 1。","note":"","priority":"frequent"},{"text":"掩码连续 1 后接连续 0；不连续掩码不是常见的 CIDR 子网模型。","note":"","priority":"understand"}],"source":"PDF 第11–12页；转写 5.2","priority":"must","visual":"mask","memory":"前 n 位 1，后 32−n 位 0；总地址 2^(32−n)。"},{"id":"6:0","chapter":6,"index":0,"title":"子网划分：借位求数量","fullTitle":"子网划分：借位求数量","intro":"这是老师明确指出的理解与计算难点，重点看从原网络主机位借走几位作为子网位。","points":[{"text":"从原前缀 /23 分成 /27 子网：借位 27−23＝4。","note":"","priority":"must"},{"text":"分出的等长子网个数 2⁴＝16 个。","note":"","priority":"must"},{"text":"每个 /27 子网的主机位是 32−27＝5，总地址数 32。","note":"","priority":"must"},{"text":"传统可用主机数 2⁵−2＝30。","note":"","priority":"must"},{"text":"结合题目实际可用地址规则，常规网络和广播地址不分给主机。","note":"","priority":"frequent"}],"source":"PDF 第12–13页；转写 5.2","priority":"must","visual":"subnet","memory":"子网个数=2^(新前缀−原前缀)；常规可用主机数=2^(32−新前缀)−2。","examples":[{"title":"PDF 第13页真题：/23 划为 /27","given":"117.15.32.0/23 划分为 /27，求子网数与每个子网主机数","steps":["从 /23 到 /27：借了 4 位作子网号","子网数：2^4＝16 个","剩余 5 位主机号：2^5＝32 地址","排除网络地址和广播地址：32−2＝30 个传统可用主机地址"],"answer":"16 个子网；每个子网 30 个常规可用主机地址","warning":""}]},{"id":"6:1","chapter":6,"index":1,"title":"子网计算四步法","fullTitle":"子网计算四步法","intro":"把老师讲过的进制转换和主机计算整理成固定顺序，避免只记公式不会求网络地址。","points":[{"text":"① 读懂 IP/n，主机位 h＝32−n。","note":"","priority":"must"},{"text":"② 计算掩码：n 个连续 1，再补 32−n 个 0。","note":"","priority":"must"},{"text":"③ IP 与掩码按位 AND 求网络地址。","note":"","priority":"must"},{"text":"④ 主机位全 1 求广播地址；一般可用范围为网络＋1 到广播−1。","note":"","priority":"must"},{"text":"按区块大小（如 /27 为 32）定位所在子网，能快速做选择题。","note":"","priority":"frequent"}],"source":"PDF 第12–13页；转写 5.2","priority":"must","visual":"subnetcalc","memory":"看前缀→写掩码→求网络地址→求广播地址→定可用范围。","examples":[{"title":"192.168.1.130/26","given":"求掩码、网络地址、广播地址和传统主机范围","steps":["主机位 6，区块大小 64","第四段按 0、64、128、192 分段，130 落在 128～191","掩码为 255.255.255.192","主机位全 0 得 .128，全 1 得 .191"],"answer":"网络 192.168.1.128；广播 192.168.1.191；可用 .129～.190","warning":""}]},{"id":"6:2","chapter":6,"index":2,"title":"按主机数选前缀","fullTitle":"按主机数选前缀","intro":"如果题目反过来给主机需求，需要从最小的主机位数 h 开始，保证传统可用主机数量覆盖需求。","points":[{"text":"每个子网需 100 台主机时：2⁶−2＝62 不够；2⁷−2＝126 足够。","note":"","priority":"must"},{"text":"主机位至少 7，前缀最多 32−7＝/25。","note":"","priority":"must"},{"text":"需要 300 台主机：2⁸−2＝254 不够；2⁹−2＝510 足够，对应 /23。","note":"","priority":"frequent"},{"text":"注意可用主机数量与地址总数不同，常规题要减去网络和广播地址。","note":"","priority":""}],"source":"PDF 第12–13页；转写 5.2","priority":"frequent","visual":"hostneed","memory":"先找最小 h 使 2^h−2≥主机数，再得前缀 32−h。"},{"id":"6:3","chapter":6,"index":3,"title":"超网汇聚：合并连续网段","fullTitle":"超网汇聚：合并连续网段","intro":"与子网划分相反，超网汇聚将多个相邻且正确对齐的网络归纳为更短前缀的地址块。","points":[{"text":"两个大小相同、相邻且按汇聚后边界对齐的网段可合成一个更短前缀。","note":"","priority":"must"},{"text":"例如 192.168.0.0/24 与 192.168.1.0/24 → 192.168.0.0/23。","note":"","priority":"frequent"},{"text":"汇聚前求多个网段二进制地址的最长公共前缀。","note":"","priority":"must"},{"text":"只有地址连续还不够，还必须满足汇聚后网络边界对齐。","note":"","priority":"frequent"},{"text":"路由汇总能减少路由表条目，但具体网络拓扑需要确保路由正确。","note":"","priority":"understand"}],"source":"PDF 第12–13页；转写 5.2","priority":"must","visual":"supernet","memory":"超网：找公共前缀，地址连续且边界对齐。"},{"id":"6:4","chapter":6,"index":4,"title":"IP 子网真题常见陷阱","fullTitle":"IP 子网真题常见陷阱","intro":"老师让考生熟悉借位、分类和边界判断，计算题经常不是公式复杂，而是没有看清前缀位置。","points":[{"text":"不要把“新前缀 /27 的 27 位”全部算作借位，借位只看新旧前缀差。","note":"","priority":"must"},{"text":"传统主机数要先算 2^h，再减去网络和广播地址。","note":"","priority":"must"},{"text":"分配给不同部门的网络必须不重叠，网络号要满足区块对齐。","note":"","priority":"frequent"},{"text":"判断某 IP 属于哪个网络，按掩码 AND，而非直接看第一段是不是 B 类。","note":"","priority":"frequent"},{"text":"当题目询问的是地址总数而非可用主机数时，不要多减 2。","note":"","priority":"understand"}],"source":"PDF 第12–13页；转写 5.2","priority":"","visual":"subnet","memory":"借位＝新−旧；主机位＝32−新；总数不减2，可用数减2。"},{"id":"7:0","chapter":7,"index":0,"title":"IPv6 地址长度及特点","fullTitle":"IPv6 地址长度及特点","intro":"IPv6 主要缓解 IPv4 地址空间不足，课程强调 128 位地址与相对 IPv4 的优势。","points":[{"text":"IPv4 32 位，IPv6 128 位；理论地址空间规模是 IPv4 的 2^96 倍。","note":"","priority":"must"},{"text":"IPv6 使用冒号分隔的十六进制地址组，支持零压缩表示。","note":"","priority":"frequent"},{"text":"IPv6 首部与扩展首部结构不同于 IPv4，便于可扩展设计。","note":"","priority":"understand"},{"text":"课程列举更大地址空间、简化头部、更多服务支持等。","note":"","priority":"understand"},{"text":"IPv6 安全能力不代表默认每条 IPv6 通信都加密。","note":"","priority":"understand"}],"source":"PDF 第13–15页；转写 5.3","priority":"","visual":"ipv6","memory":"IPv4＝32 位，IPv6＝128 位，地址空间倍数＝2^96。","notice":"课堂“IPv4 地址已经全部用完”和“IPv6 天然更安全”等用语是简化表述；此处仅保留考试中的结构与设计目标，避免理解成 IPv4 网络不能继续工作或 IPv6 流量自动加密。"},{"id":"7:1","chapter":7,"index":1,"title":"IPv4 → IPv6 三种过渡技术","fullTitle":"IPv4 → IPv6 三种过渡技术","intro":"老师明确说三种过渡技术要记：双协议栈、隧道和翻译。","points":[{"text":"双协议栈：同一主机/设备同时支持 IPv4 与 IPv6。","note":"","priority":"must"},{"text":"隧道技术：在 IPv4 等网络中封装传输 IPv6 报文。","note":"","priority":"must"},{"text":"翻译技术：通过转换机制让不同协议版本之间通信。","note":"","priority":"must"},{"text":"不同过渡技术可以组合使用，并非绝对互斥。","note":"","priority":"understand"}],"source":"PDF 第13–15页；转写 5.3","priority":"frequent","visual":"transition","memory":"过渡三件套：双栈同时运行、隧道封装传输、翻译转换协议。"},{"id":"7:2","chapter":7,"index":2,"title":"网络设计三层模型","fullTitle":"网络设计三层模型","intro":"网络规划的逻辑模型，老师将核心、汇聚、接入三层对应功能列为经常考到的概念题。","points":[{"text":"核心层：高速数据转发、骨干互联，尽量简化策略处理。","note":"","priority":"must"},{"text":"汇聚层：连接核心与接入，实施安全、流量控制和路由策略。","note":"","priority":"must"},{"text":"接入层：面向终端用户接入，可负责用户认证、接入控制和地址管理等。","note":"","priority":"must"},{"text":"从上到下：核心层 → 汇聚层 → 接入层。","note":"","priority":"frequent"}],"source":"PDF 第13–15页；转写 5.3","priority":"must","visual":"three-tier","memory":"核心快转发，汇聚实施策略，接入服务用户。"},{"id":"7:3","chapter":7,"index":3,"title":"PDS 综合布线六大子系统","fullTitle":"PDS 综合布线六大子系统","intro":"课程介绍建筑物综合布线/结构化布线系统，强调名称识别和系统间连接关系。","points":[{"text":"工作区子系统：用户信息插座到终端设备的连接。","note":"","priority":"must"},{"text":"水平子系统：连接楼层配线间与工作区子系统。","note":"","priority":"frequent"},{"text":"垂直干线（干线）子系统：建筑内部跨楼层骨干布线。","note":"","priority":"frequent"},{"text":"管理子系统：跳线与配线设施管理。","note":"","priority":"understand"},{"text":"设备间子系统：设备机房及主配线设施。","note":"","priority":"understand"},{"text":"建筑群子系统：楼宇之间布线互联。","note":"","priority":"understand"}],"source":"PDF 第13–15页；转写 5.3","priority":"frequent","visual":"pds","memory":"PDS 六个：工作区、水平、干线、管理、设备间、建筑群。"},{"id":"7:4","chapter":7,"index":4,"title":"网络规划与布线题的辨析","fullTitle":"网络规划与布线题的辨析","intro":"规划题通常给出层次或布线功能描述，要求判断属于三层模型的哪一层或 PDS 的哪个子系统。","points":[{"text":"“高速骨干数据交换”对应核心层。","note":"","priority":"frequent"},{"text":"“安全、路由策略及多业务汇聚”对应汇聚层。","note":"","priority":"frequent"},{"text":"“终端接入、用户认证与计费”对应接入层。","note":"","priority":"frequent"},{"text":"“楼层配线间 → 信息插座”对应水平子系统。","note":"","priority":"frequent"},{"text":"“楼层间主干”对应垂直干线子系统。","note":"","priority":"frequent"}],"source":"PDF 第13–15页；转写 5.3","priority":"","visual":"three-tier","memory":"高速转发找核心，策略找汇聚，用户找接入；楼层内水平、楼层间干线。"},{"id":"8:0","chapter":8,"index":0,"title":"RAID 目的与 RAID 0/1","fullTitle":"RAID 目的与 RAID 0/1","intro":"老师把 RAID 列为网络存储技术，要求知道利用多磁盘提高性能或可靠性，尤其认识 0 与 1 级区别。","points":[{"text":"RAID 0 条带化：至少两盘，容量利用率理论上接近 100%，没有冗余容错。","note":"","priority":"must"},{"text":"RAID 1 镜像：两盘相互备份，常见双盘容量利用率约 50%。","note":"","priority":"must"},{"text":"RAID 将多盘组成逻辑存储系统，目标可能是速度、容量或故障容忍。","note":"","priority":"frequent"},{"text":"RAID 不等于备份，误删除/勒索软件/火灾等风险仍需要独立备份。","note":"","priority":"understand"}],"source":"PDF 第15–17页；转写 5.3","priority":"must","visual":"raid0-1","memory":"RAID0 拼速度但不冗余；RAID1 做镜像，双盘容量利用率约一半。"},{"id":"8:1","chapter":8,"index":1,"title":"RAID 3、RAID 5 的校验机制","fullTitle":"RAID 3、RAID 5 的校验机制","intro":"课程在讲解不同 RAID 级别时指出校验盘与分布式校验的差异，重点理解冗余如何增加可靠性。","points":[{"text":"RAID 3：使用专用校验盘，数据按条带分布。","note":"","priority":"frequent"},{"text":"RAID 5：分布式奇偶校验，至少 3 盘，容忍 1 块磁盘失效。","note":"","priority":"must"},{"text":"N 块同容量磁盘的 RAID 5 可用容量通常为 (N−1)×单盘容量。","note":"","priority":"frequent"},{"text":"RAID 2 属于了解级别，现代实际使用较少。","note":"","priority":"understand"},{"text":"多盘失效超过阵列容错能力会造成数据风险。","note":"","priority":"understand"}],"source":"PDF 第15–17页；转写 5.3","priority":"frequent","visual":"raid5","memory":"RAID5：校验分散，至少三盘，允许单盘故障，可用 N−1 盘容量。"},{"id":"8:2","chapter":8,"index":2,"title":"RAID 0+1 与 RAID 1+0 对比","fullTitle":"RAID 0+1 与 RAID 1+0 对比","intro":"老师通过“先条带再镜像”与“先镜像再条带”解释两种组合级别，重点理解组合次序。","points":[{"text":"RAID 0+1：先做 RAID0 条带组，再对条带组镜像。","note":"","priority":"frequent"},{"text":"RAID 1+0（RAID10）：先做 RAID1 镜像组，再跨组条带化。","note":"","priority":"frequent"},{"text":"同样四块同容量硬盘时，常见两种方案容量利用率均约 50%。","note":"","priority":"frequent"},{"text":"实际可承受的故障组合不同，需要结合坏盘位置判定，不应只背“能坏几块”的固定结论。","note":"","priority":"understand"}],"source":"PDF 第15–17页；转写 5.3","priority":"","visual":"raidcombo","memory":"0+1 先条带后镜像；1+0 先镜像后条带。"},{"id":"8:3","chapter":8,"index":3,"title":"DAS、NAS、SAN 结构与访问粒度","fullTitle":"DAS、NAS、SAN 结构与访问粒度","intro":"老师要求记住三种存储架构的英文缩写及差异，特别是直连/网络文件共享/存储网络块访问。","points":[{"text":"DAS（Direct Attached Storage）：存储设备直接连接服务器。","note":"","priority":"must"},{"text":"NAS（Network Attached Storage）：通过网络提供文件级共享访问。","note":"","priority":"must"},{"text":"SAN（Storage Area Network）：通过专用/逻辑存储网络提供块级访问。","note":"","priority":"must"},{"text":"SAN 可以采用 FC SAN、IP SAN 等不同基础设施。","note":"","priority":"understand"},{"text":"NAS 按文件服务，SAN 常提供块设备，不能仅凭“都通过网络”混淆。","note":"","priority":"frequent"}],"source":"PDF 第15–17页；转写 5.3","priority":"must","visual":"storage","memory":"DAS 直连；NAS 文件级网络共享；SAN 块级存储网络。"},{"id":"9:0","chapter":9,"index":0,"title":"NAT 网络地址转换","fullTitle":"NAT 网络地址转换","intro":"课堂把 NAT 作为网络补充考点，强调局域网私有地址通过少量公网地址对外访问的意义。","points":[{"text":"NAT 在不同地址域之间转换 IP 地址，常结合端口转换 NAPT。","note":"","priority":"frequent"},{"text":"家用路由器常见多个内网终端共享公网 IPv4 地址的情形。","note":"","priority":"frequent"},{"text":"NAT 不负责为主机分配 IP（那通常是 DHCP 的任务）。","note":"","priority":"understand"},{"text":"NAT 不是加密协议，也不等同于防火墙。","note":"","priority":"understand"}],"source":"PDF 第18–19页；转写 5.3","priority":"","visual":"nat","memory":"NAT 转换地址；多台私网主机可共用公网 IPv4 出口。"},{"id":"9:1","chapter":9,"index":1,"title":"VLAN：逻辑分组与广播域","fullTitle":"VLAN：逻辑分组与广播域","intro":"虚拟局域网把用户或端口在逻辑上划分到不同的二层广播域，老师强调与物理位置不是一一对应。","points":[{"text":"VLAN 是逻辑划分，不要求终端处于同一物理线缆分支。","note":"","priority":"must"},{"text":"一个 VLAN 通常构成一个二层广播域。","note":"","priority":"frequent"},{"text":"不同 VLAN 的 IP 通信通常需要三层转发设备。","note":"","priority":"understand"},{"text":"IEEE 802.1Q 是常见 VLAN 标签机制。","note":"","priority":"understand"}],"source":"PDF 第18–19页；转写 5.3","priority":"","visual":"vlan","memory":"VLAN 是逻辑分组，一个 VLAN 一个广播域。"},{"id":"9:2","chapter":9,"index":2,"title":"VPN：通过公共网络构建逻辑专用网络","fullTitle":"VPN：通过公共网络构建逻辑专用网络","intro":"课件补充 VPN（虚拟专用网络）与逻辑隧道的思想，以认识概念为主。","points":[{"text":"VPN 可在共享公网基础设施上构建逻辑隔离的专用通信连接。","note":"","priority":"understand"},{"text":"常见 VPN 方案会通过隧道、安全认证和加密等机制保护传输。","note":"","priority":"understand"},{"text":"VPN 并不是自动赋予所有访问权限，具体访问控制依实现而定。","note":"","priority":"understand"}],"source":"PDF 第18–19页；转写 5.3","priority":"","visual":"vpn","memory":"VPN：在公共网络上提供逻辑专用连接。"},{"id":"9:3","chapter":9,"index":3,"title":"IP、掩码与默认网关的连通性判断","fullTitle":"IP、掩码与默认网关的连通性判断","intro":"老师提到网络故障判断题可能要求检查网关和主机的网络号是否一致。","points":[{"text":"按设备 IP 与掩码求出设备网络地址。","note":"","priority":"frequent"},{"text":"再对网关 IP 使用相同掩码判断网关是否在同一链路子网中。","note":"","priority":"frequent"},{"text":"如果普通 IPv4 主机默认网关不可从本地网络直接访问，跨网段通信往往失败。","note":"","priority":"frequent"},{"text":"真实网络可能存在代理 ARP、复杂路由等特殊设计，考试一般按标准单网段模型。","note":"","priority":"understand"}],"source":"PDF 第18–19页；转写 5.3","priority":"","visual":"gateway","memory":"查不通：先看本机 IP/掩码，再看默认网关是否可达。"},{"id":"9:4","chapter":9,"index":4,"title":"URL 组成与域名层级","fullTitle":"URL 组成与域名层级","intro":"课程结尾补充 URL 的组成，要求认识协议、主机名、域名和资源路径。","points":[{"text":"示例：https://www.example.com/path/index.html。","note":"","priority":"frequent"},{"text":"https 是方案/协议标识；www.example.com 是主机名。","note":"","priority":"frequent"},{"text":"example.com 是域名的一部分，.com 为顶级域。","note":"","priority":"frequent"},{"text":"/path/index.html 是路径，真实 URL 还可包含端口、查询串和片段。","note":"","priority":"understand"}],"source":"PDF 第18–19页；转写 5.3","priority":"","visual":"url","memory":"URL：协议方案 + 主机名 + 资源路径（可含端口和查询）。"},{"id":"9:5","chapter":9,"index":5,"title":"考前复习：五组判断题与计算套路","fullTitle":"考前复习：五组判断题与计算套路","intro":"将课堂散点知识收束成可用于随堂自测的复习提纲，先做概念分类，再训练子网计算。","points":[{"text":"分层：物理1/链路2/网络3，记数据单位、设备、地址类别。","note":"","priority":"must"},{"text":"协议：ARP/DNS/DHCP 的功能与 SMTP/POP3 的区别。","note":"","priority":"must"},{"text":"IP：A/B/C 范围、私网三段、前缀与掩码、借位与主机数。","note":"","priority":"must"},{"text":"规划：核心/汇聚/接入层和 PDS 六子系统。","note":"","priority":"frequent"},{"text":"存储：RAID0/1/5 与 DAS/NAS/SAN。","note":"","priority":"frequent"},{"text":"老师建议对偏门杂题不无限扩展，以课堂精讲和真题为优先。","note":"","priority":"understand"}],"source":"PDF 第18–19页；转写 5.3","priority":"","visual":"road","memory":"常考：OSI 层级、协议功能、IPv4、子网、规划、RAID。"}],"quizzes":[{"chapter":0,"topic":"0:0","question":"课程老师估计网络基础知识通常约占多少分？","options":["约 1 分","约 5 分","约 15 分","固定 20 分"],"answer":1,"explain":"老师在 5.1 开篇说大约五分，是课堂经验不是官方固定分值。"},{"chapter":1,"topic":"1:0","question":"LAN 的含义是？","options":["个人区域网","局域网","城域网","广域网"],"answer":1,"explain":"LAN = Local Area Network，局域网。"},{"chapter":1,"topic":"1:0","question":"1 Byte 等于多少 bit？","options":["2","4","8","16"],"answer":2,"explain":"1B=8b，注意大写 B 与小写 b。"},{"chapter":1,"topic":"1:1","question":"星型网络拓扑依赖哪类关键结构？","options":["环状连接","中心设备","共同闭合总线","每对节点直接相连"],"answer":1,"explain":"星型网络节点向中心汇聚。"},{"chapter":1,"topic":"1:2","question":"网络协议的三要素为？","options":["语法、语义、时序","容量、速率、频率","用户、密码、端口","网关、路由、交换"],"answer":0,"explain":"协议三要素是语法、语义和时序。"},{"chapter":2,"topic":"2:0","question":"OSI 七层模型自低到高第三层是？","options":["物理层","数据链路层","网络层","传输层"],"answer":2,"explain":"OSI 从底往上是物理、数据链路、网络、传输、会话、表示、应用。"},{"chapter":2,"topic":"2:0","question":"OSI 七层模型的典型第二层数据单位为？","options":["比特","帧","IP 数据报","字节码"],"answer":1,"explain":"链路层以帧为单位。"},{"chapter":2,"topic":"2:1","question":"集线器 Hub 通常被归入 OSI 哪层？","options":["物理层","数据链路层","网络层","传输层"],"answer":0,"explain":"传统以太网 Hub 是物理层设备。"},{"chapter":2,"topic":"2:2","question":"交换机与 MAC 地址通常归为哪层？","options":["物理层","数据链路层","网络层","表示层"],"answer":1,"explain":"二层交换机根据 MAC 地址转发帧。"},{"chapter":2,"topic":"2:3","question":"路由器主要工作在 OSI 哪一层？","options":["物理层","会话层","网络层","表示层"],"answer":2,"explain":"路由器主要根据网络层 IP 地址进行跨网转发。"},{"chapter":2,"topic":"2:4","question":"TCP 主要提供什么类型的传输服务？","options":["可靠、面向连接","不可重传的模拟电路","仅限广播","只用于 ARP"],"answer":0,"explain":"TCP 建立连接并提供可靠有序字节流。"},{"chapter":2,"topic":"2:6","question":"TCP/IP 四层模型的最上层是？","options":["网际层","网络接口层","传输层","应用层"],"answer":3,"explain":"TCP/IP 应用层包含 OSI 会话/表示/应用层对应功能。"},{"chapter":3,"topic":"3:0","question":"IEEE 802.3u 对应的经典以太网速率是？","options":["10 Mb/s","100 Mb/s","1000 Mb/s","10 Gb/s"],"answer":1,"explain":"快速以太网 IEEE 802.3u 对应 100 Mb/s。"},{"chapter":3,"topic":"3:1","question":"在 TCP/IP 经典协议族中 TCP/UDP 属于？","options":["应用层","传输层","网络接口层","物理层"],"answer":1,"explain":"TCP/UDP 是传输层协议。"},{"chapter":3,"topic":"3:2","question":"已知一个 IPv4 地址，需要查询其局域网 MAC 地址，应使用？","options":["ARP","DNS","SMTP","UDP"],"answer":0,"explain":"ARP 完成同链路内 IPv4 → MAC 解析。"},{"chapter":3,"topic":"3:2","question":"ICMP 主要用于？","options":["动态分配地址","网络控制消息与诊断","收邮件","光纤信号编码"],"answer":1,"explain":"ICMP 常用于错误报告、ping 等诊断。"},{"chapter":3,"topic":"3:3","question":"关于 TCP 与 UDP，正确的是？","options":["UDP 保证有序到达","TCP 无连接","TCP 可靠传输，UDP 尽力交付","两者都没有端口号"],"answer":2,"explain":"TCP 与 UDP 都通过端口区分服务，但传输保障不同。"},{"chapter":3,"topic":"3:4","question":"HTTP 的传统默认端口是？","options":["21","25","53","80"],"answer":3,"explain":"HTTP 使用 80，HTTPS 常用 443。"},{"chapter":3,"topic":"3:4","question":"FTP 传统控制连接端口是？","options":["21","23","53","110"],"answer":0,"explain":"FTP 控制端口常用 21/TCP。"},{"chapter":3,"topic":"3:5","question":"SMTP 主要用于？","options":["邮件传输","解析 MAC 地址","网络时间同步","分配 IP 地址"],"answer":0,"explain":"SMTP 是邮件发送与转发的应用层协议。"},{"chapter":3,"topic":"3:5","question":"POP3 常见端口号是？","options":["80","25","110","443"],"answer":2,"explain":"POP3 的默认端口为 110/TCP。"},{"chapter":3,"topic":"3:6","question":"DNS 主要作用是？","options":["分配动态 IP","域名解析","管理网桥","检查磁盘阵列"],"answer":1,"explain":"DNS 负责域名与 IP 等记录解析。"},{"chapter":3,"topic":"3:6","question":"DHCP 服务器经典端口是？","options":["67/UDP","68/TCP","53/TCP","80/UDP"],"answer":0,"explain":"DHCP 服务器 UDP/67；客户端 UDP/68。"},{"chapter":3,"topic":"3:7","question":"SNMP 常见管理查询端口是？","options":["21","110","161","443"],"answer":2,"explain":"传统 SNMP 查询使用 UDP/161。"},{"chapter":4,"topic":"4:0","question":"UTP 与 STP 的主要差别是？","options":["是否有额外屏蔽层","是否能够使用 IP","是否需要 CPU","是否存在光信号"],"answer":0,"explain":"UTP 为非屏蔽双绞线，STP 有屏蔽层。"},{"chapter":4,"topic":"4:1","question":"T568A 与 T568B 不同的典型线序位置是？","options":["1、2、3、6","4、5、7、8","全部 8 芯都必须不同","只有第 8 芯"],"answer":0,"explain":"经典 10/100M 交叉线交换了橙、绿线对在 1/2/3/6 的位置。"},{"chapter":4,"topic":"4:2","question":"通常适合较长距离链路的光纤类型是？","options":["多模光纤","单模光纤","电话铜线","同轴电缆"],"answer":1,"explain":"SMF 单模光纤通常适合较长距离。"},{"chapter":4,"topic":"4:3","question":"对讲机常见“能双向，但不能同时双向”的通信方式是？","options":["单工","半双工","全双工","广播"],"answer":1,"explain":"半双工允许两个方向交替发送。"},{"chapter":4,"topic":"4:4","question":"把长消息拆成较小的包进行网络转发是？","options":["电路交换","报文交换","分组交换","电路复用"],"answer":2,"explain":"分组交换以较小分组存储转发。"},{"chapter":4,"topic":"4:5","question":"ATM 信元总长度是？","options":["48B","53B","64B","128B"],"answer":1,"explain":"ATM 信元固定 53 字节，含 5 字节头部与 48 字节载荷。"},{"chapter":5,"topic":"5:0","question":"IPv4 地址长度为？","options":["16 位","32 位","64 位","128 位"],"answer":1,"explain":"IPv4 地址长 32 位。"},{"chapter":5,"topic":"5:1","question":"198.51.100.12 在传统有类编址中属于？","options":["A 类","B 类","C 类","D 类"],"answer":2,"explain":"首字节 198 在 19 const {chapters,lessons,quizzes}=DATA;
const lessonMap=new Map(lessons.map(t=>[t.id,t]));

function load(key,def){try{const v=localStorage.getItem(key);return v?JSON.parse(v):def}catch(e){return def}}
function save(key,value){try{localStorage.setItem(key,JSON.stringify(value))}catch(e){}}
let mastery=load('sd_net_v1_mastery',{});
let savedLast=load('sd_net_v1_last','1:0');
let current=lessonMap.has(savedLast)?savedLast:'1:0';
let view='home';let openedChap=1;let mapOpen=1;let focusOnly=load('sd_net_v1_focus_only',false)===true;
let quizState={scope:'all',items:[],index:0,picks:{},completed:false};
const el=id=>document.getElementById(id);
const esc=s=>String(s??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;');
function topicLabel(s){return esc(String(s).replace(/^[🔴🟠🔵]\s*/u,''))}
function priority(t){if(t.priority)return t.priority;if(t.points.some(p=>p.priority==='must'))return 'must';if(t.points.some(p=>p.priority==='frequent'))return 'frequent';if(t.points.some(p=>p.priority==='understand'))return 'understand';return ''}
function navPriorityLabel(pr){return pr==='must'?'<span class="nav-level must" title="必须掌握">必掌握</span>':pr==='frequent'?'<span class="nav-level frequent" title="重点 / 常考">常考</span>':''}
function levelTag(pr){return pr==='must'?'<span class="pill must">必须掌握</span>':pr==='frequent'?'<span class="pill frequent">重点 / 常考</span>':pr==='understand'?'<span class="pill understand">了解即可</span>':''}
function chapterDone(ci){let ids=chapters[ci].topicIds.filter(id=>ci!==0);return ids.filter(id=>mastery[id]===2).length}
function masteredCount(){return lessons.filter(t=>t.chapter!==0 && mastery[t.id]===2).length}
function setStatus(id,s){mastery[id]=s;save('sd_net_v1_mastery',mastery);render();}
function markNext(id){let s=mastery[id]||0;setStatus(id,(s+1)%3)}
function openLesson(id){if(!lessonMap.has(id))return;current=id;openedChap=lessonMap.get(id).chapter;save('sd_net_v1_last',id);setView('read')}
function setView(v){view=v;render();el('contentShell').scrollTop=0;hideMobile()}
function hideMobile(){el('sidebar').classList.remove('open');el('scrim').classList.remove('open')}
function chapNav(ci){openedChap=ci;openLesson(chapters[ci].topicIds[0])}
function renderSidebar(){
 const mustN=lessons.filter(t=>t.chapter>0&&priority(t)==='must').length;
 const freqN=lessons.filter(t=>t.chapter>0&&priority(t)==='frequent').length;
 el('sideCount').textContent=`${chapters.length} 个分支`;
 el('mustCount').textContent=mustN;el('frequentCount').textContent=freqN;
 el('focusToggle').setAttribute('aria-pressed',String(focusOnly));
 el('focusToggle').title=focusOnly?'显示全部知识主题':'只显示必须掌握和重点 / 常考的主题';
 el('navList').innerHTML=chapters.map(c=>{
  const hotIds=c.topicIds.filter(id=>{const p=priority(lessonMap.get(id));return p==='must'||p==='frequent'});
  const visibleIds=focusOnly&&c.id!==0?hotIds:c.topicIds;
  const sub=visibleIds.map(id=>{
   const t=lessonMap.get(id),pr=priority(t),done=mastery[id]===2;
   return `<button data-lesson="${id}" class="${current===id&&view==='read'?'selected':''} ${done?'complete':''} ${pr==='must'||pr==='frequent'?'nav-pr-'+pr:''}" title="${esc(t.title)}${pr==='must'?' · 必须掌握':pr==='frequent'?' · 重点 / 常考':''}"><span class="nav-topic-title">${esc(t.title)}</span>${navPriorityLabel(pr)}${done?'<span class="nav-done" title="已掌握">✓</span>':''}</button>`;
  }).join('');
  return `<div class="nav-group"><button class="chap-button ${(view==='read'&&openedChap===c.id)?'active':''}" data-chapter="${c.id}" aria-expanded="${openedChap===c.id}"><span class="chap-num">${c.number}</span><span>${esc(c.name)}</span>${hotIds.length?`<span class="chap-focus-count" title="本章 ${hotIds.length} 个重点主题">★${hotIds.length}</span>`:''}<span class="chap-chevron">${openedChap===c.id?'⌄':'›'}</span></button>${openedChap===c.id?`<div class="subnav">${sub||'<div class="nav-empty">本章暂无重点主题</div>'}</div>`:''}</div>`;
 }).join('');
 const n=masteredCount();el('sideProgress').textContent=`${n} / ${totalStudy}`;el('sideProgressBar').style.width=(n/totalStudy*100).toFixed(1)+'%';
}

 return `<div class="kicker">QUICK RECALL</div><h1 class="big-title">考前速记 · 先回忆，再核对</h1><p class="lede">汇总讲课老师强调的分层、协议、子网计算、规划和存储要点。先独立回忆，再点击精讲核对。</p><div class="section-label"><h2>十条常见解题与识记规则</h2><p>根据课件及课程转写整理</p></div><div class="qgrid">${formulas.map(f=>`<article class="card" style="margin:0"><h3 style="margin:0 0 8px">${f[0]}</h3><div class="formula">${f[1]}</div><button class="small-button tinted" style="margin-top:13px" data-lesson="${f[2]}">查看解析 ↗</button></article>`).join('')}</div>${chapters.slice(1).map(c=>`<div class="section-label"><h2>${c.number} · ${esc(c.name)}</h2><p>${c.topicIds.length} 条速记</p></div><div class="qgrid">${c.topicIds.map(id=>{let t=lessonMap.get(id);return `<article class="quick-card"><div class="qtag">${esc(c.name)} ${levelTag(priority(t))}</div><h3>${esc(t.title)}</h3><p>${esc(t.memory||t.points.slice(0,2).map(p=>p.text).join('；'))}</p><button data-lesson="${id}">完整精讲 ↗</button></article>`}).join('')}</div>`).join('')}`;
}
function getQuizItems(scope){return quizzes.map((q,i)=>({...q,key:i})).filter(q=>scope==='all'||q.chapter===Number(scope)||scope==='wrong'&&load('sd_net_v1_wrong',[]).includes(q.key));}
function startQuiz(scope){quizState={scope,items:getQuizItems(scope),index:0,picks:{},completed:false};setView('quiz')}
function chooseQuiz(idx){const item=quizState.items[quizState.index];if(quizState.picks[item.key]!==undefined)return;quizState.picks[item.key]=idx;render()}
function nextQuiz(){quizState.index++;if(quizState.index>=quizState.items.length){quizState.completed=true;const errors=quizState.items.filter(q=>quizState.picks[q.key]!==q.answer).map(q=>q.key);let old=new Set(load('sd_net_v1_wrong',[]));for(let q of quizState.items)old.delete(q.key);for(let k of errors)old.add(k);save('sd_net_v1_wrong',[...old]);}render();el('contentShell').scrollTop=0}
function renderQuiz(){el('topTitle').textContent='计算机网络 · 随堂练习';if(!quizState.items.length&&!quizState.completed){quizState.items=getQuizItems(quizState.scope)}let qs=quizState.items,idx=quizState.index;
 let filters=`<div class="quiz-filter"><button data-quizscope="all" class="${quizState.scope==='all'?'chosen':''}">全章 · ${quizzes.length} 题</button>${chapters.slice(1).map(c=>`<button data-quizscope="${c.id}" class="${quizState.scope===String(c.id)?'chosen':''}">${c.number} ${esc(c.name)} · ${getQuizItems(String(c.id)).length} 题</button>`).join('')}<button data-quizscope="wrong" class="${quizState.scope==='wrong'?'chosen':''}">错题重练 · ${getQuizItems('wrong').length} 题</button></div>`;
 if(!qs.length)return `<div class="kicker">PRACTICE</div><h1 class="big-title">随堂练习</h1><p class="lede">本组暂无试题或尚未产生错题。选择其他章节继续练习。</p>${filters}`;
 if(quizState.completed){let score=qs.filter(q=>quizState.picks[q.key]===q.answer).length;return `<div class="kicker">PRACTICE RESULT</div><h1 class="big-title">练习完成</h1><div class="score-card"><div class="huge">${Math.round(score/qs.length*100)}<small style="font-size:20px">分</small></div><h2>${score} / ${qs.length} 题正确</h2><p>${qs.length-score===0?'这组知识点都答对了，可以去精讲中继续学习其他内容。':`有 ${qs.length-score} 道题答错，错题会保存在当前浏览器中，可以单独重练。`}</p><button class="small-button primary" data-quizscope="${quizState.scope}">再做一遍</button><button class="small-button" data-quizscope="wrong">重练错题</button><button class="small-button" data-view="quick">查看考前速记</button></div>${filters}`;}
 let q=qs[idx],pick=quizState.picks[q.key],answered=pick!==undefined,chapter=chapters[q.chapter];return `<div class="kicker">PRACTICE / SELF TEST</div><h1 class="big-title">随堂练习</h1><p class="lede" style="margin-bottom:11px">按课程内容编写的自测题（非历年真题原文），答题后立即展示正确答案和解析。</p>${filters}<div class="quiz-wrap"><div class="quiz-top"><span class="tiny">${esc(chapter.name)} · 第 ${idx+1} / ${qs.length} 题</span><div class="quiz-progress"><i style="width:${idx/qs.length*100}%"></i></div><b style="font-size:12px;color:#6e8192">${Math.round(idx/qs.length*100)}%</b></div><div class="quiz-card"><span class="pill">单选题</span><h2>${esc(q.question)}</h2><div class="options">${q.options.map((o,j)=>`<button class="option ${answered&&j===q.answer?'correct':''} ${answered&&pick===j&&j!==q.answer?'incorrect':''} ${answered&&pick===j?'selected':''}" data-option="${j}" ${answered?'disabled':''}><i>${'ABCD'[j]}.</i><span>${esc(o)}</span></button>`).join('')}</div>${answered?`<div class="explain"><strong>${pick===q.answer?'✓ 回答正确':'✕ 回答错误'} · 正确答案 ${'ABCD'[q.answer]}</strong><div style="margin-top:5px">${esc(q.explain)}</div><div style="margin-top:10px"><button class="small-button tinted" data-lesson="${q.topic}">返回对应知识点 ↗</button></div></div>`:''}<div class="quiz-bottom"><span class="tiny">请先选择一个答案</span><button class="small-button primary" data-nextquestion ${!answered?'disabled':''}>${idx===qs.length-1?'查看成绩':'下一题 →'}</button></div></div></div>`;}
function renderRail(){if(view!=='read')return '';let t=lessonMap.get(current),c=chapters[t.chapter];return `<div class="rail-card"><h3>本章目录 · ${c.number}</h3>${c.topicIds.map((id,i)=>`<button class="rail-topic ${id===current?'current':''}" data-lesson="${id}">${String(i+1).padStart(2,'0')} · ${esc(lessonMap.get(id).title)} ${mastery[id]===2?'✓':''}</button>`).join('')}<div class="rail-memory"><strong>本节一句话</strong><p>${esc(t.memory||t.points[0]?.text||'')}</p><div class="tiny">${esc(t.source)}</div></div></div>`}
function render(){renderSidebar();document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('on',b.dataset.tab===view));const main=el('mainContent');main.className='content '+(view==='read'?'reading':'');main.innerHTML=({home:renderHome,read:renderRead,map:renderMap,quick:renderQuick,quiz:renderQuiz}[view]||renderHome)();const shell=el('contentShell');shell.classList.toggle('withrail',view==='read');el('rightRail').innerHTML=renderRail()}
function openSearch(){el('searchOverlay').classList.remove('hidden');el('searchInput').focus();searchResults('')}
function closeSearch(){el('searchOverlay').classList.add('hidden')}
function searchResults(term){
 term=term.trim().toLowerCase();
 let hits=term?lessons.filter(t=>(t.title+' '+t.intro+' '+t.points.map(p=>p.text+' '+p.note).join(' ')).toLowerCase().includes(term)):lessons.filter(t=>t.chapter>0&&priority(t)==='must').slice(0,8);
 if(term)hits.sort((a,b)=>{const score=t=>{let name=t.title.toLowerCase();return name===term?0:name.startsWith(term)?1:name.includes(term)?2:3};return score(a)-score(b) || a.chapter-b.chapter || a.index-b.index});
 let n=hits.length;hits=hits.slice(0,25);
 el('searchResults').innerHTML=`<div class="tiny">${term?`匹配 ${n} 个知识主题`:'建议重点内容'}</div>`+hits.map(t=>`<button class="sr" data-searchlesson="${t.id}"><strong>${esc(t.title)}</strong><small>${esc(chapters[t.chapter].name)} · ${esc(t.intro.slice(0,66))}…</small></button>`).join('')+(hits.length?'':'<div class="tiny">没有匹配结果，试试其他关键词。</div>');
}
document.body.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;
 if(b.id==='focusToggle'){focusOnly=!focusOnly;save('sd_net_v1_focus_only',focusOnly);renderSidebar();return}
 if(b.dataset.view){setView(b.dataset.view);return}
 if(b.dataset.tab){setView(b.dataset.tab);return}
 if(b.dataset.chapter!==undefined){let ci=+b.dataset.chapter;if(openedChap===ci){openedChap=-1;renderSidebar()}else{openedChap=ci;renderSidebar()}return}
 if(b.dataset.lesson){openLesson(b.dataset.lesson);return}
 if(b.dataset.master){markNext(b.dataset.master);return}
 if(b.dataset.mapchap!==undefined){let ci=+b.dataset.mapchap;mapOpen=mapOpen===ci?-1:ci;render();return}
 if(b.dataset.quizscope){startQuiz(b.dataset.quizscope);return}
 if(b.dataset.quiztopic){const t=lessonMap.get(b.dataset.quiztopic);quizState={scope:String(t.chapter),items:getQuizItems(String(t.chapter)),index:0,picks:{},completed:false};setView('quiz');return}
 if(b.dataset.option!==undefined){chooseQuiz(+b.dataset.option);return}
 if(b.hasAttribute('data-nextquestion')){nextQuiz();return}
 if(b.dataset.searchlesson){closeSearch();openLesson(b.dataset.searchlesson);return}
});
el('menuBtn').onclick=()=>{el('sidebar').classList.add('open');el('scrim').classList.add('open')};el('scrim').onclick=hideMobile;
function refreshThemeButton(){const dark=document.documentElement.dataset.theme==='dark',b=el('themeBtn');b.setAttribute('aria-pressed',String(dark));b.setAttribute('aria-label',dark?'切换为日间模式':'切换为夜间模式');b.title=dark?'切换为日间模式':'切换为夜间模式'}
el('themeBtn').onclick=()=>{const next=document.documentElement.dataset.theme==='dark'?'light':'dark';document.documentElement.dataset.theme=next;save('sd_net_v1_theme',next);refreshThemeButton()};refreshThemeButton();
el('searchBtn').onclick=openSearch;el('searchClose').onclick=closeSearch;el('searchInput').oninput=e=>searchResults(e.target.value);
el('searchOverlay').addEventListener('click',e=>{if(e.target===el('searchOverlay'))closeSearch()});
window.addEventListener('keydown',e=>{if(e.key==='Escape'){closeSearch();hideMobile()}if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){e.preventDefault();openSearch()}});
render();

function dotIp(u){return [u>>>24,(u>>>16)&255,(u>>>8)&255,u&255].join('.')}
function calcSubnetAddress(str,prefix){let parts=str.trim().split('.');if(parts.length!==4||parts.some(q=>!/^\d{1,3}$/.test(q)||Number(q)>255))return {error:'请输入合法 IPv4 地址，例如 192.168.1.130。'};let p=Number(prefix);if(!Number.isInteger(p)||p<1||p>32)return {error:'请输入 1～32 的整数前缀（/0 表示默认路由，不作为本页常规主机子网计算）。'};let ip=parts.reduce((acc,q)=>((acc<<8)>>>0)+Number(q),0)>>>0,mask=p===0?0:(0xffffffff<<(32-p))>>>0,net=(ip&mask)>>>0,bc=(net|(~mask>>>0))>>>0;let count=2**(32-p),trad=p<=30?Math.max(0,count-2):p===31?2:1;let range=p<=30?dotIp((net+1)>>>0)+' ～ '+dotIp((bc-1)>>>0):p===31?'特殊点到点链路：两地址可用':'单一主机地址';return {prefix:p,mask:dotIp(mask),network:dotIp(net),broadcast:dotIp(bc),count,hosts:trad,range,extra:p>=31?'注意：/31、/32 与常规减 2 主机数规则不同。':'经典可分配主机数按去除网络及广播地址计算。'} }
document.addEventListener('click',e=>{if(!e.target.closest('[data-netcalc]'))return;const o=calcSubnetAddress(el('netAddress').value,el('netPrefix').value);const dest=el('netCalcResult');if(!dest)return;dest.classList.toggle('error',!!o.error);dest.textContent=o.error||`掩码：${o.mask}　网络地址：${o.network}　广播地址：${o.broadcast}　总地址数：${o.count.toLocaleString()}　可用地址数：${o.hosts.toLocaleString()}　范围：${o.range}。${o.extra}`;});
</script></body></html>
