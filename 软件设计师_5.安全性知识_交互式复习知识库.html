.db-flow{display:flex;align-items:center;justify-content:center;gap:9px;flex-wrap:wrap;margin:8px 0}

.db-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(155px,1fr));gap:10px}.db-grid .db-node{min-width:0;max-width:none}
.db-layer{text-align:center}.db-layer>.db-grid{margin-top:12px}

.db-rectangle{width:95px;height:60px;border-radius:5px}.db-oval{width:100px;height:60px;border-radius:50%}.db-rhombus{width:65px;height:65px;transform:rotate(45deg);border-radius:4px}.db-rhombus b{transform:rotate(-45deg);display:block;font-size:13px}

<script>
const DATA = {"chapters":[{"id":0,"number":"00","name":"本章学习定位","subtitle":"课件 PDF 第2页；转写 6.1 开篇","topicIds":["0:0","0:1","0:2"]},{"id":1,"number":"01","name":"信息安全基础与安全需求","subtitle":"课件 PDF 第2—4页；转写 6.1","topicIds":["1:0","1:1","1:2","1:3","1:4","1:5","1:6","1:7"]},{"id":2,"number":"02","name":"加密技术与密钥体制","subtitle":"课件 PDF 第5—6页；转写 6.1","topicIds":["2:0","2:1","2:2","2:3","2:4","2:5","2:6"]},{"id":3,"number":"03","name":"摘要、数字签名与 PKI","subtitle":"课件 PDF 第7—9页；转写 6.1","topicIds":["3:0","3:1","3:2","3:3","3:4","3:5","3:6"]},{"id":4,"number":"04","name":"防火墙与入侵检测防御","subtitle":"课件 PDF 第9—10页；转写 6.2","topicIds":["4:0","4:1","4:2","4:3","4:4"]},{"id":5,"number":"05","name":"攻击威胁与恶意程序","subtitle":"课件 PDF 第11—12页；转写 6.2","topicIds":["5:0","5:1","5:2","5:3","5:4","5:5","5:6"]},{"id":6,"number":"06","name":"网络安全协议与应用","subtitle":"课件 PDF 第12—14页；转写 6.2","topicIds":["6:0","6:1","6:2","6:3","6:4","6:5","6:6","6:7","6:8"]}],"lessons":[{"id":"0:0","chapter":0,"index":0,"title":"本章定位：信息安全与网络安全","fullTitle":"本章定位：信息安全与网络安全","intro":"老师把安全性知识分成信息安全、网络安全两块，认为这部分主要是概念理解与判断，旧课程经验约每年 2 分。","points":[{"text":"主要内容：信息安全及信息系统安全；安全技术；防火墙、入侵检测和网络攻击；安全协议。","note":"对应课件第2页总览。","priority":""},{"text":"老师的分值经验约 2 分，且与计算机网络内容有交叉。","note":"不是最新考务固定配分，也不是必然出现的题数。","priority":"understand"},{"text":"最值得掌握：信息安全 CIA 三要素、安全空间五属性、加密流程、防火墙、重放与拒绝服务。","note":"老师明确在对应课程中强调。","priority":"frequent"},{"text":"对 SSL、SET、PGP 等扩展协议：以概念和使用场景为主，不深入内部细节。","note":"老师在 6.2 多次说明“了解基本定义即可”。","priority":"understand"},{"text":"本章自测题根据课件和课堂讲解编写，不冒充历年真题。","note":"跨时代变化的协议应以题干和课程语境辨析。","priority":""}],"source":"课件 PDF 第2页；转写 6.1 开篇","priority":"","visual":"study","memory":"考试重点先抓 CIA、五属性、公私钥、签名、防火墙、重放和 DoS。"},{"id":"0:1","chapter":0,"index":1,"title":"学习路线：先辨析，再串联","fullTitle":"学习路线：先辨析，再串联","intro":"这章不需要把安全技术完全当成密码学课程来学。先明确每种技术在解决什么安全问题，再看它如何组合。","points":[{"text":"第一遍：掌握 CIA 与五属性 → 安全需求分层 → 安全技术分类。","note":"","priority":""},{"text":"第二遍：区分对称加密与非对称加密 → 信息摘要 → 数字签名 → 数字证书。","note":"","priority":""},{"text":"第三遍：防火墙、IDS、IPS → 主动与被动攻击 → 重放、DoS、病毒与木马。","note":"","priority":""},{"text":"第四遍：把 HTTPS、SSH、SET、Kerberos、PGP、S/MIME 按场景归类。","note":"","priority":""},{"text":"第五遍：先在速记页复述关键词，再做题检验易混淆项。","note":"","priority":""}],"source":"课件 PDF 第2页；转写 6.1 开篇","priority":"","visual":"study","memory":"判断题先看“保护什么”：保密、完整、认证、不可抵赖，还是服务可用。"},{"id":"0:2","chapter":0,"index":2,"title":"资料来源与阅读提醒","fullTitle":"资料来源与阅读提醒","intro":"本知识库以《6.安全性知识》PDF 和 6.1、6.2 两份课程转写为主要依据。课堂中的“经常考/了解即可”按老师原话的意思标记。","points":[{"text":"课件内容以本次上传的 PDF 第 2～14 页为范围，广告与销售提醒不纳入学习正文。","note":"","priority":""},{"text":"语音转写中的错别字进行了必要统一，如“铭文”统一为“明文”、“中间截获”统一成正常表述。","note":"","priority":""},{"text":"部分课堂解释使用了简化比喻，精讲保留备考逻辑，另以“资料核对提醒”提示其适用边界。","note":"","priority":""},{"text":"MD5、SHA-1、DES、SSL、SET 等协议/算法的介绍属于课程知识点，不应据此视为今天的安全部署建议。","note":"","priority":""},{"text":"老师对知识难度及考试频率的评价属于当时的授课经验，不能替代实际考试大纲。","note":"","priority":""}],"source":"课件 PDF 第2页；转写 6.1 开篇","priority":"","visual":"sourcenote","memory":"课程考点与现行安全实务要区分；先理解考题语境，再看适用边界。"},{"id":"1:0","chapter":1,"index":0,"title":"信息安全与信息系统安全","fullTitle":"信息安全与信息系统安全","intro":"信息安全强调信息和数据的保护；信息系统安全还涉及支撑信息运行的设备、环境、操作系统、应用与网络等整体系统。","points":[{"text":"信息安全：围绕信息本身的保密、完整、可用等要求。","note":"课程将“数据”作为信息安全最直观的对象。","priority":""},{"text":"信息系统安全：除了数据，还要考虑设备被盗、链路被破坏、运行时被攻击等。","note":"老师用设备、线路、黑客攻击举例。","priority":""},{"text":"本章讲解整体分为信息安全与网络安全两大方向。","note":"网络安全是与信息安全交叉的关注领域。","priority":""},{"text":"概念区分主要是理解性的，老师指出一般不直接考定义。","note":"不要在这一点投入过多背诵时间。","priority":"understand"},{"text":"判断实际题目时，优先看它保护的对象和引发问题的途径。","note":"这有助于把“物理/网络/系统/应用安全”分开。","priority":""}],"source":"课件 PDF 第2—4页；转写 6.1","priority":"","visual":"security-scope","memory":"信息安全重数据；信息系统安全还覆盖承载数据和软件运行的整个系统。"},{"id":"1:1","chapter":1,"index":1,"title":"安全空间三维模型：X、Y、Z","fullTitle":"安全空间三维模型：X、Y、Z","intro":"课件第 2 页的立体图把安全体系组织为三个维度。老师要求能够识别 X、Y、Z 各指什么，无需背下每个格子的全部细目。","points":[{"text":"X 轴：安全机制（安全防范、授权、审计、平台与数据保护等）。","note":"按系统采取的安全技术机制进行描述。","priority":"frequent"},{"text":"Y 轴：网络层次，对应 OSI 七层模型。","note":"物理、数据链路、网络、传输、会话、表示、应用。","priority":"frequent"},{"text":"Z 轴：安全服务，面向各网络层次提供认证、访问控制、保密、完整性等支持。","note":"注意它是“服务”，不是安全机制列表。","priority":"frequent"},{"text":"安全机制是用技术和控制手段实现安全服务的途径。","note":"X 与 Z 的概念不要倒置。","priority":""},{"text":"课堂定位：记住三个维度的含义即可。","note":"PDF 第2页示意图为对应依据。","priority":"understand"}],"source":"课件 PDF 第2—4页；转写 6.1","priority":"","visual":"axes","memory":"X 机制、Y OSI 层次、Z 服务。"},{"id":"1:2","chapter":1,"index":2,"title":"安全空间五大属性","fullTitle":"安全空间五大属性","intro":"老师在 6.1 中特别要求记住安全空间的五个属性：认证、权限、完整、加密、不可否认。","points":[{"text":"认证：确认实体“是谁”。","note":"如账号身份验证。","priority":"must"},{"text":"权限：确认通过认证后“能做什么”。","note":"访问控制与最小授权。","priority":"must"},{"text":"完整：防止信息未经授权被篡改。","note":"增删改造成非预期改变都影响完整性。","priority":"must"},{"text":"加密：对信息加密以支持保密。","note":"该处以课堂“五属性”表述为准。","priority":"must"},{"text":"不可否认：防止发送者或参与者否认已执行的行为。","note":"又称不可抵赖；数字签名是典型应用。","priority":"must"}],"source":"课件 PDF 第2—4页；转写 6.1","priority":"must","visual":"five","memory":"安全空间五属性：认证、权限、完整、加密、不可否认。"},{"id":"1:3","chapter":1,"index":3,"title":"信息安全 CIA 三要素","fullTitle":"信息安全 CIA 三要素","intro":"这是本课最明确的核心记忆点：保密性、完整性、可用性，常写作 CIA。与前一节“安全空间五属性”不是同一组概念。","points":[{"text":"C — Confidentiality：保密性/机密性。","note":"信息不被未授权实体获取、泄露或使用。","priority":"must"},{"text":"I — Integrity：完整性。","note":"信息不被未经授权修改或破坏。","priority":"must"},{"text":"A — Availability：可用性。","note":"授权用户需要时，信息或系统可被访问和使用。","priority":"must"},{"text":"CIA 三要素以外，还有真实性、可核查性、不可抵赖性、可靠性。","note":"课堂认为这些是补充属性。","priority":"understand"},{"text":"易混辨析：安全空间“五属性”与信息安全“三要素”不同。","note":"题干若指三元组，填 CIA；若指安全空间，则填五属性。","priority":"frequent"}],"source":"课件 PDF 第2—4页；转写 6.1","priority":"must","visual":"cia","memory":"CIA：保密“不泄露”，完整“不乱改”，可用“用得上”。"},{"id":"1:4","chapter":1,"index":4,"title":"保密性与最小授权原则","fullTitle":"保密性与最小授权原则","intro":"保密性不只是加密，也包含访问权限与物理层面的防泄露。老师用课程系统和数据库权限说明“最小授权”。","points":[{"text":"保密性：未授权者不能获得或利用受保护信息。","note":"强调信息不泄露。","priority":"must"},{"text":"最小授权：只授予完成工作所必需的权限。","note":"如只允许查看数据，不默认开放删除权。","priority":"frequent"},{"text":"防暴露：尽量降低信息被他人看到、复制或截获的机会。","note":"这是保密策略的一部分。","priority":""},{"text":"信息加密：将明文转换为密文，减少截获后的信息暴露。","note":"本章后续讨论具体密钥体制。","priority":""},{"text":"物理保密：保护设备及环境，考虑电磁泄露等物理途径。","note":"老师举机房设备被盗、电磁泄露等例子。","priority":"understand"}],"source":"课件 PDF 第2—4页；转写 6.1","priority":"","visual":"confidential","memory":"最小授权：需要多少权限就给多少，不把“能登录”视为“能操作全部”。"},{"id":"1:5","chapter":1,"index":5,"title":"完整性：影响因素与常见保障","fullTitle":"完整性：影响因素与常见保障","intro":"完整性的关键词是“未经授权不能修改”，既要防人为篡改，也要防传输错误或故障造成的数据变化。","points":[{"text":"完整性强调信息保持正确、完整且没有未经授权的修改。","note":"题目中出现“被改动/被插入/被删除”先联想完整性。","priority":"must"},{"text":"影响因素：设备故障、传输误码、人为攻击、病毒感染。","note":"课堂列举的四种典型因素。","priority":"frequent"},{"text":"保障方式：可靠通信、纠错编码、校验和、密码学摘要或数字签名。","note":"不同机制的保障范围并不完全相同。","priority":""},{"text":"哈希摘要可辅助检测数据是否发生变化。","note":"但仅靠未认证的摘要不能阻止攻击者同时替换数据与摘要。","priority":""},{"text":"数字签名进一步为消息完整性与签名者身份提供验证依据。","note":"数字签名的完整性作用将在后续讲解。","priority":""}],"source":"课件 PDF 第2—4页；转写 6.1","priority":"frequent","visual":"integrity","memory":"完整性关注“内容有没有被非法改”；摘要用于核对内容变化。"},{"id":"1:6","chapter":1,"index":6,"title":"可用性、可靠性与其他属性","fullTitle":"可用性、可靠性与其他属性","intro":"可用性和可靠性不要混同；真实性、可核查性、不可抵赖性在课件中也是补充安全属性。","points":[{"text":"可用性：授权用户需要时，系统或信息能正常访问。","note":"故障停机、拒绝服务会影响可用性。","priority":"must"},{"text":"可靠性：在规定时间和条件下，无故障完成指定功能的能力。","note":"强调能否稳定、正确完成工作。","priority":"frequent"},{"text":"真实性：确认信息来源是否与声称的实体一致。","note":"不是判断“对方说的每句话是否属实”。","priority":"understand"},{"text":"可核查性：活动可追溯到有关实体。","note":"通常依赖日志、审计等机制。","priority":"understand"},{"text":"不可抵赖性：建立有效责任机制，减少对行为的否认。","note":"与数字签名联系最紧密。","priority":"frequent"},{"text":"教学区分：可用性关心“能不能用”，可靠性关心“能否无故障完成规定功能”。","note":"不同指标有关联，但概念不完全相同。","priority":"frequent"}],"source":"课件 PDF 第2—4页；转写 6.1","priority":"","visual":"availability","memory":"可用：想用时能用；可靠：规定条件下能无故障完成。"},{"id":"1:7","chapter":1,"index":7,"title":"安全需求四层分类","fullTitle":"安全需求四层分类","intro":"课件把安全需求分为物理线路、网络、系统、应用四类；老师用“保护对象”法帮助判断归属。","points":[{"text":"物理线路安全：设备、线缆、机房环境、供电、温湿度、防火防雷。","note":"安全的物理基础。","priority":"frequent"},{"text":"网络安全：针对网络通信、攻击与入侵的防护。","note":"如防火墙、入侵检测与通信保护。","priority":"frequent"},{"text":"系统安全：操作系统、系统软件的配置、漏洞修复等。","note":"如操作系统补丁。","priority":"frequent"},{"text":"应用安全：应用软件及数据库应用的漏洞、授权、输入校验等。","note":"课程中特别把数据库应用归在应用层理解。","priority":"frequent"},{"text":"做题法：看“防护目标”而不是措施是否都用了网络。","note":"雷击→物理，系统补丁→系统，应用漏洞→应用。","priority":"frequent"}],"source":"课件 PDF 第2—4页；转写 6.1","priority":"frequent","visual":"layers","memory":"物理看设备环境；网络看通信入侵；系统看操作系统；应用看业务程序。"},{"id":"2:0","chapter":2,"index":0,"title":"密码体制模型：明文、密文、密钥","fullTitle":"密码体制模型：明文、密文、密钥","intro":"课件第 5 页展示了发送端加密、信道传输、接收端解密的基础模型。课程强调理解参与要素，不必深入推导公式。","points":[{"text":"明文 M：发送前可直接理解的原始数据。","note":"也是加密的输入。","priority":""},{"text":"密文 C：明文经加密运算后的结果。","note":"通过通信信道传送。","priority":""},{"text":"密钥 K：控制加解密过程的重要秘密参数。","note":"加密密钥 Ke 与解密密钥 Kd 不一定相同。","priority":""},{"text":"加密：C = E(M,Ke)；解密：M = D(C,Kd)。","note":"课件以 E、D 表示算法。","priority":""},{"text":"攻击者截获密文不应轻易得到明文。","note":"依赖合适算法、密钥保密和协议配置。","priority":""},{"text":"老师认为公式了解即可，不作为本章深入计算重点。","note":"理解箭头和各名称更重要。","priority":"understand"}],"source":"课件 PDF 第5—6页；转写 6.1","priority":"","visual":"cipher-model","memory":"明文 M → 加密 E + 密钥 → 密文 C → 解密 D + 密钥 → 明文 M。"},{"id":"2:1","chapter":2,"index":1,"title":"对称加密：使用同一密钥","fullTitle":"对称加密：使用同一密钥","intro":"对称密钥体制的主要识别特征是双方共享同一秘密密钥。老师要求记住它适合加密大量数据，以及密钥分发困难。","points":[{"text":"数据加密与解密使用同一把共享密钥。","note":"又称共享密钥加密。","priority":"frequent"},{"text":"优点：加解密速度快，适合大量数据。","note":"这是课堂真题中反复出现的判断点。","priority":"must"},{"text":"难点：通信双方需要安全地获得共享密钥。","note":"称为密钥分发或密钥协商问题。","priority":"frequent"},{"text":"密钥不能直接公开给任意人。","note":"与公开的公钥区别。","priority":""},{"text":"课堂用“安全性比非对称低”作简化比较。","note":"实际安全性不能单纯按对称/非对称分类比较，取决于算法、密钥长度和使用方式。","priority":""}],"source":"课件 PDF 第5—6页；转写 6.1","priority":"frequent","visual":"symmetric","memory":"对称：同钥加解密；速度快、适合大数据；密钥共享是难点。","notice":"课堂以旧算法的位数解释“对称加密安全性较低”。这不是通用结论：现代 AES 等对称密码同样可提供很强的安全性，密钥位数不能直接与 RSA 位数比较。"},{"id":"2:2","chapter":2,"index":2,"title":"常见对称算法：DES、3DES、AES、RC5、IDEA","fullTitle":"常见对称算法：DES、3DES、AES、RC5、IDEA","intro":"课件第 5 页列举了五种常见对称加密算法，主要用于识别选择题选项，并非要求实现这些算法。","points":[{"text":"DES：经典分组密码，历史有效密钥长度为 56 位。","note":"现在不宜作为新系统加密方案。","priority":"frequent"},{"text":"3DES：把 DES 以多次处理方式组合，属于对称密码。","note":"课件示意为 EDE 的三次处理。","priority":"frequent"},{"text":"AES：现代常见分组密码算法，也是对称密码。","note":"考试最容易与 RSA 混淆。","priority":"frequent"},{"text":"RC5：对称分组密码算法。","note":"课程只要求记住分类。","priority":"understand"},{"text":"IDEA：对称密码算法，课件举出 128 位密钥。","note":"课程借 PGP 案例提到 IDEA。","priority":"understand"},{"text":"避免把“3DES 三重运算”误解为“必须是三把完全不同的密钥”。","note":"不同 3DES 方案可能有不同密钥配置。","priority":""}],"source":"课件 PDF 第5—6页；转写 6.1","priority":"","visual":"algos","memory":"对称：DES、3DES、AES、RC5、IDEA；非对称：RSA、ECC 等。"},{"id":"2:3","chapter":2,"index":3,"title":"非对称加密：公钥与私钥配对","fullTitle":"非对称加密：公钥与私钥配对","intro":"非对称密码体制为通信主体提供一对密钥：可公开的公钥和必须保护的私钥。老师明确强调其保密通信流程经常考。","points":[{"text":"每个通信主体各自拥有公钥与私钥。","note":"例如 A 有 A 公钥/A 私钥，B 有 B 公钥/B 私钥。","priority":"must"},{"text":"公钥可以公开，私钥必须安全保存。","note":"私钥泄露将损害相关安全属性。","priority":"must"},{"text":"用于保密时：发送者使用接收者公钥加密，接收者使用自己的私钥解密。","note":"不要误写成“发送方用自己的公钥加密”。","priority":"must"},{"text":"典型算法：RSA、ECC 等；课件还提 ElGamal。","note":"课程以辨析分类为主要目的。","priority":"frequent"},{"text":"非对称运算通常开销较大，不直接用来加密全部大文件。","note":"常与对称密钥搭配使用。","priority":"frequent"}],"source":"课件 PDF 第5—6页；转写 6.1","priority":"must","visual":"asymmetric","memory":"保密通信：用接收者公钥加密 → 接收者私钥解密。"},{"id":"2:4","chapter":2,"index":4,"title":"公钥加密流程：A 向 B 保密发送","fullTitle":"公钥加密流程：A 向 B 保密发送","intro":"这类流程题核心是回答：“谁持有唯一能解密的私钥？”若希望只有 B 能解密，就应围绕 B 的密钥对设计。","points":[{"text":"① A 和 B 各自生成或持有公钥/私钥对。","note":"公钥公开、私钥自持。","priority":"must"},{"text":"② A 获取并验证 B 的公钥。","note":"实际应用中需保证公钥真实属于 B。","priority":"must"},{"text":"③ A 使用 B 公钥加密要发送的内容（或会话密钥）。","note":"课堂考试流程的关键步骤。","priority":"must"},{"text":"④ B 收到后使用 B 私钥解密。","note":"只有 B 的私钥可完成对应解密。","priority":"must"},{"text":"⑤ 不使用 A 私钥来实现“只有 B 能阅读”的保密目标。","note":"A 私钥用于 A 自身的签名操作。","priority":"frequent"}],"source":"课件 PDF 第5—6页；转写 6.1","priority":"must","visual":"asym-flow","memory":"想让 B 看懂：A 用 B 公钥加密，B 用 B 私钥解密。","examples":[{"title":"谁的公钥与私钥？","given":"甲给乙发一份应保密的信息，问甲用谁的密钥加密、乙用谁的密钥解密。","steps":["甲的目标是只有乙能解密。","乙的私钥不能公开，只有乙自己掌握。","所以甲使用乙的公钥进行加密。","乙用自己的私钥进行解密。"],"answer":"乙的公钥加密；乙的私钥解密。","warning":"题目若改为“验证甲的签名”，则密钥使用方向会变。"}]},{"id":"2:5","chapter":2,"index":5,"title":"对称与非对称：区别与使用选择","fullTitle":"对称与非对称：区别与使用选择","intro":"这两类密码不应仅背“快/慢”，还要把使用目的与密钥关系绑定起来。","points":[{"text":"密钥数量：对称双方共享同一秘密；非对称每个主体保管密钥对。","note":"最根本的结构区别。","priority":"frequent"},{"text":"数据量大：通常用对称算法处理数据本体。","note":"效率高。","priority":"must"},{"text":"密钥分发与身份相关任务：适当使用公钥密码和证书。","note":"典型为混合加密和 PKI。","priority":"frequent"},{"text":"实现机密性不意味着自动实现身份认证、完整性或不可抵赖性。","note":"要按需求补充完整性认证或签名。","priority":""},{"text":"实际系统通常采用结合方式，避免把两者理解为二选一。","note":"例如后续“数字信封”。","priority":""}],"source":"课件 PDF 第5—6页；转写 6.1","priority":"","visual":"crypto-compare","memory":"对称负责大量数据；公钥密码解决密钥保护/交换和签名等配套问题。"},{"id":"2:6","chapter":2,"index":6,"title":"数字信封：加密数据与保护密钥","fullTitle":"数字信封：加密数据与保护密钥","intro":"数字信封利用对称密码加密数据，再使用接收方公钥加密对称密钥。这是老师用来串联两类加密方法的扩展。","points":[{"text":"第 1 步：生成一次性或会话对称密钥 K。","note":"会话密钥主要用于当前消息。","priority":"understand"},{"text":"第 2 步：用 K 对消息正文做对称加密。","note":"适合大数据量。","priority":"understand"},{"text":"第 3 步：用 B 的公钥加密 K，构成给 B 的“密钥信封”。","note":"避免裸传对称密钥。","priority":"understand"},{"text":"第 4 步：B 用自己的私钥解开 K，再用 K 解开密文。","note":"密钥解包与数据解密分两步。","priority":"understand"},{"text":"数字信封主要关注保密和密钥传递，不可直接等同于数字签名。","note":"还需要校验消息来源与完整性。","priority":"frequent"}],"source":"课件 PDF 第5—6页；转写 6.1","priority":"","visual":"envelope","memory":"数据用对称密钥加密；对称密钥用接收方公钥加密。"},{"id":"3:0","chapter":3,"index":0,"title":"信息摘要与哈希函数","fullTitle":"信息摘要与哈希函数","intro":"信息摘要通过哈希算法把任意长度数据映射为固定长度结果。老师主要从“检测内容是否改变”解释其作用。","points":[{"text":"哈希函数 H：消息 M → 摘要 h=H(M)。","note":"摘要通常比消息短且长度固定。","priority":"frequent"},{"text":"同一内容、同一算法会得到相同摘要。","note":"利于重复计算比对。","priority":""},{"text":"内容发生改变时，摘要通常随之改变。","note":"密码学设计追求强抗碰撞能力，但理论上不同输入也可能同摘要。","priority":"frequent"},{"text":"典型应用：文件完整性核对、数字签名所需的消息摘要。","note":"后者通常在摘要上签名。","priority":"frequent"},{"text":"摘要不是加密：通常不需要“解密摘要”还原原文。","note":"不可逆压缩性质与保密不同。","priority":"frequent"},{"text":"简单附带一个无认证摘要并不能证明来源可信。","note":"攻击者可同时篡改消息和摘要。","priority":""}],"source":"课件 PDF 第7—9页；转写 6.1","priority":"frequent","visual":"hash","memory":"摘要：固定长度、便于验改；不等于加密，也不天然保证来源身份。"},{"id":"3:1","chapter":3,"index":1,"title":"MD5、SHA-1 与摘要算法分类","fullTitle":"MD5、SHA-1 与摘要算法分类","intro":"课件第 7 页以 MD5 和 SHA-1 为典型摘要算法，讲解它们的摘要位数。考试识别时注意它们与加密算法的区别。","points":[{"text":"MD5：输出 128 位摘要。","note":"课件历史知识点；现代密码安全需求中不宜再选作抗碰撞摘要。","priority":"frequent"},{"text":"SHA-1：输出 160 位摘要。","note":"同样存在碰撞安全问题，不宜用于新的数字签名方案。","priority":"frequent"},{"text":"SHA-256 等是现代常见摘要算法示例。","note":"这是现行技术补充，不是老师该段课程的强调对象。","priority":"understand"},{"text":"摘要位数和数据明文长度不是一一对应关系。","note":"大文件也能得到固定长度摘要。","priority":""},{"text":"“输入改变一位，摘要绝对不可能相同”是课堂便于理解的简化说法。","note":"数学上有限摘要空间必然可能发生碰撞。","priority":""}],"source":"课件 PDF 第7—9页；转写 6.1","priority":"","visual":"hash-algos","memory":"MD5=128 bit；SHA-1=160 bit；都是摘要算法，不是对称加密。","notice":"本课列举 MD5、SHA-1 供考试概念识别。它们已不适合新的抗碰撞安全场景；不能把课程示例当作安全工程选型建议。"},{"id":"3:2","chapter":3,"index":2,"title":"数字签名：作用与基本步骤","fullTitle":"数字签名：作用与基本步骤","intro":"数字签名与加密的使用方向不同。签名使用发送者自己的私钥；验证使用发送者的公钥。","points":[{"text":"签名目标：验证签名者来源、检测内容改动，并支持不可抵赖性。","note":"前提是私钥安全、身份和公钥得到正确绑定。","priority":"must"},{"text":"发送方 A：先对消息算摘要，再用 A 私钥对摘要进行签名。","note":"老师在 6.2 的 PGP 串讲中补充“主要对摘要签名”。","priority":"must"},{"text":"接收方 B：用 A 公钥验证签名，并对收到的消息重新算摘要。","note":"重点是验证签名与消息是否匹配。","priority":"must"},{"text":"数字签名本身不负责把原始消息内容保密。","note":"需要保密时另外使用加密。","priority":"must"},{"text":"不要误写成“B 的私钥用于验证 A 的签名”。","note":"私钥的所有者要和发送者一致。","priority":"frequent"}],"source":"课件 PDF 第7—9页；转写 6.1","priority":"must","visual":"signature","memory":"签名：发送方私钥签；验签：发送方公钥验；不等于内容加密。","examples":[{"title":"甲的签名，乙如何验证？","given":"甲向乙发送消息和数字签名；问乙使用谁的公钥。","steps":["谁做签名？甲。","签名基于甲自己的私钥。","对应验签使用甲的公钥。","乙重新对消息计算摘要并完成签名验证。"],"answer":"使用甲的公钥验签。","warning":"如果问题要求“保证乙才能读”，则应改为用乙公钥加密。"}]},{"id":"3:3","chapter":3,"index":3,"title":"加密、摘要、签名三者对比","fullTitle":"加密、摘要、签名三者对比","intro":"最常见的混淆是把“保护机密性”和“验证来源或内容完整性”当成一回事。这一节把目的、方法、结果放在一张表里。","points":[{"text":"对称/公钥加密：主要用于保密性。","note":"未经授权者不应读懂明文。","priority":"must"},{"text":"哈希摘要：主要用于辅助完整性检验。","note":"反映内容的特征，不单独提供身份认证。","priority":"frequent"},{"text":"数字签名：用于来源认证、完整性验证、不可抵赖。","note":"不直接实现密文保密。","priority":"must"},{"text":"数字证书：绑定主体身份与公钥。","note":"保证验签或加密使用的公钥归属可验证。","priority":"frequent"},{"text":"实际安全通信经常把多种技术组合。","note":"单一技术通常只覆盖部分安全目标。","priority":""}],"source":"课件 PDF 第7—9页；转写 6.1","priority":"must","visual":"securitytools","memory":"加密保密；摘要验改；签名验人+验改+不可抵赖；证书绑定人和公钥。"},{"id":"3:4","chapter":3,"index":4,"title":"PKI：公钥基础设施","fullTitle":"PKI：公钥基础设施","intro":"PKI（Public Key Infrastructure）是围绕公钥、数字证书、信任链和认证管理建立的安全支撑体系。老师要求理解基本概念。","points":[{"text":"PKI 基于公钥密码体制提供身份认证等安全基础服务。","note":"属于安全基础设施，不是单个加密算法。","priority":"frequent"},{"text":"数字证书用于把一个实体（网站、组织、用户）和相应公钥联系起来。","note":"课件将“绑定公钥与身份”列为核心。","priority":"must"},{"text":"CA（证书颁发机构）：对证书签名并承担证书签发职责。","note":"老师用“驾照发证机构”类比。","priority":"frequent"},{"text":"证书可包含公钥、主体标识、签发者、有效期、序列号、签名算法等。","note":"通常不会公开持有者私钥。","priority":"frequent"},{"text":"证书有效性还涉及信任链、有效期、用途、撤销状态等。","note":"这是现代验证时需要注意的边界；课件主要说明 CA 签名。","priority":"understand"}],"source":"课件 PDF 第7—9页；转写 6.1","priority":"frequent","visual":"pki","memory":"数字证书绑定“谁”与“哪把公钥”；CA 负责签发与可信验证。"},{"id":"3:5","chapter":3,"index":5,"title":"数字证书：驾照类比与验证","fullTitle":"数字证书：驾照类比与验证","intro":"老师使用“驾驶人—驾驶证—签发机关”的三方类比，帮助理解证书证明公钥归属。考试主要识别证书/CA/公钥作用。","points":[{"text":"现实类比：人 ↔ 驾照 ↔ 发证机关。","note":"驾照由权威机构签发并对应特定人。","priority":""},{"text":"PKI 对应：主体 ↔ 数字证书 ↔ CA。","note":"证书包含主体信息与公钥。","priority":"frequent"},{"text":"CA 数字签名用于证明证书来源及其内容未被非法改变。","note":"验证时使用可信 CA 相关公钥。","priority":"frequent"},{"text":"验证通过不代表“任何连接到该主体的应用都绝对安全”。","note":"证书解决的是部分身份与密钥真实性问题。","priority":""},{"text":"私钥不放进公开证书，不向他人分享。","note":"题目若出现“证书公开包含私钥”，一般是错误选项。","priority":"must"}],"source":"课件 PDF 第7—9页；转写 6.1","priority":"","visual":"certificate","memory":"主体—证书—CA ≈ 人—驾照—发证机关；证书可公开，私钥不公开。"},{"id":"3:6","chapter":3,"index":6,"title":"综合示例：安全邮件的混合保护","fullTitle":"综合示例：安全邮件的混合保护","intro":"课堂用 PGP 示意图把摘要、签名、对称加密和数字信封串联起来；老师明确定位为扩展，用于建立整体理解。","points":[{"text":"① 发送方计算消息摘要，并用自己的私钥生成签名。","note":"来源认证与完整性机制。","priority":"understand"},{"text":"② 把消息和签名打包，再用临时对称密钥加密。","note":"消息本体通过高效对称加密处理。","priority":"understand"},{"text":"③ 用接收者公钥保护临时对称密钥。","note":"构成数字信封。","priority":"understand"},{"text":"④ 接收者用私钥取出会话密钥，再解密消息和签名。","note":"恢复原始消息内容。","priority":"understand"},{"text":"⑤ 用发送者公钥验签，并核对收到的消息。","note":"验证签名与消息匹配。","priority":"understand"},{"text":"这只是课程示意，不表示全部 PGP 版本都固定使用 MD5 或 IDEA。","note":"算法具体组合与版本有关。","priority":""}],"source":"课件 PDF 第7—9页；转写 6.1","priority":"","visual":"mailflow","memory":"先签名、再对称加密正文、再用接收方公钥保护密钥；接收方反向处理。","notice":"老师在综合串讲中把数字签名附加值称作“MAC”，并用“私钥加密”解释签名。标准密码学里消息认证码 MAC 与数字签名不同；本知识库按“签名”表述，避免混淆。"},{"id":"4:0","chapter":4,"index":0,"title":"防火墙：内外网边界控制","fullTitle":"防火墙：内外网边界控制","intro":"课件第 9 页把防火墙比作隔离内外网的“大门”。老师指出这是网络安全技术中最重要的概念之一。","points":[{"text":"防火墙：按安全规则控制可信网络与不可信网络之间的通信。","note":"题干出现“进出内网的数据包是否允许”优先想到防火墙。","priority":"must"},{"text":"它可以按地址、端口、连接状态、应用特征等匹配规则。","note":"具体能力取决于设备与方案。","priority":""},{"text":"作用：阻止不允许的连接或流量穿越安全边界。","note":"不是保证系统内部绝对安全。","priority":"frequent"},{"text":"老师以“门卫/大门”比喻其边界控制作用。","note":"这个比喻适合记忆与做题。","priority":"frequent"},{"text":"防火墙不能替代身份权限管理、终端防护、补丁与日志审计。","note":"安全通常要多层防护。","priority":""}],"source":"课件 PDF 第9—10页；转写 6.2","priority":"must","visual":"firewall","memory":"防火墙像门卫：重点是按规则控制内外网络的进出。"},{"id":"4:1","chapter":4,"index":1,"title":"网络级与应用级防火墙","fullTitle":"网络级与应用级防火墙","intro":"老师把防火墙简要分为网络级和应用级两类，主要要求理解层级和检测粒度，而不是深入实现。","points":[{"text":"网络级防火墙：侧重网络层/传输层地址、协议、端口等信息。","note":"通常规则简单、处理开销相对较小。","priority":"understand"},{"text":"应用级防火墙：深入应用协议、请求和内容信息。","note":"可以针对具体应用行为处理。","priority":"understand"},{"text":"课堂用“低层快、高层检查细”概括差异。","note":"实际性能和安全效果还取决于产品与部署。","priority":"understand"},{"text":"题目若强调“过滤进出网络的数据包”，通常首先对应防火墙。","note":"老师真题解析的主要判断法。","priority":"frequent"},{"text":"应用级检查不是无条件“绝对更安全”。","note":"需要配合规则、更新、部署。","priority":""}],"source":"课件 PDF 第9—10页；转写 6.2","priority":"","visual":"firewall-levels","memory":"网络级看通信元信息；应用级能理解更多应用请求内容。"},{"id":"4:2","chapter":4,"index":2,"title":"入侵检测系统 IDS：监控与告警","fullTitle":"入侵检测系统 IDS：监控与告警","intro":"老师把 IDS 比作“摄像头”：采集并分析可疑流量或行为，检测到异常后报警，而不是默认自己执行封堵。","points":[{"text":"IDS = Intrusion Detection System，入侵检测系统。","note":"D 是 Detection（检测）。","priority":"frequent"},{"text":"典型职责：监控、分析、发现异常、报告或报警。","note":"课堂强调的四步。","priority":"frequent"},{"text":"传统被动 IDS 一般不在网络数据转发的必经路径上主动阻断。","note":"可以通过镜像端口/探针获得流量。","priority":"frequent"},{"text":"部署点通常靠近重要资源或网络入口，以保证观察到相关流量。","note":"部署方式随保护目标变化。","priority":"understand"},{"text":"检测手段可以包含特征规则和异常检测。","note":"课程将其形容为带知识库的监控。","priority":""},{"text":"老师特别要求记住缩写 IDS 和“摄像头”比喻。","note":"与 IPS 对照。","priority":"frequent"}],"source":"课件 PDF 第9—10页；转写 6.2","priority":"frequent","visual":"ids","memory":"IDS 像摄像头：看见异常 → 分析 → 报警。"},{"id":"4:3","chapter":4,"index":3,"title":"入侵防御系统 IPS：检测并阻断","fullTitle":"入侵防御系统 IPS：检测并阻断","intro":"老师以“机关”比喻 IPS：发现某种攻击后还能主动阻断。此部分他明确评价为补充知识，了解即可。","points":[{"text":"IPS = Intrusion Prevention System，入侵防御系统。","note":"P 是 Prevention（预防、防御）。","priority":"understand"},{"text":"IPS 不只检测，还可以按策略阻断可疑通信。","note":"区别于传统被动 IDS。","priority":"frequent"},{"text":"典型 IPS 可能以内联模式部署在流量路径上。","note":"必须综合考虑误报及业务中断风险。","priority":"understand"},{"text":"IDS = 摄像头；IPS = 可以触发拦截的机关。","note":"保留老师的类比帮助记忆。","priority":"understand"},{"text":"并非所有 IDS/IPS 产品只有一种部署方式或功能。","note":"这里遵循课件原理层的简化。","priority":""}],"source":"课件 PDF 第9—10页；转写 6.2","priority":"","visual":"ips","memory":"IDS 重发现告警，IPS 重主动阻断；老师认为 IPS 属扩展。"},{"id":"4:4","chapter":4,"index":4,"title":"蜜罐、杀毒与多层防护","fullTitle":"蜜罐、杀毒与多层防护","intro":"蜜罐模拟可被攻击的目标，用来观察入侵行为；杀毒软件面向恶意代码。老师在 6.2 作为补充知识简述。","points":[{"text":"蜜罐 Honeypot：构造诱饵服务或系统吸引攻击者。","note":"借此采集、分析攻击行为。","priority":"understand"},{"text":"蜜罐通常不应放任攻击者借它进一步攻击真实业务网络。","note":"隔离和监控仍必不可少。","priority":""},{"text":"杀毒/终端安全软件：发现并处理可疑恶意程序。","note":"与网络边界的防火墙职责不同。","priority":""},{"text":"防火墙关注通信边界，IDS/IPS 关注异常行为，终端防护关注主机内威胁。","note":"不同层面组合才能形成多层防护。","priority":""},{"text":"老师把蜜罐概括为“设置陷阱”，此处只需理解基本作用。","note":"非本课重点考查内容。","priority":"understand"}],"source":"课件 PDF 第9—10页；转写 6.2","priority":"","visual":"defense-stack","memory":"边界门卫=防火墙；摄像头=IDS；拦截机关=IPS；诱饵=蜜罐。"},{"id":"5:0","chapter":5,"index":0,"title":"被动攻击：窃听与流量分析","fullTitle":"被动攻击：窃听与流量分析","intro":"被动攻击倾向于观察或收集信息而不直接改变通信内容。课件把窃听、业务流分析作为典型例子。","points":[{"text":"窃听：监听通信内容，损害机密性。","note":"被动攻击的典型形式。","priority":"frequent"},{"text":"业务流/流量分析：观察谁与谁通信、时间、频率等模式。","note":"即使不理解正文，也可能分析通信特征。","priority":"frequent"},{"text":"被动攻击的核心在于秘密观察，而不是必须让对方察觉。","note":"老师用“听但不改”作记忆。","priority":""},{"text":"反例：篡改报文、假冒身份、拒绝服务通常属于主动攻击。","note":"它们会改变系统行为或通信。","priority":""},{"text":"资料把“非法登录”也列在被动侧，但其主动性依实际行为而定。","note":"严格分类时，不宜把所有非法登录无条件视为被动攻击。","priority":""}],"source":"课件 PDF 第11—12页；转写 6.2","priority":"frequent","visual":"passive","memory":"被动：听、看、分析，不改变原通信内容。","notice":"课件将某些“非法登录”情形列入被动攻击；实际安全分析更常按有无修改、伪造、干扰及目标行为来判断，不能仅凭是否被发现分类。"},{"id":"5:1","chapter":5,"index":1,"title":"主动攻击：伪装、篡改与抵赖","fullTitle":"主动攻击：伪装、篡改与抵赖","intro":"主动攻击通过修改、伪造、重放或阻断等手段影响通信与系统行为。课堂强调重放攻击和拒绝服务必须掌握。","points":[{"text":"假冒身份：攻击者冒充合法通信方。","note":"影响实体认证。","priority":"frequent"},{"text":"篡改/插入：修改、伪造或添加数据。","note":"影响完整性及业务正确性。","priority":""},{"text":"抵赖：参与者否认自己的行为。","note":"对应不可抵赖技术。","priority":""},{"text":"旁路控制：利用系统安全缺陷绕过原有访问控制。","note":"课堂例举，理解即可。","priority":"understand"},{"text":"重放攻击：截获旧报文再重新发送。","note":"老师明确说重要。","priority":"must"},{"text":"DoS 拒绝服务：占用或破坏服务资源，使合法用户难以访问。","note":"老师明确说重要。","priority":"must"}],"source":"课件 PDF 第11—12页；转写 6.2","priority":"frequent","visual":"active","memory":"主动攻击会“动手”：假冒、改包、重放、阻断。"},{"id":"5:2","chapter":5,"index":2,"title":"重放攻击：旧报文再次发送","fullTitle":"重放攻击：旧报文再次发送","intro":"重放不是一定要解出密码内容；攻击者可以把曾经有效的认证或交易报文再次发送，诱使服务端重复处理。","points":[{"text":"攻击步骤：捕获合法报文 → 保存 → 在其他时间重复发送。","note":"最典型的重放时序。","priority":"must"},{"text":"攻击效果：使旧授权/旧交易在不应该的时间再次生效。","note":"具体结果取决于协议设计。","priority":"must"},{"text":"防护：随机挑战值 nonce、序列号、一次性令牌或时间戳等机制。","note":"课程特别指出时间戳。","priority":"frequent"},{"text":"单有时间戳但没有可信校验、有效期和重复检查，未必能阻断重放。","note":"这是对老师简化说法的实践补充。","priority":""},{"text":"考试关键词：“先截获已发送报文，再重复发送”＝重放。","note":"课件第12页示例。","priority":"must"}],"source":"课件 PDF 第11—12页；转写 6.2","priority":"must","visual":"replay","memory":"重放＝抓旧包，再发一遍；识别靠时效/唯一性/状态校验。","notice":"课堂把“加一个时间戳”说成能够解决重放问题，并称重放已基本消失。这只是概念化说明：时间戳需认证且配合重放窗口等校验，现实中重放攻击仍可能出现。","examples":[{"title":"判断攻击类型","given":"攻击者发送一个目的主机已经接收过的报文，以获得不应有的效果。","steps":["题干强调“已经接收过的报文”。","攻击者不是单纯观察，也不是修改后发送。","关键行为是重复提交旧报文。"],"answer":"重放攻击。","warning":"反重放应设计报文唯一性或有效期验证，不能只依赖内容加密。"}]},{"id":"5:3","chapter":5,"index":3,"title":"拒绝服务 DoS 与可用性","fullTitle":"拒绝服务 DoS 与可用性","intro":"DoS 的主要目标是让合法用户无法获得服务。老师以服务端请求过多而崩溃作形象解释，但应注意“访问量大”不必然就是攻击。","points":[{"text":"DoS = Denial of Service，拒绝服务攻击。","note":"目的在于损害服务可用性。","priority":"must"},{"text":"常见方式：耗尽计算、连接、带宽等资源，使合法请求无法正常完成。","note":"资源耗尽只是常见路径之一。","priority":"must"},{"text":"DDoS：来自多个来源的分布式拒绝服务攻击。","note":"属于拓展的经典术语。","priority":"understand"},{"text":"检测关键词：“合法用户无法访问”“服务资源被恶意占用”。","note":"课件将其列为必须掌握。","priority":"must"},{"text":"正常高并发（如抢票）造成拥塞是故障，不应自动等同于恶意 DoS。","note":"攻击需要具有恶意或违规流量等判据。","priority":""}],"source":"课件 PDF 第11—12页；转写 6.2","priority":"must","visual":"dos","memory":"DoS 主要破坏 A（Availability，可用性）；正常流量高峰不自动算攻击。"},{"id":"5:4","chapter":5,"index":4,"title":"计算机病毒：自我复制与危害","fullTitle":"计算机病毒：自我复制与危害","intro":"课程定义病毒为能自我复制、传播并可能损害计算机功能和数据的一类程序指令或代码。","points":[{"text":"病毒本质是恶意程序代码，不是物理生物病毒。","note":"考试常识题。","priority":"frequent"},{"text":"传播/自我复制能力是课件强调的重要特征。","note":"包括感染其他程序或载体等。","priority":"frequent"},{"text":"典型特征：传染性、隐蔽性、潜伏性、触发性和破坏性。","note":"不同病毒并不总同时表现全部特征。","priority":"frequent"},{"text":"课件真题辨析：“自毁性”不是常用的基本必备特征。","note":"按题干原选项理解。","priority":"frequent"},{"text":"课程举“熊猫烧香”等历史案例帮助理解。","note":"不必背诵大量病毒名称。","priority":"understand"}],"source":"课件 PDF 第11—12页；转写 6.2","priority":"","visual":"virus","memory":"病毒是程序代码；抓关键词“自我复制、感染传播”。"},{"id":"5:5","chapter":5,"index":5,"title":"木马、后门与病毒的区别","fullTitle":"木马、后门与病毒的区别","intro":"课堂用“病毒主动破坏、木马暗中监控”概括差别，主要帮助识别木马的伪装和后门作用。","points":[{"text":"木马 Trojan：伪装成正常程序或利用诱导执行，在受害机器上实施未授权行为。","note":"常见与窃取信息、后门控制相关。","priority":"frequent"},{"text":"病毒通常强调感染传播或自我复制。","note":"与木马的典型传播机制不同。","priority":"frequent"},{"text":"木马并非只能监听，也可能删除文件、加密数据或下载其他恶意程序。","note":"不能把“不会破坏系统”当通用规则。","priority":""},{"text":"后门：绕过正常授权机制的隐蔽访问入口。","note":"木马可能安装后门，但两者不是同义词。","priority":""},{"text":"防护：不运行不明来源程序，保持更新，配合终端检测与最小权限。","note":"依据原理延伸的实践提示。","priority":""}],"source":"课件 PDF 第11—12页；转写 6.2","priority":"","visual":"trojan","memory":"病毒典型特征是感染复制；木马典型特征是伪装诱导与未授权控制。","notice":"老师把木马描述为“不主动破坏，只监控”。这是备考类比而非严格定义：木马同样可能执行破坏行为。"},{"id":"5:6","chapter":5,"index":6,"title":"网络威胁速辨：考题关键词","fullTitle":"网络威胁速辨：考题关键词","intro":"把课件里容易混淆的威胁放到同一张对照表，从“行为”和“损害的安全属性”两步判断。","points":[{"text":"窃听：未授权获取通信内容 → 保密性。","note":"通常是被动攻击。","priority":"frequent"},{"text":"流量分析：分析通信模式 → 泄露通信关系/行为信息。","note":"通常是被动攻击。","priority":"frequent"},{"text":"身份假冒：冒用他人身份 → 认证真实性。","note":"通常是主动攻击。","priority":"frequent"},{"text":"篡改消息：修改数据 → 完整性。","note":"主动攻击。","priority":"frequent"},{"text":"重放旧报文：重复发送合法旧消息 → 重放攻击。","note":"主动攻击。","priority":"must"},{"text":"使服务不可用：DoS/DDoS → 可用性。","note":"主动攻击。","priority":"must"}],"source":"课件 PDF 第11—12页；转写 6.2","priority":"frequent","visual":"threattable","memory":"先识别动作，再看受损属性；重放看“旧报文”，DoS 看“用不了”。"},{"id":"6:0","chapter":6,"index":0,"title":"协议总览：按网络层次与业务目标辨析","fullTitle":"协议总览：按网络层次与业务目标辨析","intro":"课件第 12 页把常见安全协议放在 OSI 模型上。老师说以“属于哪类、用于哪里”为主，不需要深入内部协议流程。","points":[{"text":"物理层：物理隔离、屏蔽、设备保护等手段。","note":"并非主要使用应用协议。","priority":"understand"},{"text":"数据链路侧：隧道或链路保护方案示例 PPTP、L2TP。","note":"要注意它们本身不必然表示数据已被强加密。","priority":"understand"},{"text":"网络层：IPsec。","note":"常用于网络层安全通信。","priority":"understand"},{"text":"与传输安全相关：SSL/TLS。","note":"课程用 SSL 与 HTTPS 举例。","priority":"frequent"},{"text":"应用场景：HTTPS 网页访问、SSH 安全远程登录、SET 支付、PGP/S/MIME 安全邮件。","note":"题目常考协议与用途匹配。","priority":"frequent"},{"text":"协议位置图是课堂帮助分类的简化示意，并非严格的一协议只属于单层。","note":"例如 TLS 运行在传输协议之上，为应用流量提供保护。","priority":""}],"source":"课件 PDF 第12—14页；转写 6.2","priority":"","visual":"protocol-map","memory":"IPsec 保护 IP 层；TLS 支撑 HTTPS；SSH 远程登录；PGP/S/MIME 安全邮件。"},{"id":"6:1","chapter":6,"index":1,"title":"SSL / TLS 与 HTTPS","fullTitle":"SSL / TLS 与 HTTPS","intro":"老师重点提到 HTTPS 用于安全网页传输，要求记住 HTTPS 通常使用 443 端口。SSL 是课件旧称，现代实现以 TLS 为主。","points":[{"text":"HTTP：常见明文网页传输协议，默认端口 80。","note":"老师明确要求记住端口。","priority":"must"},{"text":"HTTPS：HTTP 通过 TLS 安全通道传输，默认端口 443。","note":"课程将它表述为 HTTP + SSL。","priority":"must"},{"text":"TLS：现代安全传输协议，用于身份验证与保护传输数据机密性、完整性。","note":"课程用 SSL/TLS 的旧式分层图说明。","priority":"frequent"},{"text":"SSL 是历史协议名称；现代实际部署主要使用 TLS。","note":"考试老题可能继续使用 SSL 表述。","priority":""},{"text":"HTTPS 并不保证站点业务绝对可信，不等于网站没有漏洞。","note":"它主要保护客户端与服务器之间的传输通道。","priority":""}],"source":"课件 PDF 第12—14页；转写 6.2","priority":"frequent","visual":"https","memory":"HTTP=80；HTTPS=443；HTTPS 现在主要靠 TLS 安全传输。","notice":"旧课件说“HTTPS 就是 HTTP+SSL”。这是历史教学说法；今天通常称为 HTTP over TLS，旧版 SSL 已淘汰。"},{"id":"6:2","chapter":6,"index":2,"title":"SSH：安全远程管理","fullTitle":"SSH：安全远程管理","intro":"SSH 用于加密远程登录和命令行会话。老师的典型题是“管理员远程配置路由器，需保护账号密码与操作内容”。","points":[{"text":"SSH = Secure Shell，用于安全远程交互与管理。","note":"与 Telnet 的明文传输形成对照。","priority":"must"},{"text":"使用 SSH 可保护远程登录凭据与会话传输。","note":"老师明确给出相关选择题。","priority":"must"},{"text":"SSH 也可承载安全文件传输，如 SFTP。","note":"具体功能取决于部署。","priority":"understand"},{"text":"SSH 通常默认使用 TCP 22 端口。","note":"这是一般网络常识补充，原课件的主要考点是协议用途。","priority":""},{"text":"题目关键词：命令行管理远端设备/路由器、保护会话内容 → SSH。","note":"课程直接强调。","priority":"must"}],"source":"课件 PDF 第12—14页；转写 6.2","priority":"must","visual":"ssh","memory":"远程命令行管理要保密，选 SSH；网页 HTTPS 不是 SSH。"},{"id":"6:3","chapter":6,"index":3,"title":"IPsec：网络层安全通信","fullTitle":"IPsec：网络层安全通信","intro":"IPsec 是在 IP 层保护通信的协议套件，课件将它放在网络层并要求了解。","points":[{"text":"IPsec 面向网络层的安全传输。","note":"课件在协议层次总览中列出。","priority":"understand"},{"text":"主要可提供数据保密、完整性验证等功能。","note":"取决于配置和工作模式。","priority":"understand"},{"text":"常与 VPN 场景联系。","note":"属于理解用途的补充，而非老师要求深入实现。","priority":""},{"text":"不要把 IPsec 与 HTTPS 的应用场景和层次完全混同。","note":"前者以 IP 层为保护对象，后者保护 HTTP 通信。","priority":""}],"source":"课件 PDF 第12—14页；转写 6.2","priority":"","visual":"ipsec","memory":"IPsec = IP 网络层安全；了解与 VPN 的常见关联即可。"},{"id":"6:4","chapter":6,"index":4,"title":"SET：安全电子交易协议","fullTitle":"SET：安全电子交易协议","intro":"SET 是早期围绕电子商务卡支付安全设计的协议。老师在课件第 13 页介绍它涉及多方认证与支付信息保护，了解场景即可。","points":[{"text":"SET = Secure Electronic Transaction，安全电子交易协议。","note":"课件翻译与应用场景。","priority":"understand"},{"text":"设计目标是保护网上银行卡/信用卡支付交易。","note":"B2C 场景是老师主要举例。","priority":"understand"},{"text":"涉及持卡人、商户、银行、支付机构、认证机构等多方。","note":"协议结构较复杂。","priority":""},{"text":"不要将 SET 误记成一般网页 HTTPS 或邮件协议。","note":"考试更可能考定义匹配。","priority":""},{"text":"SET 属历史技术知识点，不代表当今电子支付普遍仍采用它。","note":"与今天的实际部署应分开看待。","priority":""}],"source":"课件 PDF 第12—14页；转写 6.2","priority":"","visual":"set","memory":"SET 看“电子交易/卡支付”，了解用途即可。"},{"id":"6:5","chapter":6,"index":5,"title":"Kerberos：第三方票据认证","fullTitle":"Kerberos：第三方票据认证","intro":"老师在 6.2 中把 Kerberos 描述为基于可信第三方的身份认证机制，核心是使用票据完成网络服务认证。","points":[{"text":"Kerberos 是网络身份认证协议。","note":"不是公钥证书机构本身。","priority":"understand"},{"text":"以可信认证中心/密钥分发中心 KDC 及票据为核心。","note":"KDC = Key Distribution Center。","priority":"frequent"},{"text":"客户端获取可用于访问服务的票据，再向服务方出示。","note":"有助于理解为什么不是直接每次发送密码。","priority":"understand"},{"text":"PKI 侧重 CA 证书与公钥绑定；Kerberos 侧重 KDC 与票据。","note":"课程第三方认证真题辨析的关键。","priority":"frequent"},{"text":"不能把 KDC 写成 PKI 数字证书的存储服务器。","note":"老师明确指出此类错项。","priority":"frequent"}],"source":"课件 PDF 第12—14页；转写 6.2","priority":"","visual":"kerberos","memory":"Kerberos：KDC 发票据；PKI：CA 签发数字证书。"},{"id":"6:6","chapter":6,"index":6,"title":"PGP：安全电子邮件与混合技术","fullTitle":"PGP：安全电子邮件与混合技术","intro":"PGP 是安全邮件保护方案，老师虽然花了较多时间解释，但明确说它的详细流程不是本课考试重点，主要用于串联已学技术。","points":[{"text":"PGP：Pretty Good Privacy，提供邮件加密与签名等能力。","note":"课件以此作为综合技术示例。","priority":"understand"},{"text":"可以综合对称加密、公钥密码、摘要和数字签名技术。","note":"课件示意采用 IDEA、RSA、MD5 等历史算法组合。","priority":"understand"},{"text":"邮件内容加密适合用对称密钥，密钥再由收件人公钥保护。","note":"数字信封思路。","priority":"understand"},{"text":"发送方以自身私钥签名，收件方以发送者公钥验签。","note":"综合流程中的签名部分。","priority":"frequent"},{"text":"老师明确表示详细邮件流程属于扩展，不必深究。","note":"但懂这个例子能串起前面概念。","priority":"understand"}],"source":"课件 PDF 第12—14页；转写 6.2","priority":"","visual":"pgp","memory":"PGP：邮件安全；混合加密 + 摘要 + 签名。"},{"id":"6:7","chapter":6,"index":7,"title":"S/MIME 与安全邮件协议辨析","fullTitle":"S/MIME 与安全邮件协议辨析","intro":"课件最后一页将 S/MIME 作为安全电子邮件服务选项，同时强调 MIME 本身不是加密与签名安全方案。","points":[{"text":"MIME：多用途互联网邮件扩展，用于扩展邮件内容类型。","note":"本身不等于提供邮件的安全加密。","priority":"understand"},{"text":"S/MIME：安全多用途互联网邮件扩展，提供邮件加密/签名支持。","note":"课件真题选择答案。","priority":"frequent"},{"text":"PGP 也是安全邮件相关技术。","note":"与 S/MIME 的具体实现和信任模型可以不同。","priority":""},{"text":"HTTPS 用于 Web，SET 用于历史电子交易，S/MIME 和 PGP 用于邮件。","note":"凭服务场景识别即可。","priority":"frequent"},{"text":"老师建议协议部分主要“看得懂名词、能与用途对应”。","note":"无需按信息安全工程师深度学习。","priority":"understand"}],"source":"课件 PDF 第12—14页；转写 6.2","priority":"","visual":"securemail","memory":"安全电子邮件选 PGP 或 S/MIME；MIME 只扩展内容格式。"},{"id":"6:8","chapter":6,"index":8,"title":"安全协议选择：一张总对照","fullTitle":"安全协议选择：一张总对照","intro":"最后把常见协议按网络层次和应用业务汇总，便于考前快速定位选择题关键词。","points":[{"text":"HTTPS/TLS：Web 安全传输；HTTPS 默认 443。","note":"HTTP 默认 80。","priority":"must"},{"text":"SSH：安全远程登录和管理。","note":"题干出现命令行管理设备优先联想。","priority":"must"},{"text":"IPsec：网络层通信安全。","note":"课件要求了解。","priority":"understand"},{"text":"Kerberos：KDC 与票据身份认证。","note":"与 CA 证书体制区分。","priority":"frequent"},{"text":"SET：历史电子交易/信用卡支付协议。","note":"场景辨析为主。","priority":"understand"},{"text":"PGP / S/MIME：安全电子邮件。","note":"用于加密和签名等能力。","priority":"frequent"}],"source":"课件 PDF 第12—14页；转写 6.2","priority":"frequent","visual":"protocol-table","memory":"Web HTTPS；远程管理 SSH；网络层 IPsec；认证票据 Kerberos；邮件 PGP/S/MIME。"}],"quizzes":[{"chapter":1,"topic":"1:0","question":"课件中“信息系统安全”与“信息安全”的关系，哪项更准确？","options":["前者只看加密","前者还涉及设备和运行环境等整体系统","后者仅指机房设备","两者都不涉及网络"],"answer":1,"explain":"信息安全关注信息属性；信息系统安全还要考虑承载信息的系统与环境。"},{"chapter":1,"topic":"1:1","question":"安全空间三维模型中，课件 X、Y、Z 三轴依次是？","options":["安全机 ES、3DES","RSA、ECC、DES","SHA-1、MD5、AES","Kerberos、SET、AES"],"answer":0,"explain":"DES、3DES、AES 属于对称密码；RSA/ECC 属公钥算法；MD5/SHA-1 属哈希摘要。"},{"chapter":2,"topic":"2:3","question":"非对称密码体系中，以下哪项需要保密保存？","options":["公钥","私钥","公开算法名称","数字证书中的主体名称"],"answer":1,"explain":"私钥必须安全保护，公钥可以发布。"},{"chapter":2,"topic":"2:4","question":"A 希望只有 B 能读懂消息，A 应优先使用哪把钥加密？","options":["A 的公钥","A 的私钥","B 的公钥","B 的私钥"],"answer":2,"explain":"保密通信使用接收者 B 的公钥加密，B 用自己的私钥解密。"},{"chapter":2,"topic":"2:4","question":"B 收到 A 发来的 B 公钥加密的密文，应由谁使用哪把钥解密？","options":["A 用 A 私钥","B 用 B 私钥","A 用 B 公钥","任何人用 B 公钥"],"answer":1,"explain":"只有与 B 公钥配对的 B 私钥可解密。"},{"chapter":2,"topic":"2:5","question":"以下说法哪项正确？","options":["公钥加密一定比 AES 运算快","数据保密性与签名不可抵赖性完全等价","对称密码适合大量数据，公钥密码可辅助保护会话密钥","哈希摘要可用原密钥解密"],"answer":2,"explain":"混合加密结合对称处理数据和公钥密码保护密钥的特点。"},{"chapter":2,"topic":"2:6","question":"数字信封里用于加密大段数据本体的通常是？","options":["对称会话密钥","CA 私钥","签发机构序列号","存储设备口令"],"answer":0,"explain":"数字信封用对称密钥加密数据，接收方公钥加密这个密钥。"},{"chapter":2,"topic":"2:6","question":"数字信封如何把会话密钥安全交给接收方 B？","options":["明文公开会话密钥","用 B 的公钥加密会话密钥","用 A 的公钥加密整个数据库","用 B 的私钥签名后广播"],"answer":1,"explain":"对称密钥经 B 公钥加密，只有 B 私钥能解开。"},{"chapter":3,"topic":"3:0","question":"信息摘要与加密的主要区别是？","options":["摘要一定能还原原文","摘要输出通常固定长度且不可逆还原原文","摘要必须使用 CA","摘要结果只能是原文的一半"],"answer":1,"explain":"摘要为任意长度消息生成固定长度特征，不能像密文那样通过解密还原明文。"},{"chapter":3,"topic":"3:0","question":"直接发送“数据+未认证的哈希值”，为什么不能单独证明来源真实？","options":["哈希长度过长","攻击者可能同时修改数据和哈希值","哈希输出无法比较","哈希不能对文件计算"],"answer":1,"explain":"哈希能辅助发现意外修改，但无密钥或签名验证的摘要不能可靠认证来源。"},{"chapter":3,"topic":"3:1","question":"MD5 输出摘要长度为？","options":["64 位","128 位","160 位","256 位"],"answer":1,"explain":"课件列举 MD5 产生 128 位摘要。"},{"chapter":3,"topic":"3:1","question":"SHA-1 输出摘要长度为？","options":["80 位","128 位","160 位","512 位"],"answer":2,"explain":"课件列举 SHA-1 产生 160 位摘要。"},{"chapter":3,"topic":"3:1","question":"从现行安全实践看，哪项说法正确？","options":["MD5 和 SHA-1 应优先用于新签名系统","SHA-1 是非对称加密","MD5 和 SHA-1 属历史摘要算法，现代抗碰撞场景不宜继续选用","MD5 必须与 RSA 同密钥"],"answer":2,"explai  else if(v==='pgp')body=grid([['数字签名','发件方私钥对摘要签名'],['对称加密','邮件正文大量数据加密'],['公钥加密','保护邮件会话密钥'],['验签与摘要','收件方检查消息匹配']]);
 else if(v==='securemail')body=table(['协议','用途','课堂定位'],[['MIME','扩展邮件内容格式','不是加密安全协议'],['S/MIME','邮件加密与签名','安全电子邮件'],['PGP','邮件加密与签名','安全电子邮件'],['SET','电子交易','不是邮件协议']]);
 else if(v==='protocol-table')body=table(['题目出现的关键词','优先想到'],[['HTTPS / 443 / 网页安全','TLS/HTTPS'],['远程登录、命令行配置路由器','SSH'],['IP 层 / VPN','IPsec'],['KDC / 票据','Kerberos'],['信用卡 / 电子交易（历史）','SET'],['安全邮件','PGP 或 S/MIME']]);
 if(!body)return '';
 return `<section class="card"><h2>🧩 可视化理解</h2><div class="diagram"><div class="diagram-title">VISUAL EXPLAINER · ${esc(t.title)}</div>${body}</div></section>`;
}
function renderMap(){el('topTitle').textContent='安全性知识 · 知识脑图';return `<div class="kicker">KNOWLEDGE MAP</div><h1 class="big-title">一张图，看懂整章知识结构</h1><p class="lede">按章节展开知识分支。点击右侧主题可以直接跳转到图文精讲；再次点击已展开的章节可以收起。</p><div class="map-root">安全性知识 <span style="font-size:12px;margin-left:13px;opacity:.7;align-self:center">6 组知识主题 · 1 份考试定位</span></div><div class="map-rail">${chapters.map(c=>`<div class="map-branch"><button class="map-chap ${mapOpen===c.id?'on':''}" data-mapchap="${c.id}"><span>${c.number} · ${esc(c.name)}</span><b>${mapOpen===c.id?'−':'+'}</b></button><div class="map-topics">${mapOpen===c.id?c.topicIds.map(id=>{let t=lessonMap.get(id);return `<button class="map-topic" data-lesson="${id}"><b>${esc(t.title)}</b><small>${t.points.length} 个知识条目 · 查看精讲 ↗</small><div class="map-details">${t.points.slice(0,3).map(p=>`<span>• ${topicLabel(p.text)}</span>`).join('')}${t.points.length>3?`<span>… 及其他 ${t.points.length-3} 项</span>`:''}</div></button>`}).join(''):`<div style="color:#92a1b0;font-size:12px;padding:13px">${c.topicIds.length} 个子主题 · 点击左侧展开</div>`}</div></div>`).join('')}</div>`}
function renderQuick(){el('topTitle').textContent='安全性知识 · 考前速记';
 const rules=[
  ['信息安全 CIA','C 保密、I 完整、A 可用','1:3'],
  ['安全空间五属性','认证、权限、完整、加密、不可否认','1:2'],
  ['安全空间三维','X 安全机制、Y OSI 层次、Z 安全服务','1:1'],
  ['四类安全需求','物理线路、网络、系统、应用','1:7'],
  ['对称与非对称','同钥高效；公钥可公开，私钥需保密','2:5'],
  ['公钥保密通信','用接收方公钥加密，用接收方私钥解密','2:4'],
  ['数字签名','发送者私钥签，发送者公钥验；不保密正文','3:2'],
  ['摘要与证书','哈希检测内容变化；证书绑定身份与公钥','3:3'],
  ['网络防御','防火墙=门卫；IDS=摄像头；IPS=主动阻断','4:3'],
  ['攻击分类','窃听/流量分析=被动；重放/DoS=主动','5:6'],
  ['重放与 DoS','重放：旧报文再发；DoS：合法用户用不了','5:2'],
  ['协议用途与端口','HTTPS=443，HTTP=80；SSH=远程管理；PGP/S-MIME=邮件','6:8']];
 return `<div class="kicker">QUICK RECALL</div><h1 class="big-title">考前速记 · 核心概念与易混对照</h1><p class="lede">这章以判断技术目的和应用场景为主。建议先遮住答案自测，再点击跳回精讲。</p><div class="section-label"><h2>12 条高效判题规则</h2><p>按课件与老师重点整理；现代实践补充另行标明</p></div><div class="qgrid">${rules.map(x=>`<article class="card" style="margin:0"><h3 style="margin:0 0 8px">${x[0]}</h3><div class="formula">${x[1]}</div><button class="small-button tinted" style="margin-top:13px" data-lesson="${x[2]}">查看精讲 ↗</button></article>`).join('')}</div>${chapters.slice(1).map(c=>`<div class="section-label"><h2>${c.number} · ${esc(c.name)}</h2><p>${c.topicIds.length} 个主题</p></div><div class="qgrid">${c.topicIds.map(id=>{let t=lessonMap.get(id);return `<article class="quick-card"><div class="qtag">${esc(c.name)} ${levelTag(priority(t))}</div><h3>${esc(t.title)}</h3><p>${esc(t.memory||t.points.slice(0,2).map(p=>p.text).join('；'))}</p><button data-lesson="${id}">完整精讲 ↗</button></article>`}).join('')}</div>`).join('')}`;
}
function getQuizItems(scope){return quizzes.map((q,i)=>({...q,key:i})).filter(q=>scope==='all'||q.chapter===Number(scope)||scope==='wrong'&&load('sd_sec_v1_wrong',[]).includes(q.key));}
function startQuiz(scope){quizState={scope,items:getQuizItems(scope),index:0,picks:{},completed:false};setView('quiz')}
function chooseQuiz(idx){const item=quizState.items[quizState.index];if(quizState.picks[item.key]!==undefined)return;quizState.picks[item.key]=idx;render()}
function nextQuiz(){quizState.index++;if(quizState.index>=quizState.items.length){quizState.completed=true;const errors=quizState.items.filter(q=>quizState.picks[q.key]!==q.answer).map(q=>q.key);let old=new Set(load('sd_sec_v1_wrong',[]));for(let q of quizState.items)old.delete(q.key);for(let k of errors)old.add(k);save('sd_sec_v1_wrong',[...old]);}render();el('contentShell').scrollTop=0}
function renderQuiz(){el('topTitle').textContent='安全性知识 · 随堂练习';if(!quizState.items.length&&!quizState.completed){quizState.items=getQuizItems(quizState.scope)}let qs=quizState.items,idx=quizState.index;
 let filters=`<div class="quiz-filter"><button data-quizscope="all" class="${quizState.scope==='all'?'chosen':''}">全章 · ${quizzes.length} 题</button>${chapters.slice(1).map(c=>`<button data-quizscope="${c.id}" class="${quizState.scope===String(c.id)?'chosen':''}">${c.number} ${esc(c.name)} · ${getQuizItems(String(c.id)).length} 题</button>`).join('')}<button data-quizscope="wrong" class="${quizState.scope==='wrong'?'chosen':''}">错题重练 · ${getQuizItems('wrong').length} 题</button></div>`;
 if(!qs.length)return `<div class="kicker">PRACTICE</div><h1 class="big-title">随堂练习</h1><p class="lede">本组暂无试题或尚未产生错题。选择其他章节继续练习。</p>${filters}`;
 if(quizState.completed){let score=qs.filter(q=>quizState.picks[q.key]===q.answer).length;return `<div class="kicker">PRACTICE RESULT</div><h1 class="big-title">练习完成</h1><div class="score-card"><div class="huge">${Math.round(score/qs.length*100)}<small style="font-size:20px">分</small></div><h2>${score} / ${qs.length} 题正确</h2><p>${qs.length-score===0?'这组知识点都答对了，可以去精讲中继续学习其他内容。':`有 ${qs.length-score} 道题答错，错题会保存在当前浏览器中，可以单独重练。`}</p><button class="small-button primary" data-quizscope="${quizState.scope}">再做一遍</button><button class="small-button" data-quizscope="wrong">重练错题</button><button class="small-button" data-view="quick">查看考前速记</button></div>${filters}`;}
 let q=qs[idx],pick=quizState.picks[q.key],answered=pick!==undefined,chapter=chapters[q.chapter];return `<div class="kicker">PRACTICE / SELF TEST</div><h1 class="big-title">随堂练习</h1><p class="lede" style="margin-bottom:11px">按课程内容编写的自测题（非历年真题原文），答题后立即展示正确答案和解析。</p>${filters}<div class="quiz-wrap"><div class="quiz-top"><span class="tiny">${esc(chapter.name)} · 第 ${idx+1} / ${qs.length} 题</span><div class="quiz-progress"><i style="width:${idx/qs.length*100}%"></i></div><b style="font-size:12px;color:#6e8192">${Math.round(idx/qs.length*100)}%</b></div><div class="quiz-card"><span class="pill">单选题</span><h2>${esc(q.question)}</h2><div class="options">${q.options.map((o,j)=>`<button class="option ${answered&&j===q.answer?'correct':''} ${answered&&pick===j&&j!==q.answer?'incorrect':''} ${answered&&pick===j?'selected':''}" data-option="${j}" ${answered?'disabled':''}><i>${'ABCD'[j]}.</i><span>${esc(o)}</span></button>`).join('')}</div>${answered?`<div class="explain"><strong>${pick===q.answer?'✓ 回答正确':'✕ 回答错误'} · 正确答案 ${'ABCD'[q.answer]}</strong><div style="margin-top:5px">${esc(q.explain)}</div><div style="margin-top:10px"><button class="small-button tinted" data-lesson="${q.topic}">返回对应知识点 ↗</button></div></div>`:''}<div class="quiz-bottom"><span class="tiny">请先选择一个答案</span><button class="small-button primary" data-nextquestion ${!answered?'disabled':''}>${idx===qs.length-1?'查看成绩':'下一题 →'}</button></div></div></div>`;}
function renderRail(){if(view!=='read')return '';let t=lessonMap.get(current),c=chapters[t.chapter];return `<div class="rail-card"><h3>本章目录 · ${c.number}</h3>${c.topicIds.map((id,i)=>`<button class="rail-topic ${id===current?'current':''}" data-lesson="${id}">${String(i+1).padStart(2,'0')} · ${esc(lessonMap.get(id).title)} ${mastery[id]===2?'✓':''}</button>`).join('')}<div class="rail-memory"><strong>本节一句话</strong><p>${esc(t.memory||t.points[0]?.text||'')}</p><div class="tiny">${esc(t.source)}</div></div></div>`}
function render(){renderSidebar();document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('on',b.dataset.tab===view));const main=el('mainContent');main.className='content '+(view==='read'?'reading':'');main.innerHTML=({home:renderHome,read:renderRead,map:renderMap,quick:renderQuick,quiz:renderQuiz}[view]||renderHome)();const shell=el('contentShell');shell.classList.toggle('withrail',view==='read');el('rightRail').innerHTML=renderRail()}
function openSearch(){el('searchOverlay').classList.remove('hidden');el('searchInput').focus();searchResults('')}
function closeSearch(){el('searchOverlay').classList.add('hidden')}
function searchResults(term){
 term=term.trim().toLowerCase();
 let hits=term?lessons.filter(t=>(t.title+' '+t.intro+' '+t.points.map(p=>p.text+' '+p.note).join(' ')).toLowerCase().includes(term)):lessons.filter(t=>t.chapter>0&&priority(t)==='must').slice(0,8);
 if(term)hits.sort((a,b)=>{const score=t=>{let name=t.title.toLowerCase();return name===term?0:name.startsWith(term)?1:name.includes(term)?2:3};return score(a)-score(b) || a.chapter-b.chapter || a.index-b.index});
 let n=hits.length;hits=hits.slice(0,25);
 el('searchResults').innerHTML=`<div class="tiny">${term?`匹配 ${n} 个知识主题`:'建议重点内容'}</div>`+hits.map(t=>`<button class="sr" data-searchlesson="${t.id}"><strong>${esc(t.title)}</strong><small>${esc(chapters[t.chapter].name)} · ${esc(t.intro.slice(0,66))}…</small></button>`).join('')+(hits.length?'':'<div class="tiny">没有匹配结果，试试其他关键词。</div>');
}
document.body.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;
 if(b.id==='focusToggle'){focusOnly=!focusOnly;save('sd_sec_v1_focus_only',focusOnly);renderSidebar();return}
 if(b.dataset.view){setView(b.dataset.view);return}
 if(b.dataset.tab){setView(b.dataset.tab);return}
 if(b.dataset.chapter!==undefined){let ci=+b.dataset.chapter;if(openedChap===ci){openedChap=-1;renderSidebar()}else{openedChap=ci;renderSidebar()}return}
 if(b.dataset.lesson){openLesson(b.dataset.lesson);return}
 if(b.dataset.master){markNext(b.dataset.master);return}
 if(b.dataset.mapchap!==undefined){let ci=+b.dataset.mapchap;mapOpen=mapOpen===ci?-1:ci;render();return}
 if(b.dataset.quizscope){startQuiz(b.dataset.quizscope);return}
 if(b.dataset.quiztopic){const t=lessonMap.get(b.dataset.quiztopic);quizState={scope:String(t.chapter),items:getQuizItems(String(t.chapter)),index:0,picks:{},completed:false};setView('quiz');return}
 if(b.dataset.option!==undefined){chooseQuiz(+b.dataset.option);return}
 if(b.hasAttribute('data-nextquestion')){nextQuiz();return}
 if(b.dataset.searchlesson){closeSearch();openLesson(b.dataset.searchlesson);return}
});
el('menuBtn').onclick=()=>{el('sidebar').classList.add('open');el('scrim').classList.add('open')};el('scrim').onclick=hideMobile;
function refreshThemeButton(){const dark=document.documentElement.dataset.theme==='dark',b=el('themeBtn');b.setAttribute('aria-pressed',String(dark));b.setAttribute('aria-label',dark?'切换为日间模式':'切换为夜间模式');b.title=dark?'切换为日间模式':'切换为夜间模式'}
el('themeBtn').onclick=()=>{const next=document.documentElement.dataset.theme==='dark'?'light':'dark';document.documentElement.dataset.theme=next;save('sd_sec_v1_theme',next);refreshThemeButton()};refreshThemeButton();
el('searchBtn').onclick=openSearch;el('searchClose').onclick=closeSearch;el('searchInput').oninput=e=>searchResults(e.target.value);
el('searchOverlay').addEventListener('click',e=>{if(e.target===el('searchOverlay'))closeSearch()});
window.addEventListener('keydown',e=>{if(e.key==='Escape'){closeSearch();hideMobile()}if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){e.preventDefault();openSearch()}});
render();
