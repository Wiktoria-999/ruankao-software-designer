.net-row{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:8px}.net-arrow{font-size:18px;color:var(--accent);font-weight:800}.net-cell{flex:1 1 120px;min-width:100px;max-width:300px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 13px;text-align:center;color:var(--ink)}.net-cell.highlight{background:var(--accent-bg);border-color:#a9c9e5}.net-cell b{display:block;font-size:13px;line-height:1.5}.net-cell small{display:block;font-size:11px;color:var(--muted);line-height:1.6;margin-top:6px}.net-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}.net-grid .net-cell{min-width:0;max-width:none}.net-layerstack{max-width:730px;margin:4px auto;display:grid;gap:6px}.net-layer{display:flex;align-items:center;justify-content:space-between;gap:18px;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:13px 17px;color:var(--ink)}.net-layer strong{font-size:13px;flex:0 0 135px}.net-layer span{font-size:12px;color:var(--muted);line-height:1.65}.net-layer.light{background:var(--accent-bg)}.net-tablewrap{overflow-x:auto}.net-note{text-align:center;font-size:12px;line-height:1.85;color:var(--muted);margin-top:14px}.net-bits{display:flex;align-items:center;gap:6px;max-width:760px;margin:12px auto;min-height:60px}.net-bitgroup{flex:1;background:var(--accent-bg);border:1px solid var(--line);text-align:center;padding:10px 5px;color:var(--ink);font-weight:800;border-radius:6px}.net-bitgroup small{display:block;font-size:10px;color:var(--muted);font-weight:400;margin-top:3px}.net-bithead,.net-bitpayload{background:var(--accent-bg);color:var(--ink);padding:14px 6px;text-align:center;border:1px solid var(--line);font-size:12px;border-radius:7px;font-weight:750}.net-bitpayload{background:#e5f6f1}.net-topologies{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.net-topologies>div{border:1px solid var(--line);border-radius:9px;padding:11px 9px;text-align:center \n/* 算法分析与设计：沿用前面章节的统一配色，专用图解统一变量与阅读尺度 */
.lang-row{display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:7px;margin:8px 0}
.lang-arrow{font-size:20px;font-weight:800;color:var(--accent);flex:none}

.lang-automaton{max-width:580px;margin:0 auto;color:var(--accent)}.lang-automaton svg{width:100%;height:auto;overflow:visible}.lang-state{fill:var(--panel);stroke:var(--accent);stroke-width:2}.lang-automaton text{fill:var(--ink)}

<script>
const DATA = {"chapters":[{"id":0,"number":"00","name":"本章考试定位","subtitle":"PDF 第2页；转写 10.1 / 10.2","topicIds":["0:0","0:1"]},{"id":1,"number":"01","name":"算法特性与渐进表示","subtitle":"PDF 第2～3页；转写 10.1","topicIds":["1:0","1:1","1:2","1:3","1:4"]},{"id":2,"number":"02","name":"时间复杂度分析","subtitle":"PDF 第3～4页；转写 10.1","topicIds":["2:0","2:1","2:2","2:3","2:4","2:5","2:6"]},{"id":3,"number":"03","name":"递归与递归复杂度","subtitle":"PDF 第4～5页；转写 10.1","topicIds":["3:0","3:1","3:2","3:3","3:4","3:5"]},{"id":4,"number":"04","name":"分治法","subtitle":"PDF 第6页；转写 10.1","topicIds":["4:0","4:1","4:2","4:3"]},{"id":5,"number":"05","name":"动态规划与 0-1 背包","subtitle":"PDF 第6～8、10页；转写 10.1 / 10.2","topicIds":["5:0","5:1","5:2","5:3","5:4","5:5","5:6"]},{"id":6,"number":"06","name":"贪心法与经典应用","subtitle":"PDF 第8～10页；转写 10.2","topicIds":["6:0","6:1","6:2","6:3","6:4","6:5","6:6"]},{"id":7,"number":"07","name":"回溯与其他算法策略","subtitle":"PDF 第9、11～12页；转写 10.2","topicIds":["7:0","7:1","7:2","7:3","7:4","7:5"]},{"id":8,"number":"08","name":"数据挖掘与智能优化","subtitle":"PDF 第12～14页；转写 10.2","topicIds":["8:0","8:1","8:2","8:3","8:4","8:5","8:6","8:7","8:8","8:9"]}],"lessons":[{"id":"0:0","chapter":0,"index":0,"title":"考试定位：核心算法设计思想","fullTitle":"考试定位：核心算法设计思想","intro":"老师在 10.1 开篇明确：算法分析与设计连接数据结构，内容不算特别多，但需要会分析具体案例，而不只是记名词。","points":[{"text":"重点掌握：算法时间复杂度的计算与判断。","note":"","priority":"must"},{"text":"重点掌握：递归的边界、递归式与时间复杂度。","note":"","priority":"must"},{"text":"重点掌握：分治法、动态规划法、贪心法、回溯法四种算法设计策略。","note":"","priority":"must"},{"text":"老师认为上午选择题和下午案例题都可能涉及上述四种思想。","note":"","priority":"frequent"},{"text":"其他算法如分支限界、概率、近似、数据挖掘、智能优化，老师定位为了解即可。","note":"","priority":"understand"}],"source":"PDF 第2页；转写 10.1 / 10.2","priority":"","visual":"road","memory":"算法基础两项：复杂度与递归；核心设计四法：分治、动态规划、贪心、回溯。"},{"id":"0:1","chapter":0,"index":1,"title":"本章复习策略与容易失分点","fullTitle":"本章复习策略与容易失分点","intro":"按照课件与视频讲解顺序复习；先掌握循环计数、递归展开与四种方法，再做背包和消防栓案例。","points":[{"text":"时间复杂度：不能只凭循环“层数”判断；先计算每层真实执行次数。","note":"","priority":"must"},{"text":"动态规划与贪心：同是优化思路，但一个要设计状态与转移，另一个按局部规则决策。","note":"","priority":"must"},{"text":"0-1 背包：整件选或不选；可分背包：可以只取部分物品。","note":"","priority":"must"},{"text":"题目只问算法策略时，先抓“分解/保存重叠子问题/不可撤销的局部选择/搜索后退”等关键词。","note":"","priority":"frequent"},{"text":"老师建议对难题适度取舍，但基础例题至少独立练习一次。","note":"","priority":"understand"},{"text":"本网页自测题为依据资料重新编写的复习题，不冒充原版真题。","note":"","priority":""}],"source":"PDF 第2页；转写 10.1 / 10.2","priority":"","visual":"road","memory":"先看原理 → 用示例推演 → 自己做题 → 根据错题回到精讲。"},{"id":"1:0","chapter":1,"index":0,"title":"算法定义与五个特性","fullTitle":"算法定义与五个特性","intro":"课件第 2 页概括：算法是描述求解特定问题步骤的有限指令序列，具有五项基本特性。","points":[{"text":"有穷性：执行必须在有限步骤后终止。","note":"","priority":"frequent"},{"text":"确定性：每一步指令含义明确、没有歧义。","note":"","priority":"frequent"},{"text":"可行性：每个操作是可以有效执行的。","note":"","priority":"frequent"},{"text":"输入：可以有 0 个或多个输入。","note":"","priority":"frequent"},{"text":"输出：必须有 1 个或多个输出。","note":"","priority":"frequent"},{"text":"老师要求本节稍微看一看，掌握“五个特性”基本名称即可。","note":"","priority":"understand"}],"source":"PDF 第2～3页；转写 10.1","priority":"","visual":"traits","memory":"五性：有穷、确定、可行、输入、输出；输入可为 0，输出至少 1。"},{"id":"1:1","chapter":1,"index":1,"title":"时间复杂度 vs 空间复杂度","fullTitle":"时间复杂度 vs 空间复杂度","intro":"时间复杂度描述基本操作次数如何随规模 n 增长，空间复杂度描述额外空间需求的增长。","points":[{"text":"时间复杂度 T(n)：以基本操作执行次数作为衡量，关注随输入规模的增长趋势。","note":"","priority":"must"},{"text":"空间复杂度 S(n)：关注算法占用的额外存储空间与 n 的关系。","note":"","priority":"frequent"},{"text":"输入规模相同，数据分布不同也可能使运行次数不同，例如快速排序的不同情形。","note":"","priority":"frequent"},{"text":"复杂度通常谈最好、最坏、平均三类情形，需看题目给定条件。","note":"","priority":"frequent"},{"text":"不能仅用“在某台电脑上跑了几毫秒”来代表渐进复杂度。","note":"","priority":""}],"source":"PDF 第2～3页；转写 10.1","priority":"must","visual":"time-space","memory":"时间看操作次数，空间看额外存储；题目可能注明最好/最坏/平均。"},{"id":"1:2","chapter":1,"index":2,"title":"大 O、Ω 与 Θ：上界、下界与紧界","fullTitle":"大 O、Ω 与 Θ：上界、下界与紧界","intro":"老师认为重点在 O 记号；PDF 第 3 页配有三种渐进符号的图示，应知道它们与增长界的关系。","points":[{"text":"O(g(n))：渐进上界；充分大 n 时 f(n) 不超过某个常数倍 g(n)。","note":"","priority":"must"},{"text":"Ω(g(n))：渐进下界；充分大 n 时 f(n) 不小于某个正的常数倍 g(n)。","note":"","priority":"understand"},{"text":"Θ(g(n))：渐进紧界；同时具有相同级别的上界与下界。","note":"","priority":"understand"},{"text":"课程提到考试最常用的是大 O，Ω 和 Θ 主要理解概念。","note":"","priority":"frequent"},{"text":"注意 O(n²) 可以作为 O(n) 算法的宽松上界（n 足够大时）；“准确阶”通常用 Θ。","note":"","priority":""}],"source":"PDF 第2～3页；转写 10.1","priority":"frequent","visual":"bounds","memory":"大 O 是上界、Ω 是下界、Θ 上下同阶。"},{"id":"1:3","chapter":1,"index":3,"title":"多项式复杂度：只保留最高阶","fullTitle":"多项式复杂度：只保留最高阶","intro":"课程先用 an²+bn+c 示例解释渐进记法：删除低阶项与非零常数系数。","points":[{"text":"例如 T(n)=3n²+7n+12，则 T(n)=Θ(n²)，也有 O(n²)。","note":"","priority":"must"},{"text":"常数因子不改变复杂度等级：O(2n)=O(n)。","note":"","priority":"must"},{"text":"多项式只看最高阶项，例如 5n³+8n²+n → O(n³)。","note":"","priority":"frequent"},{"text":"默认 n 趋于充分大；这不等于实际运行中常数因子永远不重要。","note":"","priority":"frequent"}],"source":"PDF 第2～3页；转写 10.1","priority":"must","visual":"dominant","memory":"保留最高增长项、忽略常数系数。"},{"id":"1:4","chapter":1,"index":4,"title":"常用增长阶排序","fullTitle":"常用增长阶排序","intro":"判断两段代码谁增长更快时，先识别数量级，再考虑题目是否问“最坏情况”。","points":[{"text":"通常增长阶：O(1) < O(log n) < O(n) < O(n log n) < O(n²) < O(n³) < O(2ⁿ) < O(n!)。","note":"","priority":"must"},{"text":"折半查找 O(log n)，顺序查找最坏 O(n)（举例）。","note":"","priority":"frequent"},{"text":"归并排序 O(n log n)，经典双重嵌套循环 O(n²)（举例）。","note":"","priority":"frequent"},{"text":"快速排序常见平均 O(n log n)，最坏 O(n²)，不能只看“用到了分治”就判断 O(log n)。","note":"","priority":"frequent"}],"source":"PDF 第2～3页；转写 10.1","priority":"must","visual":"growth","memory":"1、log n、n、nlogn、n²、n³、2ⁿ、n!，按规模上升。"},{"id":"2:0","chapter":2,"index":0,"title":"常数阶 O(1)：计算次数不随 n 变化","fullTitle":"常数阶 O(1)：计算次数不随 n 变化","intro":"对应 PDF 第 4 页第一种代码；只有固定数量的简单运算，通常为常数阶。","points":[{"text":"若程序只有固定次算术、赋值、输出，操作次数不随 n 变化，为 O(1)。","note":"","priority":"must"},{"text":"例如 sum=(1+n)*n/2；单纯按公式算前 n 项之和，不循环 n 次。","note":"","priority":"frequent"},{"text":"切勿仅凭代码行数多少来判定，关键是是否随输入规模变化。","note":"","priority":"frequent"}],"source":"PDF 第3～4页；转写 10.1","priority":"","visual":"basic-loops","memory":"固定步骤 = O(1)。"},{"id":"2:1","chapter":2,"index":1,"title":"单层线性循环 O(n)","fullTitle":"单层线性循环 O(n)","intro":"循环变量每次增加一个固定量，从 0 到 n−1，则循环次数与 n 成正比。","points":[{"text":"for(i=0;i<n;i++) 共执行 n 次（循环体为 O(1) 时）。","note":"","priority":"must"},{"text":"如果每次加 2，执行次数约 n/2，仍为 O(n)。","note":"","priority":"frequent"},{"text":"非嵌套的两个 O(n) 循环：O(n)+O(n)=O(n)。","note":"","priority":"frequent"}],"source":"PDF 第3～4页；转写 10.1","priority":"must","visual":"basic-loops","memory":"从 0 到 n，一次加常数，通常 O(n)。"},{"id":"2:2","chapter":2,"index":2,"title":"对数阶 O(log n)：倍增或折半","fullTitle":"对数阶 O(log n)：倍增或折半","intro":"PDF 第 4 页给出 count=count*2 的 while 循环；每轮乘固定倍数使次数对数增长。","points":[{"text":"count=1；while(count<n) count*=2：执行 Θ(log₂ n) 次。","note":"","priority":"must"},{"text":"每轮 n/=2 或二分缩小搜索区间，同类为 O(log n)。","note":"","priority":"frequent"},{"text":"换成每轮 ×3，仍为 O(log n)，对数底数常不写。","note":"","priority":"frequent"},{"text":"n=17 时循环依次以 1、2、4、8、16 为起值，实际执行 5 次（注意课堂口述近似）。","note":"","priority":"frequent"}],"source":"PDF 第3～4页；转写 10.1","priority":"must","visual":"halving","memory":"成倍变化 → log n；变量一次加常数 → n。"},{"id":"2:3","chapter":2,"index":3,"title":"双重嵌套循环 O(n²)","fullTitle":"双重嵌套循环 O(n²)","intro":"外层 n 次、内层每轮 n 次，累计执行 n×n 次。","points":[{"text":"for(i=0;i<n;i++) for(j=0;j<n;j++)：内层共 n² 次。","note":"","priority":"must"},{"text":"两个独立顺序循环不是嵌套，应相加，仍为 O(n)。","note":"","priority":"frequent"},{"text":"3 层全部 n 次的嵌套循环通常为 O(n³)。","note":"","priority":"frequent"}],"source":"PDF 第3～4页；转写 10.1","priority":"must","visual":"nested","memory":"嵌套相乘，前后相加。"},{"id":"2:4","chapter":2,"index":4,"title":"三角形循环 j=i：仍然 O(n²)","fullTitle":"三角形循环 j=i：仍然 O(n²)","intro":"老师专门讲这段代码：第二层不是每次完整循环 n 次，而是逐渐缩短。","points":[{"text":"for(i=0;i<n;i++) for(j=i;j<n;j++)，内层次数分别为 n,n−1,…,1。","note":"","priority":"must"},{"text":"总次数 n+(n−1)+…+1=n(n+1)/2，仍为 Θ(n²)。","note":"","priority":"must"},{"text":"可用代入特殊 i 的办法，先确定每层次数，再求总和。","note":"","priority":"frequent"}],"source":"PDF 第3～4页；转写 10.1","priority":"must","visual":"triangle","memory":"j 从 i 开始：n+n−1+…+1 = n(n+1)/2 → O(n²)。","examples":[{"title":"三角形双重循环","given":"i 从 0 到 n−1，j 从 i 到 n−1","steps":["i=0：j 执行 n 次。","i=1：j 执行 n−1 次。","… i=n−1：j 执行 1 次。","求和 n(n+1)/2，最高阶 n²。"],"answer":"时间复杂度 Θ(n²)。"}]},{"id":"2:5","chapter":2,"index":5,"title":"混合嵌套 O(n log n)","fullTitle":"混合嵌套 O(n log n)","intro":"两重循环不必然是平方阶。内层如果每次翻倍，执行次数只有 log n。","points":[{"text":"外层 i 从 0 到 n−1；内层 j 从 1 每次翻倍到 n → Θ(n log n)。","note":"","priority":"must"},{"text":"先算每一层真实次数：n×log n，而不是看见“两层”就套 n²。","note":"","priority":"frequent"},{"text":"若两个循环先后执行，一个 O(n) 一个 O(log n)，合计为 O(n)。","note":"","priority":"frequent"}],"source":"PDF 第3～4页；转写 10.1","priority":"must","visual":"mixed","memory":"外层 n、内层 log n：嵌套 O(nlogn)，顺序 O(n)。"},{"id":"2:6","chapter":2,"index":6,"title":"代码复杂度判题四步","fullTitle":"代码复杂度判题四步","intro":"对应本章老师最强调的能力：读循环边界、计算次数、建立求和式、取最高阶。","points":[{"text":"① 确定输入规模变量 n 和循环终止条件。","note":"","priority":"must"},{"text":"② 识别迭代方式：+1、×2、j=i、递归调用。","note":"","priority":"must"},{"text":"③ 若有嵌套，按每次外循环求内循环次数并累加。","note":"","priority":"must"},{"text":"④ 消掉常数与低阶项，给出 O 或 Θ 阶。","note":"","priority":"must"},{"text":"对不确定的代码先列 n=4、n=8 的计数表验证，不要先猜答案。","note":"","priority":"frequent"}],"source":"PDF 第3～4页；转写 10.1","priority":"must","visual":"analysis-flow","memory":"读边界 → 算次数 → 求和/相乘 → 留最高阶。"},{"id":"3:0","chapter":3,"index":0,"title":"递归：直接/间接调用自己","fullTitle":"递归：直接/间接调用自己","intro":"递归是函数直接或经其他函数调用自身，用更小的问题求解原问题。","points":[{"text":"递归的两个基本要素：边界条件（退出条件）与递归关系（递归体）。","note":"","priority":"must"},{"text":"直接递归：f() 调用 f()；间接递归：f() 调用 g()，g() 再调用 f()。","note":"","priority":"frequent"},{"text":"没有能达到的终止条件，可能发生无限递归。","note":"","priority":"frequent"},{"text":"递归经常与分治一起使用，例如快速排序或归并排序。","note":"","priority":"frequent"}],"source":"PDF 第4～5页；转写 10.1","priority":"must","visual":"recursion","memory":"递归两个条件：出口＋递归关系。"},{"id":"3:1","chapter":3,"index":1,"title":"阶乘递归：逐层调用与返回","fullTitle":"阶乘递归：逐层调用与返回","intro":"课件第 4 页提供阶乘示例，教师用它说明递归内藏重复调用，不可只数代码行。","points":[{"text":"0!=1 是边界条件。","note":"","priority":"must"},{"text":"n!=n×(n−1)!（n>0）是递归关系。","note":"","priority":"must"},{"text":"求 4!：4×3!→4×3×2!→4×3×2×1!→24。","note":"","priority":"frequent"},{"text":"这一直接递归实现调用 n 层左右，时间复杂度 O(n)，调用栈空间 O(n)。","note":"","priority":"frequent"}],"source":"PDF 第4～5页；转写 10.1","priority":"must","visual":"factorial","memory":"n! = n × (n−1)!，0!=1；时间/栈空间都是 O(n)。"},{"id":"3:2","chapter":3,"index":2,"title":"递归时间分析：迭代展开法","fullTitle":"递归时间分析：迭代展开法","intro":"课程不要求熟练掌握递归树、主定理等全部技巧，优先练习把递推式代入展开。","points":[{"text":"令 T(n)=T(n−1)+n，继续代 T(n−1)=T(n−2)+(n−1)。","note":"","priority":"must"},{"text":"展开可得 T(n)=T(1)+2+3+…+n=Θ(n²)（给定 T(1)=1）。","note":"","priority":"must"},{"text":"从递归式展开到边界条件，观察次数与每层代价，再求和。","note":"","priority":"frequent"},{"text":"不要把 T(n)=T(n−1) 误写为 Θ(n²)：如果每次无额外 +n，则需要按真正的式子判断。","note":"","priority":"frequent"}],"source":"PDF 第4～5页；转写 10.1","priority":"must","visual":"rec-expand","memory":"展开代入，找各层开销，累计求和。","examples":[{"title":"递推式展开","given":"T(n)=T(n−1)+n；T(1)=1","steps":["T(n)=T(n−2)+(n−1)+n。","继续展开得 T(1)+2+3+…+n。","和为 n(n+1)/2，主导项 n²。"],"answer":"T(n)=Θ(n²)。"}],"notice":"老师在 10.1 特别指出：部分教材例题把 T(n)=T(n−1)+n 中的“+n”漏写了；知识库按他解释的正确递推式展示。"},{"id":"3:3","chapter":3,"index":3,"title":"T(n)=8T(n/2)+n² 的增长阶","fullTitle":"T(n)=8T(n/2)+n² 的增长阶","intro":"PDF 第 5 页配有旧题，老师通过多次展开说明它不是 n²，而是 n³ 量级。","points":[{"text":"展开一次：T(n)=8T(n/2)+n²。","note":"","priority":"must"},{"text":"展开两次：T(n)=8²T(n/4)+3n²（第二层新贡献 2n²）。","note":"","priority":"must"},{"text":"第 k 层约有 8ᵏ 个子问题，规模 n/2ᵏ，层工作量 n²×2ᵏ。","note":"","priority":"must"},{"text":"深度 log₂n，累加后得到 Θ(n³)（假定常数规模的基本情形）。","note":"","priority":"must"},{"text":"主定理也能得到相同结论：n^{log₂8}=n³ 大于 n²。","note":"","priority":"frequent"}],"source":"PDF 第4～5页；转写 10.1","priority":"must","visual":"rec-8","memory":"8 个 n/2 规模子问题：总阶数 n³，不能错当 n²。"},{"id":"3:4","chapter":3,"index":4,"title":"课件比较题：X 最大整数为 63","fullTitle":"课件比较题：X 最大整数为 63","intro":"PDF 第 5 页题目把 T_A(n)=8T_A(n/2)+n² 与 T_B(n)=X T_B(n/4)+n² 进行大规模增长速度比较。","points":[{"text":"算法 A：T_A(n)=Θ(n³)。","note":"","priority":"frequent"},{"text":"B 递归项决定的临界系数：X=4³=64。","note":"","priority":"frequent"},{"text":"若 X<64，B 的渐进增长阶严格小于 n³（例如 16<X<64 时约为 n^{log₄X}），可比 A 快。","note":"","priority":"frequent"},{"text":"X=64 时，B 的阶为 Θ(n³ log n)，不比 A 快。","note":"","priority":"frequent"},{"text":"因此整数 X 的最大值为 63。","note":"","priority":"frequent"},{"text":"教师用代入方式得到 63；这里添加较严格的边界说明，帮助避免把“等于 64”误当成相同速度。","note":"","priority":"frequent"}],"source":"PDF 第4～5页；转写 10.1","priority":"frequent","visual":"rec-compare","memory":"比较 T_A=8T(n/2)+n² 与 T_B=X T(n/4)+n²：X 最大 63。","examples":[{"title":"递归比较：求 X 上限","given":"A：8T(n/2)+n²；B：X T(n/4)+n²。要求 B 渐进快于 A","steps":["A 的临界幂次 log₂8=3，故 A=Θ(n³)。","B 若 X>16，递归项主导时阶为 n^{log₄X}。","要指数低于 3，则 log₄X<3，即 X<64。","X=64 临界时会多出 log n 因子，故不能取 64。"],"answer":"最大整数 X=63。"}]},{"id":"3:5","chapter":3,"index":5,"title":"递归式的边界与推导陷阱","fullTitle":"递归式的边界与推导陷阱","intro":"课程强调递归展开是理解算法运行的工具，不能把“递归”直接等同于“指数复杂度”。","points":[{"text":"单分支递归如阶乘通常 O(n)，不一定指数。","note":"","priority":"must"},{"text":"多分支递归要看子问题个数、规模缩小比例与合并代价。","note":"","priority":"must"},{"text":"T(n)=2T(n/2)+O(n) 是经典归并排序级别 O(nlogn)。","note":"","priority":"frequent"},{"text":"只有题目给出完整递推式与合理边界，才能严格确定复杂度。","note":"","priority":"frequent"},{"text":"主定理属扩展理解，老师明确说此阶段不要求系统掌握。","note":"","priority":"understand"}],"source":"PDF 第4～5页；转写 10.1","priority":"","visual":"recursion","memory":"递归 ≠ 必定指数，关键看分支数、缩小比与每层工作。"},{"id":"4:0","chapter":4,"index":0,"title":"分治法的思想与适用条件","fullTitle":"分治法的思想与适用条件","intro":"课件第 6 页强调将大问题拆成若干更小的、同类的子问题，并分别求解。","points":[{"text":"分治：把一个规模为 n 的问题拆成较小且结构相同的子问题。","note":"","priority":"must"},{"text":"经典教学情形：子问题相互独立，适合用递归独立求解。","note":"","priority":"frequent"},{"text":"三步：分解 Divide → 求解 Conquer → 合并 Combine。","note":"","priority":"must"},{"text":"典型例子：归并排序、快速排序、折半查找（常被用来理解分治）。","note":"","priority":"frequent"}],"source":"PDF 第6页；转写 10.1","priority":"must","visual":"divide","memory":"分而治之：分解、求解、合并。"},{"id":"4:1","chapter":4,"index":1,"title":"归并排序：分治的完整示例","fullTitle":"归并排序：分治的完整示例","intro":"归并排序把数组不断二分，递归排好两个子数组，再线性合并。","points":[{"text":"分解：把长度 n 的序列拆成两部分。","note":"","priority":"must"},{"text":"求解：递归分别排序两个子序列。","note":"","priority":"must"},{"text":"合并：按大小顺序归并，合并工作 O(n)。","note":"","priority":"must"},{"text":"典型递推 T(n)=2T(n/2)+O(n)，总时间 O(nlogn)。","note":"","priority":"frequent"},{"text":"分治拆成两半并不意味着总复杂度 O(logn)，还必须考虑每层合并。","note":"","priority":"frequent"}],"source":"PDF 第6页；转写 10.1","priority":"must","visual":"merge","memory":"归并：分两半、分别排序、线性合并 → O(nlogn)。"},{"id":"4:2","chapter":4,"index":2,"title":"快速排序与折半查找的区别","fullTitle":"快速排序与折半查找的区别","intro":"两者都能体现缩小子问题的思想，但在总工作量与最坏情况上不同。","points":[{"text":"折半查找：在有序数据上每轮排除一半，典型时间 O(logn)。","note":"","priority":"frequent"},{"text":"快速排序：按枢轴划分并对左右部分排序，平均 O(nlogn)，最坏 O(n²)。","note":"","priority":"frequent"},{"text":"一轮划分仍需扫描/比较元素，不能仅按树高估计整个排序时间。","note":"","priority":"frequent"},{"text":"理解算法的具体工作，才能判断复杂度。","note":"","priority":""}],"source":"PDF 第6页；转写 10.1","priority":"","visual":"divide-vs","memory":"折半查找 O(logn)；快排平均 O(nlogn)、最坏 O(n²)。"},{"id":"4:3","chapter":4,"index":3,"title":"分治与动态规划的核心对照","fullTitle":"分治与动态规划的核心对照","intro":"老师强调这两种方法都可“拆问题”，但动态规划特别重视重叠子问题和保存结果。","points":[{"text":"分治：把问题拆成可相对独立求解的子问题，然后合并。","note":"","priority":"must"},{"text":"动态规划：存在重叠子问题，避免重复计算并用状态表达最优值。","note":"","priority":"must"},{"text":"分治可递归实现；动态规划可自顶向下记忆化或自底向上填表。","note":"","priority":"frequent"},{"text":"并非所有分治子问题严格独立，也不是所有动态规划都必须为优化问题；按老师教学模型区分。","note":"","priority":"frequent"}],"source":"PDF 第6页；转写 10.1","priority":"must","visual":"compare4","memory":"分治拆独立同类子问题；DP 重叠子问题，保存已经求得的状态。"},{"id":"5:0","chapter":5,"index":0,"title":"动态规划法：最优子结构与重叠子问题","fullTitle":"动态规划法：最优子结构与重叠子问题","intro":"这一节是老师反复强调的经典设计思想；可以把重复问题的最优值保存在表格里。","points":[{"text":"最优子结构：整体最优解可以由若干子问题最优解构成。","note":"","priority":"must"},{"text":"重叠子问题：求解过程中重复碰到相同子问题。","note":"","priority":"must"},{"text":"保存子问题结果，可避免重复计算：记忆化或表格填充。","note":"","priority":"must"},{"text":"课程强调用于最优化问题，结合实际状态与转移才可判断。","note":"","priority":"frequent"},{"text":"不是“只要叫动态规划就一定能解所有优化问题”，需要有效的状态模型。","note":"","priority":"frequent"}],"source":"PDF 第6～8、10页；转写 10.1 / 10.2","priority":"must","visual":"dp-core","memory":"DP 两性：最优子结构 + 重叠子问题；用表避免重复算。"},{"id":"5:1","chapter":5,"index":1,"title":"动态规划设计的四个步骤","fullTitle":"动态规划设计的四个步骤","intro":"PDF 第 7 页列四步，老师说“了解步骤即可”，但应理解每步的角色。","points":[{"text":"① 描述最优解结构与状态。","note":"","priority":"frequent"},{"text":"② 递归定义最优值，写状态转移公式。","note":"","priority":"frequent"},{"text":"③ 通常自底向上计算最优值（也可记忆化递归）。","note":"","priority":"frequent"},{"text":"④ 由结果表追踪并构造具体解。","note":"","priority":"frequent"},{"text":"需要重点理解的是状态定义与转移，不必机械默写四步。","note":"","priority":""}],"source":"PDF 第6～8、10页；转写 10.1 / 10.2","priority":"","visual":"dp-steps","memory":"定义状态 → 写转移 → 算表 → 还原方案。"},{"id":"5:2","chapter":5,"index":2,"title":"0-1 背包：选或不选，不可拆分","fullTitle":"0-1 背包：选或不选，不可拆分","intro":"PDF 第 7～8 页详细介绍背包容量 W 下若干物品的最优价值，xi 只能是 0 或 1。","points":[{"text":"每件物品要么整个选入（xi=1），要么不选（xi=0）。","note":"","priority":"must"},{"text":"约束：所选物品总重量 ≤ W；目标：总价值尽量大。","note":"","priority":"must"},{"text":"可行解不必然最优；如课件容量 W=17，选 {1,2,5} 得价值 22，选 {4,5} 得价值 24。","note":"","priority":"frequent"},{"text":"若物品价值、重量均为整数，最终总价值是所选物品价值之和，不应出现“取 1/3 件”的结果。","note":"","priority":"frequent"}],"source":"PDF 第6～8、10页；转写 10.1 / 10.2","priority":"must","visual":"knapsack-concept","memory":"0-1 背包：xi∈{0,1}，先检查容量约束再比价值。"},{"id":"5:3","chapter":5,"index":3,"title":"0-1 背包 DP 状态与转移公式","fullTitle":"0-1 背包 DP 状态与转移公式","intro":"老师认为案例填空会考 c(i,w) 的含义、选与不选对应的两种状态。","points":[{"text":"定义 c[i,w]：只考虑前 i 件物品、容量为 w 时可取得的最大总价值。","note":"","priority":"must"},{"text":"当 i=0 或 w=0，c[i,w]=0。","note":"","priority":"must"},{"text":"若第 i 件重量 wi>w：c[i,w]=c[i−1,w]（装不下，不选）。","note":"","priority":"must"},{"text":"否则 c[i,w]=max(c[i−1,w], c[i−1,w−wi]+vi)。","note":"","priority":"must"},{"text":"两个候选值分别代表“不选当前物品”和“选当前物品”。","note":"","priority":"frequent"}],"source":"PDF 第6～8、10页；转写 10.1 / 10.2","priority":"must","visual":"dp-formula","memory":"装不下沿用上一行；装得下取 max(不选,选入)。"},{"id":"5:4","chapter":5,"index":4,"title":"课件真题：五件 0-1 背包的最优价值","fullTitle":"课件真题：五件 0-1 背包的最优价值","intro":"PDF 第 10 页给出 n=5、W=10 的实际算例，本页内置可以逐行填表的 DP 模拟器。","points":[{"text":"重量 w={2,2,6,5,4}；价值 v={6,3,5,4,6}；容量 W=10。","note":"","priority":"must"},{"text":"最优可选第 1、2、5 件，重量 2+2+4=8，价值 6+3+6=15。","note":"","priority":"must"},{"text":"课件给出的 0-1 背包最优价值为 15。","note":"","priority":"must"},{"text":"自底向上填 c[i,w] 表计算，时间复杂度 O(nW)，W 是数值容量。","note":"","priority":"frequent"},{"text":"O(nW) 是伪多项式界，非对输入比特长度严格多项式的保证。","note":"","priority":"frequent"}],"source":"PDF 第6～8、10页；转写 10.1 / 10.2","priority":"must","visual":"dp-interactive","memory":"五件、容量10：0-1 最优 15（1、2、5）；DP 时间 O(nW)。","examples":[{"title":"用 DP 表求 0-1 背包","given":"W=10，重量(2,2,6,5,4)，价值(6,3,5,4,6)","steps":["用 c[i,w] 表示“前 i 件，容量 w”的最优价值。","每行逐个判断当前物品选或不选。","填完第 5 行，得到 c[5,10]=15。","按表反向回溯，可找到物品 1、2、5。"],"answer":"最优价值 15；一个最优方案为选 1、2、5。"}]},{"id":"5:5","chapter":5,"index":5,"title":"背包动态规划 O(nW) 与状态表理解","fullTitle":"背包动态规划 O(nW) 与状态表理解","intro":"做题不只是死记 O(nW)，要知道需要填充多少个状态。","points":[{"text":"n 件物品、容量为 0…W，表共有约 n×W 个需要计算的状态。","note":"","priority":"must"},{"text":"每个状态只需要比较常数个候选值，所以时间 O(nW)。","note":"","priority":"frequent"},{"text":"若保存完整二维表，需要 O(nW) 空间；滚动数组可节省到 O(W)。","note":"","priority":"frequent"},{"text":"容量 W 若非常大，状态表也会变大；不要把它误称为 O(nlogW)。","note":"","priority":"frequent"}],"source":"PDF 第6～8、10页；转写 10.1 / 10.2","priority":"must","visual":"dp-formula","memory":"DP 背包计算 n×W 个格子：O(nW)。"},{"id":"5:6","chapter":5,"index":6,"title":"DP 与贪心最重要的分界线","fullTitle":"DP 与贪心最重要的分界线","intro":"老师提示两者都常用于优化，但“每步选局部最优”并不总是通向全局最优。","points":[{"text":"DP：以状态值比较所有可行的关键决策，保留能导出最优值的信息。","note":"","priority":"must"},{"text":"贪心：每一步按局部准则做决定，通常不回头修改。","note":"","priority":"must"},{"text":"最优子结构对两者都可能成立，仅此不足以选出贪心算法。","note":"","priority":"frequent"},{"text":"0-1 背包一般不能简单按价值密度贪心；可分背包则可以（正重量、可按比例拆分）。","note":"","priority":"frequent"}],"source":"PDF 第6～8、10页；转写 10.1 / 10.2","priority":"must","visual":"dp-greedy","memory":"0-1：DP 选或不选；可分：按价值密度贪心。"},{"id":"6:0","chapter":6,"index":0,"title":"贪心法：局部最优选择策略","fullTitle":"贪心法：局部最优选择策略","intro":"贪心根据当前已知信息选出看起来最好的下一步，不撤销决策；要保证全局最优需证明贪心选择性质。","points":[{"text":"贪心在每一步仅做当前局部最优选择，通常不再修改此前决定。","note":"","priority":"must"},{"text":"不是所有优化问题都能通过贪心得到全局最优。","note":"","priority":"must"},{"text":"若问题具有贪心选择性质和最优子结构，且选择规则正确，贪心可得到最优解。","note":"","priority":"frequent"},{"text":"局部看最优并不等于全局必最优，老师将此作为 DP 与贪心的基本对比。","note":"","priority":"frequent"}],"source":"PDF 第8～10页；转写 10.2","priority":"must","visual":"dp-greedy","memory":"贪心：只看当前最优，不回头；能否全局最优须证明。"},{"id":"6:1","chapter":6,"index":1,"title":"可分背包：可以只取物品的一部分","fullTitle":"可分背包：可以只取物品的一部分","intro":"课件第 9～10 页把普通（可分）背包与 0-1 背包对照；这两个模型的关键在物品能否拆分。","points":[{"text":"0-1 背包：xi∈{0,1}；可分背包：0≤xi≤1。","note":"","priority":"must"},{"text":"可分背包可在容量不足时取最后一个物品的部分重量。","note":"","priority":"must"},{"text":"单位重量价值 ri=vi/wi（密度）。","note":"","priority":"must"},{"text":"对正重量、价值线性按比例的可分背包，按 ri 从大到小装入可得最优值。","note":"","priority":"must"}],"source":"PDF 第8～10页；转写 10.2","priority":"must","visual":"fractional","memory":"可分背包：排序 vi/wi，高密度先装，末件可取一部分。"},{"id":"6:2","chapter":6,"index":2,"title":"三种贪心标准：为何选价值密度","fullTitle":"三种贪心标准：为何选价值密度","intro":"老师提出“价值最大、重量最小、单位价值最大”三种选法，让学员判断最优贪心准则。","points":[{"text":"按总价值最大先选：可能浪费容量，未必最优。","note":"","priority":"frequent"},{"text":"按重量最小先选：只顾重量，未必最优。","note":"","priority":"frequent"},{"text":"按单位重量价值 vi/wi 最高先选：可分背包的正确贪心规则。","note":"","priority":"must"},{"text":"先排序，再依次放入；剩余容量不足时取当前物品的一部分。","note":"","priority":"must"}],"source":"PDF 第8～10页；转写 10.2","priority":"must","visual":"greedy-density","memory":"价值/重量 = 密度；可分背包按密度从高到低。"},{"id":"6:3","chapter":6,"index":3,"title":"课件背包真题：可分最优为 16.67","fullTitle":"课件背包真题：可分最优为 16.67","intro":"课件第 10 页使用与 0-1 背包相同的 5 件物品：区别在于最后能装第 3 件的 1/3。","points":[{"text":"物品 1：6/2=3；物品 2：3/2=1.5；物品 5：6/4=1.5。","note":"","priority":"must"},{"text":"先取 1、2、5，重量 8，价值 15；剩余容量 2。","note":"","priority":"must"},{"text":"物品 3 密度 5/6≈0.833，高于物品 4 的 4/5=0.8。","note":"","priority":"must"},{"text":"取物品 3 的 2/6=1/3，增加价值 5/3≈1.67。","note":"","priority":"must"},{"text":"最终价值 15+5/3=50/3≈16.67；排序用归并排序则总时间 O(nlogn)。","note":"","priority":"must"}],"source":"PDF 第8～10页；转写 10.2","priority":"must","visual":"fractional-interactive","memory":"相同输入：0-1 最优 15，可分最优 16.67；选择 1、2、5、1/3 个3。","examples":[{"title":"可分背包按密度贪心","given":"W=10，w=[2,2,6,5,4]；v=[6,3,5,4,6]","steps":["密度 1:3，2:1.5，5:1.5，3:5/6，4:4/5。","装入 1、2、5，已用容量 8，价值 15。","剩余容量 2，取第 3 件 2/6。","增加价值 2×5/6=5/3。"],"answer":"最优价值 50/3≈16.67。"}]},{"id":"6:4","chapter":6,"index":4,"title":"消防栓贪心：最左未覆盖房屋开始","fullTitle":"消防栓贪心：最左未覆盖房屋开始","intro":"PDF 第 10 页的案例：沿道路每个消防栓覆盖固定半径，求覆盖所有房屋的最少消防栓。","points":[{"text":"从左边第一栋未被覆盖房屋 x 出发，在 x+20 处设置消防栓。","note":"","priority":"must"},{"text":"该消防栓覆盖区间 [x, x+40]，删除/跳过范围内所有房屋。","note":"","priority":"must"},{"text":"继续从下一栋最左未覆盖房屋重复，直到全部覆盖。","note":"","priority":"must"},{"text":"课件半径为 20 米，房屋已按坐标排序，单次扫描的算法时间 O(n)。","note":"","priority":"frequent"},{"text":"若原始房屋坐标无序，先排序通常还需 O(nlogn)，课件未要求计入。","note":"","priority":"frequent"}],"source":"PDF 第8～10页；转写 10.2","priority":"must","visual":"hydrants","memory":"最左未覆盖位置 x，栓放 x+20；可覆盖 [x,x+40]。"},{"id":"6:5","chapter":6,"index":5,"title":"消防栓真题：10 栋房屋求 5 个消防栓","fullTitle":"消防栓真题：10 栋房屋求 5 个消防栓","intro":"课件第 10 页提供了完整的房屋坐标和答案，内置逐步放置模拟器。","points":[{"text":"10 栋房屋坐标：10、20、30、35、60、80、160、210、260、300（米）。","note":"","priority":"must"},{"text":"半径 20：从 x=10 放在 30，覆盖 10–50。","note":"","priority":"must"},{"text":"然后放在 80、180、230、280，总共 5 个。","note":"","priority":"must"},{"text":"该具体等半径、单直线覆盖问题的最左贪心策略可证明最优；一般贪心策略是否最优应分情况。","note":"","priority":"frequent"},{"text":"题目给定已排序坐标，遍历一次，时间 O(n)。","note":"","priority":"frequent"}],"source":"PDF 第8～10页；转写 10.2","priority":"must","visual":"hydrant-interactive","memory":"坐标 [10,20,30,35,60,80,160,210,260,300]，栓位 [30,80,180,230,280]，共 5 个。","examples":[{"title":"课件覆盖案例","given":"半径20米；房屋位于10、20、30、35、60、80、160、210、260、300米","steps":["第一座栓30米，覆盖[10,50]：前4栋。","第二座栓80米，覆盖[60,100]：第5、6栋。","第三座栓180米，覆盖[160,200]：第7栋。","第四座栓230米，覆盖[210,250]：第8栋。","第五座栓280米，覆盖[260,300]：第9、10栋。"],"answer":"需 5 个消防栓，位置 30、80、180、230、280 米。"}]},{"id":"6:6","chapter":6,"index":6,"title":"贪心正确性：案例题该如何识别","fullTitle":"贪心正确性：案例题该如何识别","intro":"老师认为看题目文字中的“当前第一个未覆盖对象、做局部选择、删除已解决对象”通常可识别贪心。","points":[{"text":"① 找“当前依据什么指标选下一步”：当前最左、最低成本、最高密度等。","note":"","priority":"must"},{"text":"② 看选择后是否永久删除已覆盖对象/不再修改选择。","note":"","priority":"must"},{"text":"③ 检查是否有贪心选择性质；局部策略可能失败。","note":"","priority":"must"},{"text":"消防栓案例在题给条件下可取得全局最优，但不能推广为任何贪心都一定最优。","note":"","priority":"frequent"}],"source":"PDF 第8～10页；转写 10.2","priority":"must","visual":"greedy-choice","memory":"识别贪心：每次局部优选、做完不回头；正确性另证。"},{"id":"7:0","chapter":7,"index":0,"title":"回溯法：解空间树和深度优先搜索","fullTitle":"回溯法：解空间树和深度优先搜索","intro":"老师将回溯称为“通用的解题方法”，重点理解先深入、遇到死路就退回上一决策点。","points":[{"text":"把候选解组织成解空间树，从根开始逐步构建。","note":"","priority":"must"},{"text":"主要采用深度优先搜索 DFS，沿一条路径持续深入。","note":"","priority":"must"},{"text":"遇到不满足约束、无法产生解的分支 → 剪枝并退回（回溯）。","note":"","priority":"must"},{"text":"经典场景：迷宫、八皇后、组合枚举。","note":"","priority":"frequent"},{"text":"搜索树不一定是二叉树。","note":"","priority":"frequent"}],"source":"PDF 第9、11～12页；转写 10.2","priority":"must","visual":"backtrack","memory":"回溯 DFS：先向下尝试，走不通就撤销、换分支。"},{"id":"7:1","chapter":7,"index":1,"title":"回溯中的剪枝与撤销决策","fullTitle":"回溯中的剪枝与撤销决策","intro":"回溯不是盲目枚举所有状态，而是尽早发现不可能完成的路径，避免继续向下。","points":[{"text":"约束检查：当前部分解若已经违法，就不再延伸该分支。","note":"","priority":"must"},{"text":"撤销：从无解子树退出，恢复状态，再尝试其他候选选择。","note":"","priority":"must"},{"text":"找到一个可行解后，可根据题目决定继续找所有解还是结束。","note":"","priority":"frequent"},{"text":"一般状态数可能呈指数增长；剪枝能改善实际效率，但不自动保证低阶复杂度。","note":"","priority":"frequent"}],"source":"PDF 第9、11～12页；转写 10.2","priority":"","visual":"backtrack-tree","memory":"选 → 验 → 深入 → 不行就撤销。"},{"id":"7:2","chapter":7,"index":2,"title":"分支限界法：活结点、扩展结点、界","fullTitle":"分支限界法：活结点、扩展结点、界","intro":"课件第 11 页介绍扩展结点和活结点，老师要求了解与回溯的区别。","points":[{"text":"活结点：已产生但仍待扩展的结点。","note":"","priority":"understand"},{"text":"扩展结点：正在扩展其子结点的结点。","note":"","priority":"understand"},{"text":"分支限界通过可行性与上下界信息裁剪不可能更优的分支。","note":"","priority":"understand"},{"text":"常见选择顺序：FIFO 队列式、优先队列式（最佳优先）。","note":"","priority":"understand"},{"text":"老师将它和深度优先回溯对比，常见课堂模型用广度/最佳优先方式展开。","note":"","priority":"understand"}],"source":"PDF 第9、11～12页；转写 10.2","priority":"understand","visual":"branch-bound","memory":"回溯沿深度；分支限界常用队列/优先队列，靠界限剪枝。"},{"id":"7:3","chapter":7,"index":3,"title":"分支限界与回溯的对照","fullTitle":"分支限界与回溯的对照","intro":"两者都能在解空间树中探索，但通常关注的任务目标和结点扩展策略不同。","points":[{"text":"回溯：DFS 为主，找可行解或全部解，也可配合最优值搜索。","note":"","priority":"understand"},{"text":"分支限界：通常面向最优化，依据边界剪枝，使用队列/优先队列选活结点。","note":"","priority":"understand"},{"text":"FIFO 对应队列式扩展；优先队列优先考虑最有希望的结点。","note":"","priority":"understand"},{"text":"老师对这一节要求“了解定义即可”，不需要复杂编程实现。","note":"","priority":"understand"}],"source":"PDF 第9、11～12页；转写 10.2","priority":"understand","visual":"back-vs-branch","memory":"回溯 DFS 找解；分支限界利用界限与活结点策略找更优解。"},{"id":"7:4","chapter":7,"index":4,"title":"概率算法的概念和分类","fullTitle":"概率算法的概念和分类","intro":"课件第 11 页把概率算法作为新增了解内容，强调算法内部有随机选择、可能降低时间开销。","points":[{"text":"执行过程中可使用随机数决定后续步骤。","note":"","priority":"understand"},{"text":"同一输入，不同随机选择序列可能产生不同过程或结果。","note":"","priority":"understand"},{"text":"课程列举数值概率、蒙特卡洛、拉斯维加斯、舍伍德四类。","note":"","priority":"understand"},{"text":"并非所有随机算法都允许错误：Las Vegas 型通常只输出正确答案，运行时间随机。","note":"","priority":"understand"},{"text":"概率算法的每一步规则仍明确定义；随机性并不意味着“算法不具确定含义”。","note":"","priority":"understand"}],"source":"PDF 第9、11～12页；转写 10.2","priority":"understand","visual":"randomized","memory":"概率算法：内部用随机选择；蒙特卡洛可有错误概率，拉斯维加斯答案正确但耗时随机。","notice":"转写把“概率算法违反算法的确定性特征”当作直观说法。严格而言随机选择过程可由明确概率规则规定，不等于指令含义模糊；也并非所有随机算法可能输出错误。"},{"id":"7:5","chapter":7,"index":5,"title":"近似算法：用质量保证换运行代价","fullTitle":"近似算法：用质量保证换运行代价","intro":"课程把近似算法作为第五版新增内容，主要记忆“放弃精确最优”与两个性能标准。","points":[{"text":"用于精确求最优解成本高的问题。","note":"","priority":"understand"},{"text":"允许给出接近最优的可行解，以降低求解成本。","note":"","priority":"understand"},{"text":"两个重要衡量指标：时间复杂度，以及近似解与最优解之间的比率/误差界。","note":"","priority":"understand"},{"text":"与概率算法区别：近似算法不一定依赖随机过程。","note":"","priority":"understand"}],"source":"PDF 第9、11～12页；转写 10.2","priority":"understand","visual":"approx","memory":"近似算法两标准：跑得快不快？离最优差多少？"},{"id":"8:0","chapter":8,"index":0,"title":"数据挖掘：发现隐含模式与知识","fullTitle":"数据挖掘：发现隐含模式与知识","intro":"老师说属于扩展知识，主要记四种功能及其直观用途，不必深钻算法内部。","points":[{"text":"利用统计分析、机器学习等，从大量数据中发现可用模式。","note":"","priority":"understand"},{"text":"课程四项功能：分类、回归、关联规则、聚类。","note":"","priority":"understand"},{"text":"银行风险评估、电商营销分析等是老师提到的场景。","note":"","priority":"understand"},{"text":"与前面数据库章节的数据仓库、OLAP 等概念形成衔接。","note":"","priority":"understand"}],"source":"PDF 第12～14页；转写 10.2","priority":"understand","visual":"mining-four","memory":"数据挖掘四种：分类、回归、关联规则、聚类。"},{"id":"8:1","chapter":8,"index":1,"title":"分类与回归：有监督学习","fullTitle":"分类与回归：有监督学习","intro":"用已有样本中的标签或数值建立预测模型，课件强调分类与回归是两类常用任务。","points":[{"text":"分类：预测离散类别，例如合格/不合格。","note":"","priority":"understand"},{"text":"回归：预测连续数值，例如销量或价格。","note":"","priority":"understand"},{"text":"监督学习通常需要带目标标签或数值的训练样本。","note":"","priority":"understand"},{"text":"课件列举 BP、SVM 等算法名称，老师说无需深入实现细节。","note":"","priority":"understand"}],"source":"PDF 第12～14页；转写 10.2","priority":"understand","visual":"class-reg","memory":"分类预测“属于哪一类”；回归预测“多少数值”。"},{"id":"8:2","chapter":8,"index":2,"title":"关联规则：频繁项集与共同购买","fullTitle":"关联规则：频繁项集与共同购买","intro":"课件第 13 页出现 Apriori、FP-growth、ECLAT，老师用“啤酒与尿布”故事解释关联规则。","points":[{"text":"发现频繁共同出现的商品/事件组合及其关联规则。","note":"","priority":"understand"},{"text":"Apriori、FP-growth、ECLAT 是课件列出的关联规则挖掘算法。","note":"","priority":"understand"},{"text":"支持度：项集在交易中共同出现的频率；置信度：前件出现时后件也出现的比例（概念拓展）。","note":"","priority":"understand"},{"text":"“啤酒与尿布”属于课堂案例故事，不必当作已核实的商业事实。","note":"","priority":"understand"}],"source":"PDF 第12～14页；转写 10.2","priority":"understand","visual":"association","memory":"关联规则：哪些事经常一起发生？代表算法 Apriori / FP-growth。"},{"id":"8:3","chapter":8,"index":3,"title":"聚类：无监督地把相似对象放一起","fullTitle":"聚类：无监督地把相似对象放一起","intro":"老师用“物以类聚、人以群分”帮助记聚类；关键是和有标签的分类区分。","points":[{"text":"聚类通常不依赖预先给定的类别标签。","note":"","priority":"understand"},{"text":"根据数据之间的相似性分组，让同组更相似、组间差异更大。","note":"","priority":"understand"},{"text":"与分类的主要区别：分类有监督，聚类通常无监督。","note":"","priority":"understand"},{"text":"课程对聚类算法名称不要求深入。","note":"","priority":"understand"}],"source":"PDF 第12～14页；转写 10.2","priority":"understand","visual":"clustering","memory":"分类有标签，聚类找群体；“物以类聚”。"},{"id":"8:4","chapter":8,"index":4,"title":"智能优化算法概览","fullTitle":"智能优化算法概览","intro":"PDF 第 13～14 页列出典型智能优化方法；老师将整个板块定位为“了解原理即可”。","points":[{"text":"人工神经网络 ANN：抽象神经元连接与学习过程。","note":"","priority":"understand"},{"text":"遗传算法 GA：种群、选择、交叉、变异，源于自然进化思想。","note":"","priority":"understand"},{"text":"模拟退火 SA：允许概率性接受较差解，以摆脱局部最优。","note":"","priority":"understand"},{"text":"禁忌搜索 TS：借助禁忌表记忆搜索历史，减少重复陷入相同局部区域。","note":"","priority":"understand"},{"text":"蚁群算法 ACO：模拟信息素的正反馈。","note":"","priority":"understand"},{"text":"粒子群算法 PSO：群体粒子参考自身与群体最好位置调整。","note":"","priority":"understand"}],"source":"PDF 第12～14页；转写 10.2","priority":"understand","visual":"heuristics","memory":"ANN 神经元、GA 进化、SA 退火、TS 禁忌、ACO 信息素、PSO 个体/群体最优。"},{"id":"8:5","chapter":8,"index":5,"title":"遗传算法：选择、交叉、变异","fullTitle":"遗传算法：选择、交叉、变异","intro":"课件将遗传算法介绍为模拟遗传和进化过程的优化思想，老师只要求识别关键名词。","points":[{"text":"初始种群由若干候选解组成。","note":"","priority":"understand"},{"text":"选择适应度较高的个体参与后续繁殖。","note":"","priority":"understand"},{"text":"交叉与变异产生新候选解，迭代更新种群。","note":"","priority":"understand"},{"text":"它是启发式/随机优化方法，一般不能保证在有限迭代下找到全局最优。","note":"","priority":"understand"}],"source":"PDF 第12～14页；转写 10.2","priority":"understand","visual":"genetic","memory":"遗传三动作：选择、交叉、变异。"},{"id":"8:6","chapter":8,"index":6,"title":"模拟退火与禁忌搜索","fullTitle":"模拟退火与禁忌搜索","intro":"两者都尝试减少局部最优困境；老师主要要求掌握起源和直观机制。","points":[{"text":"模拟退火 SA：高温时较愿意接受差解，温度降低后接受概率变小。","note":"","priority":"understand"},{"text":"禁忌搜索 TS：用禁忌表记录近期搜索选择，避免反复回到相同状态。","note":"","priority":"understand"},{"text":"退火思路来自加温、保温、缓慢冷却的类比。","note":"","priority":"understand"},{"text":"模拟退火不能普遍承诺任何有限运行都得到全局最优。","note":"","priority":"understand"}],"source":"PDF 第12～14页；转写 10.2","priority":"understand","visual":"sa-tabu","memory":"SA 借温度跳出局部最优；TS 借禁忌表防重复。"},{"id":"8:7","chapter":8,"index":7,"title":"蚁群算法：信息素与路径探索","fullTitle":"蚁群算法：信息素与路径探索","intro":"课件第 14 页借蚂蚁寻找食物的路径理解信息素反馈机制。","points":[{"text":"候选路径上的信息素影响后续蚂蚁的选择概率。","note":"","priority":"understand"},{"text":"较优路线可能积累更多信息素，形成正反馈。","note":"","priority":"understand"},{"text":"配合信息素挥发避免过度锁定早期路线。","note":"","priority":"understand"},{"text":"算法用于路径、组合优化等场景，属于启发式搜索而非最优性保证。","note":"","priority":"understand"}],"source":"PDF 第12～14页；转写 10.2","priority":"understand","visual":"ants","memory":"蚁群：路径信息素 + 挥发 + 正反馈。"},{"id":"8:8","chapter":8,"index":8,"title":"粒子群 PSO：pBest 与 gBest","fullTitle":"粒子群 PSO：pBest 与 gBest","intro":"课程用鸟群觅食类比：每个粒子拥有位置与速度，并参考个体与群体目前最好结果。","points":[{"text":"pBest（个体历史最优）：粒子自己迄今找到的最好位置。","note":"","priority":"must"},{"text":"gBest（全局历史最优）：整个粒子群迄今找到的最好位置。","note":"","priority":"must"},{"text":"粒子基于惯性、个体经验和群体经验更新速度、位置。","note":"","priority":"frequent"},{"text":"老师认为了解 pBest、gBest 概念即可，不要求公式推导。","note":"","priority":"understand"}],"source":"PDF 第12～14页；转写 10.2","priority":"","visual":"pso","memory":"PSO 看两个历史最好：自己 pBest，整体 gBest。"},{"id":"8:9","chapter":8,"index":9,"title":"考前总结：哪些值得反复刷题","fullTitle":"考前总结：哪些值得反复刷题","intro":"依据 10.2 收尾的复习建议，帮助在有限时间内安排本章注意力。","points":[{"text":"反复练：循环/递归时间复杂度计算。","note":"","priority":"understand"},{"text":"反复练：四大算法策略的文字特征。","note":"","priority":"understand"},{"text":"反复练：0-1 背包的状态式、可分背包的价值密度、消防栓贪心。","note":"","priority":"understand"},{"text":"理解回溯法的 DFS、剪枝与撤销过程。","note":"","priority":"understand"},{"text":"分支限界、概率、近似、数据挖掘、智能优化以概念对照为主。","note":"","priority":"understand"},{"text":"结合考试讲解做题，无法解出的高难度题应记录思路而非机械背答案。","note":"","priority":"understand"}],"source":"PDF 第12～14页；转写 10.2","priority":"understand","visual":"road","memory":"先复杂度/递归，次四大策略及两类背包、消防栓，最后扫新技术。"}],"quizzes":[{"chapter":1,"topic":"1:0","question":"以下哪个不是课程列出的算法五个基本特性？","options":["有穷性","可行性","确定性","并行性"],"answer":3,"explain":"课件五个特性为有穷、确定、可行、输入、输出。"},{"chapter":1,"topic":"1:0","question":"一个算法的输入和输出数量，按照教材应如何理解？","options":["输入至少1、输出可为0","输入可为0、输出至少1","输入输出都必须恰好1","输入输出都必须恰好0"],"answer":1,"explain":"教材明确说输入可以零个或多个，而输出需要一个或多个。"},{"chapter":1,"topic":"1:1","question":"分析算法的“时间复杂度”主要研究什么？","options":["电脑主频","基本操作次数随输入规模的增长","源代码文件大小","运行时内存中的页表格式"],"answer":1,"explain":"复杂度刻画输入规模增长时基本操作数的数量级。"},{"chapter":1,"topic":"1:1","question":"快速排序同一规模输入可能表现出不同运行时间，最合理的原因是？","options":["输入数据排列分布不同","Java 必须解释","不存在最坏时间复杂度","时间复杂度一定 O(log n)"],"answer":0,"explain":"快排的划分质量与输入分布/枢轴选择有关，最坏可能 O(n²)。"},{"chapter":1,"topic":"1:2","question":"渐进符号 Θ(g(n)) 表示？","options":["只提供下界","只提供上界","同时给出同阶上下界","必须等于精确运行毫秒数"],"answer":2,"explain":"Θ 表示渐进紧界，即同阶上界和下界同时成立。"},{"chapter":1,"topic":"1:2","question":"大 O 主要表示哪个概念？","options":["渐进上界","渐进下界","特定 CPU 耗电量","某次输入的精确时间"],"answer":0,"explain":"大 O 是渐进上界。"},{"chapter":1,"topic":"1:3","question":"T(n)=7n³+20n²+8，则复杂度可写成？","options":["O(1)","O(n)","O(n²)","O(n³)"],"answer":3,"explain":"只保留增长最快的最高阶 n³，忽略常数系数。"},{"chapter":1,"topic":"1:4","question":"下列增长次序从低到高正确的是？","options":["n² < nlogn < n","logn < n < nlogn < n²","n < 1 < logn","2ⁿ < n³"],"answer":1,"explain":"常见增长阶 logn < n < nlogn < n²。"},{"chapter":1,"topic":"1:4","question":"经典归并排序的时间复杂度通常为？","options":["O(1)","O(logn)","O(nlogn)","O(n³)"],"answer":2,"explain":"归并排序每层线性合并、共有约 logn 层，总 O(nlogn)。"},{"chapter":2,"topic":"2:0","question":"固定次数的赋值与乘法运算，没有按 n 变化的循环，通常属于？","options":["O(1)","O(n)","O(n²)","O(2ⁿ)"],"answer":0,"explain":"固定基本操作数不随 n 变化，属于 O(1)。"},{"chapter":2,"topic":"2:1","question":"for(i=0;i<n;i++) 循环体为固定操作，时间复杂度是？","options":["O(1)","O(logn)","O(n)","O(n²)"],"answer":2,"explain":"一重循环执行 n 次。"},{"chapter":2,"topic":"2:1","question":"两个顺序执行、各为 O(n) 的循环总复杂度是？","options":["O(n²)","O(n)","O(logn)","O(2ⁿ)"],"answer":1,"explain":"顺序相加 O(n)+O(n)=O(n)。"},{"chapter":2,"topic":"2:2","question":"count=1;while(count<n)count*=2; 的复杂度为？","options":["O(1)","O(logn)","O(n)","O(n²)"],"answer":1,"explain":"每轮翻倍，循环次数近似 log₂n。"},{"chapter":2,"topic":"2:2","question":"当 n=17，count 从1翻倍直到不小于 n，循环体执行几次？","options":["4","5","8","17"],"answer":1,"explain":"起始依次为 1、2、4、8、16，共 5 次，下一次 count=32 循环结束。"},{"chapter":2,"topic":"2:3","question":"外层 n 次，内层每次 n 次，循环体执行总数约为？","options":["n","2n","n²","logn"],"answer":2,"explain":"相互嵌套时每次外层执行 n 次内层，总 n×n。"},{"chapter":2,"topic":"2:4","question":"for(i=0;i<n;i++) for(j=i;j<n;j++) 的内层总执行次数为？","options":["n","n(n+1)/2","nlogn","2ⁿ"],"answer":1,"explain":"每次内层是 n,n−1,…,1，总和 n(n+1)/2。"},{"chapter":2,"topic":"2:5","question":"外层循环 n 次，内层循环每轮翻倍至 n，复杂度为？","options":["O(logn)","O(n)","O(nlogn)","O(n²)"],"answer":2,"explain":"每次外层有 logn 次内层，合计 nlogn。"},{"chapter":2,"topic":"2:6","question":"哪种复杂度分析习惯正确？","options":["数循环的括号个数","只看最外层","计算实际迭代次数并作求和/乘法","每个递归都是指数阶"],"answer":2,"explain":"老师强调代入循环边界，按次数分析，不能靠外观猜。"},{"chapter":3,"topic":"3:0","question":"递归算法两个最基本要素是？","options":["输入和注释","边界条件和递归关系","数组和链表","队列和栈"],"answer":1,"explain":"必须有递归的出口和逐步缩小问题的递归式。"},{"chapter":3,"topic":"3:1","question":"用 n!=n×(n−1)! 递归实现阶乘，其 n=0 的边界值为？","options":["0","1","n","−1"],"answer":1,"explain":"0!=1 是经典递归出口。"},{"chapter":3,"topic":"3:1","question":"普通阶乘直接递归实现的时间复杂度一般是？","options":["O(1)","O(logn)","O(n)","O(2ⁿ)"],"answer":2,"explain":"每次 n 减1，调用深度为 n，假设单次工作常数。"},{"chapter":3,"topic":"3:2","question":"T(n)=T(n−1)+n，T(1)=1，则 T(n) 为？","options":["Θ(1)","Θ(logn)","Θ(n)","Θ(n²)"],"answer":3,"explain":"展开后求和1+2+…+n=n(n+1)/2。"},{"chapter":3,"topic":"3:3","question":"T(n)=8T(n/2)+n² 的增长阶为？","options":["Θ(n)","Θ(nlogn)","Θ(n²)","Θ(n³)"],"answer":3,"explain":"递归分支数8、缩小比2，n^{log₂8}=n³ 主导。"},{"chapter":3,"topic":"3:4","question":"课件比较 T_A(n)=8T(n/2)+n² 与 T_B(n)=X T(n/4)+n²，B 需渐进更快时最大整数 X 是？","options":["15","17","63","65"],"answer":2,"explain":"临界 X=4³=64，等于64时 B=Θ(n³logn)；需 X<64，所以最大63。"},{"chapter":3,"topic":"3:5","question":"“所有递归程序的时间复杂度均为 O(2ⁿ)”这一说法？","options":["正确","只对阶乘正确","错误，需看分支数、规模与每层工作量","只对归并排序正确"],"answer":2,"explain":"单分支阶乘递归是 O(n)，归并是 O(nlogn)。"},{"chapter":4,"topic":"4:0","question":"分治法的典型三个步骤是？","options":["分解、求解、合并","先排序、再排序、最后排序","入栈、出栈、交换","预测、分类、回归"],"answer":0,"explain":"分治 Divide/Conquer/Combine。"},{"chapter":4,"topic":"4:1","question":"归并排序为何是 O(nlogn) 而不是 O(logn)？","options":["每层归并需要 O(n) 工作","递归深度是 n²","它没有划分","归并不做比较"],"answer":0,"explain":"共有对数层，每层累计合并开销线性。"},{"chapter":4,"topic":"4:2","question":"快速排序的最坏时间复杂度通常为？","options":["O(1)","O(logn)","O(nlogn)","O(n²)"],"answer":3,"explain":"极端不平衡分区可导致平方级比较。"},{"chapter":4,"topic":"4:3","question":"动态规划与分治最关键的区别，老师强调哪点？","options":["DP 使用保存的重叠子问题结果","分治算法不能用递归","DP 一定不拆子问题","分治只能用于数组"],"answer":0,"explain":"动态规划特别处理重叠子问题，缓存避免重复计算。"},{"chapter":5,"topic":"5:0","question":"动态规划通常强调哪两项性质？","options":["有穷性和输出","最优子结构、重叠子问题","分片与复制","确定性和上界"],"answer":1,"explain":"DP 的两个经典性质是最优子结构和重叠子问题。"},{"chapter":5,"topic":"5:1","question":"下列哪一步最直接用于避免重复计算子问题？","options":["随机选取分支","保存已计算状态值","每次都重新暴力计算","删除所有边界条件"],"answer":1,"explain":"DP 的状态表或记忆化存储计算结果。"},{"chapter":5,"topic":"5:2","question":"0-1 背包中 xi 的合法取值是？","options":["任意实数","只能0或1","只能1/3","任意负数"],"answer":1,"explain":"0-1 背包中物品只能整件取或不取。"},{"chapter":5,"topic":"5:3","question":"若当前第 i 件物品重量 wi>w，c[i,w] 应等于？","options":["vi","0","c[i−1,w]","c[i−1,w−wi]+vi"],"answer":2,"explain":"装不下只能不取当前物品，沿用前 i−1 件的最优值。"},{"chapter":5,"topic":"5:3","question":"当 wi≤w 时，0-1 背包状态转移式为？","options":["min(c[i−1,w],vi)","max(c[i−1,w],c[i−1,w−wi]+vi)","c[i−1,w]+wi","c[i,w−1]+1"],"answer":1,"explain":"对当前物品做选或不选两个分支的最优值比较。"},{"chapter":5,"topic":"5:4","question":"课件五物品 W=10 的 0-1 背包最优价值为？","options":["11","14","15","16.67"],"answer":2,"explain":"一组最优解选第1、2、5件，价值6+3+6=15。"},{"chapter":5,"topic":"5:4","question":"课件 W=10 的五物品中，下列哪个是 0-1 背包最优方案之一？","options":["1、2、5","1、3、5","3、4","1、4、5"],"answer":0,"explain":"1、2、5件重量8，价值15。1、3、5件重12超过容量。"},{"chapter":5,"topic":"5:5","question":"采用按容量填状态表的经典 0-1 背包 DP 算法，复杂度为？","options":["O(n)","O(logW)","O(nW)","O(2ⁿ)"],"answer":2,"explain":"需要考虑 n×W 个状态，每格常数工作。"},{"chapter":5,"topic":"5:6","question":"为何 0-1 背包通常不能直接按价值密度贪心保证最优？","options":["物品必须整取，局部密度可能浪费容量","所有物品没有价值","动态规划完全不考虑容量","物品数为0"],"answer":0,"explain":"0-1 不允许拆分，密度最优的局部选择可能排除更好的组合。"},{"chapter":6,"topic":"6:0","question":"贪心法的最关键特征是？","options":["每次根据当前信息作局部选择","一定穷举所有解","始终保留所有方案","必须随机选一条路"],"answer":0,"explain":"贪心通常一旦选择不回头，依赖贪心选择性质保证最优。"},{"chapter":6,"topic":"6:1","question":"部分背包允许每件物品选取比例 xi 的范围是？","options":["只有0或1","0≤xi≤1","xi≥2","xi<0"],"answer":1,"explain":"可分背包允许取一部分，比例可以介于0和1之间。"},{"chapter":6,"topic":"6:2","question":"可分背包贪心排序的正确指标通常是？","options":["物品编号","重量最小","单件总价值最大","vi/wi 最大"],"answer":3,"explain":"正重量、线性可分的背包按单位重量价值排序最优。"},{"chapter":6,"topic":"6:3","question":"课件同组输入的可分背包最优价值约为？","options":["11","14","15","16.67"],"answer":3,"explain":"选1、2、5价值15，再取3的1/3增加5/3，约16.67。"},{"chapter":6,"topic":"6:3","question":"先通过归并排序计算可分背包再依次放入，其总时间复杂度通常为？","options":["O(1)","O(n)","O(nlogn)","O(n²)"],"answer":2,"explain":"排序 nlogn，加一遍扫描 n，合计 nlogn。"},{"chapter":6,"topic":"6:4","question":"消防栓覆盖半径为20米，最左未覆盖房屋坐标为10，第一座栓按题目算法应放在？","options":["10","20","30","50"],"answer":2,"explain":"安装在10+20=30，可覆盖[10,50]。"},{"chapter":6,"topic":"6:5","question":"10栋房屋[10,20,30,35,60,80,160,210,260,300]最少需几座半径20的消防栓？","options":["4","5","6","7"],"answer":1,"explain":"课件示例给出位置30、80、180、230、280，共5座。"},{"chapter":6,"topic":"6:5","question":"课件消防栓算法已给按坐标排序的房屋列表，单次从左向右扫描的时间复杂度是？","options":["O(1)","O(logn)","O(n)","O(n²)"],"answer":2,"explain":"每栋房屋至多查看固定次，已排序条件下单次扫描O(n)。"},{"chapter":6,"topic":"6:6","question":"下列哪项最能说明“贪心不能一概保证最优”？","options":["所有贪心必定失败","不同问题须验证贪心选择性质","贪心必须使用回溯","只需要判断数据长度"],"answer":1,"explain":"正确的贪心规则在某些问题有最优性证明，在其他问题可能失败。"},{"chapter":7,"topic":"7:0","question":"回溯法在解空间树中常使用哪种搜索策略？","options":["广度优先","深度优先","二分查找","归并排序"],"answer":1,"explain":"回溯通常使用深度优先搜索，并撤销不能继续的部分解。"},{"chapter":7,"topic":"7:1","question":"回溯发现当前部分解必然不可行时，应该？","options":["继续遍历所有子结点","剪去该分支并回退","直接输出最优解","忽略约束"],"answer":1,"explain":"剪枝与回退正是回溯的核心。"},{"chapter":7,"topic":"7:2","question":"分支限界中等待扩展的结点通常称为？","options":["活结点","叶子终结符","哑结点","空对象"],"answer":0,"explain":"活结点为待扩展的结点。"},{"chapter":7,"topic":"7:3","question":"与课堂 DFS 回溯相比，队列式分支限界更  }).join('');

function renderExtra(t){return t.notice?`<div class="notice"><strong>📌 资料核对提醒：</strong>${esc(t.notice)}</div>`:''}
function renderDiagram(t){
 const v=t.visual;if(!v)return '';

 else if(v==='traits')body=grid([['有穷性','有限步骤终止'],['确定性','每步含义明确'],['可行性','操作可执行'],['输入','0 个或多个'],['输出','1 个或多个']]);
 else if(v==='time-space')body=grid([['时间复杂度 T(n)','随着规模 n，基本操作次数增长'],['空间复杂度 S(n)','随着规模 n，额外存储量增长']]);
 else if(v==='bounds')body=grid([['O(g(n)) · 上界','充分大 n：f(n) ≤ c·g(n)'],['Ω(g(n)) · 下界','充分大 n：f(n) ≥ c·g(n)'],['Θ(g(n)) · 紧界','同阶上下界同时成立']]);
 else if(v==='dominant')body=flow([['原多项式','3n² + 7n + 12'],['忽略低阶','3n²'],['忽略常数系数','Θ(n²)']]);
 else if(v==='growth')body=`${eq('1　&lt;　log n　&lt;　n　&lt;　n log n　&lt;　n²　&lt;　n³　&lt;　2ⁿ　&lt;　n!')}<div class="algo-note">上图表示充分大规模下的常见增长趋势，不表示各具体输入 n 上都保持同样数值大小。</div>`;
 else if(v==='basic-loops')body=table(['代码形态','执行次数','典型阶'],[['sum=(1+n)*n/2','固定','O(1)'],['for(i=0;i<n;i++)','n','O(n)'],['先后执行两个长度 n 循环','n+n=2n','O(n)']]);
 else if(v==='halving')body=`${eq('count:　1 → 2 → 4 → 8 → 16 → 32 → …')}<div class="algo-note">当 n=17，循环体在 count=1、2、4、8、16 时执行，共 5 次；翻倍至 32 时退出。</div>`;
 else if(v==='nested')body=`${eq('n × n = n²')} ${table(['外层 i','对应内层次数（n=4）'],[['0','4'],['1','4'],['2','4'],['3','4'],['合计','16 = 4²']])}`;
 else if(v==='triangle')body=`${eq('n + (n−1) + ··· + 1 = n(n+1)/2')} ${table(['外层 i','内层 j 范围（n=4）','次数'],[['0','0,1,2,3','4'],['1','1,2,3','3'],['2','2,3','2'],['3','3','1'],['合计','','10']])}`;

 else if(v==='analysis-flow')body=flow([['读边界','输入规模 n'],['计次数','步长与循环次数'],['求和','嵌套/顺序'],['取最高阶','O / Θ']]);
 else if(v==='recursion')body=grid([['边界条件','到什么时候停止？'],['递归关系','下一层求解什么更小问题？'],['调用深度','最深执行多少层？'],['工作量','每层做多少工作？']]);

 else if(v==='divide')body=flow([['分解','规模 n → 若干较小问题'],['求解','分别递归/直接求'],['合并','小解拼回大解']]);
 else if(v==='merge')body=`${eq('[7, 2, 6, 1]')}<div class="algo-tree">${flow([['左半','[7,2]'],['右半','[6,1]']])}${flow([['分别排序','[2,7] / [1,6]'],['归并','[1,2,6,7]']])}</div>`;
 else if(v==='divide-vs')body=table(['算法','每层工作','层数','复杂度'],[['折半查找','O(1)','约 log₂n','O(logn)'],['归并排序','总计 O(n)','约 log₂n','O(nlogn)'],['快排最坏','不断 n−1','约 n','O(n²)']]);
 else if(v==='compare4')body=grid([['分治','独立子问题，分开解决再合并'],['动态规划','重叠子问题，记忆/填表复用答案'],['贪心','局部选最优，不回头'],['回溯','深搜解空间，失败就撤销']]);

 else if(v==='dp-formula')body=`${eq('c[i,w] = max( c[i−1,w], c[i−1,w−wi] + vi )')}<div class="algo-note">仅在 wi ≤ w 时比较；放不下就直接取 c[i−1,w]。边界：i=0 或 w=0 时为 0。</div>`;
 else if(v==='dp-interactive'){
   const ww=[2,2,6,5,4],vv=[6,3,5,4,6],W=10;
   const arr=Array.from({length:6},()=>Array(11).fill(0));for(let i=1;i<=5;i++)for(let w=0;w<=10;w++){arr[i][w]=ww[i-1]>w?arr[i-1][w]:Math.max(arr[i-1][w],arr[i-1][w-ww[i-1]]+vv[i-1]);}
   const k=algoDpStep, heads=['i / w',...Array.from({length:11},(_,i)=>i)];
   const r=arr.map((row,i)=>`<tr class="${i===k?'algo-active-row':''}"><th>${i===0?'0 · 无物品':`${i} · w${i}=${ww[i-1]}`}</th>${row.map((val,j)=>`<td class="${i>k?'algo-unknown':''} ${i===k&&j===10?'algo-highlight-td':''}">${i<=k?val:'·'}</td>`).join('')}</tr>`).join('');
   body=`<div class="algo-sim"><div class="algo-simhead"><b>0-1 背包：逐件填 DP 表</b><span>已处理 ${k} / 5 件</span></div><div class="algo-tablewrap algo-wide"><table class="mini-table"><thead><tr>${heads.map(x=>`<th>${x}</th>`).join('')}</tr></thead><tbody>${r}</tbody></table></div><div class="algo-simfoot"><div>当前最优价值：<strong>${arr[k][10]}</strong> <span>${k===5?'最终 c[5,10]=15；可选物品 1、2、5。':'继续处理下一件后，更新容量 0～10 的所有状态。'}</span></div><div class="algo-actions"><button class="small-button" data-algo-dp="reset" ${k===0?'disabled':''}>重置</button><button class="small-button primary" data-algo-dp="next" ${k===5?'disabled':''}>下一件物品 →</button></div></div></div>`;
 }
 else if(v==='dp-greedy')body=grid([['动态规划 DP','保存状态，比较选与不选；0-1 背包'],['贪心 Greedy','按单位重量价值从高到低装；可分背包']]);
 else if(v==='fractional')body=`${eq('0 ≤ xi ≤ 1　｜　密度 ri = vi / wi')}${grid([['0-1 背包','整件；不可取 1/3 件'],['可分背包','若余量不足，可取 1/3 件']])}`;
 else if(v==='greedy-density')body=table(['规则','会否保证可分背包最优'],[['优先总价值最高','不保证'],['优先重量最小','不保证'],['优先单位重量价值 vi/wi 最高','保证（正重量，线性可分）']]);
 else if(v==='fractional-interactive'){

   for(let k=0;k<algoFractionStep;k++){const i=idx[k],amt=Math.min(ww[i],cap-used); used+=amt;total+=amt/ww[i]*vv[i];parts.push({i,amt,value:amt/ww[i]*vv[i]});}

   body=`<div class="algo-sim"><div class="algo-simhead"><b>可分背包 · 价值密度贪心</b><span>第 ${algoFractionStep} / 4 步</span></div><div class="algo-tablewrap"><table class="mini-table"><thead><tr><th>排序后的物品</th><th>重量</th><th>价值</th><th>密度</th><th>取重</th></tr></thead><tbody>${rows}</tbody></table></div><div class="algo-meter"><div style="width:${used/cap*100}%"></div></div><div class="algo-simfoot"><div>已装重量 <strong>${used} / 10</strong>　总价值 <strong>${total===0?'0':total.toFixed(2)}</strong><span>${algoFractionStep===4?'取物品 3 的 2/6，最终精确值 50/3≈16.67。':'按密度从大到小取；同密度物品先后不影响最终价值。'}</span></div><div class="algo-actions"><button class="small-button" data-algo-frac="reset" ${algoFractionStep===0?'disabled':''}>重置</button><button class="small-button primary" data-algo-frac="next" ${algoFractionStep===4?'disabled':''}>下一步 →</button></div></div></div>`;

   body=`<div class="algo-sim"><div class="algo-simhead"><b>消防栓 · 逐步覆盖</b><span>${k} / 5 座</span></div><div class="algo-svgwrap"><svg viewBox="0 0 760 140" role="img" aria-label="十栋房屋沿一条直线分布，安装消防栓逐步覆盖"><line x1="20" y1="73" x2="735" y2="73" stroke="currentColor" stroke-opacity=".22" stroke-width="3"/>${ranges}${marks}${dots}</svg></div><div class="algo-simfoot"><div>已覆盖 <strong>${detail[k][1]} / 10</strong> 栋<span>${detail[k][0]}</span></div><div class="algo-actions"><button class="small-button" data-algo-hyd="reset" ${k===0?'disabled':''}>重置</button><button class="small-button primary" data-algo-hyd="next" ${k===5?'disabled':''}>安装下一座 →</button></div></div></div>`;
 }
 else if(v==='greedy-choice')body=flow([['读题','每步按当前条件挑对象'],['局部选择','当前最优方案'],['不撤销','移除已解决对象'],['验证','是否保证最优']]);

 return `<section class="card"><h2>🧩 可视化理解${['dp-interactive','fractional-interactive','hydrant-interactive'].includes(v)?' · 交互演示':''}</h2><div class="diagram"><div class="diagram-title">ALGORITHM EXPLAINER · ${esc(t.title)}</div>${body}</div></section>`;
}
function renderMap(){el('topTitle').textContent='算法分析与设计 · 知识脑图';return `<div class="kicker">KNOWLEDGE MAP</div><h1 class="big-title">一张图，看懂整章知识结构</h1><p class="lede">按章节展开知识分支。点击右侧主题可以直接跳转到图文精讲；再次点击已展开的章节可以收起。</p><div class="map-root">算法分析与设计 <span style="font-size:12px;margin-left:13px;opacity:.7;align-self:center">8 组知识主题 · 1 份考试定位</span></div><div class="map-rail">${chapters.map(c=>`<div class="map-branch"><button class="map-chap ${mapOpen===c.id?'on':''}" data-mapchap="${c.id}"><span>${c.number} · ${esc(c.name)}</span><b>${mapOpen===c.id?'−':'+'}</b></button><div class="map-topics">${mapOpen===c.id?c.topicIds.map(id=>{let t=lessonMap.get(id);return `<button class="map-topic" data-lesson="${id}"><b>${esc(t.title)}</b><small>${t.points.length} 个知识条目 · 查看精讲 ↗</small><div class="map-details">${t.points.slice(0,3).map(p=>`<span>• ${topicLabel(p.text)}</span>`).join('')}${t.points.length>3?`<span>… 及其他 ${t.points.length-3} 项</span>`:''}</div></button>`}).join(''):`<div style="color:#92a1b0;font-size:12px;padding:13px">${c.topicIds.length} 个子主题 · 点击左侧展开</div>`}</div></div>`).join('')}</div>`}
function renderQuick(){el('topTitle').textContent='算法分析与设计 · 考前速记';
 const rules=[
 ['五个特性','有穷、确定、可行、输入(可0)、输出(至少1)','1:0'],
 ['复杂度','O 上界，Ω 下界，Θ 紧界；保留最高阶','1:3'],
 ['循环判题','顺序相加、嵌套计算乘积；倍增为 logn','2:6'],
 ['三角形循环','j=i 时：n+(n−1)+…+1 = n(n+1)/2','2:4'],
 ['递归分析','边界 + 递归关系；代入展开，按层求和','3:2'],
 ['分治法','分解→求解→合并；典型归并排序 O(nlogn)','4:0'],
 ['动态规划','最优子结构 + 重叠子问题；状态表复用','5:0'],
 ['0-1 背包','c[i,w]=max(c[i−1,w],c[i−1,w−wi]+vi)','5:3'],
 ['贪心可分背包','按 vi/wi 降序；0-1 最优15 vs 可分16.67','6:3'],
 ['消防栓','最左未覆盖 x，在 x+r 放栓；案例共5座','6:5'],
 ['回溯','DFS 深入→不合法剪枝→撤销选择','7:0'],
 ['新算法','数据挖掘四类；ANN/GA/SA/TS/ACO/PSO 识别特点','8:4']];
 return `<div class="kicker">QUICK RECALL</div><h1 class="big-title">考前速记 · 算法题型判别</h1><p class="lede">先用 12 条高频规则复述，再点击返回精讲；最后做练习检验是否真的理解。</p><div class="section-label"><h2>核心判题规则</h2><p>来源：10.1 / 10.2 课程讲解</p></div><div class="qgrid">${rules.map(f=>`<article class="card" style="margin:0"><h3 style="margin:0 0 8px">${esc(f[0])}</h3><div class="formula">${esc(f[1])}</div><button class="small-button tinted" style="margin-top:13px" data-lesson="${f[2]}">查看精讲 ↗</button></article>`).join('')}</div>${chapters.slice(1).map(c=>`<div class="section-label"><h2>${c.number} · ${esc(c.name)}</h2><p>${c.topicIds.length} 条速记</p></div><div class="qgrid">${c.topicIds.map(id=>{let t=lessonMap.get(id);return `<article class="quick-card"><div class="qtag">${esc(c.name)} ${levelTag(priority(t))}</div><h3>${esc(t.title)}</h3><p>${esc(t.memory||t.points.slice(0,2).map(p=>p.text).join('；'))}</p><button data-lesson="${id}">完整精讲 ↗</button></article>`}).join('')}</div>`).join('')}`;
}
function getQuizItems(scope){return quizzes.map((q,i)=>({...q,key:i})).filter(q=>scope==='all'||q.chapter===Number(scope)||scope==='wrong'&&load('sd_algo_v1_wrong',[]).includes(q.key));}
function startQuiz(scope){quizState={scope,items:getQuizItems(scope),index:0,picks:{},completed:false};setView('quiz')}
function chooseQuiz(idx){const item=quizState.items[quizState.index];if(quizState.picks[item.key]!==undefined)return;quizState.picks[item.key]=idx;render()}
function nextQuiz(){quizState.index++;if(quizState.index>=quizState.items.length){quizState.completed=true;const errors=quizState.items.filter(q=>quizState.picks[q.key]!==q.answer).map(q=>q.key);let old=new Set(load('sd_algo_v1_wrong',[]));for(let q of quizState.items)old.delete(q.key);for(let k of errors)old.add(k);save('sd_algo_v1_wrong',[...old]);}render();el('contentShell').scrollTop=0}
function renderQuiz(){el('topTitle').textContent='算法分析与设计 · 随堂练习';if(!quizState.items.length&&!quizState.completed){quizState.items=getQuizItems(quizState.scope)}let qs=quizState.items,idx=quizState.index;
 let filters=`<div class="quiz-filter"><button data-quizscope="all" class="${quizState.scope==='all'?'chosen':''}">全章 · ${quizzes.length} 题</button>${chapters.slice(1).map(c=>`<button data-quizscope="${c.id}" class="${quizState.scope===String(c.id)?'chosen':''}">${c.number} ${esc(c.name)} · ${getQuizItems(String(c.id)).length} 题</button>`).join('')}<button data-quizscope="wrong" class="${quizState.scope==='wrong'?'chosen':''}">错题重练 · ${getQuizItems('wrong').length} 题</button></div>`;
 if(!qs.length)return `<div class="kicker">PRACTICE</div><h1 class="big-title">随堂练习</h1><p class="lede">本组暂无试题或尚未产生错题。选择其他章节继续练习。</p>${filters}`;
 if(quizState.completed){let score=qs.filter(q=>quizState.picks[q.key]===q.answer).length;return `<div class="kicker">PRACTICE RESULT</div><h1 class="big-title">练习完成</h1><div class="score-card"><div class="huge">${Math.round(score/qs.length*100)}<small style="font-size:20px">分</small></div><h2>${score} / ${qs.length} 题正确</h2><p>${qs.length-score===0?'这组知识点都答对了，可以去精讲中继续学习其他内容。':`有 ${qs.length-score} 道题答错，错题会保存在当前浏览器中，可以单独重练。`}</p><button class="small-button primary" data-quizscope="${quizState.scope}">再做一遍</button><button class="small-button" data-quizscope="wrong">重练错题</button><button class="small-button" data-view="quick">查看考前速记</button></div>${filters}`;}
 let q=qs[idx],pick=quizState.picks[q.key],answered=pick!==undefined,chapter=chapters[q.chapter];return `<div class="kicker">PRACTICE / SELF TEST</div><h1 class="big-title">随堂练习</h1><p class="lede" style="margin-bottom:11px">按课程内容编写的自测题（非历年真题原文），答题后立即展示正确答案和解析。</p>${filters}<div class="quiz-wrap"><div class="quiz-top"><span class="tiny">${esc(chapter.name)} · 第 ${idx+1} / ${qs.length} 题</span><div class="quiz-progress"><i style="width:${idx/qs.length*100}%"></i></div><b style="font-size:12px;color:#6e8192">${Math.round(idx/qs.length*100)}%</b></div><div class="quiz-card"><span class="pill">单选题</span><h2>${esc(q.question)}</h2><div class="options">${q.options.map((o,j)=>`<button class="option ${answered&&j===q.answer?'correct':''} ${answered&&pick===j&&j!==q.answer?'incorrect':''} ${answered&&pick===j?'selected':''}" data-option="${j}" ${answered?'disabled':''}><i>${'ABCD'[j]}.</i><span>${esc(o)}</span></button>`).join('')}</div>${answered?`<div class="explain"><strong>${pick===q.answer?'✓ 回答正确':'✕ 回答错误'} · 正确答案 ${'ABCD'[q.answer]}</strong><div style="margin-top:5px">${esc(q.explain)}</div><div style="margin-top:10px"><button class="small-button tinted" data-lesson="${q.topic}">返回对应知识点 ↗</button></div></div>`:''}<div class="quiz-bottom"><span class="tiny">请先选择一个答案</span><button class="small-button primary" data-nextquestion ${!answered?'disabled':''}>${idx===qs.length-1?'查看成绩':'下一题 →'}</button></div></div></div>`;}
function renderRail(){if(view!=='read')return '';let t=lessonMap.get(current),c=chapters[t.chapter];return `<div class="rail-card"><h3>本章目录 · ${c.number}</h3>${c.topicIds.map((id,i)=>`<button class="rail-topic ${id===current?'current':''}" data-lesson="${id}">${String(i+1).padStart(2,'0')} · ${esc(lessonMap.get(id).title)} ${mastery[id]===2?'✓':''}</button>`).join('')}<div class="rail-memory"><strong>本节一句话</strong><p>${esc(t.memory||t.points[0]?.text||'')}</p><div class="tiny">${esc(t.source)}</div></div></div>`}
function render(){renderSidebar();document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('on',b.dataset.tab===view));const main=el('mainContent');main.className='content '+(view==='read'?'reading':'');main.innerHTML=({home:renderHome,read:renderRead,map:renderMap,quick:renderQuick,quiz:renderQuiz}[view]||renderHome)();const shell=el('contentShell');shell.classList.toggle('withrail',view==='read');el('rightRail').innerHTML=renderRail()}
function openSearch(){el('searchOverlay').classList.remove('hidden');el('searchInput').focus();searchResults('')}
function closeSearch(){el('searchOverlay').classList.add('hidden')}
function searchResults(term){
 term=term.trim().toLowerCase();
 let hits=term?lessons.filter(t=>(t.title+' '+t.intro+' '+t.points.map(p=>p.text+' '+p.note).join(' ')).toLowerCase().includes(term)):lessons.filter(t=>t.chapter>0&&priority(t)==='must').slice(0,8);
 if(term)hits.sort((a,b)=>{const score=t=>{let name=t.title.toLowerCase();return name===term?0:name.startsWith(term)?1:name.includes(term)?2:3};return score(a)-score(b) || a.chapter-b.chapter || a.index-b.index});
 let n=hits.length;hits=hits.slice(0,25);
 el('searchResults').innerHTML=`<div class="tiny">${term?`匹配 ${n} 个知识主题`:'建议重点内容'}</div>`+hits.map(t=>`<button class="sr" data-searchlesson="${t.id}"><strong>${esc(t.title)}</strong><small>${esc(chapters[t.chapter].name)} · ${esc(t.intro.slice(0,66))}…</small></button>`).join('')+(hits.length?'':'<div class="tiny">没有匹配结果，试试其他关键词。</div>');
}
document.body.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;
 if(b.dataset.algoDp){algoDpStep=b.dataset.algoDp==='reset'?0:Math.min(5,algoDpStep+1);render();return;}
 if(b.dataset.algoFrac){algoFractionStep=b.dataset.algoFrac==='reset'?0:Math.min(4,algoFractionStep+1);render();return;}
 if(b.dataset.algoHyd){algoHydrantStep=b.dataset.algoHyd==='reset'?0:Math.min(5,algoHydrantStep+1);render();return;}
 if(b.id==='focusToggle'){focusOnly=!focusOnly;save('sd_algo_v1_focus_only',focusOnly);renderSidebar();return}
 if(b.dataset.view){setView(b.dataset.view);return}
 if(b.dataset.tab){setView(b.dataset.tab);return}
 if(b.dataset.chapter!==undefined){let ci=+b.dataset.chapter;if(openedChap===ci){openedChap=-1;renderSidebar()}else{openedChap=ci;renderSidebar()}return}
 if(b.dataset.lesson){openLesson(b.dataset.lesson);return}
 if(b.dataset.master){markNext(b.dataset.master);return}
 if(b.dataset.mapchap!==undefined){let ci=+b.dataset.mapchap;mapOpen=mapOpen===ci?-1:ci;render();return}
 if(b.dataset.quizscope){startQuiz(b.dataset.quizscope);return}
 if(b.dataset.quiztopic){const t=lessonMap.get(b.dataset.quiztopic);quizState={scope:String(t.chapter),items:getQuizItems(String(t.chapter)),index:0,picks:{},completed:false};setView('quiz');return}
 if(b.dataset.option!==undefined){chooseQuiz(+b.dataset.option);return}
 if(b.hasAttribute('data-nextquestion')){nextQuiz();return}
 if(b.dataset.searchlesson){closeSearch();openLesson(b.dataset.searchlesson);return}
});
el('menuBtn').onclick=()=>{el('sidebar').classList.add('open');el('scrim').classList.add('open')};el('scrim').onclick=hideMobile;
function refreshThemeButton(){const dark=document.documentElement.dataset.theme==='dark',b=el('themeBtn');b.setAttribute('aria-pressed',String(dark));b.setAttribute('aria-label',dark?'切换为日间模式':'切换为夜间模式');b.title=dark?'切换为日间模式':'切换为夜间模式'}
el('themeBtn').onclick=()=>{const next=document.documentElement.dataset.theme==='dark'?'light':'dark';document.documentElement.dataset.theme=next;save('sd_algo_v1_theme',next);refreshThemeButton()};refreshThemeButton();
el('searchBtn').onclick=openSearch;el('searchClose').onclick=closeSearch;el('searchInput').oninput=e=>searchResults(e.target.value);
el('searchOverlay').addEventListener('click',e=>{if(e.target===el('searchOverlay'))closeSearch()});
window.addEventListener('keydown',e=>{if(e.key==='Escape'){closeSearch();hideMobile()}if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){e.preventDefault();openSearch()}});
render();

</script></body></html>
