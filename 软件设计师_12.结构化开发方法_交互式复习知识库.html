/* 第 3 章数据库知识：同一视觉设计规范下的专属教学图解 */
.db-flow{display:flex;align-items:center;justify-content:center;gap:9px;flex-wrap:wrap;margin:8px 0}
.db-arrow{color:var(--accent);font-size:21px;flex:none;font-weight:800}
.db-node{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 16px;color:var(--ink);min-width:112px;text-align:center;max-width:255px;flex:1 1 120px}
.db-node.accent{border-color:var(--accent);background:var(--accent-bg)}
.db-node strong{display:block;font-size:14px;line-height:1.5}.db-node small{display:block;font-size:12px;color:var(--muted);margin-top:6px;line-height:1.6}
.db-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(155px,1fr));gap:10px}.db-grid .db-node{min-width:0;max-width:none}
.db-layer{text-align:center}.db-layer>.db-grid{margin-top:12px}
.db-stair{max-width:640px;margin:5px auto;display:flex;flex-direction:column;align-items:center;gap:5px}.db-stair .db-node{width:100%;max-width:510px;flex:none}.db-stair>span{font-size:12px;color:var(--accent);font-weight:750;padding:6px}
.db-er-shapes{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));align-items:center;justify-items:center;gap:15px;padding:12px 3px}
.db-er-shapes>div{height:130px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:17px;min-width:0}
.db-er-shapes small{font-size:12px;color:var(--muted)}.db-rectangle,.db-oval,.db-rhombus{display:grid;place-items:center;background:var(--accent-bg);color:var(--ink);font-size:14px;font-weight:800;border:2px solid var(--accent)}
.db-rectangle{width:95px;height:60px;border-radius:5px}.db-oval{width:100px;height:60px;border-radius:50%}.db-rhombus{width:65px;height:65px;transform:rotate(45deg);border-radius:4px}.db-rhombus b{transform:rotate(-45deg);display:block;font-size:13px}
.db-math{background:var(--accent-bg);border:1px solid var(--line);border-radius:9px;padding:17px;color:var(--accent);font-weight:800;text-align:center;overflow-wrap:anywhere;font-size:17px;margin-bottom:16px}
.db-code{background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:18px 22px;color:var(--ink);font:14px/2.1 ui-monospace,Consolas,monospace;white-space:normal;margin:0 auto 14px;max-width:660px;overflow-x:auto}.db-code span{font-weight:900;color:var(--accent)}
.db-note{color:var(--muted);font-size:12px;line-height:1.9;margin-top:13px;text-align:center}
html[data-theme="dark"] .db-node{background:#1c3046;border-color:#3d5670}
html[data-theme="dark"] .db-node.accent,html[data-theme="dark"] .db-rectangle,html[data-theme="dark"] .db-oval,html[data-theme="dark"] .db-rhombus{background:#264765;border-color:#75b2e8;color:#e8f3ff}
html[data-theme="dark"] .db-code{background:#112031;border-color:#3a536c}
@media(max-width:650px){.db-flow{gap:6px}.db-node{padding:12px 9px;min-width:98px;flex-basis:110px}.db-arrow{font-size:17px}.db-er-shapes{gap:3px}.db-er-shapes small{font-size:10px}.db-rectangle,.db-oval{width:85px;height:55px}.db-rhombus{width:57px;height:57px}.db-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.db-math{font-size:14px}}


/* security knowledge diagrams follow the unified palette */
.sec-cia{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.sec-cia>div{background:var(--panel);border:1px solid var(--line);border-radius:12px;min-height:150px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:17px 10px}.sec-cia strong{font:800 45px/1 ui-sans-serif,system-ui,sans-serif;color:var(--accent)}.sec-cia b{font-size:15px;color:var(--ink);margin:14px 0 6px}.sec-cia small{font-size:12px;color:var(--muted);text-align:center}

.sec-two-col .db-node strong{overflow-wrap:anywhere}.db-flow .db-node strong{overflow-wrap:anywhere}

const DATA = {"chapters":[{"id":0,"number":"00","name":"本章考试定位","subtitle":"PDF 第2页；转写开篇、结尾","topicIds":["0:0","0:1"]},{"id":1,"number":"01","name":"系统分析与设计概述","subtitle":"PDF 第2、4–6页；转写前半部分","topicIds":["1:0","1:1","1:2","1:3","1:4","1:5","1:6","1:7","1:8"]},{"id":2,"number":"02","name":"内聚与耦合","subtitle":"PDF 第3–4页；转写内聚耦合讲解","topicIds":["2:0","2:1","2:2","2:3","2:4","2:5","2:6","2:7","2:8","2:9","2:10","2:11","2:12","2:13","2:14","2:15","2:16","2:17","2:18"]},{"id":3,"number":"03","name":"结构化开发方法 · DFD","subtitle":"PDF 第6–8页；转写结构化分析","topicIds":["3:0","3:1","3:2","3:3","3:4","3:5","3:6","3:7","3:8"]},{"id":4,"number":"04","name":"结构化设计方法","subtitle":"PDF 第9页；转写结构化设计","topicIds":["4:0","4:1","4:2"]},{"id":5,"number":"05","name":"WebApp 分析与设计","subtitle":"PDF 第10–11页；转写末尾","topicIds":["5:0","5:1","5:2","5:3"]}],"lessons":[{"id":"0:0","chapter":0,"index":0,"title":"考试定位与重点","fullTitle":"考试定位与重点","intro":"老师录课时估计本章选择题约3～4分，内聚、耦合各约1分；DFD 又是案例分析的重要基础。","points":[{"text":"内聚、耦合：老师反复强调分类与强弱顺序。","note":"","priority":""},{"text":"系统分析、设计：区分逻辑与物理模型、总体与详细设计。","note":"","priority":""},{"text":"数据流图：熟悉四类元素、加工错误和分层平衡。","note":"","priority":""},{"text":"WebApp：老师要求了解即可，其录课时的历史考情不是未来考试保证。","note":"","priority":""}],"source":"PDF 第2页；转写开篇、结尾","priority":"","memory":"先拿内聚耦合，再掌握 DFD 判错与层间平衡。","visual":"table","table":{"headers":["板块","课堂定位"],"rows":[["内聚与耦合","常考，分类含义与顺序均要记"],["DFD","选择题、案例分析基础"],["系统分析设计","概念、工具和原则辨析"],["WebApp","了解即可"]]},"notice":"分值、必考或未考过等说法均为老师录课经验，不是官方固定配分或未来命题承诺。自测题为教学改编，不冒称真题。"},{"id":"0:1","chapter":0,"index":1,"title":"复习路线与资料说明","fullTitle":"复习路线与资料说明","intro":"本章承接软件工程中的结构化方法，专门展开内聚、耦合与数据流图。","points":[{"text":"第一轮：理清系统分析与设计的产出。","note":"","priority":""},{"text":"第二轮：用老师的“顾名思义”及关键词学习七种内聚、七种耦合。","note":"","priority":""},{"text":"第三轮：练习数据流图判错、分层与数据字典。","note":"","priority":""},{"text":"最后：结构化设计四类任务，WebApp 简单回顾。","note":"","priority":""}],"source":"PDF 第2页；转写开篇、结尾","priority":"","memory":"关键词识别→比较等级→情境判题。","notice":"来源：13.结构化开发方法.pdf（11页）及 [37]--13.结构化开发方法.doc（完整转写）。本文件为系列第十二部分，原课件编号13。"},{"id":"1:0","chapter":1,"index":0,"title":"四种模型的转换路径","fullTitle":"四种模型的转换路径","intro":"课件第2页用当前系统、目标系统与逻辑、物理两个维度展示完整开发路径。","points":[{"text":"认识当前环境，获得当前系统物理模型。","note":"","priority":""},{"text":"由当前物理模型抽象出当前逻辑模型。","note":"","priority":""},{"text":"分析、优化当前逻辑模型，建立目标系统逻辑模型。","note":"","priority":""},{"text":"将目标逻辑模型具体化，建立目标物理模型。","note":"","priority":""},{"text":"老师提醒：前三步属于系统分析，第四步属于系统设计。","note":"","priority":""}],"source":"PDF 第2、4–6页；转写前半部分","priority":"frequent","memory":"当前物理→当前逻辑→目标逻辑→目标物理；分析止于目标逻辑。","visual":"table","table":{"headers":["步骤","转换","阶段"],"rows":[["1","认识当前物理模型","分析"],["2","抽象当前逻辑模型","分析"],["3","优化为目标逻辑模型","分析"],["4","具体化为目标物理模型","设计"]]},"demo":"models"},{"id":"1:1","chapter":1,"index":1,"title":"逻辑模型与物理模型","fullTitle":"逻辑模型与物理模型","intro":"逻辑模型反映系统功能与性质，物理模型描述具体实现方案。","points":[{"text":"系统分析回答“做什么”，形成目标系统逻辑模型。","note":"","priority":""},{"text":"系统设计回答“怎么做”，形成目标系统物理模型。","note":"","priority":""},{"text":"系统实施把设计方案落实为可运行系统。","note":"","priority":""},{"text":"老师用图纸与沙盘作类比帮助理解，并非软件模型的严格定义。","note":"","priority":""}],"source":"PDF 第2、4–6页；转写前半部分","priority":"frequent","memory":"分析→逻辑；设计→物理。"},{"id":"1:2","chapter":1,"index":2,"title":"系统设计基本原理","fullTitle":"系统设计基本原理","intro":"抽象、模块化、信息隐藏、模块独立是课件给出的基本原理。","points":[{"text":"抽象：保留本质特征，忽略不必要细节；包括过程抽象、数据抽象。","note":"","priority":""},{"text":"模块化：自顶向下分解为相对独立的模块。","note":"","priority":""},{"text":"信息隐藏：通过接口交互，隐藏模块内部实现与数据。","note":"","priority":""},{"text":"模块独立：尽量减少模块间关联，模块内元素紧密协作。","note":"","priority":""},{"text":"模块独立性通过耦合与内聚衡量。","note":"","priority":""}],"source":"PDF 第2、4–6页；转写前半部分","priority":"frequent","memory":"高内聚、低耦合；暴露接口，隐藏实现。"},{"id":"1:3","chapter":1,"index":3,"title":"总体结构设计与八项原则","fullTitle":"总体结构设计与八项原则","intro":"总体结构设计对应课程中的概要设计，对系统整体结构形式与可利用资源进行宏观设计。","points":[{"text":"分解协调：分解模块并协调相互关系。","note":"","priority":""},{"text":"自顶向下：由整体逐步求精。","note":"","priority":""},{"text":"信息隐藏与抽象：隔离内部细节。","note":"","priority":""},{"text":"一致性、明确性：统一规则并清楚定义职责。","note":"","priority":""},{"text":"尽量低耦合、高内聚。","note":"","priority":""},{"text":"扇入扇出合理，模块规模适当。","note":"","priority":""}],"source":"PDF 第2、4–6页；转写前半部分","priority":"","memory":"概要设计看框架；模块不是越小越好。","visual":"table","table":{"headers":["原则组","要点"],"rows":[["分解、方向","分解协调，自顶向下"],["信息与规范","信息隐藏、抽象、一致性、明确性"],["模块质量","高内聚、低耦合、扇入扇出合理、规模适当"]]}},{"id":"1:4","chapter":1,"index":4,"title":"扇入与扇出","fullTitle":"扇入与扇出","intro":"老师回顾软件工程中的模块调用关系：扇入是被多少上级模块调用，扇出是直接调用多少下级模块。","points":[{"text":"扇入：其他模块直接调用当前模块的数量。","note":"","priority":""},{"text":"扇出：当前模块直接调用其他模块的数量。","note":"","priority":""},{"text":"通常期望较高扇入以促进复用，较低扇出以减少依赖。","note":"","priority":""},{"text":"课件原则是扇入、扇出合理，并非越极端越好。","note":"","priority":""}],"source":"PDF 第2、4–6页；转写前半部分","priority":"","memory":"扇入＝别人调用我；扇出＝我调用别人。","demo":"fan"},{"id":"1:5","chapter":1,"index":5,"title":"子系统划分原则","fullTitle":"子系统划分原则","intro":"老师说此处不太常考，按原则理解即可。","points":[{"text":"子系统具有相对独立性。","note":"","priority":""},{"text":"子系统之间的数据依赖尽量小。","note":"","priority":""},{"text":"划分结果应使数据冗余较小。","note":"","priority":""},{"text":"考虑今后管理发展的需要。","note":"","priority":""},{"text":"便于系统分阶段实现。","note":"","priority":""},{"text":"充分利用各类资源。","note":"","priority":""}],"source":"PDF 第2、4–6页；转写前半部分","priority":"understand","memory":"独立、低依赖、少冗余、可发展、分阶段、用资源。"},{"id":"1:6","chapter":1,"index":6,"title":"子系统结构设计的任务","fullTitle":"子系统结构设计的任务","intro":"确定划分后的子系统模块结构并绘制模块结构图。","points":[{"text":"确定每个子系统如何划分模块。","note":"","priority":""},{"text":"确定子系统及模块之间传递的数据和调用关系。","note":"","priority":""},{"text":"评价并改进模块结构的质量。","note":"","priority":""},{"text":"从数据流图导出模块结构图。","note":"","priority":""},{"text":"不必在概要设计中决定每个模块内部的核心算法和具体数据结构。","note":"","priority":""}],"source":"PDF 第2、4–6页；转写前半部分","priority":"frequent","memory":"概要结构看模块及接口；详细设计看内部算法。"},{"id":"1:7","chapter":1,"index":7,"title":"模块的四个要素","fullTitle":"模块的四个要素","intro":"模块是组成系统的基本单位，能够组合、分解、更换。逻辑模块强调功能，物理模块强调具体实现。","points":[{"text":"输入和输出：与外界交换的数据。","note":"","priority":""},{"text":"处理功能：把输入转换为输出的工作。","note":"","priority":""},{"text":"内部数据：仅供本模块自身引用。","note":"","priority":""},{"text":"程序代码：实现模块功能的程序。","note":"","priority":""},{"text":"前两项属于外部特性，后两项属于内部特性。","note":"","priority":""}],"source":"PDF 第2、4–6页；转写前半部分","priority":"frequent","memory":"输入输出、处理功能＝外部；内部数据、程序代码＝内部。","visual":"table","table":{"headers":["特性","要素","关注点"],"rows":[["外部","输入输出、处理功能","模块接口和职责"],["内部","内部数据、程序代码","详细实现"]]}},{"id":"1:8","chapter":1,"index":8,"title":"模块结构图的组织原则","fullTitle":"模块结构图的组织原则","intro":"按课程的结构化设计规范，系统采用树状分解组织模块，主要表达调用关系及数据传递。","points":[{"text":"模块内凝聚力强，模块之间联系少。","note":"","priority":""},{"text":"课件强调上下级调用关系，不安排同级横向调用。","note":"","priority":""},{"text":"课件要求树状结构，避免网状与交叉调用。","note":"","priority":""},{"text":"模块及后续 IPO 图分类编码、归档。","note":"","priority":""},{"text":"结构图关注外部属性，不关注模块内部代码。","note":"","priority":""}],"source":"PDF 第2、4–6页；转写前半部分","priority":"understand","memory":"树状分解、合理调用、关注外部属性。","notice":"树状、禁止横向调用是本课特定结构化设计原则，不是现代所有软件架构的普遍强制规则。"},{"id":"2:0","chapter":2,"index":0,"title":"高内聚、低耦合","fullTitle":"高内聚、低耦合","intro":"老师明确指出这两类概念是本章最重要的选择题考点，需要掌握每类含义及程度排序。","points":[{"text":"内聚：同一模块内部处理元素之间的联系紧密程度，越高通常越好。","note":"","priority":""},{"text":"耦合：不同模块之间的关联程度，越低通常越好。","note":"","priority":""},{"text":"高内聚让一个模块围绕清晰职责工作。","note":"","priority":""},{"text":"低耦合降低修改一个模块对其他模块的影响。","note":"","priority":""}],"source":"PDF 第3–4页；转写内聚耦合讲解","priority":"must","memory":"内聚看模块内部；耦合看模块之间。","visual":"table","table":{"headers":["维度","作用范围","目标"],"rows":[["内聚","模块内部","高"],["耦合","模块之间","低"]]}},{"id":"2:1","chapter":2,"index":1,"title":"七种内聚：从低到高","fullTitle":"七种内聚：从低到高","intro":"课件第3页上表给出的排序，老师要求记住含义并能按程度比较。","points":[{"text":"偶然→逻辑→时间→过程→通信→顺序→功能。","note":"","priority":""},{"text":"偶然最低，功能最高。","note":"","priority":""},{"text":"典型考法一：给定义识别类型。","note":"","priority":""},{"text":"典型考法二：在若干类型中比较强弱。","note":"","priority":""}],"source":"PDF 第3–4页；转写内聚耦合讲解","priority":"must","memory":"偶、逻、时、过、通、顺、功（由弱到强，整理助记）。","visual":"table","table":{"headers":["类型","老师的记忆关键词"],"rows":[["偶然内聚","无直接关系"],["逻辑内聚","逻辑相似、参数决定"],["时间内聚","同一时间执行"],["过程内聚","指定的过程顺序"],["通信内聚","相同数据结构、相同输入输出"],["顺序内聚","顺序执行、前一输出为后一输入"],["功能内聚","共同作用、缺一不可"]]},"demo":"cohRank"},{"id":"2:2","chapter":2,"index":2,"title":"偶然内聚","fullTitle":"偶然内聚","intro":"老师的记忆关键词：无直接关系。","points":[{"text":"核心辨析：无直接关系。","note":"","priority":""},{"text":"教学情境：无关的日志、打印、计算等被随意放在同一模块。","note":"","priority":""},{"text":"强度排序：第 1 位（从低到高，共七种）。","note":"","priority":""}],"source":"PDF 第3–4页；转写内聚耦合讲解","priority":"must","memory":"无直接关系"},{"id":"2:3","chapter":2,"index":3,"title":"逻辑内聚","fullTitle":"逻辑内聚","intro":"老师的记忆关键词：逻辑相似、参数决定。","points":[{"text":"核心辨析：逻辑相似、参数决定。","note":"","priority":""},{"text":"教学情境：根据参数选择不同类型的处理操作。","note":"","priority":""},{"text":"强度排序：第 2 位（从低到高，共七种）。","note":"","priority":""}],"source":"PDF 第3–4页；转写内聚耦合讲解","priority":"must","memory":"逻辑相似、参数决定"},{"id":"2:4","chapter":2,"index":4,"title":"时间内聚","fullTitle":"时间内聚","intro":"老师的记忆关键词：同一时间执行。","points":[{"text":"核心辨析：同一时间执行。","note":"","priority":""},{"text":"教学情境：把启动时需要执行的多个初始化动作放在一起。","note":"","priority":""},{"text":"强度排序：第 3 位（从低到高，共七种）。","note":"","priority":""}],"source":"PDF 第3–4页；转写内聚耦合讲解","priority":"must","memory":"同一时间执行"},{"id":"2:5","chapter":2,"index":5,"title":"过程内聚","fullTitle":"过程内聚","intro":"老师的记忆关键词：指定的过程顺序。","points":[{"text":"核心辨析：指定的过程顺序。","note":"","priority":""},{"text":"教学情境：若干动作按照规定步骤执行，不要求前一输出成为后一输入。","note":"","priority":""},{"text":"强度排序：第 4 位（从低到高，共七种）。","note":"","priority":""}],"source":"PDF 第3–4页；转写内聚耦合讲解","priority":"must","memory":"指定的过程顺序"},{"id":"2:6","chapter":2,"index":6,"title":"通信内聚","fullTitle":"通信内聚","intro":"老师的记忆关键词：相同数据结构、相同输入输出。","points":[{"text":"核心辨析：相同数据结构、相同输入输出。","note":"","priority":""},{"text":"教学情境：多项操作使用同一份数据或产生相同输出。","note":"","priority":""},{"text":"强度排序：第 5 位（从低到高，共七种）。","note":"","priority":""}],"source":"PDF 第3–4页；转写内聚耦合讲解","priority":"must","memory":"相同数据结构、相同输入输出"},{"id":"2:7","chapter":2,"index":7,"title":"顺序内聚","fullTitle":"顺序内聚","intro":"老师的记忆关键词：顺序执行、前一输出为后一输入。","points":[{"text":"核心辨析：顺序执行、前一输出为后一输入。","note":"","priority":""},{"text":"教学情境：解析文本→清洗解析结果→统计清洗结果。","note":"","priority":""},{"text":"强度排序：第 6 位（从低到高，共七种）。","note":"","priority":""}],"source":"PDF 第3–4页；转写内聚耦合讲解","priority":"must","memory":"顺序执行、前一输出为后一输入"},{"id":"2:8","chapter":2,"index":8,"title":"功能内聚","fullTitle":"功能内聚","intro":"老师的记忆关键词：共同作用、缺一不可。","points":[{"text":"核心辨析：共同作用、缺一不可。","note":"","priority":""},{"text":"教学情境：多个处理元素协作完成一个明确的功能。","note":"","priority":""},{"text":"强度排序：第 7 位（从低到高，共七种）。","note":"","priority":""}],"source":"PDF 第3–4页；转写内聚耦合讲解","priority":"must","memory":"共同作用、缺一不可"},{"id":"2:9","chapter":2,"index":9,"title":"易混内聚：过程、通信、顺序、功能","fullTitle":"易混内聚：过程、通信、顺序、功能","intro":"仅看到“按顺序”不能立刻选顺序内聚；要进一步检查数据依赖。","points":[{"text":"过程内聚：指定过程顺序，不强调输入输出相接。","note":"","priority":""},{"text":"通信内聚：围绕同一个数据结构或输入输出。","note":"","priority":""},{"text":"顺序内聚：前一个处理的输出是下一个处理的输入。","note":"","priority":""},{"text":"功能内聚：各元素共同完成一个功能，缺一不可。","note":"","priority":""}],"source":"PDF 第3–4页；转写内聚耦合讲解","priority":"must","memory":"过程看步骤；通信看同数据；顺序看输出接输入；功能看共同目标。","visual":"table","table":{"headers":["易混类型","辨别证据"],"rows":[["过程","指定顺序"],["通信","共同数据"],["顺序","前输出→后输入"],["功能","共同完成一个功能"]]},"demo":"cohQuiz"},{"id":"2:10","chapter":2,"index":10,"title":"七种耦合：从低到高","fullTitle":"七种耦合：从低到高","intro":"课件第3页下表的排序。老师强调尤其区分数据值、数据结构、公共数据区。","points":[{"text":"无直接→数据→标记→控制→外部→公共→内容。","note":"","priority":""},{"text":"无直接耦合最低，内容耦合最高。","note":"","priority":""},{"text":"选择题中根据模块之间依赖方式辨析。","note":"","priority":""},{"text":"实际软件允许必要的接口依赖，不追求取消所有协作。","note":"","priority":""}],"source":"PDF 第3–4页；转写内聚耦合讲解","priority":"must","memory":"无、数、标、控、外、公、内（由弱到强，整理助记）。","visual":"table","table":{"headers":["类型","老师的记忆关键词"],"rows":[["无直接耦合","无直接关系"],["数据耦合","传递简单数据值"],["标记耦合","传递数据结构"],["控制耦合","控制变量、选择执行某一功能"],["外部耦合","软件外部环境"],["公共耦合","公共数据环境"],["内容耦合","模块内部关联"]]},"demo":"coupRank"},{"id":"2:11","chapter":2,"index":11,"title":"无直接耦合","fullTitle":"无直接耦合","intro":"老师的记忆关键词：无直接关系。","points":[{"text":"核心辨析：无直接关系。","note":"","priority":""},{"text":"教学情境：两个模块不直接调用，也不交换信息。","note":"","priority":""},{"text":"强度排序：第 1 位（从低到高，共七种）。","note":"","priority":""}],"source":"PDF 第3–4页；转写内聚耦合讲解","priority":"must","memory":"无直接关系"},{"id":"2:12","chapter":2,"index":12,"title":"数据耦合","fullTitle":"数据耦合","intro":"老师的记忆关键词：传递简单数据值。","points":[{"text":"核心辨析：传递简单数据值。","note":"","priority":""},{"text":"教学情境：A 调用 B 时仅传递所需数值或简单变量。","note":"","priority":""},{"text":"强度排序：第 2 位（从低到高，共七种）。","note":"","priority":""}],"source":"PDF 第3–4页；转写内聚耦合讲解","priority":"must","memory":"传递简单数据值"},{"id":"2:13","chapter":2,"index":13,"title":"标记耦合","fullTitle":"标记耦合","intro":"老师的记忆关键词：传递数据结构。","points":[{"text":"核心辨析：传递数据结构。","note":"","priority":""},{"text":"教学情境：A 向 B 传递记录结构 X。","note":"","priority":""},{"text":"强度排序：第 3 位（从低到高，共七种）。","note":"","priority":""}],"source":"PDF 第3–4页；转写内聚耦合讲解","priority":"must","memory":"传递数据结构"},{"id":"2:14","chapter":2,"index":14,"title":"控制耦合","fullTitle":"控制耦合","intro":"老师的记忆关键词：控制变量、选择执行某一功能。","points":[{"text":"核心辨析：控制变量、选择执行某一功能。","note":"","priority":""},{"text":"教学情境：A 调用 B 并传入模式标志，决定 B 内部执行哪个功能。","note":"","priority":""},{"text":"强度排序：第 4 位（从低到高，共七种）。","note":"","priority":""}],"source":"PDF 第3–4页；转写内聚耦合讲解","priority":"must","memory":"控制变量、选择执行某一功能"},{"id":"2:15","chapter":2,"index":15,"title":"外部耦合","fullTitle":"外部耦合","intro":"老师的记忆关键词：软件外部环境。","points":[{"text":"核心辨析：软件外部环境。","note":"","priority":""},{"text":"教学情境：两个模块因依赖同一外部设备格式或通信协议而关联。","note":"","priority":""},{"text":"强度排序：第 5 位（从低到高，共七种）。","note":"","priority":""}],"source":"PDF 第3–4页；转写内聚耦合讲解","priority":"must","memory":"软件外部环境"},{"id":"2:16","chapter":2,"index":16,"title":"公共耦合","fullTitle":"公共耦合","intro":"老师的记忆关键词：公共数据环境。","points":[{"text":"核心辨析：公共数据环境。","note":"","priority":""},{"text":"教学情境：两个模块直接读写同一个共享全局变量。","note":"","priority":""},{"text":"强度排序：第 6 位（从低到高，共七种）。","note":"","priority":""}],"source":"PDF 第3–4页；转写内聚耦合讲解","priority":"must","memory":"公共数据环境"},{"id":"2:17","chapter":2,"index":17,"title":"内容耦合","fullTitle":"内容耦合","intro":"老师的记忆关键词：模块内部关联。","points":[{"text":"核心辨析：模块内部关联。","note":"","priority":""},{"text":"教学情境：A 绕过 B 的正常入口，直接访问 B 内部数据或跳入内部代码。","note":"","priority":""},{"text":"强度排序：第 7 位（从低到高，共七种）。","note":"","priority":""}],"source":"PDF 第3–4页；转写内聚耦合讲解","priority":"must","memory":"模块内部关联"},{"id":"2:18","chapter":2,"index":18,"title":"易混耦合：数据、标记、控制、公共","fullTitle":"易混耦合：数据、标记、控制、公共","intro":"课件第4页的课堂真题直接用“传递数据结构 X”考查标记耦合。","points":[{"text":"数据耦合：传递简单数据值。","note":"","priority":""},{"text":"标记耦合：按课件分类，模块间传递数据结构。","note":"","priority":""},{"text":"控制耦合：传递控制变量来选择内部行为。","note":"","priority":""},{"text":"公共耦合：模块在公共数据区域上相互作用，并非参数传递。","note":"","priority":""}],"source":"PDF 第3–4页；转写内聚耦合讲解","priority":"must","memory":"传值＝数据；传结构＝标记；传控制＝控制；共享全局＝公共。","visual":"table","table":{"headers":["方式","类型"],"rows":[["传数值","数据耦合"],["传记录/结构","标记耦合"],["传决定行为的控制标志","控制耦合"],["访问公共数据区域","公共耦合"]]},"notice":"采用课件的考试分类。实际工程对标记耦合的更严格定义可考虑是否依赖复合结构的非必要部分，不能只凭语言类型判断所有真实代码的设计质量。","demo":"coupQuiz"},{"id":"3:0","chapter":3,"index":0,"title":"结构化开发方法与分析产出","fullTitle":"结构化开发方法与分析产出","intro":"以数据流为中心，构建分析与设计模型，适用于需求相对明确的传统开发情境。","points":[{"text":"SA：Structured Analysis，结构化分析。","note":"","priority":""},{"text":"SD：Structured Design，结构化设计。","note":"","priority":""},{"text":"SPD（前课也写 SP）：结构化程序设计。","note":"","priority":""},{"text":"课件：分层 DFD、数据字典、小说明（加工逻辑）、补充材料。","note":"","priority":""},{"text":"老师结合软件工程补充三大模型：DFD 功能模型、STD 行为模型、E-R 数据模型，以及数据字典。","note":"","priority":""}],"source":"PDF 第6–8页；转写结构化分析","priority":"frequent","memory":"分析出逻辑模型，设计出模块结构；DFD 功能、STD 行为、E-R 数据。","visual":"table","table":{"headers":["分析产出","含义"],"rows":[["DFD","功能及数据变换"],["STD","状态转换、行为"],["E-R 图","数据实体与联系"],["DD","数据字典，定义图中成分"],["小说明","描述基本加工逻辑"]]},"notice":"课程后文将 SA 产出的模型与课件列举的文档互补说明；SPD/SP 为课程缩写差异。不能把结构化设计等同于某一种编程语言。"},{"id":"3:1","chapter":3,"index":1,"title":"DFD 四类基本图形元素","fullTitle":"DFD 四类基本图形元素","intro":"数据流图描述数据在系统中如何流动和变换，用于功能建模，不是数据库实体关系图。","points":[{"text":"外部实体：系统外的数据来源或归宿，矩形。","note":"","priority":""},{"text":"加工：转换输入数据流为输出数据流，圆角矩形或圆形。","note":"","priority":""},{"text":"数据存储：存放数据，双平行线或开口矩形。","note":"","priority":""},{"text":"数据流：有向箭头，描述一组数据的流向。","note":"","priority":""}],"source":"PDF 第6–8页；转写结构化分析","priority":"must","memory":"实体、加工、存储、流；DFD 是功能模型。","visual":"table","table":{"headers":["元素","含义","命名示例"],"rows":[["外部实体","系统外的交互者","读者"],["加工","数据变换","办理借阅"],["数据存储","存储数据","借阅记录"],["数据流","传递的数据","借阅申请"]]},"demo":"elements"},{"id":"3:2","chapter":3,"index":2,"title":"DFD 数据流连接规则","fullTitle":"DFD 数据流连接规则","intro":"老师总结为“数据流的流向必须经过加工”，即一条数据流至少一端是加工。","points":[{"text":"实体→加工、加工→实体合法。","note":"","priority":""},{"text":"存储→加工、加工→存储合法。","note":"","priority":""},{"text":"加工→加工也可以传递数据。","note":"","priority":""},{"text":"实体→实体、实体→存储、存储→存储不直接相连；反向同理。","note":"","priority":""},{"text":"合法连线仍需检查数据意义、加工输入输出与层间一致性。","note":"","priority":""}],"source":"PDF 第6–8页；转写结构化分析","priority":"must","memory":"每条数据流至少一端是加工。","notice":"数据流图描述系统边界内的功能与数据流，不用直接实体间连线来表示系统外业务。","demo":"links"},{"id":"3:3","chapter":3,"index":3,"title":"加工三类错误：黑洞、奇迹、灰洞","fullTitle":"加工三类错误：黑洞、奇迹、灰洞","intro":"课件第7页上图展示三种典型错误。老师指出黑洞和奇迹一眼可辨，灰洞更难，案例分析需要结合语义判断。","points":[{"text":"黑洞：有输入、无输出。","note":"","priority":""},{"text":"奇迹：有输出、无输入。","note":"","priority":""},{"text":"灰洞：既有输入也有输出，但输入不足以产生输出。","note":"","priority":""},{"text":"课件示例：仅有雇员地址却产生银行结算表，缺少结算数据。","note":"","priority":""},{"text":"审题需要结合加工职责和数据流内容，不只数箭头。","note":"","priority":""}],"source":"PDF 第6–8页；转写结构化分析","priority":"must","memory":"黑洞只进；奇迹只出；灰洞输入不足。","visual":"table","table":{"headers":["类型","输入","输出","判断"],"rows":[["黑洞","有","无","吞掉数据"],["奇迹","无","有","凭空产生"],["灰洞","有但不足","有","逻辑不支持"]]},"demo":"errors","examples":[{"title":"灰洞排查","given":"某加工只接收雇员地址，却输出银行结算表。","steps":["检查输入：存在雇员地址。","检查输出：存在结算表。","核对含义：缺少账户、金额或结算明细等必要数据。"],"answer":"灰洞；补齐产生结算表的必要输入。","warning":""}]},{"id":"3:4","chapter":3,"index":4,"title":"外部实体的识别","fullTitle":"外部实体的识别","intro":"老师指出选择题常考外部实体：它存在于软件系统之外，并与系统交换数据。","points":[{"text":"外部实体是数据的来源或归宿，可以是人员、组织或其他系统。","note":"","priority":""},{"text":"是否外部取决于当前系统边界，而不是现实世界的组织归属。","note":"","priority":""},{"text":"课件图书馆管理系统例：读者是外部实体。","note":"","priority":""},{"text":"图书信息、借书证等通常是数据或数据对象；“借阅”是业务加工而非实体。","note":"","priority":""}],"source":"PDF 第6–8页；转写结构化分析","priority":"frequent","memory":"先定系统边界，再找系统外与它交换数据的主体。"},{"id":"3:5","chapter":3,"index":5,"title":"分层数据流图：顶层、0层、1层","fullTitle":"分层数据流图：顶层、0层、1层","intro":"课件第7页下图以考试管理系统为例，说明由整体到局部、自顶向下逐层分解。","points":[{"text":"顶层图（上下文图）：一个加工代表整个系统，展示与外部实体的交换。","note":"","priority":""},{"text":"0层图：分解整个系统为若干主要加工及必要数据存储。","note":"","priority":""},{"text":"1层图：进一步分解0层中的某一个加工，可按1.1、1.2等编号。","note":"","priority":""},{"text":"课程案例：考试管理系统的报名登记与统计成绩两大加工，再分解报名检查、编号、登记等。","note":"","priority":""},{"text":"老师录课经验：案例题常考顶层与0层。","note":"","priority":""}],"source":"PDF 第6–8页；转写结构化分析","priority":"must","memory":"顶层看边界，0层看主要功能，1层细化一个父加工。","demo":"layers"},{"id":"3:6","chapter":3,"index":6,"title":"父子图平衡与加工分解","fullTitle":"父子图平衡与加工分解","intro":"子图的边界输入、输出必须与其对应的父加工保持一致。","points":[{"text":"顶层和0层比较整个系统边界数据流。","note":"","priority":""},{"text":"1层子图比较被分解的那一个0层加工，而不是0层整张图。","note":"","priority":""},{"text":"子图内部可新增内部加工、存储及内部流。","note":"","priority":""},{"text":"父图的边界数据不得无故丢失或增加；语义等价的组合/拆分需能够由数据字典对应。","note":"","priority":""},{"text":"检查方向、名称和内容，不能只比较数量。","note":"","priority":""}],"source":"PDF 第6–8页；转写结构化分析","priority":"must","memory":"平衡看父加工的边界，不看子图内部新增连线。","demo":"balance","examples":[{"title":"分层平衡案例（教学改编）","given":"父加工“办理借阅”的输入为借阅申请，输出为借阅结果；子图却额外向读者输出缴费通知。","steps":["列出父加工的边界输入与输出。","列出子图跨边界数据流。","逐项比较，发现缴费通知在父图不存在。","若确需此流，应同步修改父图及相关需求；否则删除子图多余流。"],"answer":"当前父子图不平衡。","warning":""}]},{"id":"3:7","chapter":3,"index":7,"title":"数据字典 DD：四类条目","fullTitle":"数据字典 DD：四类条目","intro":"DFD 显示数据如何流动和系统如何分解，数据字典进一步定义图中数据及加工的含义。","points":[{"text":"课件列出：数据流、数据项、数据存储、基本加工。","note":"","priority":""},{"text":"数据流：描述传输的数据组成等。","note":"","priority":""},{"text":"数据项：定义基本数据元素。","note":"","priority":""},{"text":"数据存储：定义保存的数据及结构。","note":"","priority":""},{"text":"基本加工：描述加工职责及逻辑。","note":"","priority":""},{"text":"老师提醒：本课四类条目不包含外部实体。","note":"","priority":""}],"source":"PDF 第6–8页；转写结构化分析","priority":"frequent","memory":"DD：流、项、存、加工；课件不列外部实体。","notice":"这是本课程采用的四类条目口径，不代表所有现代数据字典实现都不能记录外部实体。"},{"id":"3:8","chapter":3,"index":8,"title":"数据字典符号与加工小说明","fullTitle":"数据字典符号与加工小说明","intro":"课件第8页列出等于、加号、选择、重复四类常用符号，并说明加工逻辑描述工具。","points":[{"text":"=：被定义为；+：与，表示组成。","note":"","priority":""},{"text":"[a或b]：从备选项中选择（课件用方括号与分隔符）。","note":"","priority":""},{"text":"{a}：重复，课件示例为零个或多个 a。","note":"","priority":""},{"text":"加工逻辑也叫“小说明”。","note":"","priority":""},{"text":"常用方法：结构化语言、判定表、判定树；老师要求记住名称。","note":"","priority":""}],"source":"PDF 第6–8页；转写结构化分析","priority":"frequent","memory":"等于定义、加号组成、方括号选择、花括号重复。","visual":"table","table":{"headers":["符号","含义","教学示例"],"rows":[["=","定义","订单 = 订单号 + 金额"],["+","与","姓名 + 联系方式"],["[ ]","或","支付方式 = [现金 或 转账]"],["{ }","重复","订单 = 订单号 + {明细}"]]}},{"id":"4:0","chapter":4,"index":0,"title":"结构化设计 SD 与结构图","fullTitle":"结构化设计 SD 与结构图","intro":"SD 与 SA 衔接，面向数据流，将系统设计成由相对独立、功能单一模块组成的结构。","points":[{"text":"结构化分析采用数据流图描述功能。","note":"","priority":""},{"text":"结构化设计采用结构图（Structure Chart）描述软件体系结构。","note":"","priority":""},{"text":"结构图展示模块的组成和调用关系。","note":"","priority":""},{"text":"五种基本符号：模块、调用、数据、控制、转接。","note":"","priority":""},{"text":"DFD 到模块结构图是课程强调的分析与设计衔接。","note":"","priority":""}],"source":"PDF 第9页；转写结构化设计","priority":"frequent","memory":"DFD 看数据流动；结构图看模块调用。","notice":"老师提到曾有一道选项均为结构图符号的异常题，这只是授课经验；本网页不复刻未给出完整题干的题目。","demo":"chart"},{"id":"4:1","chapter":4,"index":1,"title":"结构化设计的四项任务","fullTitle":"结构化设计的四项任务","intro":"课件第9页将设计分为体系结构、数据、接口、过程四部分。老师强调按关键词判断。","points":[{"text":"体系结构设计：定义软件主要结构元素及关系。","note":"","priority":""},{"text":"数据设计：基于 E-R 图，确定文件系统结构、数据库表结构。","note":"","priority":""},{"text":"接口设计：描述软件与外部环境交互、内部构件接口与调用关系。","note":"","priority":""},{"text":"过程设计：确定模块内部算法和数据结构，选择过程表示方式。","note":"","priority":""}],"source":"PDF 第9页；转写结构化设计","priority":"frequent","memory":"架构看结构关系；数据看表；接口看交互；过程看算法。","visual":"table","table":{"headers":["设计类型","关注内容"],"rows":[["体系结构","主要结构元素及关系"],["数据","文件与数据库表结构"],["接口","内外接口、调用关系"],["过程","模块算法、内部数据结构"]]},"demo":"design"},{"id":"4:2","chapter":4,"index":2,"title":"接口设计与数据设计的依据","fullTitle":"接口设计与数据设计的依据","intro":"老师特意强调课件第9页的选择题：设计阶段接口设计依据需求分析阶段的数据流图。","points":[{"text":"DFD 提供数据流及功能变换信息，有助于确定模块间数据交换和接口。","note":"","priority":""},{"text":"E-R 图提供实体联系模型，有助于数据设计。","note":"","priority":""},{"text":"过程设计要确定内部算法与数据结构，而非仅确定调用关系。","note":"","priority":""},{"text":"不要自行推断状态转换图与另外一种设计任务存在唯一对应。","note":"","priority":""}],"source":"PDF 第9页；转写结构化设计","priority":"frequent","memory":"接口设计 ← DFD；数据设计 ← E-R。"},{"id":"5:0","chapter":5,"index":0,"title":"WebApp 概念与六项特性","fullTitle":"WebApp 概念与六项特性","intro":"基于 Web 的系统和应用，课件指出大多数采用敏捷开发过程模型。老师要求了解即可。","points":[{"text":"网络密集性：依赖网络为客户群体提供服务。","note":"","priority":""},{"text":"并发性：大量用户可能同时访问。","note":"","priority":""},{"text":"无法预知的负载量：访问量可能剧烈波动。","note":"","priority":""},{"text":"性能：访问、处理及显示延迟影响使用体验。","note":"","priority":""},{"text":"可用性：热门应用通常期望全天候访问。","note":"","priority":""},{"text":"数据驱动：通过超媒体提供内容，也访问应用环境外数据库。","note":"","priority":""}],"source":"PDF 第10–11页；转写末尾","priority":"understand","memory":"网络、并发、负载、性能、可用、数据。","notice":"老师的“没考过”是录课时的经验，不代表现在或未来必然不考。WebApp 不仅是手机 App；全天候可用是目标，并非保证 100% 可用。"},{"id":"5:1","chapter":5,"index":1,"title":"WebApp 五种需求模型","fullTitle":"WebApp 五种需求模型","intro":"需求分析阶段从内容、交互、功能、导航及配置描述 WebApp。","points":[{"text":"内容模型：定义文字、图像、音频、视频等内容及结构。","note":"","priority":""},{"text":"交互模型：用户如何与应用交互，可用用例、顺序图、状态图、原型。","note":"","priority":""},{"text":"功能模型：提供计算、操作、统计等功能。","note":"","priority":""},{"text":"导航模型：从一个元素到另一个元素的导航策略。","note":"","priority":""},{"text":"配置模型：运行环境和基础设施，可采用 UML 部署图描述复杂配置。","note":"","priority":""}],"source":"PDF 第10–11页；转写末尾","priority":"understand","memory":"内容是什么；交互怎么用；功能做什么；导航怎么走；配置在哪里跑。","visual":"table","table":{"headers":["模型","关键词"],"rows":[["内容","信息与内容对象"],["交互","用户操作过程"],["功能","计算、处理"],["导航","访问路径"],["配置","环境、基础设施"]]}},{"id":"5:2","chapter":5,"index":2,"title":"WebApp 四类设计","fullTitle":"WebApp 四类设计","intro":"课件第11页：架构、构件、内容、导航设计。","points":[{"text":"架构设计：组织用户交互、内部处理、导航与内容展示。","note":"","priority":""},{"text":"构件设计：封装内容与功能；区分构件级内容设计与功能设计。","note":"","priority":""},{"text":"内容设计：内容对象的表现和导航组织；线性、网格、层次、网络结构及组合。","note":"","priority":""},{"text":"导航设计：定义导航路径，使用户能够访问内容与功能。","note":"","priority":""}],"source":"PDF 第10–11页；转写末尾","priority":"understand","memory":"架构、构件、内容、导航。","visual":"table","table":{"headers":["设计","关注点"],"rows":[["架构","整体组织"],["构件","功能与内容封装"],["内容","表现与组织结构"],["导航","访问路径"]]}},{"id":"5:3","chapter":5,"index":3,"title":"MVC：模型、视图、控制器","fullTitle":"MVC：模型、视图、控制器","intro":"课件提到 MVC 是 WebApp 基础结构模型之一，用于分离应用功能与信息内容；老师以账单查询解释。","points":[{"text":"Model 模型：数据和业务处理。","note":"","priority":""},{"text":"View 视图：呈现信息，与用户交互。","note":"","priority":""},{"text":"Controller 控制器：接收或协调用户操作，调用模型处理。","note":"","priority":""},{"text":"账单查询示例：用户操作视图→控制器处理→模型查询数据→视图显示账单。","note":"","priority":""},{"text":"MVC 的具体调用关系因框架而异。","note":"","priority":""}],"source":"PDF 第10–11页；转写末尾","priority":"understand","memory":"M 管数据与业务，V 管显示，C 管协调。","notice":"课程的“模型直接返回视图”是示意流程，现代框架的返回路径不一定一致。","demo":"mvc"}],"quizzes":[{"chapter":2,"topic":"2:2","question":"无关的日志、打印、计算等被随意放在同一模块。 主要体现哪类内聚？","options":["逻辑内聚","时间内聚","过程内聚","偶然内聚"],"answer":3,"explain":"依据：无直接关系。题干仅突出该分类特征。"},{"chapter":2,"topic":"2:3","question":"根据参数选择不同类型的处理操作。 主要体现哪类内聚？","options":["逻辑内聚","时间内聚","过程内聚","通信内聚"],"answer":0,"explain":"依据：逻辑相似、参数决定。题干仅突出该分类特征。"},{"chapter":2,"topic":"2:4","question":"把启动时需要执行的多个初始化动作放在一起。 主要体现哪类内聚？","options":["过程内聚","通信内聚","时间内聚","顺序内聚"],"answer":2,"explain":"依据：同一时间执行。题干仅突出该分类特征。"},{"chapter":2,"topic":"2:5","question":"若干动作按照规定步骤执行，不要求前一输出成为后一输入。 主要体现哪类内聚？","options":["通信内聚","顺序内聚","功能内聚","过程内聚"],"answer":3,"explain":"依据：指定的过程顺序。题干仅突出该分类特征。"},{"chapter":2,"topic":"2:6","question":"多项操作使用同一份数据或产生相同输出。 主要体现哪类内聚？","options":["顺序内聚","通信内聚","功能内聚","偶然内聚"],"answer":1,"explain":"依据：相同数据结构、相同输入输出。题干仅突出该分类特征。"},{"chapter":2,"topic":"2:7","question":"解析文本→清洗解析结果→统计清洗结果。 主要体现哪类内聚？","options":["功能内聚","顺序内聚","偶然内聚","逻辑内聚"],"answer":1,"explain":"依据：顺序执行、前一输出为后一输入。题干仅突出该分类特征。"},{"chapter":2,"topic":"2:8","question":"多个处理元素协作完成一个明确的功能。 主要体现哪类内聚？","options":["偶然内聚","逻辑内聚","时间内聚","功能内聚"],"answer":3,"explain":"依据：共同作用、缺一不可。题干仅突出该分类特征。"},{"chapter":2,"topic":"2:11","question":"两个模块不直接调用，也不交换信息。 主要体现哪类耦合？","options":["无直接耦合","数据耦合","标记耦合","控制耦合"],"answer":0,"explain":"依据：无直接关系。"},{"chapter":2,"topic":"2:12","question":"A 调用 B 时仅传递所需数值或简单变量。 主要体现哪类耦合？","options":["数据耦合","标记耦合","控制耦合","外部耦合"],"answer":0,"explain":"依据：传递简单数据值。"},{"chapter":2,"topic":"2:13","question":"A 向 B 传递记录结构 X。 主要体现哪类耦合？","options":["控制耦合","标记耦合","外部耦合","公共耦合"],"answer":1,"explain":"依据：传递数据结构。"},{"chapter":2,"topic":"2:14","question":"A 调用 B 并传入模式标志，决定 B 内部执行哪个功能。 主要体现哪类耦合？","options":["控制耦合","外部耦合","公共耦合","内容耦合"],"answer":0,"explain":"依据：控制变量、选择执行某一功能。"},{"chapter":2,"topic":"2:15","question":"两个模块因依赖同一外部设备格式或通信协议而关联。 主要体现哪类耦合？","options":["外部耦合","公共耦合","内容耦合","无直接耦合"],"answer":0,"explain":"依据：软件外部环境。"},{"chapter":2,"topic":"2:16","question":"两个模块直接读写同一个共享全局变量。 主要体现哪类耦合？","options":["内容耦合","无直接耦合","数据耦合","公共耦合"],"answer":3,"explain":"依据：公共数据环境。"},{"chapter":2,"topic":"2:17","question":"A 绕过 B 的正常入口，直接访问 B 内部数据或跳入内部代码。 主要体现哪类耦合？","options":["无直接耦合","数据耦合","标记耦合","内容耦合"],"answer":3,"explain":"依据：模块内部关联。"},{"chapter":1,"topic":"1:0","question":"系统分析阶段最后形成的是？","options":["当前系统物理模型","目标系统物理模型","源程序","目标系统逻辑模型"],"answer":3,"explain":"分析的结果是目标系统逻辑模型，具体化属于系统设计。"},{"chapter":1,"topic":"1:0","question":"从目标逻辑模型到目标物理模型属于？","options":["系统设计","系统分析","系统规划","系统维护"],"answer":0,"explain":"第四步是具体化，属于系统设计。"},{"chapter":1,"topic":"1:1","question":"主要描述系统功能和性质的是？","options":["物理模型","源代码","逻辑模型","测试报告"],"answer":2,"explain":"逻辑模型回答做什么；物理模型回答如何实现。"},{"chapter":1,"topic":"1:2","question":"对外公开接口但隐藏模块内部细节体现？","options":["公共耦合","信息隐藏","内容耦合","重复设计"],"answer":1,"explain":"信息隐藏有助于提高模块独立性。"},{"chapter":1,"topic":"1:3","question":"下列哪项不符合系统结构设计原则？","options":["高内聚低耦合","自顶向下","扇入扇出合理","模块规模越小越好"],"answer":3,"explain":"课件强调规模适当，不是越小越好。"},{"chapter":1,"topic":"1:4","question":"A、B调用M，M调用X、Y、Z，M的扇入和扇 const {chapters,lessons,quizzes}=DATA;
const lessonMap=new Map(lessons.map(t=>[t.id,t]));
const totalStudy=lessons.filter(t=>t.chapter>0).length;
const sessionStore=new Map();
function load(key,def){try{const v=localStorage.getItem(key);if(v)return JSON.parse(v)}catch(e){}return sessionStore.has(key)?JSON.parse(sessionStore.get(key)):def}
function save(key,value){const v=JSON.stringify(value);sessionStore.set(key,v);try{localStorage.setItem(key,v)}catch(e){}}
let mastery=load('sd_structured_v1_mastery',{});
let savedLast=load('sd_structured_v1_last','1:0');
let current=lessonMap.has(savedLast)?savedLast:'1:0';
let view='home';let openedChap=1;let mapOpen=1;let focusOnly=load('sd_structured_v1_focus_only',false)===true;
let quizState={scope:'all',items:[],index:0,picks:{},completed:false};
const el=id=>document.getElementById(id);
const esc=s=>String(s??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;');
function topicLabel(s){return esc(String(s).replace(/^[🔴🟠🔵]\s*/u,''))}
function priority(t){if(t.priority)return t.priority;if(t.points.some(p=>p.priority==='must'))return 'must';if(t.points.some(p=>p.priority==='frequent'))return 'frequent';if(t.points.some(p=>p.priority==='understand'))return 'understand';return ''}
function navPriorityLabel(pr){return pr==='must'?'<span class="nav-level must" title="必须掌握">必掌握</span>':pr==='frequent'?'<span class="nav-level frequent" title="重点 / 常考">常考</span>':''}
function levelTag(pr){return pr==='must'?'<span class="pill must">必须掌握</span>':pr==='frequent'?'<span class="pill frequent">重点 / 常考</span>':pr==='understand'?'<span class="pill understand">了解即可</span>':''}
function chapterDone(ci){let ids=chapters[ci].topicIds.filter(id=>ci!==0);return ids.filter(id=>mastery[id]===2).length}
function masteredCount(){return lessons.filter(t=>t.chapter!==0 && mastery[t.id]===2).length}
function setStatus(id,s){mastery[id]=s;save('sd_structured_v1_mastery',mastery);render();}
function markNext(id){let s=mastery[id]||0;setStatus(id,(s+1)%3)}
function openLesson(id){if(!lessonMap.has(id))return;current=id;openedChap=lessonMap.get(id).chapter;save('sd_structured_v1_last',id);setView('read')}
function setView(v){view=v;render();el('contentShell').scrollTop=0;hideMobile()}
function hideMobile(){el('sidebar').classList.remove('open');el('scrim').classList.remove('open')}
function chapNav(ci){openedChap=ci;openLesson(chapters[ci].topicIds[0])}
function renderSidebar(){
 const mustN=lessons.filter(t=>t.chapter>0&&priority(t)==='must').length;
 const freqN=lessons.filter(t=>t.chapter>0&&priority(t)==='frequent').length;
 el('sideCount').textContent=`${chapters.length} 个分支`;
 el('mustCount').textContent=mustN;el('frequentCount').textContent=freqN;
 el('focusToggle').setAttribute('aria-pressed',String(focusOnly));
 el('focusToggle').title=focusOnly?'显示全部知识主题':'只显示必须掌握和重点 / 常考的主题';
 el('navList').innerHTML=chapters.map(c=>{
  const hotIds=c.topicIds.filter(id=>{const p=priority(lessonMap.get(id));return p==='must'||p==='frequent'});
  const visibleIds=focusOnly&&c.id!==0?hotIds:c.topicIds;
  const sub=visibleIds.map(id=>{
   const t=lessonMap.get(id),pr=priority(t),done=mastery[id]===2;
   return `<button data-lesson="${id}" class="${current===id&&view==='read'?'selected':''} ${done?'complete':''} ${pr==='must'||pr==='frequent'?'nav-pr-'+pr:''}" title="${esc(t.title)}${pr==='must'?' · 必须掌握':pr==='frequent'?' · 重点 / 常考':''}"><span class="nav-topic-title">${esc(t.title)}</span>${navPriorityLabel(pr)}${done?'<span class="nav-done" title="已掌握">✓</span>':''}</button>`;
  }).join('');
  return `<div class="nav-group"><button class="chap-button ${(view==='read'&&openedChap===c.id)?'active':''}" data-chapter="${c.id}" aria-expanded="${openedChap===c.id}"><span class="chap-num">${c.number}</span><span>${esc(c.name)}</span>${hotIds.length?`<span class="chap-focus-count" title="本章 ${hotIds.length} 个重点主题">★${hotIds.length}</span>`:''}<span class="chap-chevron">${openedChap===c.id?'⌄':'›'}</span></button>${openedChap===c.id?`<div class="subnav">${sub||'<div class="nav-empty">本章暂无重点主题</div>'}</div>`:''}</div>`;
 }).join('');
 const n=masteredCount();el('sideProgress').textContent=`${n} / ${totalStudy}`;el('sideProgressBar').style.width=(n/totalStudy*100).toFixed(1)+'%';
}

 if(key==='links'){const names=[['外部实体','数据存储'],['外部实体','加工'],['加工','加工'],['数据存储','数据存储'],['加工','数据存储'],['数据存储','加工']][i];let type=x=>x==='加工'?'proc':x==='数据存储'?'store':'entity';return wrap(row([node(names[0],type(names[0])),edge('数据流'),node(names[1],type(names[1]))]));}

 if(key==='layers'){
 let rows=[row([node('读者','entity'),edge('申请'),node('借阅管理系统','proc',true),edge('结果'),node('读者','entity')]),row([node('读者','entity'),edge('申请'),node('1 办理借阅','proc',true),edge('记录'),node('2 管理记录','proc')])+row([node('1 办理借阅'),edge('结果'),node('读者','entity')]),row([node('读者','entity'),edge('申请'),node('1.1 检查申请'),edge('核对结果'),node('1.2 生成结果','proc',true),edge('结果'),node('读者','entity')])];return wrap(rows[i]+'<div class="st-caption">简化教学示意：省略未在本步展开的内部数据流和数据存储。</div>');}
 if(key==='balance'){const pairs=[['借阅申请','借阅结果','借阅申请','借阅结果'],['借阅申请','借阅结果','借阅申请','借阅结果、缴费通知'],['借阅申请、读者信息','借阅结果','借阅申请','借阅结果'],['订单','审核结果','订单号、金额','审核结果']][i];return wrap('<div class="st-caption">父加工</div>'+row([node('外部来源','entity'),edge(pairs[0]),node('父加工'),edge(pairs[1]),node('外部归宿','entity')])+'<div class="st-caption">子图边界</div>'+row([node('外部来源','entity'),edge(pairs[2]),node('细化加工 A'),edge('内部数据'),node('细化加工 B'),edge(pairs[3]),node('外部归宿','entity')]));}
 if(key==='fan')return wrap('<div class="st-tree">'+row([node('A','entity',i===0),node('B','entity',i===0)])+'<div class="st-down">↘　↙</div>'+row([node('M','proc',true)])+'<div class="st-down">↙　↓　↘</div>'+row(['X','Y','Z'].map(x=>node(x,'entity',i===1)))+'</div>');
 if(key==='chart')return i===0?wrap(row([node('读者','entity'),edge('申请'),node('办理借阅','proc'),edge('结果'),node('读者','entity')])):wrap(row([node('借阅管理','proc',true)])+'<div class="st-down">↙　↓　↘</div>'+row(['检查资格','登记借阅','返回结果'].map(x=>node(x,'entity'))));
 if(key==='mvc')return wrap(row(['View','Controller','Model','View'].flatMap((x,j)=>[...(j?[edge(['','请求','调用','返回数据'][j])]:[]),node(x,'proc',j===i)])));

function renderMap(){el('topTitle').textContent='结构化开发方法 · 知识脑图';return `<div class="kicker">KNOWLEDGE MAP</div><h1 class="big-title">一张图，看懂整章知识结构</h1><p class="lede">按章节展开知识分支。点击右侧主题可以直接跳转到图文精讲；再次点击已展开的章节可以收起。</p><div class="map-root">结构化开发方法 <span style="font-size:12px;margin-left:13px;opacity:.7;align-self:center">5 组知识主题 · 1 份考试定位</span></div><div class="map-rail">${chapters.map(c=>`<div class="map-branch"><button class="map-chap ${mapOpen===c.id?'on':''}" data-mapchap="${c.id}"><span>${c.number} · ${esc(c.name)}</span><b>${mapOpen===c.id?'−':'+'}</b></button><div class="map-topics">${mapOpen===c.id?c.topicIds.map(id=>{let t=lessonMap.get(id);return `<button class="map-topic" data-lesson="${id}"><b>${esc(t.title)}</b><small>${t.points.length} 个知识条目 · 查看精讲 ↗</small><div class="map-details">${t.points.slice(0,3).map(p=>`<span>• ${topicLabel(p.text)}</span>`).join('')}${t.points.length>3?`<span>… 及其他 ${t.points.length-3} 项</span>`:''}</div></button>`}).join(''):`<div style="color:#92a1b0;font-size:12px;padding:13px">${c.topicIds.length} 个子主题 · 点击左侧展开</div>`}</div></div>`).join('')}</div>`}
function renderQuick(){el('topTitle').textContent='结构化开发方法 · 考前速记';
 const rules=[["四模型转换", "当前物理→当前逻辑→目标逻辑→目标物理", "1:0"], ["分析与设计", "分析止于目标逻辑；设计形成目标物理", "1:1"], ["模块独立", "高内聚、低耦合", "2:0"], ["内聚排序", "偶、逻、时、过、通、顺、功", "2:1"], ["耦合排序", "无、数、标、控、外、公、内", "2:10"], ["内聚辨析", "过程看步骤；顺序看输出接输入", "2:9"], ["耦合辨析", "传值、传结构、传控制、共享全局", "2:18"], ["DFD连接", "每条数据流至少一端是加工", "3:2"], ["三种错误", "黑洞只进；奇迹只出；灰洞输入不足", "3:3"], ["父子图平衡", "比较被分解加工的边界输入与输出", "3:6"], ["DD条目", "数据流、数据项、数据存储、基本加工", "3:7"], ["设计依据", "接口←DFD；数据←E-R", "4:2"]];
 return `<div class="kicker">QUICK RECALL</div><h1 class="big-title">考前速记 · 核心概念与易混对照</h1><p class="lede">这章重点是内聚、耦合、DFD 与系统设计。建议先遮住答案自测，再点击跳回精讲。</p><div class="section-label"><h2>12 条高效判题规则</h2><p>按课件与老师重点整理；资料核对与教学补充另行标明</p></div><div class="qgrid">${rules.map(x=>`<article class="card" style="margin:0"><h3 style="margin:0 0 8px">${x[0]}</h3><div class="formula">${x[1]}</div><button class="small-button tinted" style="margin-top:13px" data-lesson="${x[2]}">查看精讲 ↗</button></article>`).join('')}</div>${chapters.slice(1).map(c=>`<div class="section-label"><h2>${c.number} · ${esc(c.name)}</h2><p>${c.topicIds.length} 个主题</p></div><div class="qgrid">${c.topicIds.map(id=>{let t=lessonMap.get(id);return `<article class="quick-card"><div class="qtag">${esc(c.name)} ${levelTag(priority(t))}</div><h3>${esc(t.title)}</h3><p>${esc(t.memory||t.points.slice(0,2).map(p=>p.text).join('；'))}</p><button data-lesson="${id}">完整精讲 ↗</button></article>`}).join('')}</div>`).join('')}`;
}
function getQuizItems(scope){return quizzes.map((q,i)=>({...q,key:i})).filter(q=>scope==='all'||q.chapter===Number(scope)||scope==='wrong'&&load('sd_structured_v1_wrong',[]).includes(q.key));}
function startQuiz(scope){quizState={scope,items:getQuizItems(scope),index:0,picks:{},completed:false};setView('quiz')}
function chooseQuiz(idx){const item=quizState.items[quizState.index];if(quizState.picks[item.key]!==undefined)return;quizState.picks[item.key]=idx;render()}
function nextQuiz(){quizState.index++;if(quizState.index>=quizState.items.length){quizState.completed=true;const errors=quizState.items.filter(q=>quizState.picks[q.key]!==q.answer).map(q=>q.key);let old=new Set(load('sd_structured_v1_wrong',[]));for(let q of quizState.items)old.delete(q.key);for(let k of errors)old.add(k);save('sd_structured_v1_wrong',[...old]);}render();el('contentShell').scrollTop=0}
function renderQuiz(){el('topTitle').textContent='结构化开发方法 · 随堂练习';if(!quizState.items.length&&!quizState.completed){quizState.items=getQuizItems(quizState.scope)}let qs=quizState.items,idx=quizState.index;
 let filters=`<div class="quiz-filter"><button data-quizscope="all" class="${quizState.scope==='all'?'chosen':''}">全章 · ${quizzes.length} 题</button>${chapters.slice(1).map(c=>`<button data-quizscope="${c.id}" class="${quizState.scope===String(c.id)?'chosen':''}">${c.number} ${esc(c.name)} · ${getQuizItems(String(c.id)).length} 题</button>`).join('')}<button data-quizscope="wrong" class="${quizState.scope==='wrong'?'chosen':''}">错题重练 · ${getQuizItems('wrong').length} 题</button></div>`;
 if(!qs.length)return `<div class="kicker">PRACTICE</div><h1 class="big-title">随堂练习</h1><p class="lede">本组暂无试题或尚未产生错题。选择其他章节继续练习。</p>${filters}`;
 if(quizState.completed){let score=qs.filter(q=>quizState.picks[q.key]===q.answer).length;return `<div class="kicker">PRACTICE RESULT</div><h1 class="big-title">练习完成</h1><div class="score-card"><div class="huge">${Math.round(score/qs.length*100)}<small style="font-size:20px">分</small></div><h2>${score} / ${qs.length} 题正确</h2><p>${qs.length-score===0?'这组知识点都答对了，可以去精讲中继续学习其他内容。':`有 ${qs.length-score} 道题答错，错题会保存在当前浏览器中，可以单独重练。`}</p><button class="small-button primary" data-quizscope="${quizState.scope}">再做一遍</button><button class="small-button" data-quizscope="wrong">重练错题</button><button class="small-button" data-view="quick">查看考前速记</button></div>${filters}`;}
 let q=qs[idx],pick=quizState.picks[q.key],answered=pick!==undefined,chapter=chapters[q.chapter];return `<div class="kicker">PRACTICE / SELF TEST</div><h1 class="big-title">随堂练习</h1><p class="lede" style="margin-bottom:11px">按课程内容编写的自测题（非历年真题原文），答题后立即展示正确答案和解析。</p>${filters}<div class="quiz-wrap"><div class="quiz-top"><span class="tiny">${esc(chapter.name)} · 第 ${idx+1} / ${qs.length} 题</span><div class="quiz-progress"><i style="width:${idx/qs.length*100}%"></i></div><b style="font-size:12px;color:#6e8192">${Math.round(idx/qs.length*100)}%</b></div><div class="quiz-card"><span class="pill">单选题</span><h2>${esc(q.question)}</h2><div class="options">${q.options.map((o,j)=>`<button class="option ${answered&&j===q.answer?'correct':''} ${answered&&pick===j&&j!==q.answer?'incorrect':''} ${answered&&pick===j?'selected':''}" data-option="${j}" ${answered?'disabled':''}><i>${'ABCD'[j]}.</i><span>${esc(o)}</span></button>`).join('')}</div>${answered?`<div class="explain"><strong>${pick===q.answer?'✓ 回答正确':'✕ 回答错误'} · 正确答案 ${'ABCD'[q.answer]}</strong><div style="margin-top:5px">${esc(q.explain)}</div><div style="margin-top:10px"><button class="small-button tinted" data-lesson="${q.topic}">返回对应知识点 ↗</button></div></div>`:''}<div class="quiz-bottom"><span class="tiny">请先选择一个答案</span><button class="small-button primary" data-nextquestion ${!answered?'disabled':''}>${idx===qs.length-1?'查看成绩':'下一题 →'}</button></div></div></div>`;}
function renderRail(){if(view!=='read')return '';let t=lessonMap.get(current),c=chapters[t.chapter];return `<div class="rail-card"><h3>本章目录 · ${c.number}</h3>${c.topicIds.map((id,i)=>`<button class="rail-topic ${id===current?'current':''}" data-lesson="${id}">${String(i+1).padStart(2,'0')} · ${esc(lessonMap.get(id).title)} ${mastery[id]===2?'✓':''}</button>`).join('')}<div class="rail-memory"><strong>本节一句话</strong><p>${esc(t.memory||t.points[0]?.text||'')}</p><div class="tiny">${esc(t.source)}</div></div></div>`}
function render(){renderSidebar();document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('on',b.dataset.tab===view));const main=el('mainContent');main.className='content '+(view==='read'?'reading':'');main.innerHTML=({home:renderHome,read:renderRead,map:renderMap,quick:renderQuick,quiz:renderQuiz}[view]||renderHome)();const shell=el('contentShell');shell.classList.toggle('withrail',view==='read');el('rightRail').innerHTML=renderRail()}
function openSearch(){el('searchOverlay').classList.remove('hidden');el('searchInput').focus();searchResults('')}
function closeSearch(){el('searchOverlay').classList.add('hidden')}
function searchResults(term){
 term=term.trim().toLowerCase();
 let hits=term?lessons.filter(t=>(t.title+' '+t.intro+' '+t.points.map(p=>p.text+' '+p.note).join(' ')).toLowerCase().includes(term)):lessons.filter(t=>t.chapter>0&&priority(t)==='must').slice(0,8);
 if(term)hits.sort((a,b)=>{const score=t=>{let name=t.title.toLowerCase();return name===term?0:name.startsWith(term)?1:name.includes(term)?2:3};return score(a)-score(b) || a.chapter-b.chapter || a.index-b.index});
 let n=hits.length;hits=hits.slice(0,25);
 el('searchResults').innerHTML=`<div class="tiny">${term?`匹配 ${n} 个知识主题`:'建议重点内容'}</div>`+hits.map(t=>`<button class="sr" data-searchlesson="${t.id}"><strong>${esc(t.title)}</strong><small>${esc(chapters[t.chapter].name)} · ${esc(t.intro.slice(0,66))}…</small></button>`).join('')+(hits.length?'':'<div class="tiny">没有匹配结果，试试其他关键词。</div>');
}
document.body.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;
 if(b.dataset.stpick!==undefined||b.dataset.stmove!==undefined||b.hasAttribute('data-streset')){let t=lessonMap.get(current);if(!t||!ST_CHALLENGES[t.demo])return;let st=demoState[t.id]||{i:0,pick:null};if(b.hasAttribute('data-streset'))st={i:0,pick:null};else if(b.dataset.stmove!==undefined)st={i:Math.max(0,Math.min(ST_CHALLENGES[t.demo].length-1,st.i+(+b.dataset.stmove))),pick:null};else if(st.pick===null)st={i:st.i,pick:+b.dataset.stpick};demoState[t.id]=st;el('seDemoBody').innerHTML=demoBody(t);return}

 if(b.dataset.sestep!==undefined||b.dataset.secase!==undefined||b.hasAttribute('data-sereset')){let t=lessonMap.get(current);if(!t?.demo)return;if(b.hasAttribute('data-sereset'))demoState[t.id]=t.demo==='coverage'?[]:0;else if(b.dataset.secase!==undefined){let a=new Set(demoState[t.id]||[]),n=+b.dataset.secase;a.has(n)?a.delete(n):a.add(n);demoState[t.id]=[...a]}else demoState[t.id]=+b.dataset.sestep;el('seDemoBody').innerHTML=demoBody(t);return}

 if(b.id==='focusToggle'){focusOnly=!focusOnly;save('sd_structured_v1_focus_only',focusOnly);renderSidebar();return}
 if(b.dataset.view){setView(b.dataset.view);return}
 if(b.dataset.tab){setView(b.dataset.tab);return}
 if(b.dataset.chapter!==undefined){let ci=+b.dataset.chapter;if(openedChap===ci){openedChap=-1;renderSidebar()}else{openedChap=ci;renderSidebar()}return}
 if(b.dataset.lesson){openLesson(b.dataset.lesson);return}
 if(b.dataset.master){markNext(b.dataset.master);return}
 if(b.dataset.mapchap!==undefined){let ci=+b.dataset.mapchap;mapOpen=mapOpen===ci?-1:ci;render();return}
 if(b.dataset.quizscope){startQuiz(b.dataset.quizscope);return}
 if(b.dataset.quiztopic){const t=lessonMap.get(b.dataset.quiztopic);quizState={scope:String(t.chapter),items:getQuizItems(String(t.chapter)),index:0,picks:{},completed:false};setView('quiz');return}
 if(b.dataset.option!==undefined){chooseQuiz(+b.dataset.option);return}
 if(b.hasAttribute('data-nextquestion')){nextQuiz();return}
 if(b.dataset.searchlesson){closeSearch();openLesson(b.dataset.searchlesson);return}
});
