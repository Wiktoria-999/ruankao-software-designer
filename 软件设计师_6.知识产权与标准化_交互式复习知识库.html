.db-flow{display:flex;align-items:center;justify-content:center;gap:9px;flex-wrap:wrap;margin:8px 0}

.db-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(155px,1fr));gap:10px}.db-grid .db-node{min-width:0;max-width:none}
.db-layer{text-align:center}.db-layer>.db-grid{margin-top:12px}

.db-rectangle{width:95px;height:60px;border-radius:5px}.db-oval{width:100px;height:60px;border-radius:50%}.db-rhombus{width:65px;height:65px;transform:rotate(45deg);border-radius:4px}.db-rhombus b{transform:rotate(-45deg);display:block;font-size:13px}

<script>
const DATA = {"chapters":[{"id":0,"number":"00","name":"本章考试定位","subtitle":"PDF 第2页；转写开篇及结尾","topicIds":["0:0","0:1"]},{"id":1,"number":"01","name":"知识产权概述","subtitle":"PDF 第2页；转写第1–2页","topicIds":["1:0","1:1"]},{"id":2,"number":"02","name":"保护期限","subtitle":"PDF 第3页上表；转写第2–4页","topicIds":["2:0","2:1","2:2","2:3","2:4","2:5","2:6"]},{"id":3,"number":"03","name":"知识产权人的确定","subtitle":"PDF 第3页下表、第4页上表；转写第4–7页","topicIds":["3:0","3:1","3:2","3:3","3:4","3:5","3:6","3:7"]},{"id":4,"number":"04","name":"侵权判定","subtitle":"PDF 第4页下表、第5页真题；转写第7–8页","topicIds":["4:0","4:1","4:2","4:3","4:4","4:5"]},{"id":5,"number":"05","name":"标准划分与编号","subtitle":"PDF 第6页；转写第8–10页","topicIds":["5:0","5:1","5:2","5:3"]}],"lessons":[{"id":"0:0","chapter":0,"index":0,"title":"本章考试定位","fullTitle":"本章考试定位","intro":"老师估计本章通常约 2～3 分，主要考知识产权保护期限、归属、侵权判定；标准化较少，重点认识编号。","points":[{"text":"侵权判定是老师认为考查最多的部分。","note":"课程经验，不是固定配分。","priority":"frequent"},{"text":"保护期限和产权人归属是必读对照表。","note":"老师称这几张表是主要考查内容。","priority":"frequent"},{"text":"标准化重点是分类与编号。","note":"无需深入标准协议内容。","priority":"understand"}],"source":"PDF 第2页；转写开篇及结尾","priority":"","memory":"期限 → 归属 → 侵权 → 标准代号。","visual":"table","table":{"headers":["学习板块","学习任务"],"rows":[["概述","认识四属性"],["期限","记住年数和起算点"],["归属","区分职务、委托、合作"],["侵权","判断使用行为与法定条件"],["标准化","识别分类和编号"]]}},{"id":"0:1","chapter":0,"index":1,"title":"资料口径与法规版本","fullTitle":"资料口径与法规版本","intro":"本章以课件五个板块为主；因课程有旧法和口头简化，另行对照现行法规，不把旧答案直接当作现行法律。","points":[{"text":"PDF 第3页：保护期限与职务作品两张表。","note":"","priority":""},{"text":"PDF 第4页：委托、合作、商标专利申请及侵权对照。","note":"","priority":""},{"text":"PDF 第5页：四道课程真题；部分表述绝对化。","note":"","priority":""},{"text":"PDF 第6页：标准划分与编号。","note":"","priority":""},{"text":"法规核对日期：2026年11月25日；2026年新商标法已公布，2027年1月1日施行。","note":"","priority":""}],"source":"PDF 第2页；转写开篇及结尾","priority":"","memory":"遇到法律题先看题干指定的法条版本。","notice":"本页属于备考资料，不是针对实际纠纷的法律意见。正文中的“现行核对”与教师授课重点分开；不进行全面法律更新。"},{"id":"1:0","chapter":1,"index":0,"title":"知识产权的定义与对象","fullTitle":"知识产权的定义与对象","intro":"知识产权是依法对智力成果及经营标记等享有的民事权利。其客体不是承载成果的实物本身。","points":[{"text":"著作权、专利权、商标权是本章主要对象。","note":"老师强调围绕这三类展开。","priority":""},{"text":"商业秘密：补充了解。","note":"老师指出教材相关内容较少。","priority":"understand"},{"text":"其他包括植物新品种、集成电路布图设计、地理标志等。","note":"","priority":""},{"text":"买到软件光盘的实物，不等于获得软件著作权。","note":"","priority":""}],"source":"PDF 第2页；转写第1–2页","priority":"","memory":"智力成果及标记 ≠ 实物载体。","visual":"table","table":{"headers":["权利","主要对象"],"rows":[["著作权","作品的表达"],["专利权","符合法定条件的发明创造"],["商标权","识别商品或服务来源的标志"],["商业秘密","符合法定条件的非公开商业信息"]]}},{"id":"1:1","chapter":1,"index":1,"title":"四大属性：无体性、专有性、地域性、时间性","fullTitle":"四大属性：无体性、专有性、地域性、时间性","intro":"老师特别强调地域性，建议结合含义判断，而不是仅记四个词。","points":[{"text":"无体性：对象是智力成果等抽象财富。","note":"不同于有形物的所有权。","priority":""},{"text":"专有性：原则上未经权利人同意或法定许可，不得擅自行使专有权。","note":"注意法律另有规定的情形。","priority":""},{"text":"地域性：权利的保护与相应法域有关。","note":"老师指出常见考点。","priority":"frequent"},{"text":"时间性：许多权利只在法定期限内受保护。","note":"不是所有权项都有限期。","priority":""}],"source":"PDF 第2页；转写第1–2页","priority":"frequent","memory":"无体、专有、地域、时间。","visual":"table","table":{"headers":["属性","题目关键词"],"rows":[["无体性","智力成果、抽象物"],["专有性","权利人、许可"],["地域性","不同国家、法域"],["时间性","保护期限、到期"]]},"notice":"地域性并不排除依国际条约、优先权等途径在其他国家取得保护；署名权等不受期限限制，商标可依法续展。不要将课堂的绝对化表述视为普遍规则。"},{"id":"2:0","chapter":2,"index":0,"title":"保护期限总表","fullTitle":"保护期限总表","intro":"课件第3页把普通作品、软件、注册商标、专利和商业秘密放在一张表中。本节按类型和起算时间对照。","points":[{"text":"普通作品：自然人的发表权及财产权，终生加死后50年。","note":"到第50年的12月31日。","priority":"frequent"},{"text":"软件：自然人一般终生加50年，法人或其他组织一般50年。","note":"软件著作权自开发完成产生。","priority":"frequent"},{"text":"注册商标：10年，可以依法反复续展。","note":"从核准注册日起算。","priority":"frequent"},{"text":"发明20年、实用新型10年、外观设计现行15年。","note":"三类专利均从申请日起算。","priority":"frequent"},{"text":"商业秘密没有统一固定保护年数，取决于法定条件是否持续满足。","note":"","priority":""}],"source":"PDF 第3页上表；转写第2–4页","priority":"frequent","memory":"著作权多见50；商标10可续；专利20/10/15。","visual":"table","table":{"headers":["对象","期限／起算"],"rows":[["署名、修改、保护作品完整权（著作权法）","不受限制"],["自然人发表权、财产权","终生＋50年"],["单位软件","首次发表后50年（有未发表限制）"],["商标","10年，可续展"],["发明／实用新型／外观设计","20／10／15年（申请日）"],["商业秘密","无统一固定期限"]]},"notice":"旧课件将外观设计与实用新型合写为10年。现行《专利法》第42条规定外观设计15年；详见本章法规链接。"},{"id":"2:1","chapter":2,"index":1,"title":"自然人普通作品：人身权与财产权","fullTitle":"自然人普通作品：人身权与财产权","intro":"老师用李白的诗帮助记忆：过了财产权保护期，作品仍应正确署名。","points":[{"text":"署名权、修改权、保护作品完整权：保护期不受限制。","note":"老师特别要求记住。","priority":"frequent"},{"text":"发表权及法定财产权：作者终生及死亡后50年。","note":"截止死亡后第50年12月31日。","priority":"frequent"},{"text":"合作作品以最后死亡作者的死亡时间计算。","note":"","priority":""}],"source":"PDF 第3页上表；转写第2–4页","priority":"frequent","memory":"李白的诗仍署名李白；终生＋50年，年底截止。","visual":"table","table":{"headers":["权利","期限"],"rows":[["署名、修改、保护完整","不受限制"],["发表、复制、发行等法定财产权","终生＋死后50年"]]},"examples":[{"title":"期限判断练习","given":"某独立自然人作者于2020年去世。","steps":["区分署名权与财产权。","2020＋50＝2070。","财产权截止第50年的12月31日。"],"answer":"2070年12月31日；署名权不受该期限限制。"}]},{"id":"2:2","chapter":2,"index":2,"title":"单位普通作品：50年的起算点","fullTitle":"单位普通作品：50年的起算点","intro":"旧课件将单位作品的发表权、使用权、报酬权统一写为首次发表后50年。现行著作权法区分发表权与财产权。","points":[{"text":"课件记法：单位作品没有“单位终生”，一般50年。","note":"老师重点比较个人与单位。","priority":"frequent"},{"text":"现行法：法人或非法人组织作品的发表权，从创作完成后计50年。","note":"同样适用于著作权（署名权除外）归单位的职务作品。","priority":""},{"text":"相应财产权：首次发表后50年。","note":"创作完成后50年内未发表，不再保护。","priority":""}],"source":"PDF 第3页上表；转写第2–4页","priority":"","memory":"单位作品：发表权看完成；财产权看首次发表。","visual":"table","table":{"headers":["现行法权项","截止"],"rows":[["发表权","创作完成后第50年12月31日"],["财产权","首次发表后第50年12月31日；完成50年内未发表则不再保护"]]},"notice":"现行《著作权法》第23条与旧课件简表有区别，按题目给定法律版本判断。"},{"id":"2:3","chapter":2,"index":3,"title":"计算机软件著作权期限","fullTitle":"计算机软件著作权期限","intro":"普通作品与软件在课程表格中分别列出。软件著作权还包括复制、发行、出租、网络传播、翻译等权利。","points":[{"text":"自然人软件：一般终生＋死亡后50年；合作开发以最后死亡自然人为准。","note":"截止于相应年份12月31日。","priority":"frequent"},{"text":"法人或其他组织软件：首次发表后50年。","note":"开发完成50年内未发表的，不再保护。","priority":"frequent"},{"text":"软件著作权自开发完成之日起产生，不以登记或发表为前提。","note":"","priority":""},{"text":"课件把自然人软件的署名权、修改权单列为无限期；软件条例第14条采用整体保护期表述，复习时注意所问法条及权项。","note":"","priority":""}],"source":"PDF 第3页上表；转写第2–4页","priority":"","memory":"软件：完成即产生；个人终生＋50；单位首次发表后50。","visual":"table","table":{"headers":["软件主体","一般期限"],"rows":[["自然人","终生＋50年"],["合作开发自然人","最后死亡者＋50年"],["法人／其他组织","首次发表＋50年；有未发表限制"]]},"notice":"参考《计算机软件保护条例》第14条及《著作权法》第22条。不要把普通作品全部权项的期限直接套给软件。"},{"id":"2:4","chapter":2,"index":4,"title":"注册商标：10年与续展","fullTitle":"注册商标：10年与续展","intro":"老师强调商标和专利不同，到期后可以续展，不是一次性固定期限。","points":[{"text":"注册商标每一有效期10年，自核准注册日起计算。","note":"依法续展可持续保护。","priority":"frequent"},{"text":"现行法：期满前12个月内办理续展；未办理可有6个月宽展期。","note":"每次续展10年。","priority":""},{"text":"到期未依法办理续展手续，注册商标注销。","note":"不是自动永续。","priority":""}],"source":"PDF 第3页上表；转写第2–4页","priority":"frequent","memory":"商标10年＋期满前12个月＋6个月宽展。","visual":"table","table":{"headers":["时间节点","处理"],"rows":[["核准注册","开始10年有效期"],["期满前12个月","正常续展"],["期满后6个月","宽展期"],["依法续展","再延续10年"]]},"notice":"课件只提到期满后6个月，并提到注册人死亡/终止一年未移转。这里以现行续展条款为主。2026年修订商标法于2027-01-01施行，其第44条保留12＋6个月规则。"},{"id":"2:5","chapter":2,"index":5,"title":"三种专利的保护期限","fullTitle":"三种专利的保护期限","intro":"这是本章最容易被旧资料误导的时间题。老师旧课件把发明与实用新型、外观设计分为20年和10年。","points":[{"text":"发明专利：20年。","note":"从申请日起算。","priority":"frequent"},{"text":"实用新型专利：10年。","note":"从申请日起算。","priority":"frequent"},{"text":"外观设计专利：现行15年。","note":"旧课件为10年；2020年修法后调整。","priority":"frequent"},{"text":"通常期限从申请日起算，不从授权日起算；特殊期限补偿等不作为本章主线。","note":"","priority":""}],"source":"PDF 第3页上表；转写第2–4页","priority":"frequent","memory":"现行专利：发明20、实用10、外观15。","visual":"table","table":{"headers":["种类","旧课件","现行法一般期限"],"rows":[["发明","20年","20年"],["实用新型","10年","10年"],["外观设计","10年","15年"]]},"notice":"现行《专利法》第42条，2020年修正自2021年6月1日起施行；旧申请适用过渡规则，题目未给特殊条件时按现行一般规则。"},{"id":"2:6","chapter":2,"index":6,"title":"商业秘密：无固定保护年数","fullTitle":"商业秘密：无固定保护年数","intro":"老师用企业核心配方说明，企业不一定把全部技术申请专利。商业秘密保护依赖信息保密及法定条件。","points":[{"text":"无统一10年或20年等固定期限。","note":"","priority":""},{"text":"依法公开且不再符合秘密条件的信息，通常不再作为商业秘密保护。","note":"","priority":""},{"text":"专利制度以公开换取一定期限的排他保护。","note":"","priority":""},{"text":"不是权利人单方面称为秘密就一定受保护。","note":"","priority":""}],"source":"PDF 第3页上表；转写第2–4页","priority":"","memory":"商业秘密没有统一固定年限；不是永远自动保护。","notice":"老师将“时间自己说了算”作为口头说明，不是严谨的法律判断；此处只作为课程概念辨析。"},{"id":"3:0","chapter":3,"index":0,"title":"归属判断：先看作品类型和法律关系","fullTitle":"归属判断：先看作品类型和法律关系","intro":"课程的两张归属表分别讲职务作品与委托、合作开发。做题首先识别普通作品、软件或专利。","points":[{"text":"普通职务作品：原则上作者享有，单位有业务范围内的优先使用权。","note":"法定特殊情形除外。","priority":"frequent"},{"text":"职务软件：符合规定情形时单位享有软件著作权。","note":"不能把所有在职期间成果都算单位的。","priority":"frequent"},{"text":"委托创作：按合同确定，未明确约定通常归受托方。","note":"老师反复对比。","priority":"frequent"},{"text":"合作开发：看实际创作贡献及合同。","note":"","priority":""}],"source":"PDF 第3页下表、第4页上表；转写第4–7页","priority":"frequent","memory":"先识别职务/委托/合作，再看作品类型、法定条件与有效约定。","visual":"table","table":{"headers":["关系","先判断"],"rows":[["职务","工作任务及法定例外"],["委托","合同约定；无约定看受托方"],["合作","是否实际创作、能否分割"]]},"notice":"课件第4页“单位默认归单位”是简化总结，普通职务作品不能套用该结论。"},{"id":"3:1","chapter":3,"index":1,"title":"普通职务作品：一般与特殊","fullTitle":"普通职务作品：一般与特殊","intro":"普通职务作品不必然归公司。法定特殊职务作品通常由作者保留署名权，其他著作权归单位。","points":[{"text":"一般职务作品：作者享有著作权。","note":"单位可在业务范围内优先使用；完成两年内同方式对外许可受限制。","priority":"frequent"},{"text":"特殊职务作品：主要利用单位物质技术条件，并由单位承担责任的法定类型作品。","note":"如工程设计图、产品设计图、地图、示意图等。","priority":"frequent"},{"text":"法律、行政法规或合同约定著作权归单位的职务作品，以及法定媒体从业人员的职务作品，适用特殊规则。","note":"现行法第18条。","priority":""},{"text":"个人业余创作与工作任务无关，不因任职身份自动归单位。","note":"","priority":""}],"source":"PDF 第3页下表、第4页上表；转写第4–7页","priority":"frequent","memory":"一般归作者，特殊归单位（作者享署名权）。","visual":"table","table":{"headers":["情形","归属"],"rows":[["一般职务作品","作者；单位优先使用"],["特殊职务作品","署名权归作者，其他权利归单位"],["非职务作品","按实际创作及法律关系判断"]]},"notice":"依据现行《著作权法》第18条；不是只要使用单位电脑就当然属于特殊职务作品。"},{"id":"3:2","chapter":3,"index":2,"title":"职务软件：三个法定情形","fullTitle":"职务软件：三个法定情形","intro":"课件第3页列出三个单位享有软件著作权的条件，判断是否满足其中任一项。","points":[{"text":"本职工作中明确指定的开发目标。","note":"例如公司要求实现某业务模块。","priority":"frequent"},{"text":"本职工作活动所预见或自然产生的结果。","note":"不仅限于书面指定目标。","priority":"frequent"},{"text":"主要使用单位资金、专用设备、未公开专门信息等条件，并由单位承担责任。","note":"这是一组条件，不能只看一个因素。","priority":"frequent"},{"text":"不满足职务软件条件的个人项目，应结合事实及合法约定判断。","note":"","priority":""}],"source":"PDF 第3页下表、第4页上表；转写第4–7页","priority":"frequent","memory":"目标、自然结果、主要资源＋单位担责。","visual":"table","table":{"headers":["条件","典型情境"],"rows":[["明确目标","公司指定开发系统"],["工作自然结果","为岗位任务开发配套工具"],["单位资源且承担责任","依托专用设备及单位责任研发"]]},"examples":[{"title":"情境：公司指定功能","given":"开发人员受公司指派开发订单管理模块。","steps":["判断是软件作品。","开发属于明确指定的岗位目标。","符合职务软件规则。"],"answer":"软件著作权由单位享有。"}]},{"id":"3:3","chapter":3,"index":3,"title":"职务发明与离职后一年","fullTitle":"职务发明与离职后一年","intro":"老师特别强调离职后一年内的相关发明，不要认为离职即当然与原单位无关。","points":[{"text":"本职工作中完成的发明创造属于职务发明情形。","note":"申请专利的权利原则上归单位。","priority":"frequent"},{"text":"履行单位交付的本职工作之外任务所完成的发明创造也包括在内。","note":"不只看岗位名称。","priority":""},{"text":"退休、调离或劳动人事关系终止后1年内，作出的与原单位任务或本职工作有关的发明创造。","note":"老师明确强调这一年和相关性。","priority":"frequent"},{"text":"主要利用单位物质技术条件的发明创造也应考虑专利法第6条；依法约定的情形按规定处理。","note":"","priority":""}],"source":"PDF 第3页下表、第4页上表；转写第4–7页","priority":"frequent","memory":"离职后1年＋与原工作相关，两个条件都看。","visual":"table","table":{"headers":["时间与关联","判断方向"],"rows":[["离职半年，原研发任务相关","可能属于职务发明（法定情形）"],["离职半年，与原任务无关","不能仅凭离职时间认定"],["在职完成本职任务","职务发明"]]},"notice":"依据《专利法实施细则》（2023年修订）第13条。不能把所有离职一年内成果都归原单位。"},{"id":"3:4","chapter":3,"index":4,"title":"委托作品：合同优先与默认归属","fullTitle":"委托作品：合同优先与默认归属","intro":"老师反复说明委托与职务的判断规则不同；委托方付费并不必然取得著作权。","points":[{"text":"委托创作普通作品：合同约定归属。","note":"未明确约定或没有合同，归受托人。","priority":"frequent"},{"text":"委托开发软件：书面合同约定。","note":"无书面合同或合同未明确约定，归受托人。","priority":"frequent"},{"text":"获得交付物不等于取得全部著作权。","note":"","priority":""}],"source":"PDF 第3页下表、第4页上表；转写第4–7页","priority":"frequent","memory":"委托：有约定按有效约定，无约定归受托创作方。","visual":"table","table":{"headers":["合同情况","归属"],"rows":[["约定归委托方","委托方"],["约定归受托方","受托方"],["未明确约定","受托方"]]},"examples":[{"title":"情境：外包软件","given":"甲公司委托乙公司开发软件，合同没有明确著作权归属。","steps":["识别为委托开发而非劳动职务关系。","检查合同是否明确约定。","没有明确约定，采用受托方规则。"],"answer":"乙公司（受托方）享有软件著作权。"}]},{"id":"3:5","chapter":3,"index":5,"title":"合作创作与合作开发","fullTitle":"合作创作与合作开发","intro":"合作创作强调实际创作贡献。仅提供咨询、组织等辅助行为，不能直接成为合作作者。","points":[{"text":"没有参加创作的人不能成为合作作者。","note":"老师明确指出组织、咨询、物质条件等辅助工作不等于创作。","priority":"frequent"},{"text":"共同创作的作品由合作作者共同享有著作权。","note":"具体行使与收益分配看法律和约定。","priority":""},{"text":"可分割使用的成果，各自可以对自己的部分单独享有权利。","note":"不得侵害整体作品的著作权。","priority":""},{"text":"合作开发软件有书面约定按约定，未约定再按是否能分割使用判断。","note":"","priority":""}],"source":"PDF 第3页下表、第4页上表；转写第4–7页","priority":"","memory":"看真实创作，不是看参与人数；可分割再分别行权。","visual":"table","table":{"headers":["参与方式","判断"],"rows":[["仅组织、咨询、辅助","不当然成为合作作者"],["共同实质创作","共同享有"],["可独立分割的创作部分","可对各自部分行权"]]},"notice":"课件“按人头比例”不应理解为必须平均分配，具体权益依合同及法律规定。"},{"id":"3:6","chapter":3,"index":6,"title":"商标申请：申请在先、同日使用在先","fullTitle":"商标申请：申请在先、同日使用在先","intro":"老师强调“同时”就是同一天，不比较当天上午、下午。","points":[{"text":"同种或类似商品的相同或近似商标，通常申请在先。","note":"恶意抢注、在先权利等情形另有规定。","priority":"frequent"},{"text":"同一天申请：看使用在先，并提供证据。","note":"不能按小时比较。","priority":"frequent"},{"text":"同日使用或均未使用：可协商；不愿协商或协商不成，按实施条例抽签。","note":"确定一个申请人。","priority":"frequent"}],"source":"PDF 第3页下表、第4页上表；转写第4–7页","priority":"frequent","memory":"商标：申请先 → 同日看使用 → 协商 → 抽签。","visual":"table","table":{"headers":["判断顺序","规则"],"rows":[["不同日","申请在先"],["同日","使用在先"],["同日使用/均未用","协商"],["协商不成","抽签（现行实施条例）"]]},"notice":"此处适用截至2026-11-25的现行规则（商标法及实施条例第19条）。2027年后应核对配套规则。"},{"id":"3:7","chapter":3,"index":7,"title":"专利申请：申请权与专利权","fullTitle":"专利申请：申请权与专利权","intro":"独立完成同样发明的多方可能都有申请资格，但同样发明创造原则上只能授予一项专利权。","points":[{"text":"不同日提出申请：原则上申请在先。","note":"先完成不等于先获得专利。","priority":"frequent"},{"text":"同日申请同样发明创造：依法协商确定申请人。","note":"不像商标使用抽签。","priority":"frequent"},{"text":"未提出申请时，独立完成者可各有申请专利的权利。","note":"课件第5页阀门题重点区分申请权与专利权。","priority":"frequent"}],"source":"PDF 第3页下表、第4页上表；转写第4–7页","priority":"frequent","memory":"专利看申请先，不看完成先；同日协商不抽签。","visual":"table","table":{"headers":["概念","区别"],"rows":[["申请权","可以提交申请的权利"],["专利权","依法授权后取得"],["同日申请","协商确定申请人"]]},"examples":[{"title":"课件真题思路：阀门","given":"甲先完成、乙后完成，分别独立开发同样主题的阀门，两人尚未申请。","steps":["两人都是独立完成者。","完成先后不是专利授权的决定规则。","题目询问的是申请权，不是已授权的专利权。"],"answer":"甲乙均有专利申请权（课件第5页答案C）。"}]},{"id":"4:0","chapter":4,"index":0,"title":"著作权何时产生：发表与登记","fullTitle":"著作权何时产生：发表与登记","intro":"老师强调不论作品是否发表，都可以依法享有著作权。登记并非权利产生的必要条件。","points":[{"text":"中国公民、法人或非法人组织的作品不论是否发表，依法享有著作权。","note":"满足作品条件。","priority":"frequent"},{"text":"软件著作权自开发完成之日起产生。","note":"不是领取登记证书的日期。","priority":"frequent"},{"text":"登记可用于权属证明，未登记并不等于没有权利。","note":"","priority":""}],"source":"PDF 第4页下表、第5页真题；转写第7–8页","priority":"frequent","memory":"创作完成 ≠ 必须发表或登记。","visual":"table","table":{"headers":["事项","是否为权利产生的必需条件"],"rows":[["作品满足法定条件","是"],["公开发表","否"],["著作权登记","否"]]}},{"id":"4:1","chapter":4,"index":1,"title":"保护表达，不保护思想和通用内容","fullTitle":"保护表达，不保护思想和通用内容","intro":"课程将软件思想、处理过程、操作方法、数学概念，以及法定不适用著作权法的材料作为辨析点。","points":[{"text":"软件著作权不延及思想、处理过程、操作方法、数学概念。","note":"保护具体表达，不是思想本身。","priority":"frequent"},{"text":"法律法规、国家机关具有立法行政司法性质的文件及其官方正式译文不适用著作权法。","note":"不是所有政府发布的内容均无著作权。","priority":""},{"text":"单纯事实消息、历法、通用数表、通用表格、公式不适用。","note":"旧课件称时事新闻，现行法第5条使用“单纯事实消息”。","priority":""},{"text":"自行独立实现同一思想，不等于可以直接复制他人代码。","note":"","priority":""}],"source":"PDF 第4页下表、第5页真题；转写第7–8页","priority":"frequent","memory":"思想、方法、数学概念≠受软件著作权保护的表达。","visual":"table","table":{"headers":["对象","判断"],"rows":[["原创代码和文档表达","可能受保护"],["算法思想、数学概念","软件著作权不延及"],["法律法规及官方译文","法定不适用"],["原创新闻评论","不能仅以新闻为由否定著作权"]]}},{"id":"4:2","chapter":4,"index":2,"title":"合理使用：个人学习与适当引用","fullTitle":"合理使用：个人学习与适当引用","intro":"老师讲侵权判定时把个人学习、研究和适当引用放在“不侵权”一列。它们必须满足法定条件，不能一概而论。","points":[{"text":"为个人学习、研究、欣赏，使用已经发表的作品。","note":"符合规定时可不经许可、不付报酬。","priority":"frequent"},{"text":"为介绍评论作品或说明问题，适当引用已发表作品。","note":"不能把整篇照搬当成适当引用。","priority":"frequent"},{"text":"一般要求标明作者及作品名称，不影响正常使用，不不合理损害权利人权益。","note":"现行法第24条的共同边界。","priority":""},{"text":"查重比例不是合法与侵权的法定固定阈值。","note":"","priority":""}],"source":"PDF 第4页下表、第5页真题；转写第7–8页","priority":"frequent","memory":"合理使用不是“非商用就随便用”。","visual":"table","table":{"headers":["场景","判断要点"],"rows":[["个人学习","已发表、个人目的、法定边界"],["论文引用","说明问题、适量、署名标出处"],["完整复制后公开传播","不能简单套个人学习"]]},"notice":"这里是课程考点的条件化整理，不是对任一实际使用行为的法律结论。"},{"id":"4:3","chapter":4,"index":3,"title":"合理使用：教学、馆藏、公共场所等","fullTitle":"合理使用：教学、馆藏、公共场所等","intro":"课件第4页列出多种不侵权场景，结合现行法律明确使用目的和范围。","points":[{"text":"学校课堂教学或科研：已发表作品的少量复制等，供教学科研人员使用，不得出版发行。","note":"教学不等于任意传播。","priority":""},{"text":"馆藏复制：为陈列或保存版本而复制本馆收藏作品。","note":"特定机构和目的。","priority":""},{"text":"免费表演已发表作品：不向公众收费、不向表演者付报酬且不营利。","note":"需同时符合条件。","priority":""},{"text":"公共场所艺术作品的临摹、绘画、摄影、录像。","note":"按法定情形判断。","priority":""},{"text":"公众集会讲话的媒体刊播、少数民族语言翻译国内出版、阅读障碍者无障碍提供。","note":"各项均有具体适用条件，按第24条核对。","priority":""}],"source":"PDF 第4页下表、第5页真题；转写第7–8页","priority":"","memory":"课堂、馆藏、免费表演等都有限定条件。","visual":"table","table":{"headers":["课件关键词","必须看条件"],"rows":[["教学科研","少量、内部教学科研等，不出版发行"],["馆藏","陈列或保存本馆作品"],["免费表演","不收费、不付表演报酬、不营利"],["无障碍","阅读障碍者可感知方式"]]}},{"id":"4:4","chapter":4,"index":4,"title":"典型侵权行为：署名、复制、传播","fullTitle":"典型侵权行为：署名、复制、传播","intro":"课件的侵权表以未经许可发表、虚假署名、剽窃、歪曲篡改、不付报酬等为主。","points":[{"text":"未经许可发表他人作品。","note":"无适用法定例外时。","priority":"frequent"},{"text":"未参加创作而在他人作品上署名，或将合作作品当作个人独立创作发表。","note":"侵害作者权利。","priority":"frequent"},{"text":"剽窃、歪曲、篡改他人作品。","note":"结合具体权项及事实。","priority":"frequent"},{"text":"依法应支付报酬而未支付，或未经许可使用出版版式设计等。","note":"注意法定例外与许可范围。","priority":""},{"text":"未经许可向公众复制、发行或传播受保护内容，可能构成侵权。","note":"","priority":""}],"source":"PDF 第4页下表、第5页真题；转写第7–8页","priority":"frequent","memory":"看许可、法定例外、使用方式、署名与报酬义务。","visual":"table","table":{"headers":["行为","判断方向"],"rows":[["冒名署名","侵权风险"],["直接照抄代码公开销售","侵权风险"],["适当引用并符合合理使用","可能合法"],["获得明确许可且未超范围","通常可依法使用"]]}},{"id":"4:5","chapter":4,"index":5,"title":"正版软件光盘：所有权与使用权","fullTitle":"正版软件光盘：所有权与使用权","intro":"课件第5页真题：购买有注册商标的应用软件光盘，选项中取得的是该光盘的所有权。","points":[{"text":"购买合法实物载体可取得该载体的所有权。","note":"不等于取得知识产权。","priority":"frequent"},{"text":"不会因购买光盘自动取得注册商标专用权、软件著作权或一般复制发行权。","note":"老师明确辨析。","priority":"frequent"},{"text":"合法软件复制品所有人依法可以安装、必要备份，并在规定条件下必要修改。","note":"备份不得提供他人；修改后软件对外提供受限。","priority":""},{"text":"软件使用还受合法授权条款约束。","note":"","priority":""}],"source":"PDF 第4页下表、第5页真题；转写第7–8页","priority":"frequent","memory":"买光盘≠买著作权；合法使用不等于可任意传播。","visual":"table","table":{"headers":["权利","购买正版光盘后"],"rows":[["载体所有权","取得"],["软件著作权","不会自动取得"],["商标专用权","不会自动取得"],["合法安装／必要备份","按法定及许可条件行使"]]},"notice":"《计算机软件保护条例》第16条规定合法复制品所有人的有限备份等权利；课件“只有使用权，完全不能复制”是简化表达。"},{"id":"5:0","chapter":5,"index":0,"title":"标准的五种课程分类","fullTitle":"标准的五种课程分类","intro":"课件按制定机构和适用范围分为国际、国家、行业、区域/地方、企业五类。老师要求认识类型和编号即可。","points":[{"text":"国际标准：ISO、IEC、ITU 等。","note":"国际组织制定或确认的相关标准。","priority":"understand"},{"text":"国家标准：国家主管机构制定或批准发布。","note":"GB、GB/T 等。","priority":"frequent"},{"text":"行业标准：特定行业业务领域。","note":"如 GA、YD、QC。","priority":""},{"text":"区域/地方标准：如欧洲 EN、中国地方 DB。","note":"区域与地方是课程合并展示。","priority":""},{"text":"企业标准：企业根据生产经营等需要制定；Q 为企业标准代号。","note":"","priority":""},{"text":"现行中国标准化法还明确列出团体标准。","note":"","priority":""}],"source":"PDF 第6页；转写第8–10页","priority":"","memory":"课件五类；中国现行法有国、行、地、团、企。","visual":"table","table":{"headers":["分类","典型代号"],"rows":[["国际","ISO / IEC / ITU"],["国家","GB / GB/T / GB/Z"],["行业","GA / YD / QC"],["区域／地方","EN / DB"],["企业","Q"],["团体（现行国内法补充）","T/…"]]},"notice":"现行《标准化法》第2条列出国家、行业、地方、团体、企业标准；这是国内标准体系，与课件含国际及区域的分类视角不同。"},{"id":"5:1","chapter":5,"index":1,"title":"国际与区域标准：ISO、IEC、ITU、EN","fullTitle":"国际与区域标准：ISO、IEC、ITU、EN","intro":"老师建议看到 I 联想到 International；标准组织与标准代号要分清。","points":[{"text":"ISO：国际标准化组织。","note":"","priority":""},{"text":"IEC：国际电工委员会。","note":"","priority":""},{"text":"ITU：国际电信联盟。","note":"","priority":""},{"text":"EN：欧洲标准；不等于中国国家标准。","note":"","priority":""},{"text":"OSI参考模型与ISO有关；IEEE 802系列属于熟悉的网络标准实例。","note":"","priority":""}],"source":"PDF 第6页；转写第8–10页","priority":"","memory":"I 联想 International；EN 联想欧洲。","visual":"table","table":{"headers":["缩写","对应"],"rows":[["ISO","国际标准化组织"],["IEC","国际电工委员会"],["ITU","国际电信联盟"],["EN","欧洲标准"]]}},{"id":"5:2","chapter":5,"index":2,"title":"中国国家标准：GB、GB/T、GB/Z、GJB","fullTitle":"中国国家标准：GB、GB/T、GB/Z、GJB","intro":"本节是老师特别指出的标准化记忆重点。通过字母和拼音联想，快速区分强制、推荐和指导。","points":[{"text":"GB：强制性国家标准。","note":"国标。","priority":"frequent"},{"text":"GB/T：推荐性国家标准。","note":"老师记忆法： function topicLabel(s){return esc(String(s).replace(/^[🔴🟠🔵]\s*/u,''))}
function priority(t){if(t.priority)return t.priority;if(t.points.some(p=>p.priority==='must'))return 'must';if(t.points.some(p=>p.priority==='frequent'))return 'frequent';if(t.points.some(p=>p.priority==='understand'))return 'understand';return ''}
function navPriorityLabel(pr){return pr==='must'?'<span class="nav-level must" title="必须掌握">必掌握</span>':pr==='frequent'?'<span class="nav-level frequent" title="重点 / 常考">常考</span>':''}
function levelTag(pr){return pr==='must'?'<span class="pill must">必须掌握</span>':pr==='frequent'?'<span class="pill frequent">重点 / 常考</span>':pr==='understand'?'<span class="pill understand">了解即可</span>':''}
function chapterDone(ci){let ids=chapters[ci].topicIds.filter(id=>ci!==0);return ids.filter(id=>mastery[id]===2).length}
function masteredCount(){return lessons.filter(t=>t.chapter!==0 && mastery[t.id]===2).length}
function setStatus(id,s){mastery[id]=s;save('sd_ip_v1_mastery',mastery);render();}
function markNext(id){let s=mastery[id]||0;setStatus(id,(s+1)%3)}
function openLesson(id){if(!lessonMap.has(id))return;current=id;openedChap=lessonMap.get(id).chapter;save('sd_ip_v1_last',id);setView('read')}
function setView(v){view=v;render();el('contentShell').scrollTop=0;hideMobile()}
function hideMobile(){el('sidebar').classList.remove('open');el('scrim').classList.remove('open')}
function chapNav(ci){openedChap=ci;openLesson(chapters[ci].topicIds[0])}
function renderSidebar(){
 const mustN=lessons.filter(t=>t.chapter>0&&priority(t)==='must').length;
 const freqN=lessons.filter(t=>t.chapter>0&&priority(t)==='frequent').length;
 el('sideCount').textContent=`${chapters.length} 个分支`;
 el('mustCount').textContent=mustN;el('frequentCount').textContent=freqN;
 el('focusToggle').setAttribute('aria-pressed',String(focusOnly));
 el('focusToggle').title=focusOnly?'显示全部知识主题':'只显示必须掌握和重点 / 常考的主题';
 el('navList').innerHTML=chapters.map(c=>{
  const hotIds=c.topicIds.filter(id=>{const p=priority(lessonMap.get(id));return p==='must'||p==='frequent'});
  const visibleIds=focusOnly&&c.id!==0?hotIds:c.topicIds;
  const sub=visibleIds.map(id=>{
   const t=lessonMap.get(id),pr=priority(t),done=mastery[id]===2;
   return `<button data-lesson="${id}" class="${current===id&&view==='read'?'selected':''} ${done?'complete':''} ${pr==='must'||pr==='frequent'?'nav-pr-'+pr:''}" title="${esc(t.title)}${pr==='must'?' · 必须掌握':pr==='frequent'?' · 重点 / 常考':''}"><span class="nav-topic-title">${esc(t.title)}</span>${navPriorityLabel(pr)}${done?'<span class="nav-done" title="已掌握">✓</span>':''}</button>`;
  }).join('');
  return `<div class="nav-group"><button class="chap-button ${(view==='read'&&openedChap===c.id)?'active':''}" data-chapter="${c.id}" aria-expanded="${openedChap===c.id}"><span class="chap-num">${c.number}</span><span>${esc(c.name)}</span>${hotIds.length?`<span class="chap-focus-count" title="本章 ${hotIds.length} 个重点主题">★${hotIds.length}</span>`:''}<span class="chap-chevron">${openedChap===c.id?'⌄':'›'}</span></button>${openedChap===c.id?`<div class="subnav">${sub||'<div class="nav-empty">本章暂无重点主题</div>'}</div>`:''}</div>`;
 }).join('');
 const n=masteredCount();el('sideProgress').textContent=`${n} / ${totalStudy}`;el('sideProgressBar').style.width=(n/totalStudy*100).toFixed(1)+'%';
}

function renderHome(){el('topTitle').textContent='知识产权与标准化 · 学习首页';let n=masteredCount();
 let priorityTopics=lessons.filter(t=>t.chapter>0&&priority(t)==='must').length;
 return `<section class="hero"><div class="kicker">2026 · SOFTWARE DESIGNER</div><h1>把精讲课件，变成真正能复习的知识体系。</h1><p>这是软件设计师第六部分「知识产权与标准化」的完整离线复习知识库。先用对照表记住保护期限、权利归属和侵权判断，再通过脑图、速记与情境题巩固。</p><div class="hero-actions"><button class="small-button primary" data-lesson="${current}">▶ ${n?'继续学习':'开始学习'}</button><button class="small-button" data-view="map">查看知识脑图</button><button class="small-button" data-view="quiz">开始随堂练习</button></div></section><div class="statbar"><div class="stat"><b>5 <small>+ 考试定位</small></b><small>内容章节</small></div><div class="stat"><b>${totalStudy}</b><small>精讲知识主题</small></div><div class="stat"><b>${n} <small>/ ${totalStudy}</small></b><small>已掌握主题</small></div></div><div class="section-label"><h2>章节学习路线</h2><p>按老师课程顺序组织，以课件及转写为主，法规核对单独注明</p></div><div class="chap-grid">${chapters.map(c=>{let cnt=c.topicIds.length,done=chapterDone(c.id);let lead=lessonMap.get(c.topicIds[0]);return `<article class="chap-card"><div class="num">CHAPTER ${c.number}</div><h3>${esc(c.name)}</h3><p>${esc(lead.intro)}</p><div class="bar"><i style="width:${done/Math.max(1,cnt)*100}%"></i></div><div class="foot"><span>${cnt} 个主题 ${c.id>0?`· 已掌握 ${done}`:''}</span><button data-lesson="${c.topicIds[0]}">进入章节 ↗</button></div></article>`}).join('')}</div><div class="card"><h2>这份资料怎么用？</h2><div class="d-grid three"><div class="d-chip"><b>01 · 首次学习</b>打开「图文精讲」，先看概念、对比图和典型判断题，再掌握易混结论。</div><div class="d-chip"><b>02 · 复习回顾</b>打开「知识脑图」，沿分支回忆概念；不熟悉的知识点点击返回精讲。</div><div class="d-chip"><b>03 · 考前冲刺</b>使用「考前速记」和「随堂练习」快速巩固，标记已掌握主题。</div></div><p class="tiny" style="margin-top:15px">说明：教师的“常考/了解/必须掌握”来自课程讲解，属于授课侧重点；并非官方考试大纲中的固定权重。练习题为依据资料编写的自测题，不冒充原题。</p></div>`;
}
function renderPoints(t){return `<div class="point-list">${t.points.map(p=>{let pr=p.priority||'';return `<div class="point ${pr}"><span class="point-marker"></span><div><div class="ptext">${topicLabel(p.text)}</div>${p.note?`<div class="pnote">${esc(p.note)}</div>`:''}</div></div>`}).join('')}</div>`}
function renderExample(t){if(!t.examples?.length)return '';return `<section class="card"><h2>🧩 典型题与解题步骤</h2>${t.examples.map(ex=>`<div class="example"><h3>${esc(ex.title)}</h3><div class="given"><b>已知：</b>${esc(ex.given)}</div>${ex.steps.map((step,i)=>`<div class="step"><span class="step-num">${i+1}</span><div>${esc(step)}</div></div>`).join('')}<div class="answer">结果：${esc(ex.answer)}</div>${ex.warning?`<div class="notice">⚠ ${esc(ex.warning)}</div>`:''}</div>`).join('')}</section>`}
function renderRead(){const t=lessonMap.get(current);const c=chapters[t.chapter];let same=c.topicIds;let ci=same.indexOf(current),ix=lessons.findIndex(q=>q.id===current),prev=lessons[ix-1],next=lessons[ix+1];let s=mastery[current]||0;el('topTitle').textContent=`${c.name} · 图文精讲`;
 return `<div class="crumb"><button data-view="home" style="border:0;background:none;color:#73879a;cursor:pointer;padding:0">学习首页</button> / ${esc(c.name)} / 第 ${ci+1} 节</div><div class="title-row"><div><div class="kicker">CHAPTER ${c.number} / SECTION ${String(ci+1).padStart(2,'0')}</div><h1 class="big-title">${esc(t.title)}</h1><div class="smalltags">${levelTag(priority(t))}<span class="pill">${esc(c.name)}</span><span class="pill">${s===2?'✓ 已掌握':s===1?'复习中':'未标记'}</span></div></div><button class="small-button ${s===2?'done':''}" data-master="${current}">${s===2?'✓ 已掌握 · 重置':s===1?'◐ 复习中 · 标记掌握':'○ 未学习 · 标记复习中'}</button></div><div class="topic-jump">${same.map((id,j)=>`<button class="${id===current?'current':''}" data-lesson="${id}">${j+1}. ${esc(lessonMap.get(id).title)}</button>`).join('')}</div><section class="intro-card"><div class="head">📘 先理解这一点</div><p>${esc(t.intro)}</p></section>${renderDiagram(t)}<section class="card"><h2>关键知识与老师强调的考点</h2>${renderPoints(t)}<div class="source">📎 资料来源：${esc(t.source)}。条目主要依据课件与授课转写整理，少量内容做了便于阅读的归纳，并明确标注课程旧说法的适用边界。</div></section>${renderExample(t)}${renderExtra(t)}<section class="card"><h2>一分钟回忆</h2><p style="font-size:15px;font-weight:700;color:#275b94;margin:0 0 12px">${esc(t.memory||t.points.slice(0,2).map(p=>p.text).join('；'))}</p><p class="tiny" style="margin:0">先遮住答案，试着用自己的话复述本节知识。能独立说清楚，再标记为「已掌握」。</p></section><div class="lesson-footer"><button class="small-button" ${!prev?'disabled':''} ${prev?`data-lesson="${prev.id}"`:''}>← 上一个主题</button><div class="lesson-footer-actions" style="display:flex;gap:8px;flex-wrap:wrap"><button class="small-button" data-quiztopic="${current}">练习本章节题目</button><button class="small-button primary" ${!next?'disabled':''} ${next?`data-lesson="${next.id}"`:''}>下一个主题 →</button></div></div>`
}
function renderExtra(t){return (t.notice?`<div class="notice"><strong>📌 课程口径 / 现行法规核对：</strong>${esc(t.notice)}</div>`:'')+(t.id==='0:1'?"<section class=\"card\"><h2>法规核对来源（2026-11-25）</h2><p>以下官方来源供联网时核对，离线学习不依赖这些链接。</p><div class=\"point-list\"><a class=\"point\" style=\"color:var(--accent);text-decoration:none\" href=\"https://www.ncac.gov.cn/xxfb/flfg/flfg_532/202103/t20210309_50530.html\" target=\"_blank\" rel=\"noopener noreferrer\">著作权法（2020年修正） ↗</a><a class=\"point\" style=\"color:var(--accent);text-decoration:none\" href=\"https://ipc.court.gov.cn/zh-cn/news/view-407.html\" target=\"_blank\" rel=\"noopener noreferrer\">计算机软件保护条例 ↗</a><a class=\"point\" style=\"color:var(--accent);text-decoration:none\" href=\"https://www.cnipa.gov.cn/art/2020/11/23/art_524_171347.html\" target=\"_blank\" rel=\"noopener noreferrer\">专利法（2020年修正） ↗</a><a class=\"point\" style=\"color:var(--accent);text-decoration:none\" href=\"https://www.cnipa.gov.cn/art/2023/12/21/art_98_189197.html\" target=\"_blank\" rel=\"noopener noreferrer\">专利法实施细则（2023年修订） ↗</a><a class=\"point\" style=\"color:var(--accent);text-decoration:none\" href=\"https://www.samr.gov.cn/zfjcj/tzgg/art/2023/art_cd64845f4ca1434b9f793ef14174f189.html\" target=\"_blank\" rel=\"noopener noreferrer\">商标法（现行2019修正） ↗</a><a class=\"point\" style=\"color:var(--accent);text-decoration:none\" href=\"https://www.samr.gov.cn/zfjcj/tzgg/art/2023/art_ded7a0639f184377ba7b515cb0358db2.html\" target=\"_blank\" rel=\"noopener noreferrer\">商标法实施条例 ↗</a><a class=\"point\" style=\"color:var(--accent);text-decoration:none\" href=\"https://www.cnipa.gov.cn/art/2026/6/26/art_95_206942.html\" target=\"_blank\" rel=\"noopener noreferrer\">商标法（2026修订，2027年施行） ↗</a><a class=\"point\" style=\"color:var(--accent);text-decoration:none\" href=\"https://www.cnipa.gov.cn/art/2019/7/29/art_1391_91781.html\" target=\"_blank\" rel=\"noopener noreferrer\">标准化法 ↗</a><a class=\"point\" style=\"color:var(--accent);text-decoration:none\" href=\"https://www.samr.gov.cn/zw/zfxxgk/fdzdgknr/fgs/art/2023/art_cd0ac0e159904c65b60c67edf9719c10.html\" target=\"_blank\" rel=\"noopener noreferrer\">企业标准化促进办法 ↗</a></div></section>":'')}
function renderDiagram(t){if(!t.table)return '';return `<section class="card"><h2>知识对照表</h2><div class="diagram"><div class="sec-table-scroll" style="overflow-x:auto;max-width:100%"><table class="mini-table"><thead><tr>${t.table.headers.map(x=>`<th>${esc(x)}</th>`).join('')}</tr></thead><tbody>${t.table.rows.map(r=>`<tr>${r.map(x=>`<td>${esc(x)}</td>`).join('')}</tr>`).join('')}</tbody></table></div></div></section>`}
function renderMap(){el('topTitle').textContent='知识产权与标准化 · 知识脑图';return `<div class="kicker">KNOWLEDGE MAP</div><h1 class="big-title">一张图，看懂整章知识结构</h1><p class="lede">按章节展开知识分支。点击右侧主题可以直接跳转到图文精讲；再次点击已展开的章节可以收起。</p><div class="map-root">知识产权与标准化 <span style="font-size:12px;margin-left:13px;opacity:.7;align-self:center">5 组知识主题 · 1 份考试定位</span></div><div class="map-rail">${chapters.map(c=>`<div class="map-branch"><button class="map-chap ${mapOpen===c.id?'on':''}" data-mapchap="${c.id}"><span>${c.number} · ${esc(c.name)}</span><b>${mapOpen===c.id?'−':'+'}</b></button><div class="map-topics">${mapOpen===c.id?c.topicIds.map(id=>{let t=lessonMap.get(id);return `<button class="map-topic" data-lesson="${id}"><b>${esc(t.title)}</b><small>${t.points.length} 个知识条目 · 查看精讲 ↗</small><div class="map-details">${t.points.slice(0,3).map(p=>`<span>• ${topicLabel(p.text)}</span>`).join('')}${t.points.length>3?`<span>… 及其他 ${t.points.length-3} 项</span>`:''}</div></button>`}).join(''):`<div style="color:#92a1b0;font-size:12px;padding:13px">${c.topicIds.length} 个子主题 · 点击左侧展开</div>`}</div></div>`).join('')}</div>`}
function renderQuick(){el('topTitle').textContent='知识产权与标准化 · 考前速记';
 const rules=[["四属性", "无体、专有、地域、时间", "1:1"], ["普通作品人身权", "署名、修改、保护完整：不受限", "2:1"], ["自然人期限", "终生＋死后50年，年底截止", "2:1"], ["商标", "10年可续，期满前12个月＋6个月宽展", "2:4"], ["专利（现行）", "发明20／实用10／外观15年", "2:5"], ["普通职务作品", "一般归作者，特殊归单位（作者署名）", "3:1"], ["职务软件", "指定目标、自然结果、主要资源且单位担责", "3:2"], ["职务发明", "离职后1年内＋原工作相关", "3:3"], ["委托", "无明确约定归受托方", "3:4"], ["商标与专利", "商标同日看使用；专利同日协商", "3:6"], ["侵权判断", "许可、合理使用边界、署名和传播", "4:2"], ["国标代号", "GB 强制、GB/T 推荐、GB/Z 指导、GJB 军用", "5:2"]];
 return `<div class="kicker">QUICK RECALL</div><h1 class="big-title">考前速记 · 核心概念与易混对照</h1><p class="lede">这章以权利期限、归属、侵权与标准编号为主。建议先遮住答案自测，再点击跳回精讲。</p><div class="section-label"><h2>12 条高效判题规则</h2><p>按课件与老师重点整理；现行法规核对另行标明</p></div><div class="qgrid">${rules.map(x=>`<article class="card" style="margin:0"><h3 style="margin:0 0 8px">${x[0]}</h3><div class="formula">${x[1]}</div><button class="small-button tinted" style="margin-top:13px" data-lesson="${x[2]}">查看精讲 ↗</button></article>`).join('')}</div>${chapters.slice(1).map(c=>`<div class="section-label"><h2>${c.number} · ${esc(c.name)}</h2><p>${c.topicIds.length} 个主题</p></div><div class="qgrid">${c.topicIds.map(id=>{let t=lessonMap.get(id);return `<article class="quick-card"><div class="qtag">${esc(c.name)} ${levelTag(priority(t))}</div><h3>${esc(t.title)}</h3><p>${esc(t.memory||t.points.slice(0,2).map(p=>p.text).join('；'))}</p><button data-lesson="${id}">完整精讲 ↗</button></article>`}).join('')}</div>`).join('')}`;
}
function getQuizItems(scope){return quizzes.map((q,i)=>({...q,key:i})).filter(q=>scope==='all'||q.chapter===Number(scope)||scope==='wrong'&&load('sd_ip_v1_wrong',[]).includes(q.key));}
function startQuiz(scope){quizState={scope,items:getQuizItems(scope),index:0,picks:{},completed:false};setView('quiz')}
function chooseQuiz(idx){const item=quizState.items[quizState.index];if(quizState.picks[item.key]!==undefined)return;quizState.picks[item.key]=idx;render()}
function nextQuiz(){quizState.index++;if(quizState.index>=quizState.items.length){quizState.completed=true;const errors=quizState.items.filter(q=>quizState.picks[q.key]!==q.answer).map(q=>q.key);let old=new Set(load('sd_ip_v1_wrong',[]));for(let q of quizState.items)old.delete(q.key);for(let k of errors)old.add(k);save('sd_ip_v1_wrong',[...old]);}render();el('contentShell').scrollTop=0}
function renderQuiz(){el('topTitle').textContent='知识产权与标准化 · 随堂练习';if(!quizState.items.length&&!quizState.completed){quizState.items=getQuizItems(quizState.scope)}let qs=quizState.items,idx=quizState.index;
 let filters=`<div class="quiz-filter"><button data-quizscope="all" class="${quizState.scope==='all'?'chosen':''}">全章 · ${quizzes.length} 题</button>${chapters.slice(1).map(c=>`<button data-quizscope="${c.id}" class="${quizState.scope===String(c.id)?'chosen':''}">${c.number} ${esc(c.name)} · ${getQuizItems(String(c.id)).length} 题</button>`).join('')}<button data-quizscope="wrong" class="${quizState.scope==='wrong'?'chosen':''}">错题重练 · ${getQuizItems('wrong').length} 题</button></div>`;
 if(!qs.length)return `<div class="kicker">PRACTICE</div><h1 class="big-title">随堂练习</h1><p class="lede">本组暂无试题或尚未产生错题。选择其他章节继续练习。</p>${filters}`;
 if(quizState.completed){let score=qs.filter(q=>quizState.picks[q.key]===q.answer).length;return `<div class="kicker">PRACTICE RESULT</div><h1 class="big-title">练习完成</h1><div class="score-card"><div class="huge">${Math.round(score/qs.length*100)}<small style="font-size:20px">分</small></div><h2>${score} / ${qs.length} 题正确</h2><p>${qs.length-score===0?'这组知识点都答对了，可以去精讲中继续学习其他内容。':`有 ${qs.length-score} 道题答错，错题会保存在当前浏览器中，可以单独重练。`}</p><button class="small-button primary" data-quizscope="${quizState.scope}">再做一遍</button><button class="small-button" data-quizscope="wrong">重练错题</button><button class="small-button" data-view="quick">查看考前速记</button></div>${filters}`;}
 let q=qs[idx],pick=quizState.picks[q.key],answered=pick!==undefined,chapter=chapters[q.chapter];return `<div class="kicker">PRACTICE / SELF TEST</div><h1 class="big-title">随堂练习</h1><p class="lede" style="margin-bottom:11px">按课程内容编写的自测题（非历年真题原文），答题后立即展示正确答案和解析。</p>${filters}<div class="quiz-wrap"><div class="quiz-top"><span class="tiny">${esc(chapter.name)} · 第 ${idx+1} / ${qs.length} 题</span><div class="quiz-progress"><i style="width:${idx/qs.length*100}%"></i></div><b style="font-size:12px;color:#6e8192">${Math.round(idx/qs.length*100)}%</b></div><div class="quiz-card"><span class="pill">单选题</span><h2>${esc(q.question)}</h2><div class="options">${q.options.map((o,j)=>`<button class="option ${answered&&j===q.answer?'correct':''} ${answered&&pick===j&&j!==q.answer?'incorrect':''} ${answered&&pick===j?'selected':''}" data-option="${j}" ${answered?'disabled':''}><i>${'ABCD'[j]}.</i><span>${esc(o)}</span></button>`).join('')}</div>${answered?`<div class="explain"><strong>${pick===q.answer?'✓ 回答正确':'✕ 回答错误'} · 正确答案 ${'ABCD'[q.answer]}</strong><div style="margin-top:5px">${esc(q.explain)}</div><div style="margin-top:10px"><button class="small-button tinted" data-lesson="${q.topic}">返回对应知识点 ↗</button></div></div>`:''}<div class="quiz-bottom"><span class="tiny">请先选择一个答案</span><button class="small-button primary" data-nextquestion ${!answered?'disabled':''}>${idx===qs.length-1?'查看成绩':'下一题 →'}</button></div></div></div>`;}
function renderRail(){if(view!=='read')return '';let t=lessonMap.get(current),c=chapters[t.chapter];return `<div class="rail-card"><h3>本章目录 · ${c.number}</h3>${c.topicIds.map((id,i)=>`<button class="rail-topic ${id===current?'current':''}" data-lesson="${id}">${String(i+1).padStart(2,'0')} · ${esc(lessonMap.get(id).title)} ${mastery[id]===2?'✓':''}</button>`).join('')}<div class="rail-memory"><strong>本节一句话</strong><p>${esc(t.memory||t.points[0]?.text||'')}</p><div class="tiny">${esc(t.source)}</div></div></div>`}
function render(){renderSidebar();document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('on',b.dataset.tab===view));const main=el('mainContent');main.className='content '+(view==='read'?'reading':'');main.innerHTML=({home:renderHome,read:renderRead,map:renderMap,quick:renderQuick,quiz:renderQuiz}[view]||renderHome)();const shell=el('contentShell');shell.classList.toggle('withrail',view==='read');el('rightRail').innerHTML=renderRail()}
function openSearch(){el('searchOverlay').classList.remove('hidden');el('searchInput').focus();searchResults('')}
function closeSearch(){el('searchOverlay').classList.add('hidden')}
function searchResults(term){
 term=term.trim().toLowerCase();
 let hits=term?lessons.filter(t=>(t.title+' '+t.intro+' '+t.points.map(p=>p.text+' '+p.note).join(' ')).toLowerCase().includes(term)):lessons.filter(t=>t.chapter>0&&priority(t)==='must').slice(0,8);
 if(term)hits.sort((a,b)=>{const score=t=>{let name=t.title.toLowerCase();return name===term?0:name.startsWith(term)?1:name.includes(term)?2:3};return score(a)-score(b) || a.chapter-b.chapter || a.index-b.index});
 let n=hits.length;hits=hits.slice(0,25);
 el('searchResults').innerHTML=`<div class="tiny">${term?`匹配 ${n} 个知识主题`:'建议重点内容'}</div>`+hits.map(t=>`<button class="sr" data-searchlesson="${t.id}"><strong>${esc(t.title)}</strong><small>${esc(chapters[t.chapter].name)} · ${esc(t.intro.slice(0,66))}…</small></button>`).join('')+(hits.length?'':'<div class="tiny">没有匹配结果，试试其他关键词。</div>');
}
document.body.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;
 if(b.id==='focusToggle'){focusOnly=!focusOnly;save('sd_ip_v1_focus_only',focusOnly);renderSidebar();return}
 if(b.dataset.view){setView(b.dataset.view);return}
 if(b.dataset.tab){setView(b.dataset.tab);return}
 if(b.dataset.chapter!==undefined){let ci=+b.dataset.chapter;if(openedChap===ci){openedChap=-1;renderSidebar()}else{openedChap=ci;renderSidebar()}return}
 if(b.dataset.lesson){openLesson(b.dataset.lesson);return}
 if(b.dataset.master){markNext(b.dataset.master);return}
 if(b.dataset.mapchap!==undefined){let ci=+b.dataset.mapchap;mapOpen=mapOpen===ci?-1:ci;render();return}
 if(b.dataset.quizscope){startQuiz(b.dataset.quizscope);return}
 if(b.dataset.quiztopic){const t=lessonMap.get(b.dataset.quiztopic);quizState={scope:String(t.chapter),items:getQuizItems(String(t.chapter)),index:0,picks:{},completed:false};setView('quiz');return}
 if(b.dataset.option!==undefined){chooseQuiz(+b.dataset.option);return}
 if(b.hasAttribute('data-nextquestion')){nextQuiz();return}
 if(b.dataset.searchlesson){closeSearch();openLesson(b.dataset.searchlesson);return}
});
el('menuBtn').onclick=()=>{el('sidebar').classList.add('open');el('scrim').classList.add('open')};el('scrim').onclick=hideMobile;
function refreshThemeButton(){const dark=document.documentElement.dataset.theme==='dark',b=el('themeBtn');b.setAttribute('aria-pressed',String(dark));b.setAttribute('aria-label',dark?'切换为日间模式':'切换为夜间模式');b.title=dark?'切换为日间模式':'切换为夜间模式'}
el('themeBtn').onclick=()=>{const next=document.documentElement.dataset.theme==='dark'?'light':'dark';document.documentElement.dataset.theme=next;save('sd_ip_v1_theme',next);refreshThemeButton()};refreshThemeButton();
el('searchBtn').onclick=openSearch;el('searchClose').onclick=closeSearch;el('searchInput').oninput=e=>searchResults(e.target.value);
el('searchOverlay').addEventListener('click',e=>{if(e.target===el('searchOverlay'))closeSearch()});
window.addEventListener('keydown',e=>{if(e.key==='Escape'){closeSearch();hideMobile()}if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){e.preventDefault();openSearch()}});
render();
</script></body></html>
