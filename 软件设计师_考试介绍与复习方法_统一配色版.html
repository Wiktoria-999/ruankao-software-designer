/* Exam Knowledge Base · visual system v2: restrained, reading-first light & dark */
:root{
  --bg:#f7f8fa;
  --side:#1d2937;
  --side2:#2b3b4f;
  --side-text:#cbd5e1;
  --panel:#ffffff;
  --panel2:#fafbfd;
  --line:#e4e8ed;
  --ink:#222c38;
  --muted:#5f6d7d;
  --faint:#8391a0;
  --blue:#246bb4;
  --soft-blue:#eff6fd;
  --teal:#16867f;
  --red:#c65555;
  --orange:#ab7225;
  --shadow:0 3px 16px rgba(25,38,55,.035);
}
/* Navigation uses a single deep-slate surface; blue signifies interaction,
   teal signifies completion, red/orange are reserved for exam priorities. */
.sidebar{background:var(--side)}
.sidebar-head{background:var(--side);border-bottom:1px solid #ffffff17}
.sidebar-head .eyebrow{color:#a9c7e4}
.sidebar-head p{color:#a9bbce}
.sidebar-section-title{color:#9caec1}
.legend span{background:#2d3c4e;color:#e2c69d}
.legend span:first-child{color:#f3bab6}
.filter-focus{background:#283b4f;border-color:#465e76;color:#d4e1ed}
.filter-focus.on{background:#344554;border-color:#b6a082;color:#fbe3bc}
.chapter-btn:hover,.chapter-btn.current{background:#2a3c50}

va：如何选择选做题","lead":"老师在录课时更推荐 Java 选答题，理由是课堂观察其语法题相对容易；选择应结合个人实际语言基础与考试当期题目。","points":[{"name":"课件观点","detail":"试题5为 C++，试题6为 Java，老师建议优先掌握 Java。"},{"name":"选择依据","detail":"看你读代码的熟练度、类/继承/多态知识、往年真题的准确率。"},{"name":"不必盲目切换语言","detail":"对已经熟悉 C++ 的考生，专项比较后再决定，没必要因老师一句话立刻换路线。"},{"name":"考前做选择题型模拟","detail":"分别尝试两种语言题型，选择更稳定且能在时限内解出的方向。"}],"priority":"normal","source":"PDF 第8页；课程转写“试题5/6”","visual":"","warning":"老师关于某一年只有 Java 题的回忆属于课程历史经验，不能代表未来每次考试的选答形式。","takeaway":"理解两种题型，最终依据自己熟练度和当期规则选择。"},{"id":"3:5","ch":3,"title":"通过率、难度与信心管理","lead":"课件写“全国平均通过率约 15%—20%”以及“本培训通过率达 80% 以上”，两组均为授课方陈述，缺少可独立核验的统一统计口径。","points":[{"name":"全国通过率约 15%—20%","detail":"出自课件的参考资料估计，不当作官方最新通过率。"},{"name":"培训通过率 80%+","detail":"属培训机构自述，样本、统计口径和年份不明，不能视为保证。"},{"name":"老师对考试的判断","detail":"知识面宽、可以通过系统学习取得合格成绩。"},{"name":"可操作的衡量方式","detail":"用自己的完整模拟卷成绩、错题趋势与答题时间评估准备程度。"}],"priority":"normal","source":"PDF 第9页“通过率分析”；课程转写","visual":"","warning":"以上通过率数据未经公开权威统计核验，在知识库内只作为“课程历史说法”保留。","takeaway":"比“别人通过率”更重要的是自己两科模拟成绩的稳定性。"},{"id":"4:0","ch":4,"title":"三阶段复习总路线（约200小时）","lead":"老师为有一定基础的学生建议约 3 个月、零基础约 4 个月，每天学习约 2 小时；核心是 100/70/30 小时的三阶段结构。","points":[{"name":"阶段一 · 系统学习约 100h","detail":"全量学录播/精讲，课后立即回顾配套课件，再做对应章节练习。"},{"name":"阶段二 · 综合训练约 70h","detail":"完整计时做题，做 8—10 套历年真题，认真建立并复盘错题本。"},{"name":"阶段三 · 冲刺查漏约 30h","detail":"考前约 15 天重看重点、错题和薄弱题型。"},{"name":"200 小时是老师的示例计划","detail":"不是刚性要求；备考时长可按基础与可用时间调整。"}],"priority":"must","source":"PDF 第10—11页；课程转写最后“学习方法”","visual":"phases","warning":"","takeaway":"100h 建体系 → 70h 真题训练 → 30h 查漏冲刺。"},{"id":"4:1","ch":4,"title":"阶段一：看课—回顾—做章节题","lead":"老师非常强调：听完一节课之后，不能立刻跳到下一节，也不要等全部课程学完才做练习。","points":[{"name":"第一步：学完当章视频/课程","detail":"目的是理解知识关系和例题方法，不要求一次全记住。"},{"name":"第二步：回看 PDF 课件约 10—20 分钟","detail":"教师明确说这是关键的中间步骤，帮助快速回忆。"},{"name":"第三步：立即做对应章节练习","detail":"及时验证到底是否理解、能否独立解题。"},{"name":"第四步：记录错题","detail":"截图或照片保存关键错误，并记录错因。"},{"name":"覆盖上午与下午","detail":"第一阶段完整看两科内容，避免只学选择题。"}],"priority":"must","source":"PDF 第10页上；课程转写“第一阶段”","visual":"stage1","warning":"","takeaway":"学一章 → 回顾10—20分钟 → 做一章题 → 留下错题。"},{"id":"4:2","ch":4,"title":"阶段二：8—10套真题与计时训练","lead":"老师建议认真、计时完成 8—10 套完整试卷，重点是模拟考试节奏，而不是刷题数量。","points":[{"name":"8—10 套历年真题","detail":"分阶段做完基础知识与应用技术，不要只练选择题。"},{"name":"每周约两套","detail":"老师推荐的节奏，可按工作学习时间安排。"},{"name":"严格控制时间","detail":"尽量以 240 分钟两科连考规则练习；历史课件中“两科各自150分钟/打印纸卷”的说法需按机考调整。"},{"name":"错题本的价值","detail":"记错因、正确思路、对应知识点和重做日期。"},{"name":"重难点与直播串讲","detail":"课程建议将重难点串讲放到第二阶段集中消化。"}],"priority":"must","source":"PDF 第10页下；课程转写“第二阶段”","visual":"stage2","warning":"","takeaway":"完整模拟 + 限时 + 错题原因，比盲目提高刷题量更有效。"},{"id":"4:3","ch":4,"title":"阶段三：考前15天查缺补漏","lead":"临考阶段不再大规模追新内容，围绕模拟卷失分和重点知识做定向强化。","points":[{"name":"复习窗口","detail":"老师建议考前约 15 天，目标约 30 小时。"},{"name":"基础知识薄弱","detail":"集中复习高频概念、公式、错题和常考区别。"},{"name":"应用技术薄弱","detail":"重点复练 DFD、数据库和 UML；算法题争取理解更多基础得分点。"},{"name":"选择语言题","detail":"确认 Java/C++ 自己更稳的方向，避免临考频繁切换。"},{"name":"两科都要达标","detail":"按自己的模拟成绩针对性分配冲刺时间。"}],"priority":"must","source":"PDF 第11页；课程转写“第三阶段”","visual":"stage3","warning":"","takeaway":"看错题、练薄弱题型、按两科模拟成绩定向补足。"},{"id":"4:4","ch":4,"title":"考试时间分配模拟器","lead":"根据老师的 90 分钟选择题 + 150 分钟案例题建议，练习不同分配方案，找到自己稳定的答题节奏。","points":[{"name":"基础知识 90 分钟","detail":"老师推荐的策略；可以给案例题留 150 分钟。"},{"name":"基础知识 100 分钟","detail":"仍留 140 分钟用于应用技术。"},{"name":"基础知识 120 分钟","detail":"符合课件通用 240 分钟总量，但应用技术只剩 120 分钟。"},{"name":"提醒","detail":"2026 批次规则中基础知识有 90 分钟最短和 120 分钟最长的作答时长约束。"}],"priority":"focus","source":"PDF 第3页；2026 批次安排","visual":"sim","warning":"","takeaway":"先按 90/150 练，再根据真实模拟成绩微调。"},{"id":"5:0","ch":5,"title":"课程资料：什么要优先使用","lead":"老师提供的资料较多，按使用顺序整理：课程课件 → 章节练习 → 历年真题 → 精华知识点/错题本，而不是把所有资源同时摊开。","points":[{"name":"录播与课件","detail":"录播讲原理，课件用于每章 10—20 分钟的快速回忆。"},{"name":"课后习题","detail":"按章节分组的历年题，学完一章立即刷一组。"},{"name":"历年真题","detail":"第二阶段完整计时练习，两科都要做。"},{"name":"精华知识点","detail":"老师将其定位为考前快速回顾的浓缩资料，而非替代精讲。"},{"name":"直播/串讲/答疑","detail":"属于该培训班的可选配套服务，不构成参加考试的必要条件。"}],"priority":"normal","source":"PDF 第9页配套学习资料表；课程转写“课程配套”","visual":"resources","warning":"","takeaway":"让资料服务于学习流程，避免只收藏、不实践。"},{"id":"5:1","ch":5,"title":"常见问题：怎样防止无效刷课刷题","lead":"这节课给出的最有复用价值的方法，是每一章学习后立刻回忆、练习和记录错因。","points":[{"name":"只看视频不回顾","detail":"下一章容易遗忘上一章；回看课件可以快速巩固。"},{"name":"整套课程学完才开始做题","detail":"容易发现漏洞太晚；教师明确建议章节学习与章节练习同步。"},{"name":"只刷基础知识题","detail":"两科都需合格，应用技术题需要从第一阶段开始接触。"},{"name":"刷题不计时","detail":"能做对不代表能按机考节奏完成。"},{"name":"不管理错题","detail":"只记录对错，不总结错误原因和重做情况，复盘价值较低。"}],"priority":"focus","source":"PDF 第10—11页；课程转写复习方法","visual":"mistakes","warning":"","takeaway":"每章完成：理解、回忆、练习、复盘，四步闭环。"},{"id":"5:2","ch":5,"title":"历史资料与最新公告的核对清单","lead":"考试介绍最容易过期的是报名时间、考试月份、机考操作、资格证书福利、具体题型和通过率。","points":[{"name":"要核对的① 年度与考区","detail":"明确写“2026 年广东考区”等，不依赖旧课件中的月份经验。"},{"name":"要核对的② 考务规则","detail":"基础知识最低/最高作答时间、准考证、禁止入场时间、考试软件说明。"},{"name":"要核对的③ 证书政策","detail":"资格聘任、落户、补贴和有效期不做全国统一承诺。"},{"name":"要核对的④ 题型分布","detail":"课件的分值划分是老师历年经验，不是固定不变的官方试卷配方。"},{"name":"要核对的⑤ 通过率","detail":"培训班自述通过率和非权威全国通过率不作为客观备考目标。"}],"priority":"focus","source":"课程转写；2026 深圳/广州官方考务公告","visual":"verify","warning":"","takeaway":"以官方新公告为准，课程经验做复习方向参考。"}],"quizzes":[{"topic":"1:0","question":"软件设计师属于软考的哪个等级？","options":["初级","中级","高级","不分级"],"answer":1,"explain":"课程介绍与资格目录均明确，软件设计师是中级资格。"},{"topic":"2:0","question":"课件所讲的“基础知识”科目满分是多少？","options":["45分","60分","75分","100分"],"answer":2,"explain":"课件按75道单选、每题1分讲解，共75分。"},{"topic":"2:0","question":"按课件两科合格线的讲解，哪项正确？","options":["两科相加达到90分即可","每科分别达到45分","只需基础知识过线","只需应用技术过线"],"answer":1,"explain":"老师强调两科分开计分且都达到各自合格线。"},{"topic":"2:1","question":"2026年批次规则中基础知识最长作答多长时间？","options":["90分钟","100分钟","120分钟","150分钟"],"answer":2,"explain":"2026初中级两科连考共240分钟，基础知识最长120分钟。"},{"topic":"2:1","question":"基础知识用100分钟，两科240分钟总时长下，应用技术剩余多少分钟？","options":["100分钟","120分钟","140分钟","150分钟"],"answer":2,"explain":"240 - 100 = 140分钟。"},{"topic":"2:2","question":"关于2026年下半年考试安排，下列哪项更准确？","options":["一定是11月","2026年10月安排考试，实际批次看准考证","全国每年固定同一天","只看课程旧课件即可"],"answer":1,"explain":"2026官方考务安排列出10月24至27日窗口，具体批次以准考证为准。"},{"topic":"3:1","question":"课程分值统计 le":"2026深圳考务公告","url":"https://hrss.sz.gov.cn/szksy/zxxx/content/post_12939472.html","desc":"2026考试设置、资格、报名与身份核验示例"},{"title":"2026广州考试问答","url":"https://rsj.gz.gov.cn/ywzt/rcgz/rsks/bmtz/content/post_10736860.html","desc":"2026日期、准考证与网上报名流程参考"}]};
const {chapters,topics,quizzes,weights,phases,resources}=DATA;
const topicsById=new Map(topics.map(t=>[t.id,t]));
const S={view:'home',current:'0:0',openChap:0,openMap:0,onlyFocus:false,quizScope:'all',qIndex:0,qPicks:{},qDone:false,qItems:[],minutes:90};
const $=x=>document.getElementById(x);
const esc=t=>String(t??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;');
function readStore(key,def){try{let v=localStorage.getItem(key);return v===null?def:JSON.parse(v)}catch(e){return def}}
function saveStore(key,val){try{localStorage.setItem(key,JSON.stringify(val))}catch(e){}}
let learned=readStore('soft_exam_intro_learned',{}),doneSteps=readStore('soft_exam_intro_steps',{}),wrongIds=readStore('soft_exam_intro_wrong',[]);
S.current=topicsById.has(readStore('soft_exam_intro_last','0:0'))?readStore('soft_exam_intro_last','0:0'):'0:0';S.openChap=topicsById.get(S.current).ch;S.onlyFocus=readStore('soft_exam_intro_focus',false);
function priorityBadge(p){return p==='must'?'<span class="pill must">必须关注</span>':p==='focus'?'<span class="pill focus">复习重点</span>':''}
function scrollTop(){ $('scroller').scrollTop=0;hideSide() }
function hideSide(){$('side').classList.remove('open');$('scrim').classList.remove('open')}
function setView(v){S.view=v;render();scrollTop()}
function readTopic(k){if(!topicsById.has(k))return;S.current=k;S.openChap=topicsById.get(k).ch;saveStore('soft_exam_intro_last',k);setView('read')}
function progress(){return topics.filter(t=>learned[t.id]===2).length}
function renderSide(){let focusTotal=topics.filter(t=>t.priority!=='normal').length;$('sideCount').textContent=`6 大板块`; $('progressText').textContent=`${progress()} / ${topics.length}`;$('progressBar').style.width=(100*progress()/topics.length)+'%';$('onlyFocus').setAttribute('aria-pressed',String(S.onlyFocus));$('onlyFocus').classList.toggle('on',S.onlyFocus);$('onlyFocus').lastElementChild.textContent=S.onlyFocus?'开启':'关闭';$('nav').innerHTML=chapters.map(c=>{let ids=c.ids.filter(id=>!S.onlyFocus||topicsById.get(id).priority!=='normal');let part=ids.map(id=>{let t=topicsById.get(id);return `<button class="side-topic ${t.priority==='must'?'level-must':t.priority==='focus'?'level-focus':''} ${S.current===id&&S.view==='read'?'selected':''}" data-topic="${id}"><span class="st-title">${esc(t.title)}</span>${t.priority==='must'?'<span class="tag">必看</span>':t.priority==='focus'?'<span class="tag focus">重点</span>':''}${learned[id]===2?'<span class="done">✓</span>':''}</button>`}).join('');return `<div class="side-chapter"><button class="chapter-btn ${S.openChap===c.id&&S.view==='read'?'current':''}" data-chapter="${c.id}" aria-expanded="${S.openChap===c.id}"><span class="ch-number">${String(c.id+1).padStart(2,'0')}</span><span class="ch-title">${esc(c.name)}</span>${c.ids.filter(id=>topicsById.get(id).priority!=='normal').length?`<span class="ch-count">★${c.ids.filter(id=>topicsById.get(id).priority!=='normal').length}</span>`:''}<span class="ch-arrow">${S.openChap===c.id?'⌄':'›'}</span></button>${S.openChap===c.id?`<div class="side-sub">${part||'<span style="font-size:11px;padding:10px;color:#90a8bd">本板块暂无标记重点</span>'}</div>`:''}</div>`}).join('')}
function flow(x){return `<div class="rowflow">${x.map((s,i)=>`${i?'<span class="arrow">→</span>':''}<div class="flowcell">${esc(s[0])}<small>${esc(s[1])}</small></div>`).join('')}</div>`}
function tiles(xs){return `<div class="gridcols">${xs.map(x=>`<div class="tile"><strong>${esc(x[0])}</strong>${esc(x[1])}</div>`).join('')}</div>`}
function viz(t){let v=t.visual,b='';if(!v)return '';if(v==='overview')b=flow([['考试介绍','认识资格与规则'],['考点分析','上午+下午考查内容'],['备考复习','三阶段学习法']]);
else if(v==='stats')b=tiles([['2 门科目','基础知识 + 应用技术'],['75 × 2','两科满分各 75 分'],['240 分钟','2026机考连考总时长'],['200 小时','老师示例备考总量']]);
else if(v==='levels')b=flow([['初级','程序员等'],['中级','软件设计师'],['高级','系统架构设计师等']]);
else if(v==='subjects')b=tiles([['基础知识','75 道单选题，满分 75 分，老师讲解 45 分及格'],['应用技术','课件 6 道案例题，4 必答 + 2 选 1，合计作答 5 道'],['合格标准','两科分别达线，不是相加过线']]);
else if(v==='clock'||v==='sim')b=timeSimulator();
else if(v==='calendar')b=tiles([['2026 上半年','5 月 23—26 日'],['2026 下半年','10 月 24—27 日'],['未来考试','以当年全国公告和所在考区准考证为准']]);
else if(v==='links')b=resourceLinks();
else if(v==='outline')b=tiles([['计算机基础','数据表示、操作系统、数据结构与算法'],['软件工程','开发方法、项目管理、设计与测试'],['实用技能','数据库、UML、C语言算法、C++/Java、专业英语']]);
else if(v==='weight')b=weightChart();
else if(v==='afternoon')b=afternoonTable();
else if(v==='case')b=flow([['试题1','DFD'],['试题2','E-R设计'],['试题3','UML'],['试题4','C算法'],['5 / 6','C++或Java']]);
else if(v==='phases')b=phaseSummary();
else if(v==='stage1')b=flow([['看课','理解原理'],['回顾课件','10—20分钟'],['章节练习','及时检验'],['错题复盘','写错因']]);
else if(v==='stage2')b=flow([['完整真题','8—10套'],['计时模拟','两科连考'],['看解析','不是只统计分数'],['复练错题','回归薄弱点']]);
else if(v==='stage3')b=flow([['模考诊断','定位短板'],['精华知识','上午复习'],['核心题型','下午训练'],['错题重做','考前复盘']]);
else if(v==='resources')b=tiles([['课程精讲','用于真正理解知识'],['章节题','用于每章后立刻检查'],['整套真题','用于计时模拟和查漏']]);
else if(v==='mistakes')b=tiles([['只看不做','难以形成可提取的记忆'],['只做上午','忽略两科都要达标'],['只重数量','不计时、不复盘错因']]);
else if(v==='verify')b=flow([['课程原文','保留老师观点'],['官方信息','确认考务与政策'],['备考行动','择新而用']]);
return `<section class="card"><h3>结构化理解</h3><div class="viz"><div class="viz-label">STUDY VISUAL / ${esc(t.title)}</div>${b}</div></section>`}
function timeSimulator(){return `<div class="time-sim"><div class="time-value"><small>基础知识计划用时</small><strong id="timeOne">${S.minutes} 分钟</strong></div><div class="time-value"><small>应用技术可用时间</small><strong id="timeTwo">${240-S.minutes} 分钟</strong></div></div><label for="timeRange" style="font-size:12px;font-weight:750">拖动滑块，调整第一科用时</label><input class="time-range" id="timeRange" type="range" min="90" max="120" step="5" value="${S.minutes}"><div class="time-bar"><div class="left" id="barOne" style="width:${S.minutes/240*100}%"></div><div class="right" style="flex:1"></div></div><div class="time-foot"><span>基础知识：90—120分钟</span><span>总计：240分钟</span></div><div class="note-box">老师建议从 <b>90 + 150</b> 开始模拟。2026 考务规则中的基础知识单科最短 90 分钟、最长 120 分钟应当遵守。</div>`}
function weightChart(){return `<div class="section-title"><h2>基础知识 75 分 · 课程权重参考</h2><small>课件第6—8页；非官方固定分值</small></div><div class="card">${weights.map(([k,v])=>`<div class="chart-row"><span class="chart-label">${esc(k)}</span><div class="chart-track"><i style="width:${100*v/10}%"></i></div><b>${v} 分</b></div>`).join('')}<div class="chart-total">合计 75 分 · 老师历年估计，不等于未来试卷配额</div></div>`}
function afternoonTable(){let rows=[['1','必答','数据流图 DFD','外部实体、数据存储、数据流'],['2','必答','数据库设计','E-R、关系模式、主外键'],['3','必答','UML 建模','用例图、类图与行为图'],['4','必答','C 语言算法','代码填空、算法与复杂度'],['5','选答','C++ 程序设计','语法、类与设计模式'],['6','选答','Java 程序设计','语法、类与设计模式']];return `<div style="overflow-x:auto"><table class="case-table"><tr><th>题号</th><th>课件分类</th><th>主题</th><th>常见考查</th></tr>${rows.map(r=>`<tr>${r.map(v=>`<td><strong>${esc(v)}</strong></td>`).join('')}</tr>`).join('')}</table></div>`}
function phaseSummary(){return `<div class="gridcols">${phases.map((p,i)=>`<div class="tile"><div class="stepnumber">阶段 ${i+1}</div><strong style="margin-top:10px">${esc(p.name)}</strong><span style="font-size:21px;font-weight:850;color:var(--blue)">${p.hours}h</span><br><small>${esc(p.timing)}</small></div>`).join('')}</div>`}
function resourceLinks(){return `<div class="sources-list">${resources.map(r=>`<a class="source-link" href="${r.url}" target="_blank" rel="noopener noreferrer"><span><strong>${esc(r.title)}</strong><small>${esc(r.desc)}</small></span><span style="color:var(--blue)">↗</span></a>`).join('')}</div>`}
function cards(){return `<div class="cards">${chapters.map(c=>{let done=c.ids.filter(k=>learned[k]===2).length;return `<article class="card"><div class="card-head"><span class="card-index">MODULE 0${c.id+1}</span><span class="pill">${c.ids.length} 个主题</span></div><h3 style="margin-top:13px">${esc(c.name)}</h3><p>${esc(c.desc)}</p><div class="simplebar"><i style="width:${100*done/c.ids.length}%"></i></div><div class="card-foot"><span>${done} / ${c.ids.length} 已掌握</span><button data-topic="${c.ids[0]}">进入板块 ↗</button></div></article>`}).join('')}</div>`}
function home(){let n=progress();return `<section class="hero"><div class="kicker">COURSE 00 · EXAM ORIENTATION</div><h1>先弄清考试全貌，<br>再安排每一步复习。</h1><p>基于《软设考试介绍》PDF 和文老师的课堂转写整理，保留课程题型分析与三阶段学习方法，并区分 2026 年官方考务信息。</p><div class="hero-buttons"><button class="btn primary" data-topic="${S.current}">${n?'继续学习':'开始学习'} ↗</button><button class="btn ghost" data-view="weights">查看两科考点</button><button class="btn ghost" data-view="plan">打开备考路线</button></div></section><div class="stats"><div class="stat"><b>6</b><small>学习板块</small></div><div class="stat"><b>${topics.length}</b><small>学习主题</small></div><div class="stat"><b>${quizzes.length}</b><small>自测题</small></div><div class="stat"><b>${n}/${topics.length}</b><small>已掌握主题</small></div></div><div class="note-box warn"><strong>课程历史信息核对 · 2026-11-25</strong><div>课件说下半年通常在11月，但2026年官方安排为10月；课件的分值分布、通过率和推荐选答题属于老师的课程经验。涉及下一年度报名及考点时，请看官方最新公告。</div></div><div class="section-title"><h2>从这里开始学习</h2><small>六大板块按课程逻辑整理</small></div>${cards()}<div class="section-title"><h2>老师的三阶段学习路线</h2><small>课程建议 · 总计约200小时</small></div><div class="card">${phaseSummary()}<p style="font-size:12px;color:var(--muted);margin-top:16px;line-height:1.85">建议第一次学习以「图文精讲」为主；后续查看「考点分布」和「备考路线」，最后做「知识自测」。</p></div>`}
function read(){let t=topicsById.get(S.current),c=chapters[t.ch],ids=c.ids,idx=ids.indexOf(t.id),glob=topics.indexOf(t),before=topics[glob-1],after=topics[glob+1];return `<div class="crumb">学习首页 / ${esc(c.name)} / 第 ${idx+1} 节</div><div class="titleline"><div><div class="kicker">MODULE 0${t.ch+1} / TOPIC ${String(idx+1).padStart(2,'0')}</div><h1 class="page-title">${esc(t.title)}</h1><div class="subj">${priorityBadge(t.priority)}<span class="pill">${esc(c.name)}</span><span class="pill">${learned[t.id]===2?'✓ 已掌握':learned[t.id]===1?'学习中':'未学习'}</span></div></div><button class="btn ${learned[t.id]===2?'done':''}" data-master="${t.id}">${learned[t.id]===2?'✓ 已掌握 · 重置':learned[t.id]===1?'◐ 学习中 · 标记掌握':'○ 未学习 · 标记学习中'}</button></div><p class="page-lead">${esc(t.lead)}</p><div class="topic-chips">${c.ids.map(id=>`<button data-topic="${id}" class="${id===t.id?'current':''}">${esc(topicsById.get(id).title)}</button>`).join('')}</div><div class="note-box"><strong>先理解这一点</strong><div>${esc(t.lead)}</div></div>${viz(t)}<div class="card"><h3>课程知识与学习要求</h3>${t.points.map(p=>`<div class="point"><div><b>${esc(p.name)}</b><p>${esc(p.detail)}</p></div></div>`).join('')}<div class="source">资料来源：${esc(t.source)}</div></div>${t.warning?`<div class="note-box warn"><strong>⚠ 资料核对 / 时效提醒</strong><div>${esc(t.warning)}</div></div>`:''}${t.takeaway?`<div class="card"><h3>一分钟回忆</h3><p style="font-weight:750;color:var(--ink);font-size:14px">${esc(t.takeaway)}</p></div>`:''}<div class="topic-foot"><button class="btn" ${!before?'disabled':''} ${before?`data-topic="${before.id}"`:''}>← 上一个主题</button><div class="right"><button class="btn" data-view="quiz">知识自测</button><button class="btn primary" ${!after?'disabled':''} ${after?`data-topic="${after.id}"`:''}>下一个主题 →</button></div></div>`}
function mapView(){return `<div class="kicker">KNOWLEDGE MAP</div><h1 class="page-title">课程知识脑图</h1><p class="page-lead">先从模块和主题回忆，再点击需要复习的主题进入图文精讲。点击模块标题可展开或收起分支。</p><div class="map-root">软件设计师 · 考试介绍与复习方法</div>${chapters.map(c=>`<div class="map-group"><button class="map-group-top" data-mapchap="${c.id}"><span>${String(c.id+1).padStart(2,'0')} · ${esc(c.name)}</span><span>${S.openMap===c.id?'－':'＋'}</span></button>${S.openMap===c.id?`<div class="map-items">${c.ids.map(id=>{let t=topicsById.get(id);return `<button data-topic="${id}"><strong>${esc(t.title)}</strong><small>${esc(t.takeaway||t.lead.slice(0,58))}</small></button>`}).join('')}</div>`:''}</div>`).join('')}`}
function weightsView(){return `<div class="kicker">EXAM BLUEPRINT</div><h1 class="page-title">考点分布与题型策略</h1><p class="page-lead">整理自课件第 6—8 页的两科考点表。上午分值是讲课老师对历年考点的估算；下午题型是课程讲义的分类，不是保证未来完全固定的试卷结构。</p><div class="note-box warn"><strong>分布口径</strong><div>下面的 75 分不是官方固定配额。题型、批次、选答要求应以当期试卷说明与官方公告为准。</div></div>${weightChart()}<div class="section-title"><h2>应用技术 · 题型结构</h2><small>PDF 第 8 页课程表</small></div><div class="card">${afternoonTable()}</div><div class="card" style="margin-top:17px"><h3>老师特别强调的学习策略</h3>${tiles([['前三题先争取稳定得分','DFD + 数据库设计 + UML 是课堂重点训练模块'],['算法题不能只背 C 语法','要理解算法结构、填空逻辑及复杂度'],['语言选做看自身熟练度','课程更偏向 Java，但别忽略你已掌握的 C++']])}</div>`}
function plan(){return `<div class="kicker">PREPARATION ROADMAP</div><h1 class="page-title">三阶段备考路线</h1><p class="page-lead">沿用老师的“100 小时建立体系 → 70 小时真题训练 → 30 小时考前冲刺”结构。勾选完成的任务会保存在当前浏览器。</p><div class="card">${phaseSummary()}</div>${phases.map((p,i)=>{let complete=p.steps.filter((v,j)=>doneSteps[p.id+':'+j]).length;return `<section class="card" style="margin:18px 0"><div class="phase-line"><b>阶段 ${i+1} · ${esc(p.name)}</b><small>${complete}/${p.steps.length} 已完成 · 约${p.hours}小时</small></div><div class="meter" style="background:var(--line)"><i style="width:${100*complete/p.steps.length}%;background:var(--teal)"></i></div>${p.steps.map((s,j)=>`<label class="checkrow"><input type="checkbox" data-step="${p.id+':'+j}" ${doneSteps[p.id+':'+j]?'checked':''}><span>${esc(s)}</span></label>`).join('')}</section>`}).join('')}<div class="section-title"><h2>240分钟考场分配模拟</h2><small>2026基础知识90—120分钟</small></div><div class="card">${timeSimulator()}</div><div class="note-box warn">老师把备考总量估计为200小时，适合用作规划起点。真正的进度和冲刺方向应根据两科模考成绩、错题数量、知识基础调整。</div>`}
function initQuiz(scope){S.quizScope=scope;S.qIndex=0;S.qPicks={};S.qDone=false;S.qItems=quizzes.map((q,i)=>({...q,index:i})).filter(q=>scope==='all'||scope==='wrong'&&wrongIds.includes(q.index)||scope.startsWith('c')&&topicsById.get(q.topic).ch===Number(scope.slice(1)));setView('quiz')}
function quizView(){let opts=[['all','全课自测'],['c1','考试认知'],['c2','考试规则'],['c3','考点结构'],['c4','备考方法'],['wrong','错题重练']];let head=`<div class="kicker">QUICK PRACTICE</div><h1 class="page-title">课程要点自测</h1><p class="page-lead">根据课件与课堂转写编写的自测题，主要帮助记住考试结构和老师的备考方法，不冒充考试原题。</p><div class="qa-head">${opts.map(o=>`<button data-scope="${o[0]}" class="${S.quizScope===o[0]?'on':''}">${o[1]}${o[0]==='wrong'?' ('+wrongIds.length+')':''}</button>`).join('')}</div>`;let qs=S.qItems;if(S.qDone){let correct=qs.filter(q=>S.qPicks[q.index]===q.answer).length;return head+`<div class="card quiz"><span class="kicker">本次练习结束</span><div class="big-score">${qs.length?Math.round(100*correct/qs.length):0} 分</div><h2>${correct} / ${qs.length} 题正确</h2><p style="color:var(--muted);line-height:1.85">错误题已记录，可点击「错题重练」再次检查。</p><button class="btn primary" data-scope="${S.quizScope}">再做一遍</button> <button class="btn" data-scope="wrong">复习错题</button></div>`}if(!qs.length)return head+'<div class="card">此分类暂无题目或暂无记录的错题。请切换分类。</div>';let q=qs[S.qIndex],a=S.qPicks[q.index],marked=a!==undefined;return head+`<div class="card quiz"><div style="display:flex;justify-content:space-between;gap:10px;font-size:12px;color:var(--muted)"><span>第 ${S.qIndex+1} / ${qs.length} 题</span><span>${esc(chapters[topicsById.get(q.topic).ch].name)}</span></div><div class="quiz-progress"><i style="width:${100*S.qIndex/qs.length}%"></i></div><div class="question">${esc(q.question)}</div>${q.options.map((opt,i)=>`<button data-answer="${i}" ${marked?'disabled':''} class="choice ${marked&&q.answer===i?'good':''} ${marked&&a===i&&a!==q.answer?'bad':''}"><b>${'ABCD'[i]}.</b><span>${esc(opt)}</span></button>`).join('')}${marked?`<div class="quiz-answer"><b>${a===q.answer?'✓ 回答正确':'✕ 回答错误'}，正确答案：${'ABCD'[q.answer]}</b><div style="margin-top:6px">${esc(q.explain)}</div><button class="btn" style="margin-top:11px" data-topic="${q.topic}">打开对应精讲 ↗</button></div>`:''}<div class="quiz-footer"><span style="color:var(--muted);font-size:11px">${marked?'已作答':'请选择一个答案'}</span><button class="btn primary" data-next ${!marked?'disabled':''}>${S.qIndex===qs.length-1?'查看成绩':'下一题 →'}</button></div></div>`}
function render(){renderSide();document.querySelectorAll('[data-view]').forEach(b=>{if(b.classList.contains('tab'))b.classList.toggle('on',b.dataset.view===S.view)});$('topTitle').textContent=S.view==='read'?topicsById.get(S.current).title:'软件设计师 · 考试介绍与复习方法';$('main').innerHTML=({home,read,map:mapView,weights:weightsView,plan,quiz:quizView}[S.view]||home)()}
function search(query){query=query.trim().toLowerCase();let matches=topics.filter(t=>(t.title+' '+t.lead+' '+t.points.map(p=>p.name+' '+p.detail).join(' ')).toLowerCase().includes(query));if(query)matches.sort((a,b)=>{const score=t=>t.title.toLowerCase().startsWith(query)?0:t.title.toLowerCase().includes(query)?1:2;return score(a)-score(b)});else matches=topics.filter(t=>t.priority!=='normal').slice(0,8);$('results').innerHTML=`<div style="font-size:12px;color:var(--muted)">${query?'匹配 '+matches.length+' 个主题':'推荐重点内容'}</div>`+matches.slice(0,25).map(t=>`<button class="result" data-topic="${t.id}"><strong>${esc(t.title)}</strong><small>${esc(chapters[t.ch].name)} · ${esc(t.lead.slice(0,68))}</small></button>`).join('')+(matches.length?'':'<span style="color:var(--muted);font-size:12px">没有匹配的主题，请换个关键词。</span>')}
function openSearch(){$('overlay').classList.remove('hidden');$('searchInput').focus();search('')}
function closeSearch(){$('overlay').classList.add('hidden')}
document.body.addEventListener('click',e=>{let b=e.target.closest('button');if(!b)return;if(b.dataset.view){setView(b.dataset.view);return}if(b.dataset.chapter!==undefined){let n=Number(b.dataset.chapter);S.openChap=S.openChap===n?-1:n;renderSide();return}if(b.dataset.topic){closeSearch();readTopic(b.dataset.topic);return}if(b.dataset.master){let k=b.dataset.master;learned[k]=((learned[k]||0)+1)%3;saveStore('soft_exam_intro_learned',learned);render();return}if(b.dataset.mapchap!==undefined){let n=Number(b.dataset.mapchap);S.openMap=S.openMap===n?-1:n;render();return}if(b.dataset.scope){initQuiz(b.dataset.scope);return}if(b.dataset.answer!==undefined){let q=S.qItems[S.qIndex];if(S.qPicks[q.index]===undefined){S.qPicks[q.index]=Number(b.dataset.answer);render()}return}if(b.hasAttribute('data-next')){if(S.qIndex===S.qItems.length-1){S.qDone=true;wrongIds=Array.from(new Set([...wrongIds.filter(k=>!S.qItems.some(q=>q.index===k)),...S.qItems.filter(q=>S.qPicks[q.index]!==q.answer).map(q=>q.index)]));saveStore('soft_exam_intro_wrong',wrongIds)}else S.qIndex++;render();$('scroller').scrollTop=0;return}});
document.body.addEventListener('change',e=>{let x=e.target;if(x.matches('[data-step]')){doneSteps[x.dataset.step]=x.checked;saveStore('soft_exam_intro_steps',doneSteps);render()}if(x.id==='timeRange'){S.minutes=Number(x.value);render()}});
document.body.addEventListener('input',e=>{if(e.target.id==='timeRange'){S.minutes=Number(e.target.value);$('timeOne').textContent=S.minutes+' 分钟';$('timeTwo').textContent=(240-S.minutes)+' 分钟';$('barOne').style.width=(S.minutes/240*100)+'%'}});
$('onlyFocus').onclick=()=>{S.onlyFocus=!S.onlyFocus;saveStore('soft_exam_intro_focus',S.onlyFocus);renderSide()};$('themeBtn').onclick=()=>{let next=document.documentElement.dataset.theme==='dark'?'light':'dark';document.documentElement.dataset.theme=next;try{localStorage.setItem('soft_exam_intro_theme',next)}catch(e){}};
$('menuBtn').onclick=()=>{$('side').classList.add('open');$('scrim').classList.add('open')};$('scrim').onclick=hideSide;$('searchBtn').onclick=openSearch;$('closeSearch').onclick=closeSearch;$('searchInput').oninput=e=>search(e.target.value);$('overlay').addEventListener('click',e=>{if(e.target===$('overlay'))closeSearch()});document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeSearch();hideSide()}if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();openSearch()}});
initQuiz('all');setView('home');
</script></body></html>
