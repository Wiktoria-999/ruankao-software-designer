<script>
const DATA = {"chapters":[{"id":0,"number":"00","name":"本章考试定位","subtitle":"PDF 第2页；转写 12.1–12.3","topicIds":["0:0","0:1"]},{"id":1,"number":"01","name":"范围管理","subtitle":"PDF 第2–4页；转写 12.1","topicIds":["1:0","1:1","1:2","1:3","1:4","1:5"]},{"id":2,"number":"02","name":"进度管理","subtitle":"PDF 第4–8页；转写 12.1","topicIds":["2:0","2:1","2:2","2:3","2:4","2:5","2:6","2:7","2:8","2:9","2:10","2:11","2:12","2:13"]},{"id":3,"number":"03","name":"成本管理","subtitle":"PDF 第9–10页；转写 12.2","topicIds":["3:0","3:1","3:2","3:3","3:4","3:5"]},{"id":4,"number":"04","name":"软件配置管理","subtitle":"PDF 第10–14页；转写 12.2","topicIds":["4:0","4:1","4:2","4:3","4:4","4:5","4:6","4:7","4:8"]},{"id":5,"number":"05","name":"质量管理","subtitle":"PDF 第15–17页；转写 12.3","topicIds":["5:0","5:1","5:2","5:3","5:4","5:5","5:6","5:7"]},{"id":6,"number":"06","name":"风险管理","subtitle":"PDF 第18–20页；转写 12.3","topicIds":["6:0","6:1","6:2","6:3","6:4","6:5","6:6","6:7"]},{"id":7,"number":"07","name":"组织结构与补充知识","subtitle":"PDF 第20–21页；转写 12.3","topicIds":["7:0","7:1","7:2"]}],"lessons":[{"id":"0:0","chapter":0,"index":0,"title":"考试定位与学习重点","fullTitle":"考试定位与学习重点","intro":"12.1 开篇指出，本章在软件设计师考试中总体分值不高，主要从管理角度看项目。","points":[{"text":"老师开篇估计每年约2–3分，进度管理通常约2分。","note":"","priority":"frequent"},{"text":"关键路径、总时差、自由时差是本章最重要的计算考点。","note":"","priority":"must"},{"text":"配置、质量、风险可能各出现概念题，实际分布不固定。","note":"","priority":"frequent"},{"text":"范围、成本过程等理论内容相对少考。","note":"","priority":"understand"}],"source":"PDF 第2页；转写 12.1–12.3","priority":"","memory":"先拿稳进度计算，再记配置、质量、风险。","visual":"road","notice":"分值与频率是授课时的经验判断，不是官方固定配分。12.2 中老师还谈到其他项目管理类考试的成本计算；本章按软件设计师口径，不额外扩展挣值公式。"},{"id":"0:1","chapter":0,"index":1,"title":"本章学习方法","fullTitle":"本章学习方法","intro":"老师强调先理解管理过程的前后逻辑，再做关键路径题，不必为了简单选择题反复画完整七格图。","points":[{"text":"先学会完整顺推、逆推，再练路径枚举的快捷方法。","note":"","priority":"must"},{"text":"范围、成本、质量、风险的过程按顺序记。","note":"","priority":"frequent"},{"text":"配置项状态与版本、配置库三类、质量特性归属、风险分类用对照记忆。","note":"","priority":"frequent"},{"text":"其他补充内容按老师要求理解即可。","note":"","priority":"understand"}],"source":"PDF 第2页；转写 12.1–12.3","priority":"","memory":"会算工期和时差；会辨概念；会用例题检验。","visual":"road"},{"id":"1:0","chapter":1,"index":0,"title":"范围管理的含义","fullTitle":"范围管理的含义","intro":"范围是需求的边界：该做的都做，不该做的不做。","points":[{"text":"确定项目包含与不包含的工作。","note":"","priority":"understand"},{"text":"项目生命周期中范围可能变化，需要管理变更。","note":"","priority":"understand"},{"text":"需求描述要什么，范围界定工作的边界。","note":"","priority":"understand"},{"text":"变更应遵循正式的变更流程。","note":"","priority":""}],"source":"PDF 第2–4页；转写 12.1","priority":"","memory":"需求是要什么，范围是边界。","visual":"summary"},{"id":"1:1","chapter":1,"index":1,"title":"范围管理五个过程","fullTitle":"范围管理五个过程","intro":"老师要求按本课教材的五个过程顺序记忆，而不是套用中高项的其他版本。","points":[{"text":"规划范围管理（编制范围管理计划）：说明如何定义、确认、控制范围。","note":"","priority":"must"},{"text":"定义范围：编制项目范围说明书。","note":"","priority":"must"},{"text":"创建WBS：分解成便于管理的组成部分。","note":"","priority":"must"},{"text":"确认范围：正式验收已完成的可交付成果。","note":"","priority":"must"},{"text":"范围控制：监督范围状态及范围基准变更。","note":"","priority":"must"}],"source":"PDF 第2–4页；转写 12.1","priority":"","memory":"规划→定义→WBS→确认→控制。","visual":"scopeflow"},{"id":"1:2","chapter":1,"index":2,"title":"定义范围的输入","fullTitle":"定义范围的输入","intro":"老师特别指出定义范围的输入可能考到，要区分提出变更和批准变更。","points":[{"text":"项目章程：正式启动项目的文件。","note":"","priority":"frequent"},{"text":"项目范围管理计划：指导如何管理范围。","note":"","priority":"frequent"},{"text":"组织过程资产：例如组织内部模板、历史资料。","note":"","priority":"frequent"},{"text":"批准的变更申请：经过评估和审批，不是任意提交的请求。","note":"","priority":"frequent"}],"source":"PDF 第2–4页；转写 12.1","priority":"","memory":"章程、范围计划、组织过程资产、批准的变更申请。","visual":"summary"},{"id":"1:3","chapter":1,"index":3,"title":"产品范围与项目范围","fullTitle":"产品范围与项目范围","intro":"产品范围关注产品需要有什么功能；项目范围关注为了交付产品必须完成哪些工作。","points":[{"text":"产品范围：产品或服务应具备的功能，以产品描述判断完成情况。","note":"","priority":"frequent"},{"text":"项目范围：交付产品需要完成的工作，以范围基准衡量。","note":"","priority":"frequent"},{"text":"产品范围是项目范围的基础。","note":"","priority":""},{"text":"产品范围描述是项目范围说明书的重要组成部分。","note":"","priority":""}],"source":"PDF 第2–4页；转写 12.1","priority":"","memory":"产品看功能，项目看交付所需工作。","visual":"scopecompare"},{"id":"1:4","chapter":1,"index":4,"title":"范围基准与WBS词典","fullTitle":"范围基准与WBS词典","intro":"范围基准由经过批准的三个组成部分构成。","points":[{"text":"项目范围说明书。","note":"","priority":"frequent"},{"text":"工作分解结构 WBS。","note":"","priority":"frequent"},{"text":"WBS词典：进一步说明分解单元的内容。","note":"","priority":"frequent"},{"text":"基准的变更须受控制。","note":"","priority":""}],"source":"PDF 第2–4页；转写 12.1","priority":"","memory":"范围基准=范围说明书+WBS+WBS词典。","visual":"summary"},{"id":"1:5","chapter":1,"index":5,"title":"工作分解结构 WBS","fullTitle":"工作分解结构 WBS","intro":"WBS 将主要可交付成果逐级分解，最终达到可管理的工作包。","points":[{"text":"WBS 的最小分解单元为工作包。","note":"","priority":"frequent"},{"text":"所有工作包的总和是项目的全部工作范围。","note":"","priority":"frequent"},{"text":"可以按可交付成果、子系统或生命周期分解。","note":"","priority":""},{"text":"主要用途是定义项目边界、防止需求蔓延，不是画活动依赖图。","note":"","priority":"frequent"}],"source":"PDF 第2–4页；转写 12.1","priority":"","memory":"WBS：分解到工作包，完整覆盖范围。","visual":"wbs"},{"id":"2:0","chapter":2,"index":0,"title":"进度管理的六个过程","fullTitle":"进度管理的六个过程","intro":"老师要求记住顺序，理论部分快速过，计算是重点。","points":[{"text":"活动定义：确定具体活动。","note":"","priority":"frequent"},{"text":"活动排序：识别逻辑关系。","note":"","priority":"frequent"},{"text":"活动资源估算：所需资源种类和数量。","note":"","priority":"frequent"},{"text":"活动历时估算：所需时间。","note":"","priority":"frequent"},{"text":"进度计划编制：综合顺序、历时、资源及约束。","note":"","priority":"frequent"},{"text":"进度控制：跟踪实际进度，偏差分析与调整。","note":"","priority":"frequent"}],"source":"PDF 第4–8页；转写 12.1","priority":"","memory":"定义→排序→资源→历时→计划→控制。","visual":"scheduleflow"},{"id":"2:1","chapter":2,"index":1,"title":"活动资源估算方法","fullTitle":"活动资源估算方法","intro":"老师说这部分不怎么考，了解几种方法，特别理解自下而上估算。","points":[{"text":"专家判断法：专家经验估算。","note":"","priority":"understand"},{"text":"替换方案确定：比较不同资源方案。","note":"","priority":"understand"},{"text":"公开估算数据：行业数据。","note":"","priority":"understand"},{"text":"估算软件：辅助资源安排。","note":"","priority":"understand"},{"text":"自下而上：逐项估算再汇总。","note":"","priority":"understand"},{"text":"自上而下（课堂类比）：参考类似项目的整体估计再分配。","note":"","priority":"understand"}],"source":"PDF 第4–8页；转写 12.1","priority":"","memory":"自上而下先整体；自下而上先局部。","visual":"estimate"},{"id":"2:2","chapter":2,"index":2,"title":"COCOMO 三种模型","fullTitle":"COCOMO 三种模型","intro":"老师明确要求记住三级模型之间的区别。","points":[{"text":"基本COCOMO：静态单变量，以源代码行数估算工作量。","note":"","priority":"frequent"},{"text":"中间COCOMO：加入产品、硬件、人员、项目等影响因素。","note":"","priority":"frequent"},{"text":"详细COCOMO：进一步考虑软件工程各阶段的影响。","note":"","priority":"frequent"},{"text":"详细模型涉及系统、子系统、模块三个层次。","note":"","priority":""}],"source":"PDF 第4–8页；转写 12.1","priority":"","memory":"基本看代码行，中间加因子，详细加阶段。","visual":"cocomo"},{"id":"2:3","chapter":2,"index":3,"title":"COCOMO II 阶段性模型","fullTitle":"COCOMO II 阶段性模型","intro":"老师要求识别升级模型三个阶段和三种规模估算选择。","points":[{"text":"应用组装模型：课堂对应需求分析、对象点。","note":"","priority":"frequent"},{"text":"早期设计阶段模型：课堂对应功能点。","note":"","priority":"frequent"},{"text":"体系结构阶段模型：课堂对应代码行。","note":"","priority":"frequent"},{"text":"COCOMO II 考虑多个成本驱动因子。","note":"","priority":""}],"source":"PDF 第4–8页；转写 12.1","priority":"","memory":"应用组装—对象点；早期设计—功能点；体系结构—代码行。","visual":"cocomo2","notice":"阶段与度量的对应是老师用于考试记忆的简化口径，不表示真实模型只能使用这一种规模度量。"},{"id":"2:4","chapter":2,"index":4,"title":"甘特图与PERT图","fullTitle":"甘特图与PERT图","intro":"课件第6页用条形时间表和网络图展示两种进度表示法。","points":[{"text":"甘特图：横轴时间，纵轴任务，直观看到工期和时间重叠。","note":"","priority":"frequent"},{"text":"PERT图：强调活动的前后依赖关系，可计算关键路径。","note":"","priority":"frequent"},{"text":"传统甘特图不直接显示依赖；网络图的布局不等于精确的时间坐标。","note":"","priority":""},{"text":"单代号图以节点表示活动，双代号图通常以箭线表示活动。","note":"","priority":""}],"source":"PDF 第4–8页；转写 12.1","priority":"","memory":"甘特看时间重叠，PERT看逻辑依赖。","visual":"gantt","notice":"老师说甘特图不反映依赖、PERT图不反映并行，是对课件传统画法的比较。现代甘特图可显示依赖，网络图可推断并行可能性。"},{"id":"2:5","chapter":2,"index":5,"title":"关键路径与最短工期","fullTitle":"关键路径与最短工期","intro":"老师强调题目说“最短工期”，要找的却是从开始到结束时间最长的路径。","points":[{"text":"关键路径：起点到终点持续时间之和最长的路径。","note":"","priority":"must"},{"text":"在无额外资源约束的通常题设下，关键路径长度就是项目最短工期。","note":"","priority":"must"},{"text":"关键活动是关键路径上的活动，正常情况下总时差为0。","note":"","priority":"must"},{"text":"关键路径可能有多条，也可能因活动历时变化而改变。","note":"","priority":""}],"source":"PDF 第4–8页；转写 12.1","priority":"","memory":"项目最短工期=最长路径长度。","visual":"cpm"},{"id":"2:6","chapter":2,"index":6,"title":"七格图：ES、EF、LS、LF","fullTitle":"七格图：ES、EF、LS、LF","intro":"课件第7页给出七格图；四个角表示最早与最晚时间，中间为工期、活动名称、总浮动时间。","points":[{"text":"ES（Earliest Start）：最早开始。","note":"","priority":"must"},{"text":"EF（Earliest Finish）：最早完成。","note":"","priority":"must"},{"text":"LS（Latest Start）：最迟开始。","note":"","priority":"must"},{"text":"LF（Latest Finish）：最迟完成。","note":"","priority":"must"},{"text":"D：活动持续时间；TF：总浮动时间。","note":"","priority":"must"},{"text":"第一行 ES、D、EF；中间活动名称；最后一行 LS、TF、LF。","note":"","priority":""}],"source":"PDF 第4–8页；转写 12.1","priority":"","memory":"上最早，下最迟；左开始，右完成。","visual":"seven"},{"id":"2:7","chapter":2,"index":7,"title":"顺推：最早开始与最早完成","fullTitle":"顺推：最早开始与最早完成","intro":"从起点向终点计算。多个紧前活动都完成后，当前活动才可以开始。","points":[{"text":"ES = max(所有紧前活动的 EF)。","note":"","priority":"must"},{"text":"EF = ES + D。","note":"","priority":"must"},{"text":"无紧前活动时，通常从0开始。","note":"","priority":""},{"text":"多个前驱取最大值，不是取最小或求和。","note":"","priority":""}],"source":"PDF 第4–8页；转写 12.1","priority":"","memory":"顺推取最大，完成加工期。","visual":"forward"},{"id":"2:8","chapter":2,"index":8,"title":"逆推：最迟完成与最迟开始","fullTitle":"逆推：最迟完成与最迟开始","intro":"从终点向起点计算。当前活动必须在所有后继所允许的时间之前完成。","points":[{"text":"LF = min(所有紧后活动的 LS)。","note":"","priority":"must"},{"text":"LS = LF − D。","note":"","priority":"must"},{"text":"在无额外截止约束的题中，终点LF取项目工期。","note":"","priority":""},{"text":"有多个紧后活动时取最小值。","note":"","priority":""}],"source":"PDF 第4–8页；转写 12.1","priority":"","memory":"逆推取最小，开始减工期。","visual":"backward"},{"id":"2:9","chapter":2,"index":9,"title":"总浮动时间（总时差）","fullTitle":"总浮动时间（总时差）","intro":"在不延误整个项目完工且不违反进度约束时，本活动可以推迟的时间。","points":[{"text":"TF = LS − ES = LF − EF。","note":"","priority":"must"},{"text":"正常题设中关键活动TF=0。","note":"","priority":"must"},{"text":"快捷算法：项目工期 − 经过该活动的最长完整路径长度。","note":"","priority":"frequent"},{"text":"若活动属于多条路径，必须取包含该活动的最长路径。","note":"","priority":""}],"source":"PDF 第4–8页；转写 12.1","priority":"","memory":"总时差：不影响项目完工。","visual":"float"},{"id":"2:10","chapter":2,"index":10,"title":"自由浮动时间（自由时差）","fullTitle":"自由浮动时间（自由时差）","intro":"自由时差关注的是紧后活动的最早开始，而非项目最终完成时间。","points":[{"text":"FF = min(紧后活动ES) − 本活动EF。","note":"","priority":"must"},{"text":"不影响任何紧后活动的最早开始。","note":"","priority":"must"},{"text":"一般网络题中0≤FF≤TF。","note":"","priority":""},{"text":"末端活动可连接到零工期的统一完成节点计算。","note":"","priority":""}],"source":"PDF 第4–8页；转写 12.1","priority":"","memory":"自由时差：不影响后继最早开始。","visual":"float"},{"id":"2:11","chapter":2,"index":11,"title":"完整七格图交互：顺推、逆推、时差","fullTitle":"完整七格图交互：顺推、逆推、时差","intro":"复现课件第7页 A–H 网络，按老师纠错后的依赖和工期重新计算。","points":[{"text":"顺推：A→B/C→D/F→E/G→H，按紧前关系逐个计算。","note":"","priority":"must"},{"text":"D的ES=20，EF=28；E的ES=28，EF=43。","note":"","priority":"must"},{"text":"关键路径 A–B–F–G–H，工期235。","note":"","priority":"must"},{"text":"逆推后C总时差5，自由时差5。","note":"","priority":"must"},{"text":"点击逐步计算，观察各节点七格图与时差表。","note":"","priority":"frequent"}],"source":"PDF 第4–8页；转写 12.1","priority":"","memory":"顺推取大、逆推取小；算完时差找关键活动。","visual":"interactive","notice":"课件第7页原图已注明教材有误，老师指出D的ES、EF以及E的ES、EF均需修正。本网页按公式重算。"},{"id":"2:12","chapter":2,"index":12,"title":"课件真题：由依赖表求工期和总时差","fullTitle":"课件真题：由依赖表求工期和总时差","intro":"课件第8页给出七个活动及其紧前关系，老师建议路径少时直接枚举。","points":[{"text":"A=2；B=4、C=5、D=6 均依赖A。","note":"","priority":"must"},{"text":"E=4依赖B、C；F=6依赖D；G=3依赖E、F。","note":"","priority":""},{"text":"三条路径 ABEG=13、ACEG=14、ADFG=17。","note":"","priority":"must"},{"text":"工期17天，C总时差=17−14=3天。","note":"","priority":"must"},{"text":"C自由时差为0，因为E的ES=7等于C的EF。","note":"","priority":""}],"source":"PDF 第4–8页；转写 12.1","priority":"","memory":"先画依赖，再算完整路径；C的总时差3、自由时差0。","visual":"examnet","examples":[{"title":"依赖表转网络图","given":"A(2)，B(4)、C(5)、D(6)依赖A；E(4)依赖B/C，F(6)依赖D；G(3)依赖E/F。","steps":["列出 ABEG、ACEG、ADFG。","分别累加工期为13、14、17。","取最大17，经过C的路径为14。"],"answer":"工期17天；C总时差3天。","warning":""}]},{"id":"2:13","chapter":2,"index":13,"title":"工期变化与关键路径切换","fullTitle":"工期变化与关键路径切换","intro":"课件第8页第一道题：活动历时变化后项目工期不变，但关键路径发生变化。","points":[{"text":"原关键路径 a-d-f-h-j-k，长度16周。","note":"","priority":"frequent"},{"text":"活动d-i延长2周，a-c实际为6周，f-h提前1周。","note":"","priority":""},{"text":"重新计算：a-c-i-k=15；a-d-i-k=16；a-d-f-h-j-k=15。","note":"","priority":"frequent"},{"text":"新关键路径 a-d-i-k；项目总时长仍为16周。","note":"","priority":"must"},{"text":"路径少时可直接比较，路径复杂时使用顺推。","note":"","priority":""}],"source":"PDF 第4–8页；转写 12.1","priority":"","memory":"工期没变，不代表关键路径没变。","visual":"pathchange"},{"id":"3:0","chapter":3,"index":0,"title":"成本管理三个过程","fullTitle":"成本管理三个过程","intro":"老师用“估算是要钱，预算是花钱”帮助理解，本章主要考概念而非挣值计算。","points":[{"text":"成本估算：估计完成项目所需的成本。","note":"","priority":"understand"},{"text":"成本预算：把估算成本分配至各工作包并形成成本基准。","note":"","priority":"understand"},{"text":"成本控制：在预算范围内实施，发现偏差并纠正。","note":"","priority":"understand"}],"source":"PDF 第9–10页；转写 12.2","priority":"","memory":"估算→预算→控制；要钱→分配钱→管钱。","visual":"costflow"},{"id":"3:1","chapter":3,"index":1,"title":"成本估算与储备","fullTitle":"成本估算与储备","intro":"课件列出三种估算方法，课堂补充应急储备与管理储备。","points":[{"text":"自顶向下：先整体估计再分配。","note":"","priority":"understand"},{"text":"自底向上：逐项估算再累加。","note":"","priority":"understand"},{"text":"差别估算：相似部分参照历史，不同部分单独估算。","note":"","priority":"understand"},{"text":"应急储备：应对已识别风险。","note":"","priority":"frequent"},{"text":"管理储备：应对未识别的不确定性。","note":"","priority":"frequent"}],"source":"PDF 第9–10页；转写 12.2","priority":"","memory":"应急对应已知风险；管理对应未知风险。","visual":"summary","notice":"老师用“项目经理不知道管理储备”作直观解释；真实管理制度中是否知晓、如何批准取用取决于组织规则。"},{"id":"3:2","chapter":3,"index":2,"title":"可变成本与固定成本","fullTitle":"可变成本与固定成本","intro":"老师要求掌握六种成本类型，可变与固定按产量、工作量等变化关系判断。","points":[{"text":"可变成本：随生产量、工作量或时间变化，例如材料费。","note":"","priority":"must"},{"text":"固定成本：在一定范围和期间不随业务量变化，例如厂房租金。","note":"","priority":"must"},{"text":"固定并非永远不变，规模超出原范围时可能变化。","note":"","priority":""}],"source":"PDF 第9–10页；转写 12.2","priority":"","memory":"可变随量变；固定在相关范围内不随量变。","visual":"costtypes"},{"id":"3:3","chapter":3,"index":3,"title":"直接成本与间接成本","fullTitle":"直接成本与间接成本","intro":"老师强调考试的判断关键是“是不是分摊”。","points":[{"text":"直接成本：直接归属于特定项目，如专属团队工资、差旅、物料设备。","note":"","priority":"must"},{"text":"间接成本：由多个项目分摊，如组织公共管理费用。","note":"","priority":"must"},{"text":"同一种费用的归类取决于能否直接归属，不应仅按名称判断。","note":"","priority":""}],"source":"PDF 第9–10页；转写 12.2","priority":"","memory":"直接归属；间接分摊。","visual":"costtypes"},{"id":"3:4","chapter":3,"index":4,"title":"机会成本","fullTitle":"机会成本","intro":"机会成本不是实际发生的损失，而是选择一种方案后放弃的最佳替代方案的价值。","points":[{"text":"机会成本=放弃的可行替代方案中最高的收益。","note":"","priority":"must"},{"text":"不是所选方案的收益，也不是所有放弃收益相加。","note":"","priority":"must"},{"text":"课堂案例：养猪10万、养鸡8万、养羊12万；选择养猪，机会成本12万。","note":"","priority":""},{"text":"课件真题：股票亏500元，存款可得360元，机会成本360元。","note":"","priority":""}],"source":"PDF 第9–10页；转写 12.2","priority":"","memory":"从放弃的方案里选最大收益。","visual":"opportunity","examples":[{"title":"课件机会成本真题","given":"购入股票一年后亏损500元；如果选择存款可获360元。","steps":["确定实际选择：股票。","识别放弃的最佳替代：存款收益360元。"],"answer":"机会成本360元，而非500元或860元。","warning":""}]},{"id":"3:5","chapter":3,"index":5,"title":"沉没成本与学习曲线","fullTitle":"沉没成本与学习曲线","intro":"已经不可收回的支出不应左右未来选择；熟练度提升会影响重复生产的单位成本。","points":[{"text":"沉没成本：过去已发生且未来决策不能改变的成本。","note":"","priority":"must"},{"text":"决策时重点比较未来可改变的成本与收益。","note":"","priority":"frequent"},{"text":"学习曲线：重复生产时单位成本随累计产量增长呈规律性下降。","note":"","priority":"understand"},{"text":"估算时应考虑学习效应。","note":"","priority":""}],"source":"PDF 第9–10页；转写 12.2","priority":"","memory":"沉没是过去不可追回；学习曲线是熟能生巧。","visual":"costtypes"},{"id":"4:0","chapter":4,"index":0,"title":"配置管理的目的与六项活动","fullTitle":"配置管理的目的与六项活动","intro":"配置管理控制变更、维持完整性和可追踪性；老师用需求文档版本不一致解释其价值。","points":[{"text":"制定配置管理计划。","note":"","priority":"understand"},{"text":"配置标识：识别配置项。","note":"","priority":"understand"},{"text":"配置控制：控制配置项变更。","note":"","priority":"understand"},{"text":"配置状态报告：记录状态和变更历史。","note":"","priority":"understand"},{"text":"配置审计：检查配置一致性与合规性。","note":"","priority":"understand"},{"text":"发布管理和交付。","note":"","priority":"understand"}],"source":"PDF 第10–14页；转写 12.2","priority":"","memory":"计划→标识→控制→报告→审计→发布交付。","visual":"configflow"},{"id":"4:1","chapter":4,"index":1,"title":"配置项及主要属性","fullTitle":"配置项及主要属性","intro":"按课件 GB/T 11457—2006 定义，配置项是在配置管理中视为单个实体的硬件、软件或集合。","points":[{"text":"典型配置项：需求、设计、源代码、可执行代码、测试用例、项目计划和相关文档。","note":"","priority":"frequent"},{"text":"经过评审检查后按规定纳入配置管理。","note":"","priority":"frequent"},{"text":"主要属性：名称、标识符、文件状态、版本、作者、日期。","note":"","priority":"frequent"},{"text":"配置项也包括指定的外部交付、工具及客户提供的软硬件。","note":"","priority":""}],"source":"PDF 第10–14页；转写 12.2","priority":"","memory":"配置项是被管理的对象；名称、标识、状态、版本、作者、日期。","visual":"summary"},{"id":"4:2","chapter":4,"index":2,"title":"基线与非基线配置项、权限","fullTitle":"基线与非基线配置项、权限","intro":"老师讲解基线配置项与非基线配置项的区分，以及由配置管理员统一管理权限。","points":[{"text":"基线配置项通常包括设计文档、源程序等重要工作成果。","note":"","priority":"frequent"},{"text":"非基线配置项示例：项目各类计划、报告（依组织规定）。","note":"","priority":"frequent"},{"text":"CMO：配置管理员，管理配置项操作权限。","note":"","priority":"frequent"},{"text":"CCB参与配置变更审批；PM为项目经理。","note":"","priority":""},{"text":"基线配置项不能被开发人员任意修改，开发人员一般可读取。","note":"","priority":""}],"source":"PDF 第10–14页；转写 12.2","priority":"","memory":"CMO管权限；基线修改必须受控。","visual":"summary","notice":"是否纳入基线取决于项目配置管理计划。老师也提醒课件中的具体权限例子存在简化，不宜解释为PM永远不能读取基线。"},{"id":"4:3","chapter":4,"index":3,"title":"配置项三种状态","fullTitle":"配置项三种状态","intro":"老师明确说三种状态必须掌握。","points":[{"text":"草稿：新建，修订后提交评审。","note":"","priority":"must"},{"text":"正式：评审通过后进入正式状态。","note":"","priority":"must"},{"text":"修改：对正式配置项变更时进入修改状态。","note":"","priority":"must"},{"text":"修改完并重新通过评审，恢复正式状态。","note":"","priority":""},{"text":"正式状态不等于永远不允许修改，必须通过变更控制。","note":"","priority":""}],"source":"PDF 第10–14页；转写 12.2","priority":"","memory":"草稿→评审→正式→受控修改→再评审→正式。","visual":"status"},{"id":"4:4","chapter":4,"index":4,"title":"版本号：0.YZ、X.Y、X.YZ","fullTitle":"版本号：0.YZ、X.Y、X.YZ","intro":"课件采用特定的配置项版本编号格式，老师认为掌握三种形式就是送分。","points":[{"text":"草稿0.YZ：YZ为01–99，修订时递增。","note":"","priority":"must"},{"text":"正式X.Y：首次正式版1.0；X为1–9，Y为0–9。","note":"","priority":"must"},{"text":"修改X.YZ：修改中通常只增加Z，X和Y保持不变。","note":"","priority":"must"},{"text":"修改评审通过后升级正式X.Y并去掉Z。","note":"","priority":""},{"text":"版本管理应保留历史版本，任何修改形成新版本。","note":"","priority":"frequent"}],"source":"PDF 第10–14页；转写 12.2","priority":"","memory":"0开头草稿；两位正式；非0开头三位修改。","visual":"version","notice":"这是本课指定的编号约定，不等同于通用语义化版本规范。"},{"id":"4:5","chapter":4,"index":5,"title":"版本管理与配置基线","fullTitle":"版本管理与配置基线","intro":"老师强调保留历史版本，因为新版本不一定比旧版本好。","points":[{"text":"任意修改产生新版本，不能随意丢弃历史版本。","note":"","priority":"frequent"},{"text":"按规则保存所有版本，便于迅速定位与追溯。","note":"","priority":"frequent"},{"text":"基线：一组相对稳定、被冻结的配置项。","note":"","priority":"must"},{"text":"修改基线必须经过正式变更控制。","note":"","priority":"must"},{"text":"基线通常对应里程碑；一个产品可建立多个基线。","note":"","priority":""}],"source":"PDF 第10–14页；转写 12.2","priority":"","memory":"基线冻结不是禁止变更，而是禁止随意变更。","visual":"baseline"},{"id":"4:6","chapter":4,"index":6,"title":"Release 与 Build 基线","fullTitle":"Release 与 Build 基线","intro":"课件将面向外部交付和内部开发的基线分开。","points":[{"text":"发行基线 Release：面向外部客户交付。","note":"","priority":"frequent"},{"text":"构造基线 Build：内部开发或测试使用。","note":"","priority":"frequent"},{"text":"每条基线定义建立事件、受控配置项、建立/变更程序和批准权限。","note":"","priority":""},{"text":"基线为工作提供定点，可支持分支、回退和错误重现。","note":"","priority":""}],"source":"PDF 第10–14页；转写 12.2","priority":"","memory":"Release对外交付，Build内部构造。","visual":"baseline","notice":"老师关于发行包必然不可反编译的解释属于过度简化；发布方式与调试信息是否保留由构建设置决定。"},{"id":"4:7","chapter":4,"index":7,"title":"配置库三种类型","fullTitle":"配置库三种类型","intro":"老师明确指出开发库、受控库、产品库经常考。","points":[{"text":"开发库：动态库/程序员库/工作库，个人开发工作区，允许较自由修改。","note":"","priority":"must"},{"text":"受控库：主库，保存当前基线及其变更，实行完整配置管理。","note":"","priority":"must"},{"text":"产品库：静态库/发行库/软件仓库，保存已发布基线及最终产品。","note":"","priority":"must"},{"text":"受控库和产品库的修改都要走正式流程。","note":"","priority":""}],"source":"PDF 第10–14页；转写 12.2","priority":"","memory":"开发库自己改；受控库走变更；产品库存发布。","visual":"repos"},{"id":"4:8","chapter":4,"index":8,"title":"配置库作用与配置项分类题","fullTitle":"配置库作用与配置项分类题","intro":"配置库不仅存文件，也记录状态、版本及变更相关的信息。","points":[{"text":"记录所有相关配置管理信息。","note":"","priority":"frequent"},{"text":"利用库中信息评价变更影响。","note":"","priority":"frequent"},{"text":"提取配置管理所需报告信息。","note":"","priority":"frequent"},{"text":"产品组成部分成果如需求文档、设计文档、源代码、测试用例；管理支撑成果如工作计划、质量报告。","note":"","priority":""}],"source":"PDF 第10–14页；转写 12.2","priority":"","memory":"工作计划也是配置项，但不属于产品组成部分的工作成果。","visual":"summary"},{"id":"5:0","chapter":5,"index":0,"title":"质量管理三个过程","fullTitle":"质量管理三个过程","intro":"老师要求记住规划、保证、控制，质量保证与质量控制尤其容易混淆。","points":[{"text":"质量规划：确定质量要求、标准及达成方法。","note":"","priority":"frequent"},{"text":"质量保证：阶段性评审、质量审计、过程分析。","note":"","priority":"frequent"},{"text":"质量控制：实时监控具体结果，与标准比较并纠偏。","note":"","priority":"frequent"},{"text":"范围、进度、成本共同影响质量。","note":"","priority":""}],"source":"PDF 第15–17页；转写 12.3","priority":"","memory":"规划定标准；保证看过程；控制查结果。","visual":"qualityflow"},{"id":"5:1","chapter":5,"index":1,"title":"质量六大特性与21个子特性","fullTitle":"质量六大特性与21个子特性","intro":"老师说六大特性必须记住，21个子特性主要考归属，不必逐字背定义。","points":[{"text":"六大质量特性必须记住：功能性、可靠性、可用性、效率、可维护性、可移植性。","note":"老师要求21个子特性理解记忆，重点辨认其归属，而非逐字背定义。","priority":"must"},{"text":"功能性（5）：适合性、准确性、互用性/互操作性、依从性、安全性。","note":"","priority":"frequent"},{"text":"可靠性（3）：成熟性、容错性、易恢复性。","note":"","priority":"frequent"},{"text":"可用性（3）：易理解性、易学性、易操作性。","note":"","priority":"frequent"},{"text":"效率（2）：时间特性、资源特性。","note":"","priority":"frequent"},{"text":"可维护性（4）：易分析性、可修改性、稳定性、可测试性。","note":"","priority":"frequent"},{"text":"可移植性（4）：适应性、易安装性、一致性（遵循性）、可替换性。","note":"","priority":"frequent"}],"source":"PDF 第15–17页；转写 12.3","priority":"","memory":"功能、可靠、可用、效率、维护、移植；5+3+3+2+4+4=21。","visual":"qualitymatrix","notice":"本课采用 PDF 第15–16页列出的 GB/T 16260—2002 模型，不替换为其他年份的模型。这里可用性指易使用性，不是服务可用率。"},{"id":"5:2","chapter":5,"index":2,"title":"功能性与可靠性","fullTitle":"功能性与可靠性","intro":"老师建议用特性的本质帮助记忆：功能是否正确适合，运行是否可靠。","points":[{"text":"功能性：适合性、准确性、互操作性、依从性、安全性。","note":"","priority":"frequent"},{"text":"可靠性：成熟性、容错性、易恢复性。","note":"","priority":"frequent"},{"text":"课堂记忆：成熟的人更可靠；出错后能容错、能恢复。","note":"","priority":""},{"text":"安全性在本课模型中归入功能性。","note":"","priority":""}],"source":"PDF 第15–17页；转写 12.3","priority":"","memory":"功能看适合准确互通合规安全；可靠看成熟容错恢复。","visual":"summary"},{"id":"5:3","chapter":5,"index":3,"title":"可用性与效率","fullTitle":"可用性与效率","intro":"老师以读手册、学习和操作帮助理解可用性；效率主要看时间与资源。","points":[{"text":"可用性：易理解、易学、易操作。","note":"","priority":"frequent"},{"text":"效率：时间特性、资源特性。","note":"","priority":"frequent"},{"text":"易分析性不属于可用性。","note":"","priority":""},{"text":"课件真题：易使用性的子特性不包括易分析性。","note":"","priority":""}],"source":"PDF 第15–17页；转写 12.3","priority":"","memory":"好理解、好学、好操作；效率看时间资源。","visual":"summary"},{"id":"5:4","chapter":5,"index":4,"title":"可维护性与可移植性","fullTitle":"可维护性与可移植性","intro":"老师用修改软件和切换平台两个场景区分。","points":[{"text":"可维护性：易分析、可修改、稳定、可测试。","note":"","priority":"frequent"},{"text":"可移植性：适应、易安装、一致（遵循）、可替换。","note":"","priority":"frequent"},{"text":"注意“适合性”属于功能性，“适应性”属于可移植性。","note":"","priority":""},{"text":"维护记分析→修改→稳定→测试。","note":"","priority":""}],"source":"PDF 第15–17页；转写 12.3","priority":"","memory":"维护是改得好；移植是换环境。","visual":"summary"},{"id":"5:5","chapter":5,"index":5,"title":"McCall质量模型","fullTitle":"McCall质量模型","intro":"老师说几乎不怎么考，理解产品运行、修正、转移的关注点即可。","points":[{"text":"产品运行：正确性、可靠性、易使用性、效率、完整性。","note":"","priority":"understand"},{"text":"产品修正：可维护性、灵活性、可测试性。","note":"","priority":"understand"},{"text":"产品转移：可移植性、复用性、互用性。","note":"","priority":"understand"}],"source":"PDF 第15–17页；转写 12.3","priority":"","memory":"运行看好不好用；修正看好不好改；转移看好不好迁移。","visual":"mccall"},{"id":"5:6","chapter":5,"index":6,"title":"软件评审与设计/程序质量","fullTitle":"软件评审与设计/程序质量","intro":"质量评审是质量保证的主要活动之一，课件列出两个必要条件。","points":[{"text":"设计质量：设计规格说明书符合用户要求。","note":"","priority":"understand"},{"text":"程序质量：程序按设计规格说明书正确执行。","note":"","priority":"understand"},{"text":"质量审计和过程分析保障过程；控制检查具体结果。","note":"","priority":""}],"source":"PDF 第15–17页；转写 12.3","priority":"","memory":"设计满足用户，程序满足设计。","visual":"summary"},{"id":"5:7","chapter":5,"index":7,"title":"软件容错与四类冗余技术","fullTitle":"软件容错与四类冗余技术","intro":"老师要求稍微了解容错手段，课件第17页列出四类。","points":[{"text":"结构冗余：静态、动态、混合冗余，增加结构或备份资源。","note":"","priority":"understand"},{"text":"信息冗余：加入校验信息。","note":"","priority":"understand"},{"text":"时间冗余：出错时重复执行，如重试、恢复。","note":"","priority":"understand"},{"text":"冗余附加技术：实现结构、信息、时间冗余所需资源与技术。","note":"","priority":"understand"}],"source":"PDF 第15–17页；转写 12.3","priority":"","memory":"结构增组件，信息加校验，时间靠重试，附加是支撑。","visual":"redundancy","notice":"不要把静态/动态结构冗余简单等同于冷备/热备；课堂用了备份机作比喻，具体分类应按实现机制判断。"},{"id":"6:0","chapter":6,"index":0,"title":"风险的概念与管理原则","fullTitle":"风险的概念与管理原则","intro":"风险是不确定的事件或条件，可能带来威胁，也可能带来机会。","points":[{"text":"风险管理旨在避免或减少损失、实现项目目标，而不是彻底消灭所有风险。","note":"","priority":"frequent"},{"text":"尽早识别，高层次风险记录在项目章程中。","note":"","priority":"frequent"},{"text":"风险识别贯穿项目生命周期。","note":"","priority":""},{"text":"由最有控制力的一方承担风险，风险与回报匹配且承受程度有限。","note":"","priority":""},{"text":"课件称积极规划可提前应对超过90%的风险，属于课程经验表述。","note":"","priority":""}],"source":"PDF 第18–20页；转写 12.3","priority":"","memory":"风险不等于坏事，能预测不等于能避免。","visual":"summary"},{"id":"6:1","chapter":6,"index":1,"title":"风险管理六个过程","fullTitle":"风险管理六个过程","intro":"老师要求按前后逻辑记住六个过程。","points":[{"text":"编制风险管理计划。","note":"","priority":"frequent"},{"text":"风险识别：确定风险及特征，形成风险列表。","note":"","priority":"frequent"},{"text":"风险定性分析：评估概率与影响、排序。","note":"","priority":"frequent"},{"text":"风险定量分析：数值化分析。","note":"","priority":"frequent"},{"text":"编制风险应对计划：制定策略。","note":"","priority":"frequent"},{"text":"风险监控：跟踪既有风险、识别新风险、评估应对效果。","note":"","priority":"frequent"}],"source":"PDF 第18–20页；转写 12.3","priority":"","memory":"计划→识别→定性→定量→应对→监控。","visual":"riskflow"},{"id":"6:2","chapter":6,"index":2,"title":"定性分析与定量分析","fullTitle":"定性分析与定量分析","intro":"老师用概率乘损失举例说明量化含义；不是所有风险都需要详细定量。","points":[{"text":"定性分析：按风险发生可能性、影响程度确定优先级。","note":"","priority":"frequent"},{"text":"定量分析：用数值分析风险对目标的影响。","note":"","priority":"frequent"},{"text":"风险曝光度=发生概率×影响（例如损失）。","note":"","priority":""},{"text":"定量方法：敏感性分析、期望货币价值、决策树、蒙特卡罗模拟。","note":"","priority":""}],"source":"PDF 第18–20页；转写 12.3","priority":"","memory":"定性排优先级，定量算数值。","visual":"exposure"},{"id":"6:3","chapter":6,"index":3,"title":"风险应对策略：威胁与机会","fullTitle":"风险应对策略：威胁与机会","intro":"课件将消极风险策略与积极风险策略分开。","points":[{"text":"消极（威胁）：规避、转移、减轻。","note":"","priority":"frequent"},{"text":"积极（机会）：开拓、分享、强大（课件用语，即增强机会）。","note":"","priority":"frequent"},{"text":"转移的课堂例子：购买保险。","note":"","priority":""},{"text":"应对计划应与风险的影响及资源成本相匹配。","note":"","priority":""}],"source":"PDF 第18–20页；转写 12.3","priority":"","memory":"威胁：规避转移减轻；机会：开拓分享增强。","visual":"responses"},{"id":"6:4","chapter":6,"index":4,"title":"风险属性：随机性、相对性、可变性","fullTitle":"风险属性：随机性、相对性、可变性","intro":"老师用双重偶然和承受能力解释风险性质。","points":[{"text":"随机性：是否发生和后果均有偶然性，并可能遵循统计规律。","note":"","priority":"understand"},{"text":"相对性：不同主体的承受能力不同，受收益、投入、地位与资源等影响。","note":"","priority":"understand"},{"text":"可变性：条件变化引起风险特征变化。","note":"","priority":"understand"},{"text":"风险可能在项目过程中出现、改变或消失。","note":"","priority":""}],"source":"PDF 第18–20页；转写 12.3","priority":"","memory":"随机看发生与后果；相对看主体；可变看条件。","visual":"summary"},{"id":"6:5","chapter":6,"index":5,"title":"风险的一般分类","fullTitle":"风险的一般分类","intro":"老师指出本页分类考得少，了解分类维度即可。","points":[{"text":"后果：纯粹风险/投机风险。","note":"","priority":"understand"},{"text":"来源：自然风险/人为风险。","note":"","priority":"understand"},{"text":"可管理性：可管理/不可管理。","note":"","priority":"understand"},{"text":"影响范围：局部风险/总体风险。","note":"","priority":"understand"},{"text":"承担者：业主、政府、承包商、投资方等。","note":"","priority":"understand"},{"text":"可预测性：已知、可预测、不可预测。","note":"","priority":"understand"}],"source":"PDF 第18–20页；转写 12.3","priority":"","memory":"先识别分类维度，别把不同维度混为一谈。","visual":"summary"},{"id":"6:6","chapter":6,"index":6,"title":"项目风险、技术风险、商业风险","fullTitle":"项目风险、技术风险、商业风险","intro":"老师强调这一页比前面的分类更常考，需要记住三类风险分别威胁什么。","points":[{"text":"项目风险：预算、进度、人员、资源、用户需求等，威胁项目计划。","note":"","priority":"frequent"},{"text":"技术风险：设计、实现、接口、测试、维护，威胁系统质量及交付。","note":"","priority":"frequent"},{"text":"商业风险：威胁系统的市场或商业生存能力。","note":"","priority":"frequent"},{"text":"根据题目描述的主要风险来源及后果判断。","note":"","priority":""}],"source":"PDF 第18–20页；转写 12.3","priority":"","memory":"项目风险管计划；技术风险管实现；商业风险管生存。","visual":"risktypes"},{"id":"6:7","chapter":6,"index":7,"title":"商业风险五类","fullTitle":"商业风险五类","intro":"老师要求记住市场、策略、销售、管理、预算五类，并用名称理解。","points":[{"text":"市场风险：产品优秀但市场不需要。","note":"","priority":"frequent"},{"text":"策略风险：与企业战略不符。","note":"","priority":"frequent"},{"text":"销售风险：销售部门不知道怎样推销。","note":"","priority":"frequent"},{"text":"管理风险：重点或人员变动导致失去上级支持。","note":"","priority":"frequent"},{"text":"预算风险：缺乏预算或人员保障。","note":"","priority":"frequent"}],"source":"PDF 第18–20页；转写 12.3","priority":"","memory":"市场不买、战略不符、销售不会、管理不支持、预算无保障。","visual":"businessrisk"},{"id":"7:0","chapter":7,"index":0,"title":"组织结构三种模式","fullTitle":"组织结构三种模式","intro":"课程补充组织结构，按权力主要归属区分。","points":[{"text":"项目型：项目经理权力较大、以项目为主。","note":"","priority":"understand"},{"text":"职能型：以部门领导为主。","note":"","priority":"understand"},{"text":"矩阵型：两者结合，项目经理与职能部门共同参与。","note":"","priority":"understand"},{"text":"矩阵型可有弱矩阵、平衡矩阵、强矩阵等。","note":"","priority":""}],"source":"PDF 第20–21页；转写 12.3","priority":"","memory":"项目型听项目经理，职能型听部门，矩阵型双线。","visual":"organization"},{"id":"7:1","chapter":7,"index":1,"title":"程序设计小组三种组织方式","fullTitle":"程序设计小组三种组织方式","intro":"老师以是否有主程序员和层次区分开发小组。","points":[{"text":"主程序员制：主程序员全权负责，后援工程师必要时替代。","note":"","priority":"understand"},{"text":"民主制（无主程序员）：成员地位平等，共同决策，适合较小团队。","note":"","priority":"understand"},{"text":"层次式：组长领导高级程序员，高级程序员再领导其他成员。","note":"","priority":"understand"},{"text":"课件以大项目和小项目分别说明主程序员制与民主制的适用场景。","note":"","priority":""}],"source":"PDF 第20–21页；转写 12.3","priority":"","memory":"主程序员制中心化；民主制平等；层次式分层。","visual":"team"},{"id":"7:2","chapter":7,"index":2,"title":"沟通路径计算","fullTitle":"沟通路径计算","intro":"课件第21页真题比较八人民主制与主程序员制小组。","points":[{"text":"民主制：每两人一条无向路径，n(n−1)/2。","note":"","priority":"frequent"},{"text":"主程序员制：只有中心与其余成员沟通，n−1。","note":"","priority":"frequent"},{"text":"八人例：民主制28条，主程序员制7条。","note":"","priority":"frequent"},{"text":"题设若允许成员之间额外沟通，需要按实际连边计算。","note":"","priority":""}],"source":"PDF 第20–21页；转写 12.3","priority":"","memory":"两两沟通除以2；单中心沟通减1。","visual":"communication","examples":[{"title":"8人沟通路径","given":"n=8，民主制两两沟通；主程序员制仅中心与成员沟通。","steps":["民主制：7+6+5+4+3+2+1=28。","主程序员制：1个中心、7个其他成员。"],"answer":"28条、7条。","warning":""}]}],"quizzes":[{"chapter":1,"topic":"1:0","question":"范围管理的主要目的是什么？","options":["描述代码结构","确定并控制项目工作边界","计算网络带宽","测试所有语句"],"answer":1,"explain":"范围管理界定工作边界，防止需求蔓延。"},{"chapter":1,"topic":"1:1","question":"正式验收已经完成的可交付成果，属于哪个过程？","options":["规划范围","定义范围","确认范围","范围控制"],"answer":2,"explain":"确认范围的关键是正式验收。"},{"chapter":1,"topic":"1:2","question":"哪一项是课件列出的定义范围输入？","options":["未经审批的变更申请","批准的变更申请","源代码编译结果","客户随口提出的设想"],"answer":1,"explain":"课件明确写的是批准的变更申请。"},{"chapter":1,"topic":"1:3","question":"衡量项目范围是否完成的依据是？","options":["产品描述","源代码行数","范围基准","测试人员数量"],"answer":2,"explain":"产品范围按产品描述衡量，项目范围按范围基准衡量。"},{"chapter":1,"topic":"1:4","question":"下列哪项不属于课件所述范围基准？","options":["项目范围说明书","WBS","WBS词典","甘特图"],"answer":3,"explain":"甘特图用于进度安排，不是范围基准的三项组成。"},{"chapter":1,"topic":"1:5","question":"WBS分解的最小单元是？","options":["活动依赖","工作包","关键路径","配置库"],"answer":1,"explain":"范围管理分解到工作包；进度管理还可以进一步分解为活动。"},{"chapter":2,"topic":"2:0","question":"进度计划编制前应首先确定哪类信息？","options":["活动逻辑关系、资源及历时","软件最终售价","员工休假结果","产品发布库名称"],"answer":0,"explain":"计划编制依赖排序、资源和历时等信息。"},{"chapter":2,"topic":"2:1","question":"先估算每个活动，再汇总总量属于？","options":["自上而下","自下而上","关键路径法","质量审计"],"answer":1,"explain":"逐项估算并汇总是自下而上。"},{"chapter":2,"topic":"2:2","question":"考虑开发阶段影响的COCOMO模型是？","options":["基本","中间","详细","甘特"],"answer":2,"explain":"详细模型在中间模型基础上考虑各阶段影响。"},{"chapter":2,"topic":"2:3","question":"按老师课件口径，应用组装模型对应哪种估算度量？","options":["对象点","代码行","风险曝光度","自由时差"],"answer":0,"explain":"课堂给出的阶段与度量对应是对象点、功能点、代码行。"},{"chapter":2,"topic":"2:4","question":"哪种图更适合分析活动依赖和关键路径？","options":["WBS","PERT图","配置库图","数据字典"],"answer":1,"explain":"网络图表达依赖关系并支持关键路径计算。"},{"chapter":2,"topic":"2:5","question":"项目最短工期由哪条路径决定？","options":["活动数最多","历时总和最短","历时总和最长","编号最小"],"answer":2,"explain":"依赖路径最长的时间限制了项目最早完成时间。"},{"chapter":2,"topic":"2:6","question":"七格图中右下角一般表示？","options":["ES","EF","LS","LF"],"answer":3,"explain":"右下角为最迟完成时间 LF。"},{"chapter":2,"topic":"2:7","question":"两项紧前活动EF分别为7、10，本活动工期为4，则ES和EF是？","options":["7、11","10、14","17、21","10、6"],"answer":1,"explain":"ES=max(7,10)=10；EF=10+4=14。"},{"chapter":2,"topic":"2:8","question":"两个后继LS为15和18，本活动持续5天，则LF和LS是？","options":["18、13","15、10","33、28","15、20"],"answer":1,"explain":"逆推先取较小的15，再减5。"},{"chapter":2,"topic":"2:9","question":"ES=3、LS=8、EF=7、LF=12，则TF为？","options":["3","4","5","8"],"answer":2,"explain":"TF=8−3=12−7=5。"},{"chapter":2,"topic":"2:10","question":"本活动EF=9，两个紧后活动ES分别为12和15，则FF为？","options":["6","3","9","12"],"answer":1,"explain":"min(12,15)−9=3。"},{"chapter":2,"topic":"2:11","question":"按课件纠正后的图，D最早完成时间为？","options":["30","28","20","43"],"answer":1,"explain":"D紧前为B，EF(B)=20，D工期8，故EF=28。"},{"chapter":2,"topic":"2:12","question":"课件七活动案例的项目工期和C总时差为？","options":["14、0","17、3","16、2","13、4"],"answer":1,"explain":"最长路径ADFG=17；经过C最长路径ACEG=14。"},{"chapter":2,"topic":"2:13","question":"历时变化后，关键路径一定保持原样吗？","options":["一定","只有活动减少时变","不一定，需要重新计算","只有总工期变才变"],"answer":2,"explain":"关键路径可能在工期保持不变时切换。"},{"chapter":3,"topic":"3:0","question":"将估算的成本分配到各个工作包属于？","options":["成本估算","成本预算","风险识别","配置标识"],"answer":1,"explain":"预算是将成本分配并建立基准。"},{"chapter":3,"topic":"3:1","question":"用于应对已识别风险的储备是？","options":["管理储备","应急储备","沉没成本","机会成本"],"answer":1,"explain":"应急储备用于已识别风险。"},{"chapter":3,"topic":"3:2","question":"生产每增加一件商品就增加一块屏幕的费用，属于？","options":["固定成本","可变成本","沉没成本","机会成本"],"answer":1,"explain":"材料费随产量变化。"},{"chapter":3,"topic":"3:3","question":"多个项目共同承担的行政管理费用，属于？","options":["直接成本","间接成本","机会成本","产品价格"],"answer":1,"explain":"共同承担且无法直接归属单个项目，为间接成本。"},{"chapter":3,"topic":"3:4","question":"选择A收益10万元，放弃B收益8万和C收益12万，机会成本是？","options":["10万","8万","12万","20万"],"answer":2,"explain":"放弃的最佳替代收益是12万。"},{"chapter":3,"topic":"3:5","question":"已经支付且无法退回的电影票费用是？","options":["机会成本","沉没成本","可变成本","  else if(v==='organization')body=grid([['项目型','项目经理为主'],['职能型','部门领导为主'],['矩阵型','双线管理']]);
 else if(v==='team')body=grid([['主程序员制','中心负责'],['民主制','成员平等'],['层次式','分级领导']]);
 else if(v==='communication'){let n=pmPeople,draw=(star)=>{let pts=Array.from({length:n},(_,i)=>star&&i===0?[140,115]:[140+92*Math.cos((i-(star?1:0))*2*Math.PI/(n-(star?1:0))-Math.PI/2),115+92*Math.sin((i-(star?1:0))*2*Math.PI/(n-(star?1:0))-Math.PI/2)]);let lines='';for(let i=0;i<n;i++)for(let j=i+1;j<n;j++)if(!star||i===0)lines+=`<line x1="${pts[i][0]}" y1="${pts[i][1]}" x2="${pts[j][0]}" y2="${pts[j][1]}" stroke="${star?'#169c87':'#8095a9'}" opacity="${n>10?.4:.8}"/>`;return `<svg viewBox="0 0 280 230" style="width:100%;height:auto">${lines}${pts.map(([x,y],i)=>`<circle cx="${x}" cy="${y}" r="${n>12?8:12}" fill="${star&&i===0?'#169c87':'#497caf'}"/><text x="${x}" y="${y+3}" text-anchor="middle" fill="white" font-size="${n>12?8:10}">${i+1}</text>`).join('')}</svg>`};body=`<div class="algo-sim"><div class="algo-simhead"><b>人数：${n} 人</b><div class="algo-actions"><button class="small-button" data-people="minus" ${n===2?'disabled':''}>−</button><button class="small-button" data-people="plus" ${n===20?'disabled':''}>＋</button></div></div><div class="pm-comm"><div>${draw(false)}<div class="algo-equation">民主制 ${n*(n-1)/2} 条</div></div><div>${draw(true)}<div class="algo-equation">主程序员制 ${n-1} 条</div></div></div></div>`}
 else body=eq(t.memory);
 return `<section class="card"><h2>🧩 可视化理解${['interactive','communication'].includes(v)?' · 交互演示':''}</h2><div class="diagram"><div class="diagram-title">PROJECT MANAGEMENT EXPLAINER · ${esc(t.title)}</div>${body}</div></section>`;
}
function renderMap(){el('topTitle').textContent='项目管理 · 知识脑图';return `<div class="kicker">KNOWLEDGE MAP</div><h1 class="big-title">一张图，看懂整章知识结构</h1><p class="lede">按章节展开知识分支。点击右侧主题可以直接跳转到图文精讲；再次点击已展开的章节可以收起。</p><div class="map-root">项目管理 <span style="font-size:12px;margin-left:13px;opacity:.7;align-self:center">7 组知识主题 · 1 份考试定位</span></div><div class="map-rail">${chapters.map(c=>`<div class="map-branch"><button class="map-chap ${mapOpen===c.id?'on':''}" data-mapchap="${c.id}"><span>${c.number} · ${esc(c.name)}</span><b>${mapOpen===c.id?'−':'+'}</b></button><div class="map-topics">${mapOpen===c.id?c.topicIds.map(id=>{let t=lessonMap.get(id);return `<button class="map-topic" data-lesson="${id}"><b>${esc(t.title)}</b><small>${t.points.length} 个知识条目 · 查看精讲 ↗</small><div class="map-details">${t.points.slice(0,3).map(p=>`<span>• ${topicLabel(p.text)}</span>`).join('')}${t.points.length>3?`<span>… 及其他 ${t.points.length-3} 项</span>`:''}</div></button>`}).join(''):`<div style="color:#92a1b0;font-size:12px;padding:13px">${c.topicIds.length} 个子主题 · 点击左侧展开</div>`}</div></div>`).join('')}</div>`}
function renderQuick(){el('topTitle').textContent='项目管理 · 考前速记';
 const rules=[["范围五过程", "规划→定义→WBS→确认→控制", "1:1"], ["范围基准", "范围说明书＋WBS＋WBS词典", "1:4"], ["关键路径", "最长完整路径决定最短工期", "2:5"], ["七格图", "顺推取最大，逆推取最小", "2:11"], ["总时差", "TF=LS−ES=LF−EF", "2:9"], ["自由时差", "FF=min(紧后ES)−EF", "2:10"], ["成本类型", "可变/固定；直接/间接；机会/沉没", "3:2"], ["版本号", "0.YZ草稿；X.Y正式；X.YZ修改", "4:4"], ["配置库", "开发库、受控库、产品库", "4:7"], ["质量特性", "功能、可靠、可用、效率、维护、移植（21子特性）", "5:1"], ["风险分类", "项目计划 / 系统质量与交付 / 商业生存", "6:6"], ["沟通路径", "民主制 n(n−1)/2；主程序员制 n−1", "7:2"]];
 return `<div class="kicker">QUICK RECALL</div><h1 class="big-title">考前速记 · 项目管理核心考点</h1><p class="lede">先用 12 条高频规则复述，再点击返回精讲；最后做练习检验是否真的理解。</p><div class="section-label"><h2>核心判题规则</h2><p>来源：12.1 / 12.2 / 12.3 课程讲解</p></div><div class="qgrid">${rules.map(f=>`<article class="card" style="margin:0"><h3 style="margin:0 0 8px">${esc(f[0])}</h3><div class="formula">${esc(f[1])}</div><button class="small-button tinted" style="margin-top:13px" data-lesson="${f[2]}">查看精讲 ↗</button></article>`).join('')}</div>${chapters.slice(1).map(c=>`<div class="section-label"><h2>${c.number} · ${esc(c.name)}</h2><p>${c.topicIds.length} 条速记</p></div><div class="qgrid">${c.topicIds.map(id=>{let t=lessonMap.get(id);return `<article class="quick-card"><div class="qtag">${esc(c.name)} ${levelTag(priority(t))}</div><h3>${esc(t.title)}</h3><p>${esc(t.memory||t.points.slice(0,2).map(p=>p.text).join('；'))}</p><button data-lesson="${id}">完整精讲 ↗</button></article>`}).join('')}</div>`).join('')}`;
}
function getQuizItems(scope){return quizzes.map((q,i)=>({...q,key:i})).filter(q=>scope==='all'||q.chapter===Number(scope)||scope==='wrong'&&load('sd_pm_v1_wrong',[]).includes(q.key));}
function startQuiz(scope){quizState={scope,items:getQuizItems(scope),index:0,picks:{},completed:false};setView('quiz')}
function chooseQuiz(idx){const item=quizState.items[quizState.index];if(quizState.picks[item.key]!==undefined)return;quizState.picks[item.key]=idx;render()}
function nextQuiz(){quizState.index++;if(quizState.index>=quizState.items.length){quizState.completed=true;const errors=quizState.items.filter(q=>quizState.picks[q.key]!==q.answer).map(q=>q.key);let old=new Set(load('sd_pm_v1_wrong',[]));for(let q of quizState.items)old.delete(q.key);for(let k of errors)old.add(k);save('sd_pm_v1_wrong',[...old]);}render();el('contentShell').scrollTop=0}
function renderQuiz(){el('topTitle').textContent='项目管理 · 随堂练习';if(!quizState.items.length&&!quizState.completed){quizState.items=getQuizItems(quizState.scope)}let qs=quizState.items,idx=quizState.index;
 let filters=`<div class="quiz-filter"><button data-quizscope="all" class="${quizState.scope==='all'?'chosen':''}">全章 · ${quizzes.length} 题</button>${chapters.slice(1).map(c=>`<button data-quizscope="${c.id}" class="${quizState.scope===String(c.id)?'chosen':''}">${c.number} ${esc(c.name)} · ${getQuizItems(String(c.id)).length} 题</button>`).join('')}<button data-quizscope="wrong" class="${quizState.scope==='wrong'?'chosen':''}">错题重练 · ${getQuizItems('wrong').length} 题</button></div>`;
 if(!qs.length)return `<div class="kicker">PRACTICE</div><h1 class="big-title">随堂练习</h1><p class="lede">本组暂无试题或尚未产生错题。选择其他章节继续练习。</p>${filters}`;
 if(quizState.completed){let score=qs.filter(q=>quizState.picks[q.key]===q.answer).length;return `<div class="kicker">PRACTICE RESULT</div><h1 class="big-title">练习完成</h1><div class="score-card"><div class="huge">${Math.round(score/qs.length*100)}<small style="font-size:20px">分</small></div><h2>${score} / ${qs.length} 题正确</h2><p>${qs.length-score===0?'这组知识点都答对了，可以去精讲中继续学习其他内容。':`有 ${qs.length-score} 道题答错，错题会保存在当前浏览器中，可以单独重练。`}</p><button class="small-button primary" data-quizscope="${quizState.scope}">再做一遍</button><button class="small-button" data-quizscope="wrong">重练错题</button><button class="small-button" data-view="quick">查看考前速记</button></div>${filters}`;}
 let q=qs[idx],pick=quizState.picks[q.key],answered=pick!==undefined,chapter=chapters[q.chapter];return `<div class="kicker">PRACTICE / SELF TEST</div><h1 class="big-title">随堂练习</h1><p class="lede" style="margin-bottom:11px">按课程内容编写的自测题（非历年真题原文），答题后立即展示正确答案和解析。</p>${filters}<div class="quiz-wrap"><div class="quiz-top"><span class="tiny">${esc(chapter.name)} · 第 ${idx+1} / ${qs.length} 题</span><div class="quiz-progress"><i style="width:${idx/qs.length*100}%"></i></div><b style="font-size:12px;color:#6e8192">${Math.round(idx/qs.length*100)}%</b></div><div class="quiz-card"><span class="pill">单选题</span><h2>${esc(q.question)}</h2><div class="options">${q.options.map((o,j)=>`<button class="option ${answered&&j===q.answer?'correct':''} ${answered&&pick===j&&j!==q.answer?'incorrect':''} ${answered&&pick===j?'selected':''}" data-option="${j}" ${answered?'disabled':''}><i>${'ABCD'[j]}.</i><span>${esc(o)}</span></button>`).join('')}</div>${answered?`<div class="explain"><strong>${pick===q.answer?'✓ 回答正确':'✕ 回答错误'} · 正确答案 ${'ABCD'[q.answer]}</strong><div style="margin-top:5px">${esc(q.explain)}</div><div style="margin-top:10px"><button class="small-button tinted" data-lesson="${q.topic}">返回对应知识点 ↗</button></div></div>`:''}<div class="quiz-bottom"><span class="tiny">请先选择一个答案</span><button class="small-button primary" data-nextquestion ${!answered?'disabled':''}>${idx===qs.length-1?'查看成绩':'下一题 →'}</button></div></div></div>`;}
function renderRail(){if(view!=='read')return '';let t=lessonMap.get(current),c=chapters[t.chapter];return `<div class="rail-card"><h3>本章目录 · ${c.number}</h3>${c.topicIds.map((id,i)=>`<button class="rail-topic ${id===current?'current':''}" data-lesson="${id}">${String(i+1).padStart(2,'0')} · ${esc(lessonMap.get(id).title)} ${mastery[id]===2?'✓':''}</button>`).join('')}<div class="rail-memory"><strong>本节一句话</strong><p>${esc(t.memory||t.points[0]?.text||'')}</p><div class="tiny">${esc(t.source)}</div></div></div>`}
function render(){renderSidebar();document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('on',b.dataset.tab===view));const main=el('mainContent');main.className='content '+(view==='read'?'reading':'');main.innerHTML=({home:renderHome,read:renderRead,map:renderMap,quick:renderQuick,quiz:renderQuiz}[view]||renderHome)();const shell=el('contentShell');shell.classList.toggle('withrail',view==='read');el('rightRail').innerHTML=renderRail()}
function openSearch(){el('searchOverlay').classList.remove('hidden');el('searchInput').focus();searchResults('')}
function closeSearch(){el('searchOverlay').classList.add('hidden')}
function searchResults(term){
 term=term.trim().toLowerCase();
 let hits=term?lessons.filter(t=>(t.title+' '+t.intro+' '+t.points.map(p=>p.text+' '+p.note).join(' ')).toLowerCase().includes(term)):lessons.filter(t=>t.chapter>0&&priority(t)==='must').slice(0,8);
 if(term)hits.sort((a,b)=>{const score=t=>{let name=t.title.toLowerCase();return name===term?0:name.startsWith(term)?1:name.includes(term)?2:3};return score(a)-score(b) || a.chapter-b.chapter || a.index-b.index});
 let n=hits.length;hits=hits.slice(0,25);
 el('searchResults').innerHTML=`<div class="tiny">${term?`匹配 ${n} 个知识主题`:'建议重点内容'}</div>`+hits.map(t=>`<button class="sr" data-searchlesson="${t.id}"><strong>${esc(t.title)}</strong><small>${esc(chapters[t.chapter].name)} · ${esc(t.intro.slice(0,66))}…</small></button>`).join('')+(hits.length?'':'<div class="tiny">没有匹配结果，试试其他关键词。</div>');
}
document.body.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;
 if(b.dataset.pmstep){pmStep=b.dataset.pmstep==='reset'?0:b.dataset.pmstep==='all'?17:Math.min(17,pmStep+1);render();return;}
 if(b.dataset.people){pmPeople=Math.max(2,Math.min(20,pmPeople+(b.dataset.people==='plus'?1:-1)));render();return;}
 if(b.id==='focusToggle'){focusOnly=!focusOnly;save('sd_pm_v1_focus_only',focusOnly);renderSidebar();return}
 if(b.dataset.view){setView(b.dataset.view);return}
 if(b.dataset.tab){setView(b.dataset.tab);return}
 if(b.dataset.chapter!==undefined){let ci=+b.dataset.chapter;if(openedChap===ci){openedChap=-1;renderSidebar()}else{openedChap=ci;renderSidebar()}return}
 if(b.dataset.lesson){openLesson(b.dataset.lesson);return}
 if(b.dataset.master){markNext(b.dataset.master);return}
 if(b.dataset.mapchap!==undefined){let ci=+b.dataset.mapchap;mapOpen=mapOpen===ci?-1:ci;render();return}
 if(b.dataset.quizscope){startQuiz(b.dataset.quizscope);return}
 if(b.dataset.quiztopic){const t=lessonMap.get(b.dataset.quiztopic);quizState={scope:String(t.chapter),items:getQuizItems(String(t.chapter)),index:0,picks:{},completed:false};setView('quiz');return}
 if(b.dataset.option!==undefined){chooseQuiz(+b.dataset.option);return}
 if(b.hasAttribute('data-nextquestion')){nextQuiz();return}
 if(b.dataset.searchlesson){closeSearch();openLesson(b.dataset.searchlesson);return}
});
el('menuBtn').onclick=()=>{el('sidebar').classList.add('open');el('scrim').classList.add('open')};el('scrim').onclick=hideMobile;
function refreshThemeButton(){const dark=document.documentElement.dataset.theme==='dark',b=el('themeBtn');b.setAttribute('aria-pressed',String(dark));b.setAttribute('aria-label',dark?'切换为日间模式':'切换为夜间模式');b.title=dark?'切换为日间模式':'切换为夜间模式'}
el('themeBtn').onclick=()=>{const next=document.documentElement.dataset.theme==='dark'?'light':'dark';document.documentElement.dataset.theme=next;save('sd_pm_v1_theme',next);refreshThemeButton()};refreshThemeButton();
el('searchBtn').onclick=openSearch;el('searchClose').onclick=closeSearch;el('searchInput').oninput=e=>searchResults(e.target.value);
el('searchOverlay').addEventListener('click',e=>{if(e.target===el('searchOverlay'))closeSearch()});
window.addEventListener('keydown',e=>{if(e.key==='Escape'){closeSearch();hideMobile()}if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){e.preventDefault();openSearch()}});
render();
